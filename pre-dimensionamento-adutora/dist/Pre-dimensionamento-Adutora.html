<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pré-dimensionamento de Adutora e Linha de Recalque</title>
<meta name="description" content="Pré-dimensionamento de adutoras e linhas de recalque de água e esgoto por Hazen-Williams e Colebrook-White.">
<style>/* ==================================================================
   Pré-dimensionamento de Adutora / Linha de Recalque
   ================================================================== */

:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --border: #d8dee4;
  --border-forte: #b9c2cc;
  --texto: #1b2733;
  --texto-2: #5b6875;
  --texto-3: #8a97a4;
  --azul: #14559b;
  --azul-claro: #e8f0f9;
  --azul-escuro: #0e3d70;
  --verde: #0f7b3f;
  --verde-bg: #e4f4ea;
  --ambar: #8a5a00;
  --ambar-bg: #fff3d4;
  --vermelho: #a8231f;
  --vermelho-bg: #fdeaea;
  --sombra: 0 1px 2px rgba(16, 30, 46, .06), 0 2px 8px rgba(16, 30, 46, .05);
  --r: 6px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}

[data-tema="escuro"] {
  --bg: #12171d;
  --surface: #1a2129;
  --surface-2: #202832;
  --border: #2e3945;
  --border-forte: #3d4a59;
  --texto: #e6ebf0;
  --texto-2: #a4b1bf;
  --texto-3: #76838f;
  --azul: #5aa2e8;
  --azul-claro: #1b2c3f;
  --azul-escuro: #8cc2f5;
  --verde: #56c98a;
  --verde-bg: #14301f;
  --ambar: #e0b050;
  --ambar-bg: #33260c;
  --vermelho: #f0837f;
  --vermelho-bg: #351717;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--texto);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0 0 .6em; }
a { color: var(--azul); }

/* ---------------- estrutura ---------------- */

header.topo {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 40;
}
header.topo .marca { display: flex; align-items: baseline; gap: 10px; }
header.topo h1 { font-size: 16px; letter-spacing: -.2px; }
header.topo .versao { font-size: 11px; color: var(--texto-3); }
header.topo .acoes { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

nav.abas {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  position: sticky;
  top: 51px;
  z-index: 39;
}
nav.abas button {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 13px;
  font: inherit;
  font-weight: 500;
  color: var(--texto-2);
  cursor: pointer;
  white-space: nowrap;
}
nav.abas button:hover { color: var(--texto); background: var(--surface-2); }
nav.abas button[aria-selected="true"] { color: var(--azul); border-bottom-color: var(--azul); }

main { max-width: 1500px; margin: 0 auto; padding: 16px; }

.faixa-resumo {
  display: flex; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 10px 12px; margin-bottom: 14px;
  box-shadow: var(--sombra);
}
.chip { display: flex; flex-direction: column; gap: 1px; min-width: 92px; }
.chip .rot { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-3); }
.chip .val { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip .val small { font-size: 11px; font-weight: 500; color: var(--texto-2); }

/* ---------------- cartões ---------------- */

.cartao {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 14px;
  box-shadow: var(--sombra);
  overflow: hidden;
}
.cartao > .cab {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}
.cartao > .cab h2, .cartao > .cab h3 { font-size: 13.5px; }
.cartao > .cab .sub { font-size: 12px; color: var(--texto-2); font-weight: 400; }
.cartao > .cab .dir { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.cartao > .corpo { padding: 13px; }
.cartao.recolhido > .corpo { display: none; }

.grade { display: grid; gap: 11px 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.grade.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grade.g4 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.linha { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }

/* ---------------- campos ---------------- */

label.campo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
label.campo > span.rot {
  font-size: 11.5px; font-weight: 600; color: var(--texto-2);
  display: flex; align-items: center; gap: 5px;
}
label.campo.compacto { max-width: 130px; }

input, select, textarea, button { font: inherit; color: inherit; }
input[type="text"], input[type="number"], select, textarea {
  background: var(--surface);
  border: 1px solid var(--border-forte);
  border-radius: 4px;
  padding: 6px 8px;
  width: 100%;
  min-width: 0;
}
input[type="text"], input[type="number"] { font-variant-numeric: tabular-nums; }
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--azul); outline-offset: -1px; border-color: var(--azul);
}
input.num { text-align: right; }
input:disabled, select:disabled { background: var(--surface-2); color: var(--texto-3); }
input.editado, select.editado { border-color: var(--ambar); background: var(--ambar-bg); }
textarea { resize: vertical; min-height: 54px; }
.par-unid { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
.par-unid select { width: auto; }

label.check { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
label.check input { width: auto; }

button.btn {
  background: var(--surface); border: 1px solid var(--border-forte);
  border-radius: 4px; padding: 6px 11px; cursor: pointer; font-weight: 500;
  white-space: nowrap;
}
button.btn:hover { background: var(--surface-2); border-color: var(--texto-3); }
button.btn.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
button.btn.primario:hover { background: var(--azul-escuro); border-color: var(--azul-escuro); }
button.btn.perigo:hover { background: var(--vermelho-bg); border-color: var(--vermelho); color: var(--vermelho); }
button.btn.mini { padding: 3px 7px; font-size: 12px; }
button.btn.icone { padding: 3px 7px; line-height: 1; }

.dica {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--azul-claro); color: var(--azul);
  font-size: 10px; font-weight: 700; cursor: help; border: none; flex: none;
}
.dica:hover { background: var(--azul); color: #fff; }

/* ---------------- tabelas ---------------- */

.rolagem { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--border); }
th { background: var(--surface-2); font-weight: 600; font-size: 11.5px; color: var(--texto-2); white-space: nowrap; position: relative; }
th:first-child, td:first-child { text-align: left; }
th.esq, td.esq { text-align: left; }
td { font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--surface-2); }
tfoot td { font-weight: 600; background: var(--surface-2); border-top: 2px solid var(--border-forte); }
table.enxuta th, table.enxuta td { padding: 3px 6px; }

tr.bom     td:first-child { box-shadow: inset 3px 0 var(--verde); }
tr.atencao td:first-child { box-shadow: inset 3px 0 var(--ambar); }
tr.ruim    td:first-child { box-shadow: inset 3px 0 var(--vermelho); }
tr.bom     { background: var(--verde-bg); }
tr.atencao { background: var(--ambar-bg); }
tr.ruim    { background: var(--vermelho-bg); }
tr.bom:hover, tr.atencao:hover, tr.ruim:hover { filter: brightness(.97); }
tr.selecionada { outline: 2px solid var(--azul); outline-offset: -2px; }
tr.selecionada td { font-weight: 600; }

.tag {
  display: inline-block; padding: 1px 6px; border-radius: 9px;
  font-size: 10.5px; font-weight: 600; white-space: nowrap;
}
.tag.bom { background: var(--verde-bg); color: var(--verde); border: 1px solid var(--verde); }
.tag.atencao { background: var(--ambar-bg); color: var(--ambar); border: 1px solid var(--ambar); }
.tag.ruim { background: var(--vermelho-bg); color: var(--vermelho); border: 1px solid var(--vermelho); }
.tag.neutro { background: var(--azul-claro); color: var(--azul); border: 1px solid var(--azul); }
.tag.cinza { background: var(--surface-2); color: var(--texto-2); border: 1px solid var(--border-forte); }

.aviso {
  border-left: 3px solid var(--ambar); background: var(--ambar-bg);
  padding: 8px 11px; border-radius: 0 4px 4px 0; font-size: 12.5px; margin: 8px 0;
  color: var(--texto);
}
.aviso.erro { border-color: var(--vermelho); background: var(--vermelho-bg); }
.aviso.ok { border-color: var(--verde); background: var(--verde-bg); }
.aviso.info { border-color: var(--azul); background: var(--azul-claro); }
.aviso b { display: block; margin-bottom: 2px; }
.aviso ul { margin: 4px 0 0; padding-left: 18px; }

.vazio { color: var(--texto-3); font-size: 13px; text-align: center; padding: 18px; font-style: italic; }
.nota { font-size: 11.5px; color: var(--texto-2); line-height: 1.45; }
.nota-fonte { font-size: 11px; color: var(--texto-3); }
.mono { font-family: var(--mono); font-size: 12px; }

/* ---------------- listas de peças ---------------- */

.pecas-tab select { padding: 3px 5px; font-size: 12.5px; }
.pecas-tab input { padding: 3px 5px; font-size: 12.5px; }
.pecas-tab td { padding: 3px 5px; }
.pecas-tab .col-qtd { width: 74px; }
.pecas-tab .col-k { width: 88px; }
.pecas-tab .col-di { width: 104px; }
.pecas-tab .col-x { width: 32px; }

/* ---------------- conjuntos / trechos ---------------- */

.conjunto { border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 11px; background: var(--surface); }
.conjunto > .cab-conj {
  display: flex; align-items: center; gap: 9px; padding: 8px 11px;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  border-radius: var(--r) var(--r) 0 0;
}
.conjunto > .cab-conj input.titulo {
  border: 1px solid transparent; background: transparent; font-weight: 600; width: auto; flex: 1;
}
.conjunto > .cab-conj input.titulo:hover { border-color: var(--border-forte); }
.conjunto > .corpo-conj { padding: 11px; }
.conjunto.desativado > .corpo-conj { display: none; }
.conjunto.desativado > .cab-conj { opacity: .6; border-radius: var(--r); border-bottom: none; }

.subtitulo {
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  color: var(--texto-3); margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--border);
}
.subtitulo:first-child { margin-top: 0; }

/* ---------------- perfil piezométrico ---------------- */

.perfil { width: 100%; height: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; }
.perfil text { font-size: 10px; fill: var(--texto-2); font-family: inherit; }
.perfil .terreno { fill: none; stroke: var(--texto-2); stroke-width: 1.5; }
.perfil .lp { fill: none; stroke: var(--azul); stroke-width: 2; }
.perfil .lps { fill: none; stroke: var(--vermelho); stroke-width: 1.5; stroke-dasharray: 5 3; }
.perfil .grade-l { stroke: var(--border); stroke-width: .5; }

/* ---------------- modal ---------------- */

.fundo-modal {
  position: fixed; inset: 0; background: rgba(12, 20, 30, .55);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; z-index: 100; overflow-y: auto;
}
.modal {
  background: var(--surface); border-radius: 8px; max-width: 780px; width: 100%;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .3); border: 1px solid var(--border);
}
.modal > .cab { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--border); }
.modal > .cab h3 { font-size: 15px; }
.modal > .cab button { margin-left: auto; }
.modal > .corpo { padding: 16px; max-height: 70vh; overflow-y: auto; }
.modal > .pe { padding: 11px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--texto); color: var(--bg); padding: 9px 16px; border-radius: 20px;
  font-size: 13px; z-index: 200; box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
}

/* ---------------- fontes ---------------- */

.fonte-item { border-left: 3px solid var(--azul); padding: 8px 12px; margin-bottom: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.fonte-item h4 { font-size: 13px; margin-bottom: 3px; }
.fonte-item .tipo { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-3); }
.fonte-item p { font-size: 12.5px; color: var(--texto-2); margin: 4px 0 0; }

/* ---------------- memorial / impressão ---------------- */

.memorial { background: var(--surface); padding: 22px; font-size: 12.5px; }
.memorial h2 { font-size: 15px; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.memorial h2:first-child { margin-top: 0; }
.memorial table { margin-bottom: 12px; }
.memorial .cab-doc { text-align: center; margin-bottom: 18px; }

@media print {
  header.topo, nav.abas, .acoes, button, .faixa-resumo { display: none !important; }
  body { background: #fff; font-size: 10.5pt; }
  main { max-width: none; padding: 0; }
  .cartao { break-inside: avoid; box-shadow: none; border-color: #bbb; margin-bottom: 10px; }
  .rolagem { overflow: visible; }
  tr.bom { background: #eef8f1 !important; }
  tr.atencao { background: #fdf6e3 !important; }
  tr.ruim { background: #fbeeed !important; }
  .naoimprime { display: none !important; }
}

@media (max-width: 720px) {
  header.topo { padding: 8px 10px; }
  main { padding: 10px; }
  nav.abas { top: 47px; }
  .grade { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="topo">
  <div class="marca">
    <h1>Pré-dimensionamento de Adutora / Linha de Recalque</h1>
    <span class="versao">v1.0</span>
  </div>
  <div class="acoes">
    <button class="btn" type="button" data-acao="novoProjeto">Novo</button>
    <button class="btn" type="button" data-acao="abrirProjeto">Abrir</button>
    <button class="btn" type="button" data-acao="salvarProjeto">Salvar</button>
    <button class="btn" type="button" data-acao="exemplo">Exemplos</button>
    <button class="btn" type="button" data-acao="imprimir">Imprimir</button>
    <button class="btn" type="button" data-acao="tema" title="Alternar tema claro/escuro">◐</button>
    <button class="btn primario" type="button" data-acao="ajuda">Ajuda</button>
  </div>
</header>

<nav class="abas" id="abas" role="tablist"></nav>

<main id="conteudo"></main>

<noscript>
  <div style="padding:20px">
    <h2>É necessário habilitar o JavaScript</h2>
    <p>Todo o cálculo roda no próprio navegador, sem enviar dados para nenhum servidor.
       Habilite o JavaScript e recarregue a página.</p>
  </div>
</noscript>

<script>/* ===== 01-unidades.js ===== */
/* ------------------------------------------------------------------
 * Unidades e conversões
 * Todas as conversões levam para as unidades internas (SI):
 *   vazão      -> m³/s
 *   extensão   -> m
 *   diâmetro   -> m
 *   pressão    -> mca
 * ------------------------------------------------------------------ */
(function (PDA) {
  'use strict';

  var U = {};

  U.vazao = {
    'L/s':    { f: 1e-3,          rot: 'L/s' },
    'm³/h':   { f: 1 / 3600,      rot: 'm³/h' },
    'm³/s':   { f: 1,             rot: 'm³/s' },
    'm³/dia': { f: 1 / 86400,     rot: 'm³/dia' },
    'L/min':  { f: 1e-3 / 60,     rot: 'L/min' },
    'L/dia':  { f: 1e-3 / 86400,  rot: 'L/dia' },
    'gpm':    { f: 6.30902e-5,    rot: 'gpm (US)' }
  };

  U.extensao = {
    'm':  { f: 1,      rot: 'm' },
    'km': { f: 1000,   rot: 'km' },
    'cm': { f: 0.01,   rot: 'cm' },
    'ft': { f: 0.3048, rot: 'ft' },
    'mi': { f: 1609.34, rot: 'mi' }
  };

  U.diametro = {
    'mm': { f: 1e-3,    rot: 'mm' },
    'cm': { f: 1e-2,    rot: 'cm' },
    'm':  { f: 1,       rot: 'm' },
    'pol':{ f: 0.0254,  rot: 'pol' }
  };

  U.cota = {
    'm':  { f: 1,      rot: 'm' },
    'cm': { f: 0.01,   rot: 'cm' },
    'ft': { f: 0.3048, rot: 'ft' }
  };

  U.pressao = {
    'mca': { f: 1,        rot: 'mca' },
    'kPa': { f: 0.101972, rot: 'kPa' },
    'bar': { f: 10.1972,  rot: 'bar' },
    'MPa': { f: 101.972,  rot: 'MPa' },
    'kgf/cm²': { f: 10,   rot: 'kgf/cm²' },
    'psi': { f: 0.703070, rot: 'psi' }
  };

  U.potencia = {
    'cv': { f: 1,          rot: 'cv' },
    'kW': { f: 1 / 0.7355, rot: 'kW' },
    'hp': { f: 1.01387,    rot: 'hp' }
  };

  /* converte valor da unidade informada para a unidade interna */
  U.para = function (grandeza, valor, unidade) {
    var t = U[grandeza];
    if (!t) throw new Error('Grandeza desconhecida: ' + grandeza);
    var u = t[unidade];
    if (!u) throw new Error('Unidade desconhecida: ' + unidade + ' (' + grandeza + ')');
    return Number(valor) * u.f;
  };

  /* converte da unidade interna para a unidade informada */
  U.de = function (grandeza, valorSI, unidade) {
    var t = U[grandeza];
    var u = t[unidade];
    if (!u) throw new Error('Unidade desconhecida: ' + unidade + ' (' + grandeza + ')');
    return Number(valorSI) / u.f;
  };

  U.lista = function (grandeza) {
    return Object.keys(U[grandeza]);
  };

  PDA.U = U;
})(window.PDA = window.PDA || {});

/* ===== 02-hidraulica.js ===== */
/* ------------------------------------------------------------------
 * Núcleo hidráulico
 *
 * Unidades internas: Q [m³/s], D [m], L [m], v [m/s], J [m/m], h [m]
 *
 * Referências das formulações estão em PDA.H.fontes
 * ------------------------------------------------------------------ */
(function (PDA) {
  'use strict';

  var H = {};

  H.g = 9.80665;               /* m/s²  – aceleração da gravidade normal */
  H.GAMA_AGUA = 9806.65;       /* N/m³ a 4 °C (peso específico de referência) */

  /* Constantes de Hazen-Williams expostas para ajuste fino do usuário.
     Padrão: J = 10,643 · Q^1,852 · C^-1,852 · D^-4,871  (Azevedo Netto) */
  H.HW = { k: 10.643, expQ: 1.852, expD: 4.871 };

  /* ---------------- propriedades do fluido ---------------- */

  /* Viscosidade cinemática da água [m²/s] em função da temperatura [°C].
     Correlação de Poiseuille/Helmholtz (forma usual em hidráulica):
       ni = 1,792e-6 / (1 + 0,0337 T + 0,000221 T²) */
  H.viscosidadeAgua = function (T) {
    if (T === undefined || T === null || isNaN(T)) T = 20;
    return 1.792e-6 / (1 + 0.0337 * T + 0.000221 * T * T);
  };

  /* Massa específica da água [kg/m³] – ajuste de Thiesen/Tanaka (0–100 °C) */
  H.massaEspecificaAgua = function (T) {
    if (T === undefined || T === null || isNaN(T)) T = 20;
    return 1000 * (1 - (T + 288.9414) * Math.pow(T - 3.9863, 2) /
                       (508929.2 * (T + 68.12963)));
  };

  /* Pressão de vapor da água [mca] – equação de Buck */
  H.pressaoVaporAgua = function (T) {
    if (T === undefined || T === null || isNaN(T)) T = 20;
    var pkPa = 0.61121 * Math.exp((18.678 - T / 234.5) * (T / (257.14 + T)));
    return pkPa * 1000 / 9806.65; /* kPa -> mca */
  };

  /* Pressão atmosférica [mca] em função da altitude [m] – ISA */
  H.pressaoAtmosferica = function (altitude) {
    if (!altitude) altitude = 0;
    var pkPa = 101.325 * Math.pow(1 - 2.25577e-5 * altitude, 5.25588);
    return pkPa / 9.80665;
  };

  /* ---------------- geometria ---------------- */

  /* ================================================================

     ================================================================ */

  F.tabelaPecas = function (st, ctx, conj, base) {
    var cats = {}, ordem = [];
    PDA.P.pecas.forEach(function (p) {
      if (!cats[p.cat]) { cats[p.cat] = []; ordem.push(p.cat); }
      cats[p.cat].push(p);
    });

    var Q = null;
    try { Q = PDA.C.vazaoConjunto(F.raizChave(base), conj, ctx.nOp, ctx); } catch (e) { Q = 0; }
    var tubo = PDA.C.resolverTubo(conj, ctx);
    var somaK = 0, somaH = 0;

    var linhas = (conj.pecas || []).map(function (p, i) {
      var def = PDA.P.buscarPeca(PDA.P.pecas, p.pecaId);
      var K = (p.kOverride !== null && p.kOverride !== undefined && p.kOverride !== '') ? Number(p.kOverride) : (def ? def.K : 0);
      var qtd = Number(p.qtd) || 0;
      var diLoc = (p.diLocalMm && Number(p.diLocalMm) > 0) ? Number(p.diLocalMm) / 1000 : (tubo ? tubo.diM : 0);
      var v = diLoc > 0 ? PDA.H.velocidade(Q, diLoc) : 0;
      var perda = K * qtd * v * v / (2 * PDA.H.g);
      somaK += K * qtd; somaH += perda;

      return h('tr', {},
        h('td', { class: 'esq' },
          h('select', { 'data-bind': base + '.pecas.' + i + '.pecaId', 'data-tipo': 'texto', 'data-estrutural': '1' },
            ordem.map(function (c) {
              return h('optgroup', { label: c }, cats[c].map(function (d) {
                return h('option', { value: d.id, selected: d.id === p.pecaId }, d.rot);
              }));
            }))),
        h('td', { class: 'col-qtd' },
          h('input', { type: 'text', class: 'num', value: UI.numEdit(p.qtd),
                       'data-bind': base + '.pecas.' + i + '.qtd', 'data-tipo': 'num', inputmode: 'decimal' })),
        h('td', { class: 'col-k' },
          h('input', { type: 'text', class: 'num' + (p.kOverride ? ' editado' : ''),
                       value: p.kOverride === null || p.kOverride === undefined || p.kOverride === '' ? '' : UI.numEdit(p.kOverride),
                       placeholder: def ? UI.numEdit(def.K) : '', title: def ? ('Padrão: ' + UI.numEdit(def.K)) : '',
                       'data-bind': base + '.pecas.' + i + '.kOverride', 'data-tipo': 'num', inputmode: 'decimal' })),
        h('td', { class: 'col-di' },
          h('input', { type: 'text', class: 'num' + (p.diLocalMm ? ' editado' : ''),
                       value: p.diLocalMm === null || p.diLocalMm === undefined || p.diLocalMm === '' ? '' : UI.numEdit(p.diLocalMm),
                       placeholder: tubo ? UI.num(tubo.diMm, 0) : '',
                       title: 'Diâmetro interno da peça, quando diferente do tubo do trecho (mm)',
                       'data-bind': base + '.pecas.' + i + '.diLocalMm', 'data-tipo': 'num', inputmode: 'decimal' })),
        h('td', {}, UI.num(K * qtd, 2)),
        h('td', {}, UI.num(v, 2)),
        h('td', {}, UI.num(perda, 3)),
        h('td', { class: 'col-x' },
          h('button', { class: 'btn mini icone perigo naoimprime', type: 'button',
                        'data-acao': 'removerPeca', 'data-base': base, 'data-i': i, title: 'Remover' }, '×')));
    });

    var seletorNovo = h('select', { style: 'max-width:230px', 'data-acao-change': 'addPeca', 'data-base': base },
      [h('option', { value: '' }, '+ adicionar peça…')].concat(
        ordem.map(function (c) {
          return h('optgroup', { label: c }, cats[c].map(function (d) {
            return h('option', { value: d.id }, d.rot + '  (K = ' + UI.numEdit(d.K) + ')');
          }));
        })));

    return h('div', {},
      linhas.length ? h('div', { class: 'rolagem' }, h('table', { class: 'pecas-tab enxuta' },
        h('thead', {}, h('tr', {},
          h('th', { class: 'esq' }, 'Peça'),
          h('th', {}, 'Qtd.'),
          h('th', {}, 'K', UI.dica('Coeficiente de perda localizada. O campo mostra o valor padrão como sugestão; digite outro para sobrepor apenas nesta peça.\n\n' + PDA.P.fontePecas.az)),
          h('th', {}, 'DI da peça', UI.dica('Use quando a peça tem diâmetro diferente do tubo do trecho — por exemplo uma válvula DN 300 em uma linha DN 400. Em branco, adota o DI do trecho.')),
          h('th', {}, 'ΣK'),
          h('th', {}, 'v (m/s)'),
          h('th', {}, 'Perda (m)'),
          h('th', {}, ''))),
        h('tbody', {}, linhas),
        h('tfoot', {}, h('tr', {},
          h('td', { class: 'esq', colspan: 4 }, 'Total'),
          h('td', {}, UI.num(somaK, 2)),
          h('td', {}, ''),
          h('td', {}, UI.num(somaH, 3)),
          h('td', {}, ''))))) : h('p', { class: 'vazio' }, 'Nenhuma peça lançada neste trecho.'),
      h('div', { style: 'margin-top:7px' }, seletorNovo));
  };

  F.raizChave = function (base) {
    if (base.indexOf('adutoras') === 0) return 'adutora';
    if (base.indexOf('succaoComum') === 0) return 'succaoComum';
    if (base.indexOf('barrileteComum') === 0) return 'barrileteComum';
    if (base.indexOf('succaoIndividual') === 0) return 'succaoIndividual';
    return 'barrileteIndividual';
  };

      },

        h('td', {}, l.Re ? UI.num(l.Re / 1000, 0) + 'k' : '—'),
        h('td', {}, UI.num(l.vMin1, 2)),

    var crit = v.crit;
    return h('div', {},

          UI.numEdit(crit.jBom[0]), ' a ', UI.numEdit(crit.jBom[1]), ' m/km (máx. ', UI.numEdit(crit.jMax), ')',
          UI.dica(crit.nota + '\n\nAs faixas são editáveis na aba Projeto → Critérios de verificação.')),
        h('span', {}, 'Bresse: ', UI.num(v.bresse.k07, 0), ' a ', UI.num(v.bresse.k13, 0), ' mm',
          ' (K = 1,0 → ', UI.num(v.bresse.k10, 0), ' mm)',
          UI.dica('Diâmetro econômico de Bresse D = K·√Q, com K entre 0,7 e 1,3. É apenas uma referência de ordem de grandeza para o pré-dimensionamento.\n\n' +
                  PDA.H.fontes.filter(function (f) { return f.id === 'bresse'; })[0].txt))),
      h('div', { class: 'rolagem' }, h('table', { class: 'enxuta' },
        h('thead', {}, h('tr', {},
          h('th', { class: 'esq' }, 'Diâmetro'),
          h('th', {}, 'DI (mm)'),
          h('th', {}, 'e (mm)'),
          h('th', {}, 'PN'),
          h('th', {}, 'v (m/s)'),
          h('th', {}, 'J (m/km)'),
          h('th', {}, 'hf (m)'),
          h('th', {}, 'Σhₗ (m)'),
          h('th', {}, 'Total (m)'),
          usaHW ? h('th', {}, 'C') : h('th', {}, 'f'),
          h('th', {}, 'Re'),
          h('th', {}, 'v c/ 1 bomba', UI.dica('Velocidade no trecho quando apenas uma bomba opera. É a condição crítica para a velocidade mínima de autolimpeza, especialmente em linhas de recalque de esgoto (0,6 m/s pela NBR 12208).')),
          h('th', {}, 'Situação'))),

  /* ================================================================
     Editor de um conjunto (tubo + peças + varredura)
     ================================================================ */

  /* op: {titulo, base, chave, removivel, ativavel, adutora, tituloEditavel} */
  F.conjunto = function (st, ctx, conj, op) {
    var base = op.base;
    var cabecalho = [
      op.ativavel ? h('input', { type: 'checkbox', checked: conj.ativo !== false,
                                 'data-bind': base + '.ativo', 'data-tipo': 'bool', 'data-estrutural': '1',
                                 title: 'Considerar este trecho no cálculo' }) : null,
      op.tituloEditavel
        ? h('input', { class: 'titulo', type: 'text', value: conj.rot || '', 'data-bind': base + '.rot', 'data-tipo': 'texto' })
        : h('h3', { style: 'flex:1;font-size:13px' }, op.titulo || conj.rot),
      h('div', { class: 'dir', style: 'margin-left:auto' },
        op.removivel ? h('button', { class: 'btn mini perigo naoimprime', type: 'button',
                                     'data-acao': op.acaoRemover, 'data-i': op.i }, 'Remover') : null)
    ];

    if (conj.ativo === false) {
      return h('div', { class: 'conjunto desativado' }, h('div', { class: 'cab-conj' }, cabecalho));
    }

    var campos = [
      h('label', { class: 'campo' }, h('span', { class: 'rot' }, 'Catálogo / material do tubo'),
        F.selectCatalogo(st, ctx.cats, base + '.catalogoId')),
      h('label', { class: 'campo' }, h('span', { class: 'rot' }, 'Diâmetro adotado'),
        F.selectDiametro(st, ctx.cats, conj, base + '.itemRot')),
      UI.campo(st, 'Extensão', base + '.extensao', { unid: { grandeza: 'extensao', caminho: base + '.unidExt' } })
    ];

    if (op.adutora) {
      campos.push(UI.select(st, 'Vazão do trecho', base + '.vazaoModo', [
        { v: 'pct', rot: 'Fração da vazão total' },
        { v: 'abs', rot: 'Vazão informada' }
      ], { dica: 'Em adutoras que se ramificam, cada trecho a jusante da derivação conduz menos vazão. Informe a fração (%) da vazão total bombeada ou a vazão absoluta do trecho.' }));
      if (conj.vazaoModo === 'abs') {
        campos.push(UI.campo(st, 'Vazão do trecho', base + '.vazaoAbs',
          { unid: { grandeza: 'vazao', caminho: base + '.unidVazaoAbs' } }));
      } else {
        campos.push(UI.campo(st, 'Fração da vazão total', base + '.vazaoPct', { sufixo: '%' }));
      }
    }

    if (op.nBombas) {
      campos.push(UI.campo(st, 'Bombas que o trecho coleta', base + '.nBombas', {
        sufixo: 'ud',
        dica: 'Número de bombas cuja vazão passa por este trecho do barrilete comum. O primeiro trecho após a primeira derivação conduz 1 bomba, o seguinte 2, e assim por diante.\n\nQuando o cenário simulado tiver menos bombas em operação do que este número, o programa usa a quantidade em operação.'
      }));
    }

    var corpo = [
      h('div', { class: 'grade' }, campos),
      F.infoTubo(st, ctx, conj),
      UI.sub('Rugosidade'),
      F.blocoRugosidade(st, ctx, conj, base)
    ];

    if (op.adutora) {
      var tuboAtual = PDA.C.resolverTubo(conj, ctx);
      var pnCat = tuboAtual && tuboAtual.item && tuboAtual.item.pn ? Number(tuboAtual.item.pn) * 10 : null;
      corpo.push(UI.sub('Pressão admissível e cotas do trecho (para o perfil e a verificação de pressão)'));
      corpo.push(h('div', { class: 'grade' },
        UI.campo(st, 'PN / PFA do tubo (mca)', base + '.pnMcaOverride', {
          editado: conj.pnMcaOverride !== null && conj.pnMcaOverride !== '' && conj.pnMcaOverride !== undefined,
          placeholder: pnCat !== null ? UI.num(pnCat, 0) : 'informar',
          dica: 'Pressão de serviço admissível do tubo, em mca, usada para conferir a pressão em regime permanente e a sobrepressão do transitório.\n\n' +
                (pnCat !== null
                  ? 'O catálogo deste tubo informa PN ' + UI.numEdit(tuboAtual.item.pn) + ' bar (' + UI.num(pnCat, 0) + ' mca). Deixe em branco para usar esse valor.'
                  : 'O catálogo deste tubo não traz a pressão admissível — é o caso do ferro fundido dúctil, em que a PFA depende da classe, do DN e do tipo de junta. Consulte o catálogo do fabricante e informe aqui para habilitar a verificação.')
        }),
        UI.check(st, 'Informar cotas deste trecho', base + '.usarCotas',
          { dica: 'As cotas por trecho não alteram a altura geométrica total (que vem dos níveis de sucção e de chegada). Servem para traçar o perfil e verificar a pressão máxima em cada ponto contra o PN do tubo.' }),
        conj.usarCotas ? UI.campo(st, 'Cota inicial (m)', base + '.cotaIni') : null,
        conj.usarCotas ? UI.campo(st, 'Cota final (m)', base + '.cotaFim') : null));
    }

    corpo.push(UI.sub('Peças e conexões do trecho'));
    corpo.push(F.tabelaPecas(st, ctx, conj, base));
    corpo.push(UI.sub('Comparação de diâmetros'));
    corpo.push(F.varredura(st, ctx, conj, op.chave, base));

    return h('div', { class: 'conjunto' },
      h('div', { class: 'cab-conj' }, cabecalho),
      h('div', { class: 'corpo-conj' }, corpo));
  };

    var todos = c.succao.map(function (r) { return { r: r, tipo: 'succao' }; })

  Res.svgPerfil = function (st, ctx, res) {
    var L = 0, pontos = [], cotaMin = Infinity, cotaMax = -Infinity;
    var nsMin = Number(st.cotas.nivelSuccaoMin) || 0;
    var hglAtual = nsMin + res.projeto.Hm;
    var hInterno = 0;
    res.projeto.recalque.forEach(function (r) { hInterno += r.htotal; });
    hglAtual -= hInterno;

    pontos.push({ x: 0, cota: nsMin, hgl: hglAtual });
    cotaMin = Math.min(cotaMin, nsMin); cotaMax = Math.max(cotaMax, hglAtual);

    res.projeto.adutoras.forEach(function (r, i) {
      var a = st.adutoras[i] || {};
      L += r.L;
      hglAtual -= r.htotal;
      var cota = a.usarCotas ? (Number(a.cotaFim) || 0) : nsMin;
      pontos.push({ x: L, cota: cota, hgl: hglAtual });
      cotaMin = Math.min(cotaMin, cota); cotaMax = Math.max(cotaMax, hglAtual, cota);
    });

    if (!(L > 0)) return h('p', { class: 'vazio' }, 'Informe a extensão dos trechos para desenhar o perfil.');

    var W = 900, Hh = 300, mE = 54, mD = 16, mT = 14, mB = 34;
    var faixa = Math.max(1, cotaMax - cotaMin);
    var pad = faixa * 0.1;
    var yMin = cotaMin - pad, yMax = cotaMax + pad;
    function px(x) { return mE + x / L * (W - mE - mD); }
    function py(c) { return mT + (yMax - c) / (yMax - yMin) * (Hh - mT - mB); }

    var terreno = pontos.map(function (p) { return px(p.x) + ',' + py(p.cota); }).join(' ');
    var lp = pontos.map(function (p) { return px(p.x) + ',' + py(p.hgl); }).join(' ');

    var i, nDiv = 5;

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
    svg.setAttribute('class', 'perfil');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    function sv(tag, attrs, txt) {
      var e = document.createElementNS('http://www.w3.org/2000/svg', tag), k;
      for (k in attrs) if (attrs[k] !== null) e.setAttribute(k, attrs[k]);
      if (txt !== undefined) e.textContent = txt;
      return e;
    }
    for (i = 0; i <= nDiv; i++) {
      var cc = yMin + (yMax - yMin) * i / nDiv;
      svg.appendChild(sv('line', { class: 'grade-l', x1: mE, x2: W - mD, y1: py(cc), y2: py(cc) }));
      svg.appendChild(sv('text', { x: mE - 5, y: py(cc) + 3, 'text-anchor': 'end' }, UI.num(cc, 1)));
    }
    pontos.forEach(function (p, k) {
      svg.appendChild(sv('line', { class: 'grade-l', x1: px(p.x), x2: px(p.x), y1: mT, y2: Hh - mB }));
      svg.appendChild(sv('text', {
        x: px(p.x), y: Hh - mB + 14,
        'text-anchor': k === 0 ? 'start' : (k === pontos.length - 1 ? 'end' : 'middle')
      }, UI.num(p.x, 0)));
    });
    svg.appendChild(sv('polyline', { class: 'terreno', points: terreno }));
    svg.appendChild(sv('polyline', { class: 'lp', points: lp }));
    svg.appendChild(sv('text', { x: mE + 4, y: mT + 11 }, 'Linha piezométrica'));
    svg.appendChild(sv('text', { x: W - mD, y: Hh - 4, 'text-anchor': 'end' }, 'distância (m)'));
    svg.appendChild(sv('text', { x: 4, y: mT + 9 }, 'cota (m)'));

    return h('div', {},
      svg,
      h('p', { class: 'nota', style: 'margin-top:5px' },
        'Linha cheia fina: perfil do terreno pelas cotas informadas. Linha azul: linha piezométrica ' +
        'a partir da saída da elevatória, descontando as perdas de cada trecho. ' +
        'A distância vertical entre as duas é a pressão disponível.'));
  };

    App.cats = PDA.E.carregarCatalogos();
    App.st = PDA.E.carregarLocal() || PDA.E.padrao();

    if (cfg.aba) App.aba = cfg.aba;

    App.ligarEventos();
    App.render();
  };

     Renderização
     ================================================================ */

  App.render = function () {
    App.salvarFoco();

    var st = App.st;
    var ctx, res, erro = null;
    try {
      ctx = PDA.C.contexto(st, App.cats);
      res = PDA.C.resumo(st, App.cats);
    } catch (e) {
      erro = e;
      ctx = null;
    }

    /* navegação */
    var nav = document.getElementById('abas');
    UI.limpar(nav);
    App.abas.forEach(function (a) {
      nav.appendChild(h('button', {
        type: 'button', 'aria-selected': App.aba === a.id ? 'true' : 'false',
        onclick: function () { App.aba = a.id; PDA.E.salvarConfig({ tema: document.documentElement.getAttribute('data-tema'), aba: a.id }); App.render(); }
      }, a.rot));
    });

    var main = document.getElementById('conteudo');
    UI.limpar(main);

    if (erro) {
      main.appendChild(h('div', { class: 'aviso erro' },
        h('b', {}, 'Não foi possível concluir o cálculo'),
        String(erro && erro.message ? erro.message : erro),
        h('p', { style: 'margin-top:8px' },
          h('button', { class: 'btn', type: 'button', onclick: function () { App.st = PDA.E.padrao(); App.render(); } },
            'Recomeçar com o projeto padrão'))));
      return;
    }

    if (App.aba !== 'catalogos' && App.aba !== 'fontes') {
      main.appendChild(PDA.Res.faixa(st, ctx, res));
    }

    var conteudo;
    switch (App.aba) {
      case 'projeto':    conteudo = PDA.F.abaProjeto(st, ctx); break;
      case 'bombas':     conteudo = PDA.F.abaBombas(st, ctx, res); break;
      case 'succao':     conteudo = PDA.F.abaSuccao(st, ctx); break;
      case 'barrilete':  conteudo = PDA.F.abaBarrilete(st, ctx); break;
      case 'adutoras':   conteudo = PDA.F.abaAdutoras(st, ctx); break;
      case 'resultados': conteudo = PDA.Res.aba(st, ctx, res); break;
      case 'catalogos':  conteudo = PDA.K.aba(st, ctx); break;
      case 'fontes':     conteudo = PDA.K.abaFontes(st, ctx); break;
    }
    UI.add(main, conteudo);

    PDA.E.salvarLocal(st);
    App.restaurarFoco();
  };

  App.agendar = function (ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { timer = null; App.render(); }, ms);
  };

  App.salvarFoco = function () {
    var a = document.activeElement;
    foco = null;
    if (a && a.getAttribute && a.getAttribute('data-bind')) {
      foco = {
        bind: a.getAttribute('data-bind'),
        tag: a.tagName,
        valor: a.value,
        ini: a.selectionStart,
        fim: a.selectionEnd
      };
    }
  };

  App.restaurarFoco = function () {
    if (!foco) return;
    var el = document.querySelector('[data-bind="' + foco.bind + '"]');
    if (!el) { foco = null; return; }
    if (el.tagName === 'INPUT' && el.type === 'text' && foco.valor !== undefined) {
      el.value = foco.valor;
    }
    try {
      el.focus();
      if (el.setSelectionRange && foco.ini !== null && foco.ini !== undefined) {
        el.setSelectionRange(foco.ini, foco.fim);
      }
    } catch (e) { /* alguns tipos de campo não aceitam seleção */ }
    foco = null;
  };

  /* ================================================================
     Eventos
     ================================================================ */

  App.ligarEventos = function () {
    document.addEventListener('input', function (e) { App.aoDigitar(e, false); });
    document.addEventListener('change', function (e) { App.aoDigitar(e, true); });
    document.addEventListener('click', App.aoClicar);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') UI.fecharModal();
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); App.baixarProjeto(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') { /* deixa a impressão nativa */ }
    });
  };

  App.aoDigitar = function (e, ehChange) {
    var el = e.target;
    if (!el || !el.getAttribute) return;

    /* seletor de "adicionar peça" */
    var acaoCh = el.getAttribute('data-acao-change');
    if (acaoCh === 'addPeca' && el.value) {
      var base = el.getAttribute('data-base');
      var conj = UI.get(App.st, base);
      if (conj) {
        if (!conj.pecas) conj.pecas = [];
        conj.pecas.push(PDA.E.novaPeca(el.value));
      }
      App.render();
      return;
    }

    var bind = el.getAttribute('data-bind');
    if (!bind) return;
    var tipo = el.getAttribute('data-tipo') || 'num';
    var valor;
    if (tipo === 'bool') valor = el.checked;
    else if (tipo === 'texto') valor = el.value;
    else valor = el.value.trim() === '' ? null : UI.parseNum(el.value);

    UI.set(App.st, bind, valor);

    /* troca de catálogo: o diâmetro anterior pode não existir no novo */
    if (/\.catalogoId$/.test(bind) || bind === 'catalogoId') {
      var basePai = bind.replace(/\.?catalogoId$/, '');
      var c = basePai ? UI.get(App.st, basePai) : App.st;
      if (c) c.itemRot = '';
    }

    /* nº de bombas coerente */
    if (bind === 'bombas.operando' || bind === 'bombas.instaladas') {
      var b = App.st.bombas;
      b.instaladas = Math.max(1, Math.min(50, Math.round(Number(b.instaladas) || 1)));
      b.operando = Math.max(1, Math.min(b.instaladas, Math.round(Number(b.operando) || 1)));
    }

    var estrutural = el.getAttribute('data-estrutural') || tipo === 'bool' ||
                     el.tagName === 'SELECT' || ehChange;
    App.agendar(estrutural ? 0 : 320);
  };

  App.aoClicar = function (e) {
    var el = e.target.closest ? e.target.closest('[data-acao]') : null;
    if (!el) return;
    var acao = el.getAttribute('data-acao');
    var base = el.getAttribute('data-base');
    var i = el.getAttribute('data-i');
    var st = App.st;

    if (acao.indexOf('addTrecho:') === 0) {
      var ch = acao.split(':')[1];
      st[ch].trechos.push(PDA.E.novoTrechoComum(st[ch].trechos.length + 1));
      App.render(); return;
    }
    if (acao.indexOf('delTrecho:') === 0) {
      var ch2 = acao.split(':')[1];
      st[ch2].trechos.splice(Number(i), 1);
      App.render(); return;
    }

    switch (acao) {
      case 'removerPeca':
        UI.get(st, base).pecas.splice(Number(i), 1);
        App.render(); return;

      case 'escolherDiametro':
        UI.get(st, base).itemRot = el.getAttribute('data-rot');
        App.render(); return;

      case 'addAdutora':
        st.adutoras.push(PDA.E.novaAdutora(st.adutoras.length + 1));
        App.render(); return;

      case 'duplicarAdutora':
        var ult = st.adutoras[st.adutoras.length - 1];
        var novo = PDA.E.clone(ult);
        novo.rot = (ult.rot || 'Trecho') + ' (cópia)';
        st.adutoras.push(novo);
        App.render(); return;

      case 'delAdutora':
        if (st.adutoras.length > 1) st.adutoras.splice(Number(i), 1);
        App.render(); return;

      case 'limparRugosidade':
        var cj = UI.get(st, el.getAttribute('data-base'));
        cj.cOverride = null; cj.epsOverride = null;
        App.render(); return;

      case 'restaurarCriterios':
        UI.confirmar('Restaurar critérios',
          'As faixas de velocidade e de perda unitária voltam aos valores recomendados pelas normas e pela literatura. As alterações que você fez serão perdidas.',
          function () { st.criterios = PDA.E.clone(PDA.P.criterios); App.render(); UI.toast('Critérios restaurados.'); });
        return;

      case 'editarMotores': App.modalMotores(); return;
      case 'imprimir': window.print(); return;

      case 'novoCatalogo': PDA.K.modalCatalogo(st, { cats: App.cats }, null, null); return;
      case 'duplicarCatalogo':
        PDA.K.modalCatalogo(st, { cats: App.cats }, null, PDA.CAT.buscar(App.cats.todos, el.getAttribute('data-id')));
        return;
      case 'editarCatalogo':
        PDA.K.modalCatalogo(st, { cats: App.cats }, PDA.CAT.buscar(App.cats.todos, el.getAttribute('data-id')), null);
        return;
      case 'excluirCatalogo':
        var idc = el.getAttribute('data-id');
        var cx = PDA.CAT.buscar(App.cats.todos, idc);
        UI.confirmar('Excluir catálogo', 'Excluir "' + (cx ? cx.nome : idc) + '"? Os trechos que usam este catálogo ficarão sem diâmetro.',
          function () {
            App.gravarCatalogos(App.cats.usuario.filter(function (c) { return c.id !== idc; }));
            PDA.K.selecionado = null;
            App.render(); UI.toast('Catálogo excluído.');
          });
        return;
      case 'exportarCatalogos': App.baixarCatalogos(); return;
      case 'importarCatalogos': App.abrirArquivo(App.carregarCatalogos); return;

      case 'novoProjeto':
        UI.confirmar('Novo projeto', 'Descartar os dados atuais e começar um projeto em branco?',
          function () { App.st = PDA.E.padrao(); App.aba = 'projeto'; App.render(); });
        return;
      case 'abrirProjeto': App.abrirArquivo(App.carregarProjeto); return;
      case 'salvarProjeto': App.baixarProjeto(); return;
      case 'exemplo': App.modalExemplos(); return;
      case 'ajuda': App.modalAjuda(); return;
      case 'tema':
        var atual = document.documentElement.getAttribute('data-tema') === 'escuro' ? 'claro' : 'escuro';
        document.documentElement.setAttribute('data-tema', atual);
        PDA.E.salvarConfig({ tema: atual, aba: App.aba });
        return;
    }
  };

  App.baixar = function (nome, texto) {
    var blob = new Blob([texto], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  };

  function nomeArquivo(st, sufixo) {
    var n = (st.projeto.nome || 'adutora').replace(/[^\wÀ-ÿ .-]+/g, '').trim().slice(0, 60) || 'adutora';
    return n + sufixo;
  }

  App.baixarProjeto = function () {
    App.baixar(nomeArquivo(App.st, '.adutora.json'),
      JSON.stringify({ tipo: 'pda-projeto', versao: PDA.E.VERSAO, projeto: App.st, catalogosUsuario: App.cats.usuario }, null, 1));
    UI.toast('Projeto salvo em arquivo.');
  };

  App.baixarCatalogos = function () {
    if (!App.cats.usuario.length) { UI.toast('Você ainda não cadastrou catálogos próprios.'); return; }
    App.baixar('catalogos-tubos.json',
      JSON.stringify({ tipo: 'pda-catalogos', versao: PDA.E.VERSAO, catalogos: App.cats.usuario }, null, 1));
    UI.toast(App.cats.usuario.length + ' catálogo(s) exportado(s).');
  };

  App.abrirArquivo = function (cb) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try { cb(JSON.parse(String(fr.result))); }
        catch (e) { UI.toast('Arquivo inválido: ' + e.message); }
      };
      fr.readAsText(f);
    };
    inp.click();
  };

  App.carregarProjeto = function (dados) {
    var proj = dados.projeto || (dados.versao !== undefined && dados.vazao ? dados : null);
    if (!proj) { UI.toast('Este arquivo não contém um projeto.'); return; }
    App.st = PDA.E.migrar(proj);
    if (dados.catalogosUsuario && dados.catalogosUsuario.length) {
      var atuais = App.cats.usuario.slice();
      dados.catalogosUsuario.forEach(function (c) {
        if (!atuais.some(function (x) { return x.id === c.id; })) atuais.push(c);
      });
      App.gravarCatalogos(atuais);
    }
    App.aba = 'resultados';
    App.render();
    UI.toast('Projeto carregado.');
  };

  App.carregarCatalogos = function (dados) {
    var lista = dados.catalogos || (Array.isArray(dados) ? dados : null);
    if (!lista) { UI.toast('Este arquivo não contém catálogos.'); return; }
    var atuais = App.cats.usuario.slice(), n = 0;
    lista.forEach(function (c) {
      if (!c.id) c.id = 'usr_' + Math.random().toString(36).slice(2, 9);
      if (!c.itens || !c.itens.length) return;
      atuais = atuais.filter(function (x) { return x.id !== c.id; });
      atuais.push(c); n++;
    });
    App.gravarCatalogos(atuais);
    App.render();
    UI.toast(n + ' catálogo(s) importado(s).');
  };
