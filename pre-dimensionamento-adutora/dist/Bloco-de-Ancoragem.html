      if (conjPN) conjPN.pnAuto = false;
    } else if (/\.(catalogoId|itemRot)$/.test(bind)) {
      App.autoPreencherPN(bind.replace(/\.(catalogoId|itemRot)$/, ''));
    }

    /* cota de chegada e cota final do último trecho são o mesmo número:
       editar um mantém o outro em dia */
    App.sincronizarCotas(bind);

    /* nº de bombas coerente */
    if (bind === 'bombas.operando' || bind === 'bombas.instaladas') {
      var b = App.st.bombas;
      b.instaladas = Math.max(1, Math.min(50, Math.round(Number(b.instaladas) || 1)));
      b.operando = Math.max(1, Math.min(b.instaladas, Math.round(Number(b.operando) || 1)));
    }

    var estrutural = el.getAttribute('data-estrutural') || tipo === 'bool' ||
                     el.tagName === 'SELECT' || ehChange;
    App.agendar(estrutural ? 0 : 320);
  };

  /* Mantém uma única verdade para as cotas de partida e de chegada.
     Chamado depois de cada edição de campo. */
  App.sincronizarCotas = function (bind) {
    var st = App.st;
    var ativas = st.adutoras.filter(function (a) { return a.ativo !== false; });
    var ultima = ativas[ativas.length - 1];
    var primeira = ativas[0];

    if (bind === 'cotas.nivelChegada' && ultima && ultima.usarCotas) {
      ultima.cotaFim = st.cotas.nivelChegada;
      return;
    }
    if (/^adutoras\.\d+\.cotaFim$/.test(bind) && ultima &&
        UI.get(st, bind.replace('.cotaFim', '')) === ultima) {
      st.cotas.nivelChegada = ultima.cotaFim;
      return;
    }
    if ((bind === 'cotas.cotaPartida' || bind === 'cotas.nivelSuccaoMin') && primeira && primeira.usarCotas) {
      primeira.cotaIni = PDA.C.cotaPartida(st);
      return;
    }
    if (/^adutoras\.\d+\.cotaIni$/.test(bind) && primeira &&
        UI.get(st, bind.replace('.cotaIni', '')) === primeira) {
      st.cotas.cotaPartida = primeira.cotaIni;
      return;
    }
    /* ao ligar as cotas de um trecho, já nasce coerente */
    if (/^adutoras\.\d+\.usarCotas$/.test(bind)) {
      if (ultima && ultima.usarCotas &&
          (ultima.cotaFim === null || ultima.cotaFim === undefined || Number(ultima.cotaFim) === 0)) {
        ultima.cotaFim = st.cotas.nivelChegada;
      }
      if (primeira && primeira.usarCotas &&
          (primeira.cotaIni === null || primeira.cotaIni === undefined || Number(primeira.cotaIni) === 0)) {
        primeira.cotaIni = PDA.C.cotaPartida(st);
      }
    }
  };

  App.aoClicar = function (e) {
    var el = e.target.closest ? e.target.closest('[data-acao]') : null;
    if (!el) return;
    var acao = el.getAttribute('data-acao');
    var base = el.getAttribute('data-base');
    var i = el.getAttribute('data-i');
    var st = App.st;

    if (acao.indexOf('addTrecho:') === 0) {
      var ch = acao.split(':')[1];
      var tr = st[ch].trechos;
      var tipo = ch === 'succaoComum' ? 'succao' : 'barrilete';
      tr.push(PDA.E.novoTrechoComum(tr.length + 1, tipo, tr[tr.length - 1]));
      App.render(); return;
    }
    if (acao.indexOf('delTrecho:') === 0) {
      var ch2 = acao.split(':')[1];
      st[ch2].trechos.splice(Number(i), 1);
      App.render(); return;
    }

    switch (acao) {
      case 'mover': {
        App.moverItem(el.getAttribute('data-arr'), Number(el.getAttribute('data-i')),
                      Number(el.getAttribute('data-para')));
        return;
      }

      case 'removerPeca':
        UI.get(st, base).pecas.splice(Number(i), 1);
        App.render(); return;

      case 'escolherDiametro':
        UI.get(st, base).itemRot = el.getAttribute('data-rot');
        App.render(); return;

      case 'addAdutora':
        st.adutoras.push(PDA.E.novaAdutora(st.adutoras.length + 1,
          st.adutoras[st.adutoras.length - 1]));
        App.render(); return;

      case 'duplicarAdutora':
        var ult = st.adutoras[st.adutoras.length - 1];
        var novo = PDA.E.clone(ult);
        novo.rot = (ult.rot || 'Trecho') + ' (cópia)';
        st.adutoras.push(novo);
        App.render(); return;

      case 'delAdutora':
        if (st.adutoras.length > 1) st.adutoras.splice(Number(i), 1);
        App.render(); return;

      case 'limparRugosidade':
        var cj = UI.get(st, el.getAttribute('data-base'));
        cj.cOverride = null; cj.epsOverride = null;
        App.render(); return;

      case 'restaurarCriterios':
        UI.confirmar('Restaurar critérios',
          'As faixas de velocidade e de perda unitária voltam aos valores recomendados pelas normas e pela literatura. As alterações que você fez serão perdidas.',
          function () { st.criterios = PDA.E.clone(PDA.P.criterios); App.render(); UI.toast('Critérios restaurados.'); });
        return;

      case 'editarMotores': App.modalMotores(); return;
      case 'imprimir': App.imprimir(); return;

      case 'irAba': App.irPara(el.getAttribute('data-aba')); return;

      /* coerência de cotas */
      case 'sincCotaChegada': {
        var at = st.adutoras.filter(function (a) { return a.ativo !== false; });
        var ul = at[at.length - 1];
        if (ul) st.cotas.nivelChegada = Number(ul.cotaFim) || 0;
        App.render(); UI.toast('Cota de chegada ajustada.'); return;
      }
      case 'sincCotaTrecho': {
        var at2 = st.adutoras.filter(function (a) { return a.ativo !== false; });
        var ul2 = at2[at2.length - 1];
        if (ul2) ul2.cotaFim = Number(st.cotas.nivelChegada) || 0;
        App.render(); UI.toast('Cota final do trecho ajustada.'); return;
      }
      case 'sincCotaPartida': {
        var at3 = st.adutoras.filter(function (a) { return a.ativo !== false; });
        if (at3[0]) at3[0].cotaIni = PDA.C.cotaPartida(st);
        App.render(); UI.toast('Cota inicial do trecho ajustada.'); return;
      }
      case 'trocarNiveis': {
        var t = st.cotas.nivelSuccaoMin;
        st.cotas.nivelSuccaoMin = st.cotas.nivelSuccaoMax;
        st.cotas.nivelSuccaoMax = t;
        App.render(); UI.toast('Níveis trocados.'); return;
      }

      /* perfil da linha */
      case 'colarPerfil': PDA.Pf.modalColar(st); return;
      case 'addPontoPerfil': {
        var pp = st.perfil.pontos;
        var ultX = pp.length ? Number(pp[pp.length - 1].est) || 0 : 0;
        var ultC = pp.length ? Number(pp[pp.length - 1].cota) || 0 : 0;
        pp.push({ est: st.perfil.modo === 'individual' ? 0 : ultX, cota: ultC, rot: '' });
        App.render(); return;
      }
      case 'delPontoPerfil': st.perfil.pontos.splice(Number(i), 1); App.render(); return;
      case 'limparPerfil':
        UI.confirmar('Limpar perfil', 'Remover todos os pontos do perfil da linha?',
          function () { st.perfil.pontos = []; App.render(); });
        return;

      /* curva da bomba */
      case 'colarCurva': PDA.Pf.modalColarCurva(st); return;
      case 'addPontoCurva': {
        if (!st.curvaBomba.pontos) st.curvaBomba.pontos = [];
        st.curvaBomba.pontos.push({ q: 0, H: 0 });
        App.render(); return;
      }
      case 'delPontoCurva': st.curvaBomba.pontos.splice(Number(i), 1); App.render(); return;

      /* marca */
      case 'logo': App.modalLogo(); return;

      case 'novoCatalogo': PDA.K.modalCatalogo(st, { cats: App.cats }, null, null); return;
      case 'duplicarCatalogo':
        PDA.K.modalCatalogo(st, { cats: App.cats }, null, PDA.CAT.buscar(App.cats.todos, el.getAttribute('data-id')));
        return;
      case 'editarCatalogo':
        PDA.K.modalCatalogo(st, { cats: App.cats }, PDA.CAT.buscar(App.cats.todos, el.getAttribute('data-id')), null);
        return;
      case 'excluirCatalogo':
        var idc = el.getAttribute('data-id');
        var cx = PDA.CAT.buscar(App.cats.todos, idc);
        UI.confirmar('Excluir catálogo', 'Excluir "' + (cx ? cx.nome : idc) + '"? Os trechos que usam este catálogo ficarão sem diâmetro.',
          function () {
            App.gravarCatalogos(App.cats.usuario.filter(function (c) { return c.id !== idc; }));
            PDA.K.selecionado = null;
            App.render(); UI.toast('Catálogo excluído.');
          });
        return;
      case 'exportarCatalogos': App.baixarCatalogos(); return;
      case 'importarCatalogos': App.abrirArquivo(App.carregarCatalogos); return;

      case 'novoProjeto':
        UI.confirmar('Novo projeto', 'Descartar os dados atuais e começar um projeto em branco?',
          function () { App.st = PDA.E.padrao(); App.aba = 'projeto'; App.render(); });
        return;
      case 'blocoNovo': {
        var bl = App.st.blocos;
        var modeloB = bl.itens.length ? bl.itens[bl.itens.length - 1] : null;
        var novoB = PDA.E.novoBloco(bl.itens.length + 1, modeloB);
        if (PDA.MODO_BLOCO) { novoB.tuboOrigem = 'manual'; novoB.pressaoFonte = 'informada'; }
        bl.itens.push(novoB);
        App.render();
        return;
      }
      case 'blocoDuplicar': {
        var iD = Number(el.getAttribute('data-i'));
        var copia = PDA.E.clone(App.st.blocos.itens[iD]);
        copia.rot += ' (cópia)';
        App.st.blocos.itens.splice(iD + 1, 0, copia);
        App.render();
        return;
      }
      case 'blocoExcluir': {
        var iE = Number(el.getAttribute('data-i'));
        App.st.blocos.itens.splice(iE, 1);
        App.render();
        return;
      }
      case 'blocoMover': {
        var iM = Number(el.getAttribute('data-i'));
        var dM = Number(el.getAttribute('data-d'));
        var arr = App.st.blocos.itens;
        var jM = iM + dM;
        if (jM >= 0 && jM < arr.length) {
          var tmpB = arr[iM]; arr[iM] = arr[jM]; arr[jM] = tmpB;
          App.render();
        }
        return;
      }
      case 'blocoTipo': {
        var baseT = el.getAttribute('data-base');
        var tipoT = el.getAttribute('data-tipo-bloco');
        UI.set(App.st, baseT + '.tipoEscolhido', tipoT ? Number(tipoT) : null);
        App.render();
        return;
      }
      case 'abrirProjeto': PDA.B.abrir(); return;
      case 'importarProjeto': UI.fecharModal(); App.abrirArquivo(App.carregarProjeto); return;
      case 'salvarProjeto': App.guardarNaBiblioteca(); return;
      case 'exportarProjeto': App.modalExportar(); return;
      case 'exportarArquivo': UI.fecharModal(); App.baixarProjeto(); return;
      case 'memorial': UI.fecharModal(); PDA.X.previa(); return;
      case 'memorialPdf': PDA.X.pdf(); return;
      case 'memorialWord': PDA.X.word(); return;
      case 'editarIntroducao': PDA.X.modalIntroducao(); return;
      case 'exemplo': PDA.B.abrir(); return;
      case 'exemploAgua':
        UI.fecharModal(); App.st = App.exemploAgua(); App.autoPreencherPNTodos();
        App.irPara('resumo'); return;
      case 'exemploEsgoto':
        UI.fecharModal(); App.st = App.exemploEsgoto(); App.autoPreencherPNTodos();
        App.irPara('resumo'); return;
      case 'abrirDaBiblioteca': {
        var reg = PDA.E.doBiblioteca(el.getAttribute('data-id'));
        if (!reg) { UI.toast('Projeto não encontrado.'); return; }
        App.st = PDA.E.migrar(PDA.E.clone(reg.st));
        App.st.id = reg.id;
        App.corrigirTipos();
        UI.fecharModal();
        App.irPara('resumo');
        UI.toast('Projeto "' + reg.nome + '" aberto.');
        return;
      }
      case 'duplicarDaBiblioteca': {
        var reg2 = PDA.E.doBiblioteca(el.getAttribute('data-id'));
        if (!reg2) return;
        App.st = PDA.E.migrar(PDA.E.clone(reg2.st));
        App.st.id = null;
        App.corrigirTipos();
        App.st.projeto.nome = (App.st.projeto.nome || 'Projeto') + ' (cópia)';
        UI.fecharModal();
        App.irPara('resumo');
        UI.toast('Cópia aberta. Use Salvar para guardá-la como um projeto novo.');
        return;
      }
      case 'excluirDaBiblioteca': {
        var id3 = el.getAttribute('data-id');
        var reg3 = PDA.E.doBiblioteca(id3);
        UI.confirmar('Excluir da biblioteca',
          'Excluir "' + (reg3 ? reg3.nome : id3) + '" da biblioteca deste navegador? ' +
          'O arquivo exportado, se houver, não é afetado.',
          function () {
            PDA.E.excluirDaBiblioteca(id3);
            UI.toast('Projeto excluído.');
            PDA.B.abrir();
          });
        return;
      }
      case 'ajuda': App.modalAjuda(); return;
      case 'tema':
        var atual = document.documentElement.getAttribute('data-tema') === 'escuro' ? 'claro' : 'escuro';
        document.documentElement.setAttribute('data-tema', atual);
        PDA.E.salvarConfig({ tema: atual, aba: App.aba });
        return;
    }
  };

  /* Preenche o PN do trecho com o do catálogo, quando houver. Só age
     enquanto o usuário não tiver informado um valor próprio. */
  App.autoPreencherPN = function (caminhoConj) {
    var conj = UI.get(App.st, caminhoConj);
    if (!conj || conj.pnAuto === false) return;
    var ctx;
    try { ctx = PDA.C.contexto(App.st, App.cats); } catch (e) { return; }
    var tubo = PDA.C.resolverTubo(conj, ctx);
    if (tubo && !tubo.semDiametro && tubo.item && tubo.item.pn && conj.itemRot) {
      conj.pnMcaOverride = Number(tubo.item.pn) * 10;
    } else {
      conj.pnMcaOverride = null;
    }
  };

  /* Aplica o preenchimento automático a todos os trechos de adutora */
  /* projetos gravados antes desta versão podem ter os trechos de sucção
     comum marcados como barrilete, o que aplicava o critério errado */
  App.corrigirTipos = function () {
    (App.st.succaoComum.trechos || []).forEach(function (t) { t.tipo = 'succao'; });
    (App.st.barrileteComum.trechos || []).forEach(function (t) { t.tipo = 'barrilete'; });
    App.st.succaoIndividual.tipo = 'succao';
    App.st.barrileteIndividual.tipo = 'barrilete';
    (App.st.adutoras || []).forEach(function (a) { a.tipo = 'adutora'; });
  };

  App.autoPreencherPNTodos = function () {
    App.st.adutoras.forEach(function (a, i) { App.autoPreencherPN('adutoras.' + i); });
  };

  /* Move um item de posição dentro de um array do estado */
  App.moverItem = function (caminho, de, para) {
    var arr = UI.get(App.st, caminho);
    if (!Array.isArray(arr)) return;
    if (de < 0 || de >= arr.length) return;
    para = Math.max(0, Math.min(arr.length - 1, para));
    if (de === para) return;
    var item = arr.splice(de, 1)[0];
    arr.splice(para, 0, item);
    App.render();
  };

  /* ================================================================
     Catálogos do usuário
     ================================================================ */

  App.gravarCatalogos = function (usuario) {
    App.cats.usuario = usuario;
    App.cats.todos = PDA.CAT.padrao.concat(usuario);
    if (!PDA.E.salvarCatalogos(usuario)) {
      UI.toast('Não foi possível gravar no navegador — exporte os catálogos em arquivo.');
    }
  };

  /* ================================================================
     Arquivos
     ================================================================ */

  App.baixar = function (nome, texto) {
    var blob = new Blob([texto], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  };

  function nomeArquivo(st, sufixo) {
    var n = (st.projeto.nome || 'adutora').replace(/[^\wÀ-ÿ .-]+/g, '').trim().slice(0, 60) || 'adutora';
    return n + sufixo;
  }

  /* Guarda o projeto atual na biblioteca do navegador */
  App.guardarNaBiblioteca = function () {
    var st = App.st;
    if (!st.projeto.nome || st.projeto.nome === PDA.E.padrao().projeto.nome) {
      App.pedirNome();
      return;
    }
    var r = PDA.E.guardar(st, App.agora());
    if (!r.ok) {
      UI.modal('Não foi possível guardar', [
        h('p', {}, 'O armazenamento do navegador está cheio. Exclua projetos antigos na biblioteca ' +
                   'ou exporte este projeto em arquivo.'),
        h('div', { class: 'linha', style: 'margin-top:10px' },
          h('button', { class: 'btn primario', type: 'button', onclick: function () { UI.fecharModal(); App.baixarProjeto(); } }, 'Exportar em arquivo'),
          h('button', { class: 'btn', type: 'button', onclick: function () { UI.fecharModal(); PDA.B.abrir(); } }, 'Abrir a biblioteca'))
      ]);
      return;
    }
    App.render();
    UI.toast(r.novo ? 'Projeto guardado na biblioteca.' : 'Projeto atualizado na biblioteca.');
  };

  App.pedirNome = function () {
    var inp = h('input', { type: 'text', value: App.st.projeto.nome || '', placeholder: 'Ex.: EEE Jardim Aeroporto — LR até a ETE' });
    var loc = h('input', { type: 'text', value: App.st.projeto.local || '', placeholder: 'Cidade / obra' });
    var resp = h('input', { type: 'text', value: App.st.projeto.responsavel || '', placeholder: 'Responsável técnico' });
    UI.modal('Nome do projeto', [
      h('p', { class: 'nota' },
        'A biblioteca organiza os projetos por estes campos. Dê um nome antes de guardar — ' +
        'os outros dois são opcionais e ajudam a achar depois.'),
      h('div', { class: 'grade', style: 'margin-top:10px' },
        h('label', { class: 'campo chave' }, h('span', { class: 'rot' }, 'Projeto / obra'), inp),
        h('label', { class: 'campo' }, h('span', { class: 'rot' }, 'Local'), loc),
        h('label', { class: 'campo' }, h('span', { class: 'rot' }, 'Responsável técnico'), resp))
    ], [
      h('button', { class: 'btn', type: 'button', onclick: UI.fecharModal }, 'Cancelar'),
      h('button', {
        class: 'btn primario', type: 'button', onclick: function () {
          if (!inp.value.trim()) { UI.toast('Informe o nome do projeto.'); return; }
          App.st.projeto.nome = inp.value.trim();
          App.st.projeto.local = loc.value.trim();
          App.st.projeto.responsavel = resp.value.trim();
          UI.fecharModal();
          App.guardarNaBiblioteca();
        }
      }, 'Guardar')
    ]);
    setTimeout(function () { inp.focus(); inp.select(); }, 30);
  };

  /* data/hora atual em ISO — isolada para poder ser fixada nos testes */
  App.agora = function () { return new Date().toISOString(); };

  App.baixarProjeto = function () {
    App.baixar(nomeArquivo(App.st, '.adutora.json'),
      JSON.stringify({ tipo: 'pda-projeto', versao: PDA.E.VERSAO, projeto: App.st, catalogosUsuario: App.cats.usuario }, null, 1));
    UI.toast('Projeto salvo em arquivo.');
  };

  App.baixarCatalogos = function () {
    if (!App.cats.usuario.length) { UI.toast('Você ainda não cadastrou catálogos próprios.'); return; }
    App.baixar('catalogos-tubos.json',
      JSON.stringify({ tipo: 'pda-catalogos', versao: PDA.E.VERSAO, catalogos: App.cats.usuario }, null, 1));
    UI.toast(App.cats.usuario.length + ' catálogo(s) exportado(s).');
  };

  App.abrirArquivo = function (cb) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try { cb(JSON.parse(String(fr.result))); }
        catch (e) { UI.toast('Arquivo inválido: ' + e.message); }
      };
      fr.readAsText(f);
    };
    inp.click();
  };

  App.carregarProjeto = function (dados) {
    var proj = dados.projeto || (dados.versao !== undefined && dados.vazao ? dados : null);
    if (!proj) { UI.toast('Este arquivo não contém um projeto.'); return; }
    App.st = PDA.E.migrar(proj);
    App.corrigirTipos();
    App.autoPreencherPNTodos();
    if (dados.catalogosUsuario && dados.catalogosUsuario.length) {
      var atuais = App.cats.usuario.slice();
      dados.catalogosUsuario.forEach(function (c) {
        if (!atuais.some(function (x) { return x.id === c.id; })) atuais.push(c);
      });
      App.gravarCatalogos(atuais);
    }
    App.aba = 'resultados';
    App.render();
    UI.toast('Projeto carregado.');
  };

  App.carregarCatalogos = function (dados) {
    var lista = dados.catalogos || (Array.isArray(dados) ? dados : null);
    if (!lista) { UI.toast('Este arquivo não contém catálogos.'); return; }
    var atuais = App.cats.usuario.slice(), n = 0;
    lista.forEach(function (c) {
      if (!c.id) c.id = 'usr_' + Math.random().toString(36).slice(2, 9);
      if (!c.itens || !c.itens.length) return;
      atuais = atuais.filter(function (x) { return x.id !== c.id; });
      atuais.push(c); n++;
    });
    App.gravarCatalogos(atuais);
    App.render();
    UI.toast(n + ' catálogo(s) importado(s).');
  };

  /* ================================================================
     Modais
     ================================================================ */

  App.modalMotores = function () {
    var ta = h('textarea', { rows: 6, style: 'font-family:var(--mono)' },
      App.st.bombas.motores.map(function (m) { return UI.numEdit(m); }).join(' '));
    UI.modal('Linha de motores comerciais (cv)', [
      h('p', { class: 'nota' },
        'Potências nominais consideradas na escolha do motor, em cv. Separe por espaço, vírgula ou quebra de linha. ' +

  App.modalLogo = function () {
    var modo = PDA.M.modo();

    var aviso = h('div', {});

    function mostrar() {
      UI.limpar(previa);

      }

    function escolher(m) {
      PDA.M.definirModo(m);
      App.montarMarca();
      App.render();
      App.modalLogo();
    }

    function opcao(id, titulo, descricao, extra) {
      var atual = PDA.M.modo() === id;
      return h('button', {
        class: 'btn opcao-logo' + (atual ? ' escolhida' : ''), type: 'button',
        onclick: function () { if (!atual) escolher(id); }
      }, h('b', {}, (atual ? '● ' : '○ ') + titulo),
         h('div', { class: 'nota' }, descricao), extra || null);

    var entrada = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/svg+xml,image/webp' });

      var f = entrada.files && entrada.files[0];
      if (!f) return;
      if (f.size > 900 * 1024) {
        UI.toast('Arquivo muito grande (máximo 900 kB). Reduza a imagem e tente de novo.');
        return;
      }
      var fr = new FileReader();
      fr.onload = function () {
        var uri = String(fr.result);
        PDA.M.medir(uri, function (m) {
          if (!PDA.M.gravarLogo(uri)) {
            UI.toast('Não foi possível gravar a logo neste navegador.');
            return;
          }
          App.montarMarca(); App.render();
          mostrar();
          UI.limpar(aviso);
          if (m) {
            var alturaEfetiva = Math.min(PDA.M.CAIXA.alturaTela, PDA.M.CAIXA.larguraTela / m.proporcao);
            if (m.proporcao > 7) {
              UI.add(aviso, h('div', { class: 'aviso' },
                'Esta logo é bem comprida (proporção ' + UI.num(m.proporcao, 1) + ':1). Ela cabe inteira na caixa, ' +
                'mas fica com cerca de ' + UI.num(alturaEfetiva, 0) + ' px de altura. Se preferir mais destaque, ' +
                'use uma versão mais compacta da marca — só o símbolo, ou símbolo e nome em duas linhas.'));
            } else if (m.proporcao < 0.8) {
              UI.add(aviso, h('div', { class: 'aviso' },
                'Esta logo é mais alta que larga (proporção ' + UI.num(m.proporcao, 2) + ':1). Ela cabe inteira, ' +
                'limitada pela altura da caixa. Uma versão horizontal costuma render melhor em cabeçalho.'));
            } else {
              UI.add(aviso, h('div', { class: 'aviso ok' },
                'Logo carregada: ' + m.largura + ' × ' + m.altura + ' px. Cabe bem na caixa do cabeçalho.'));
            }
          }
          UI.toast('Logo carregada.');
        });
      };
      fr.readAsDataURL(f);
    });

    mostrar();

    /* ---- timbrado ---- */
    var timbre = PDA.M.timbrado();
    var previaTimb = h('div', { class: 'previa-timbrado' });
    var avisoTimb = h('div', {});

    function mostrarTimbrado() {
      UI.limpar(previaTimb);
      var t = PDA.M.timbrado();
      if (!t) {
        UI.add(previaTimb, h('p', { class: 'nota' },
          'Sem timbrado: as páginas do memorial saem em branco, com as margens da ABNT ' +
          '(3 cm em cima e à esquerda, 2 cm embaixo e à direita) e o número no canto superior direito.'));
        return;
      }
      UI.add(previaTimb,
        h('div', { class: 'timb-folha' },
          h('img', { src: t.imagem, alt: 'Timbrado' }),
          h('div', {
            class: 'timb-mancha',
            style: 'top:' + (t.margSup / 297 * 100) + '%;bottom:' + (t.margInf / 297 * 100) +
                   '%;left:' + (30 / 210 * 100) + '%;right:' + (20 / 210 * 100) + '%'
          }, h('span', {}, 'texto'))),
        h('p', { class: 'nota' },
          'A área marcada é onde o texto entra. Original de ' + t.largura + ' × ' + t.altura +

    var entradaTimb = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp' });
    entradaTimb.addEventListener('change', function () {
      var f = entradaTimb.files && entradaTimb.files[0];

          UI.limpar(avisoTimb);
          if (!t) { UI.add(avisoTimb, h('div', { class: 'aviso' }, 'Não foi possível ler a imagem.')); return; }
          var ant = PDA.M.timbrado();
          t.margSup = ant ? ant.margSup : 35;
          t.margInf = ant ? ant.margInf : 25;
          if (!PDA.M.gravarTimbrado(t)) {
            UI.add(avisoTimb, h('div', { class: 'aviso' },
              'A imagem reduzida ainda não coube no armazenamento do navegador. ' +
              'Salve o timbrado em JPG antes de carregar.'));
            return;
          }
          App.modalLogo();
          UI.toast('Timbrado carregado (' + UI.num(t.bytes / 1024, 0) + ' kB).');
        });
      };
      fr.readAsDataURL(f);

          h('div', { style: 'margin-top:7px' }, entrada)),
        opcao('nenhuma', 'Sem logo',

    }

    D.secao('Perda de carga localizada');
    D.p('As perdas localizadas foram calculadas pelo método dos coeficientes de perda de carga, peça a peça, ' +
        'com a velocidade do próprio trecho — ou com a velocidade no diâmetro da peça, quando informado ' +
        'diâmetro distinto do tubo ' + D.usar('az') + '.');
    D.formula('h_l = K \\cdot \\frac{v^2}{2 \\cdot g}',
      'h\u2097 é a perda de carga localizada (m); e K, o coeficiente de perda da peça (adimensional).');

    D.secao('Coeficientes de rugosidade adotados');
    D.p('Os coeficientes de rugosidade foram adotados em função do material do tubo e da faixa de idade ou ' +
        'condição de conservação, a partir das faixas consagradas na literatura ' + D.usar('az') + ' ' +
        MEM.cit('porto') + '.' +
        (esgoto ? ' Por se tratar de ' + (fl ? fl.rot.toLowerCase() : 'esgoto') +
          ', foi aplicado um agravo sobre o valor de referência, prática usual em linhas de recalque em que a ' +
          'formação de biofilme na parede aumenta a rugosidade efetiva ' + D.usar('tsutiyaEsgoto') + '.' : ''));
    D.usar('porto');

    /* deixa explícito de onde veio o valor: tabela, tabela com o agravo do
       fluido, ou número digitado pelo projetista */
    function origemRug(r, cons) {
      if (r.tubo.cOverride || r.tubo.epsOverride) return 'informado pelo projetista';
      var aj = cons.ajusteFluido;
      var d = aj ? (usaHW ? aj.dC : aj.dEps) : 0;
      if (!d) return 'valor de referência';
      return 'valor de referência com agravo de ' +
             (usaHW ? n(Math.abs(d), 0) + ' no C' : n(Math.abs(d), 2) + ' mm em ε') +
             ' (' + aj.rot.toLowerCase() + ')';
    }

    var linhasRug = [];
    var vistosRug = {};
    c.succao.concat(c.recalque, c.adutoras).forEach(function (r) {
      if (!r.tubo || !r.tubo.item) return;
      var chave = r.tubo.material + '|' + r.conj.idade + '|' + (usaHW ? r.tubo.C : r.tubo.epsMm);
      if (vistosRug[chave]) return;
      vistosRug[chave] = true;
      var cons = r.tubo.consulta || {};
      var faixa = usaHW ? cons.faixaC : cons.faixaEps;
      linhasRug.push(h('tr', {},
        h('td', { class: 'esq' }, (PDA.R.materiais[r.tubo.material] || {}).rot || r.tubo.material),
        h('td', { class: 'esq' }, (PDA.R.faixasIdade.filter(function (f) { return f.id === r.conj.idade; })[0] || {}).rot || '—'),
        h('td', {}, faixa ? ne(faixa[0]) + ' a ' + ne(faixa[1]) : '—'),
        h('td', {}, usaHW ? n(r.tubo.C, 0) : n(r.tubo.epsMm, 4)),
        h('td', { class: 'esq' }, origemRug(r, cons))));
    });
    if (linhasRug.length) {
      D.tabela('Coeficientes de rugosidade adotados',
        [{ rot: 'Material', esq: true }, { rot: 'Idade / condição', esq: true },
         usaHW ? 'Faixa de C' : 'Faixa de ε (mm)',
         usaHW ? 'C adotado' : 'ε adotado (mm)', { rot: 'Origem', esq: true }], linhasRug,
        MEM.biblio.az.cit + '; ' + MEM.biblio.porto.cit + '.');
    }

    /* ---------------- capítulos de trechos ---------------- */
    if (c.succao.length) MEM.capituloTrechos(D, 'Barrilete de sucção', c.succao, 'succao');
    if (c.recalque.length) MEM.capituloTrechos(D, 'Barrilete de recalque', c.recalque, 'barrilete');
    if (c.adutoras.length) MEM.capituloTrechos(D, 'Adutora / linha de recalque', c.adutoras, 'adutora');

    /* ---------------- perfil ---------------- */
    if (res.envoltoria) MEM.capituloPerfil(D);

    /* ---------------- resumo das perdas ---------------- */
    MEM.capituloResumo(D);

    /* ---------------- bomba ---------------- */
    MEM.capituloBomba(D);

    if (!submersivel) MEM.capituloNPSH(D);
    if (res.curvaBomba && res.operacao && !res.operacao.erro) MEM.capituloOperacao(D);
    if (st.golpe.avaliar && res.golpe && res.golpe.length) MEM.capituloTransitorio(D);
    if (st.blocos && st.blocos.ativo && (st.blocos.itens || []).length) MEM.capituloBlocos(D);

    /* ---------------- considerações finais ---------------- */
    D.capitulo('Considerações finais');
    D.p('Os resultados apresentados correspondem a um pré-dimensionamento: definem a ordem de grandeza do ' +
        'diâmetro, da altura manométrica e da potência dos conjuntos, e apontam os pontos que exigem atenção. ' +
        'O projeto executivo permanece condicionado às verificações relacionadas a seguir ' +
        D.usar('nbr12214') + ' ' + MEM.cit('nbr12215') + ':');
    D.usar('nbr12215');
    D.alineas([
      'obtenção da curva característica da bomba junto ao fabricante e confirmação do ponto de operação real',
      'conferência do NPSH requerido pela bomba selecionada, com a margem de segurança recomendada',
      'análise do regime transitório com os dispositivos de proteção e o método das características',
      'confirmação das dimensões, das classes de pressão e da disponibilidade dos tubos nos catálogos vigentes',
      'levantamento topográfico de detalhe da diretriz e verificação das interferências'
    ]);

    var pend = PDA.Res.coletarAvisos(st, ctx, res);
    if (pend.length) {
      D.p('A verificação automática dos critérios adotados registrou os pontos relacionados na Tabela ' +
          (D.tabelas.length + 1) + ', que devem ser analisados antes do fechamento do projeto.');
      D.tabela('Pontos a verificar', [{ rot: 'Item', esq: true }, { rot: 'Observação', esq: true }],
        pend.map(function (t, i) {
          return h('tr', {}, h('td', {}, String(i + 1)), h('td', { class: 'esq' }, t));
        }), 'Verificação automática dos critérios adotados.');
    }

    if (st.projeto.obs) {
      D.secao('Observações do projeto');
      st.projeto.obs.split(/\n\s*\n/).forEach(function (par) { if (par.trim()) D.p(par.trim()); });
    }

    /* ---------------- bibliografia ---------------- */
    D.capituloSemNumero('Referências');
    D.p('As referências relacionadas a seguir correspondem às fontes efetivamente utilizadas nas formulações, ' +
        'nos coeficientes e nos critérios adotados neste memorial. Recomenda-se conferir a edição vigente das ' +
        'normas citadas.');
    var chaves = Object.keys(D.fontesUsadas);
    /* acrescenta as normas dos catálogos de tubo empregados */
    var mapaCat = { nbr7675: 'nbr7675', nbr8682: 'nbr8682', iso4427: 'nbr15561', nbr7665: 'nbr7665',
                    nbr5647: 'nbr5647', iso16422: 'nbr16631', nbr5580: 'nbr5580', nbr5590: 'nbr5590',
                    asme_b3610: 'asme', nbr8890: 'nbr8890', nbr15536: 'nbr15536', en1092: 'en1092',
                    nbr12214: 'nbr12214', nbr12215: 'nbr12215', nbr12208: 'nbr12208', tsutiya: 'tsutiya',
                    tsutiya_esgoto: 'tsutiyaEsgoto' };
    c.succao.concat(c.recalque, c.adutoras).forEach(function (r) {
      if (!r.tubo || !r.tubo.cat) return;
      (r.tubo.cat.fonteIds || []).forEach(function (f) {
        if (mapaCat[f] && chaves.indexOf(mapaCat[f]) < 0) chaves.push(mapaCat[f]);
      });
    });
    if (esgoto && chaves.indexOf('nbr12208') < 0) chaves.push('nbr12208');
    if (chaves.indexOf('nbr12214') < 0) chaves.push('nbr12214');

    var refs = chaves.map(function (k) { return MEM.biblio[k]; }).filter(Boolean);
    refs.sort(function (a, b) { return a.ref.localeCompare(b.ref, 'pt-BR'); });
    refs.forEach(function (r) {
      D.add(h('p', { class: 'doc-ref bloco', html: r.ref }));
    });

    return D;
  };

  /* ================================================================
     Capítulo genérico de trechos
     ================================================================ */

  MEM.capituloTrechos = function (D, titulo, trechos, tipo) {
    var st = D.st, ctx = D.ctx;
    var usaHW = st.calculo.metodo === 'hw';
    var g = PDA.H.g;

    D.capitulo(titulo);

    var validos = trechos.filter(function (r) { return r.tubo && r.tubo.item; });
    if (!validos.length) {
      D.p('Não há trechos lançados com diâmetro definido neste grupo.');
      return;
    }

    var intro = {
      succao: 'A tubulação de sucção conduz o fluido do poço até a bomba. As perdas de carga deste trecho ' +
              'entram integralmente no cálculo do NPSH disponível, razão pela qual a velocidade é mantida ' +
              'baixa e o número de singularidades, mínimo ' + D.usar('nbr12214') + '.',
      barrilete: 'O barrilete reúne a descarga dos conjuntos elevatórios até a saída da estação. O trecho ' +
              'individual conduz a vazão de uma bomba; cada trecho do barrilete comum conduz a vazão das ' +
              'bombas que já reuniu, o que é considerado trecho a trecho neste memorial.',
      adutora: 'A adutora conduz a vazão da saída da estação até o ponto de entrega. Quando a linha se ' +
              'ramifica, cada trecho a jusante da derivação conduz a fração de vazão correspondente, com ' +
              'diâmetro próprio.'
    }[tipo];
    D.p(intro);

    var crit = PDA.C.criterioDe(st, ctx, tipo);
    D.p('Os diâmetros foram verificados contra os seguintes critérios: velocidade entre ' + ne(crit.vBom[0]) +
        ' e ' + ne(crit.vBom[1]) + ' m/s (mínima admissível de ' + ne(crit.vMin) + ' m/s e máxima de ' +
        ne(crit.vMax) + ' m/s) e perda de carga unitária de até ' + ne(crit.jMax) + ' m/km' +
        (crit.fonte && MEM.biblio[({ nbr12214: 'nbr12214', nbr12215: 'nbr12215', nbr12208: 'nbr12208' })[crit.fonte]]
          ? ' ' + D.usar(({ nbr12214: 'nbr12214', nbr12215: 'nbr12215', nbr12208: 'nbr12208' })[crit.fonte]) : '') + '.');

    validos.forEach(function (r) {
      D.secao(r.rot);
      var t = r.tubo;
      var dm = t.diM;
      var A = Math.PI * dm * dm / 4;

      D.p('Tubo adotado: ' + t.cat.nome + ', ' + t.item.rot + ', com diâmetro interno de ' + n(t.diMm, 1) +
          ' mm' + (t.item.e ? ' e espessura de parede de ' + n(t.item.e, 1) + ' mm' : '') + '. ' +
          'Extensão de ' + n(r.L, 1) + ' m e vazão de ' + n(r.Q * 1000, 1) + ' L/s' +
          (r.nBombas ? ' (' + r.nBombas + ' bomba(s))' : '') + '.');

      D.formula('v = \\frac{Q}{A} = \\frac{4 \\cdot Q}{\\pi \\cdot D^2}',
        'v é a velocidade média (m/s); Q, a vazão do trecho (m³/s); A, a área da seção (m²); ' +
        'e D, o diâmetro interno (m).', { semNumero: D.equacoes > 6 });
      D.aplicacao('A = \\frac{\\pi \\cdot ' + n(dm, 4) + '^2}{4} = ' + n(A, 5) + '\\ \\text{m}^2',
                  'v = \\frac{4 \\cdot ' + n(r.Q, 4) + '}{\\pi \\cdot ' + n(dm, 4) + '^2} = ' +
                  n(r.v, 3) + '\\ \\text{m/s}');

      if (usaHW) {
        D.aplicacao('J = ' + ne(st.calculo.hwK) + ' \\cdot \\frac{' + n(r.Q, 4) + '^{' + ne(st.calculo.hwExpQ) +
                    '}}{' + n(t.C, 0) + '^{' + ne(st.calculo.hwExpQ) + '} \\cdot ' + n(dm, 4) + '^{' +
                    ne(st.calculo.hwExpD) + '}} = ' + n(r.J, 5) + '\\ \\text{m/m} = ' +
                    n(r.J * 1000, 2) + '\\ \\text{m/km}');
      } else {
        D.aplicacao('Re = \\frac{' + n(r.v, 3) + ' \\cdot ' + n(dm, 4) + '}{' + n(ctx.ni * 1e6, 3) +
                    ' \\cdot 10^{-6}} = ' + n(r.Re / 1000, 0) + ' \\cdot 10^3',
                    '\\frac{\\varepsilon}{D} = \\frac{' + n(t.epsMm, 4) + '}{' + n(t.diMm, 1) + '} = ' +
                    (t.epsMm / t.diMm).toExponential(2).replace('.', ',').replace('e-', ' \\cdot 10^{-') + '}',
                    'f = ' + n(r.f, 5) + '\\qquad \\text{(regime ' + (r.regime || 'turbulento') + ')}',
                    'J = \\frac{' + n(r.f, 5) + ' \\cdot ' + n(r.v, 3) + '^2}{2 \\cdot ' + n(g, 3) +
                    ' \\cdot ' + n(dm, 4) + '} = ' + n(r.J, 5) + '\\ \\text{m/m} = ' +
                    n(r.J * 1000, 2) + '\\ \\text{m/km}');
      }
      D.aplicacao('hf = J \\cdot L = ' + n(r.J, 5) + ' \\cdot ' + n(r.L, 1) + ' = ' + n(r.hf, 3) + '\\ \\text{m}');

      if (r.pecas && r.pecas.length) {
        var somaK = 0, somaH = 0;
        var linhasP = r.pecas.map(function (p) {
          somaK += p.K * p.qtd; somaH += p.h;
          return h('tr', {},
            h('td', { class: 'esq' }, p.rot),
            h('td', {}, ne(p.qtd)),
            h('td', {}, ne(p.K)),
            h('td', {}, n(p.K * p.qtd, 2)),
            h('td', {}, n(p.diMm, 0)),
            h('td', {}, n(p.v, 2)),
            h('td', {}, n(p.h, 4)));
        });
        linhasP.push(h('tr', { class: 'total' },
          h('td', { class: 'esq' }, 'Total'), h('td', {}, ''), h('td', {}, ''),
          h('td', {}, n(somaK, 2)), h('td', {}, ''), h('td', {}, ''), h('td', {}, n(somaH, 4))));
        D.p('As peças e conexões lançadas no trecho, os coeficientes de perda adotados e a fonte de onde ' +
            'foram tomados constam da Tabela ' + (D.tabelas.length + 1) + '.');
        D.tabela('Peças e conexões – ' + r.rot,
          [{ rot: 'Peça', esq: true }, 'Quant.', 'K unitário', 'ΣK', 'DI (mm)', 'v (m/s)', 'hₗ (m)'],
          linhasP, PDA.P.fontePecas.az.replace(/\.$/, '') + '.');
        D.usar('az');
        D.aplicacao('\\Sigma h_l = \\Sigma K \\cdot \\frac{v^2}{2 \\cdot g} = ' + n(somaK, 2) +
                    ' \\cdot \\frac{' + n(r.v, 3) + '^2}{2 \\cdot ' + n(g, 3) + '} = ' +
                    n(r.hl, 3) + '\\ \\text{m}');
      }

      D.aplicacao('h_{total} = hf + \\Sigma h_l = ' + n(r.hf, 3) + ' + ' + n(r.hl, 3) +
                  ' = ' + n(r.htotal, 3) + '\\ \\text{m}');

      var cl = PDA.C.classificar(r.v, r.J, crit);
      D.p('Verificação: velocidade de ' + n(r.v, 2) + ' m/s e perda unitária de ' + n(r.J * 1000, 2) +
          ' m/km — ' + ({ bom: 'dentro das faixas recomendadas', atencao: 'fora da faixa recomendada, porém dentro dos limites admissíveis',
                          ruim: 'FORA dos limites admissíveis', na: 'sem vazão' })[cl.classe] + '.' +
          (cl.classe !== 'bom' ? ' ' + cl.motivos.join('; ') + '.' : ''));
    });

    /* tabela resumo do grupo */
    var somaL = 0, somaHf = 0, somaHl = 0;
    var linhas = validos.map(function (r) {
      somaL += r.L; somaHf += r.hf; somaHl += r.hl;
      return h('tr', {},
        h('td', { class: 'esq' }, r.rot),
        h('td', { class: 'esq' }, r.tubo.item.rot),
        h('td', {}, n(r.tubo.diMm, 1)),
        h('td', {}, n(r.L, 1)),
        h('td', {}, n(r.Q * 1000, 1)),
        h('td', {}, n(r.v, 2)),
        h('td', {}, n(r.J * 1000, 2)),
        h('td', {}, n(r.hf, 3)),
        h('td', {}, n(r.hl, 3)),
        h('td', {}, n(r.htotal, 3)));
    });
    linhas.push(h('tr', { class: 'total' },
      h('td', { class: 'esq' }, 'Total'), h('td', {}, ''), h('td', {}, ''),
      h('td', {}, n(somaL, 1)), h('td', {}, ''), h('td', {}, ''), h('td', {}, ''),
      h('td', {}, n(somaHf, 3)), h('td', {}, n(somaHl, 3)), h('td', {}, n(somaHf + somaHl, 3))));

    D.tabela('Resumo – ' + titulo,
      [{ rot: 'Trecho', esq: true }, { rot: 'Diâmetro', esq: true }, 'DI (mm)', 'L (m)', 'Q (L/s)',
       'v (m/s)', 'J (m/km)', 'hf (m)', 'Σhₗ (m)', 'h total (m)'], linhas,
      'Resultados calculados pelo programa.');

    if (tipo === 'adutora') {
      var v = PDA.C.varrer(st, ctx, validos[0].conj, 'adutoras.0', ctx.nOp);
      var lc = v.linhas.map(function (l) {
        return h('tr', { class: l.rot === validos[0].conj.itemRot ? 'destaque' : null },
          h('td', { class: 'esq' }, l.rot + (l.rot === validos[0].conj.itemRot ? '  (adotado)' : '')),
          h('td', {}, n(l.diMm, 1)),
          h('td', {}, n(l.v, 2)),
          h('td', {}, n(l.jKm, 2)),
          h('td', {}, n(l.htotal, 3)),
          h('td', { class: 'esq' }, ({ bom: 'adequado', atencao: 'atenção', ruim: 'inadequado', na: '—' })[l.classe]));
      });
      D.tabela('Comparação de diâmetros – ' + validos[0].rot,
        [{ rot: 'Diâmetro', esq: true }, 'DI (mm)', 'v (m/s)', 'J (m/km)', 'h total (m)', { rot: 'Situação', esq: true }],
        lc, 'Varredura do catálogo, com os critérios de velocidade e perda unitária adotados.');
      D.p('O diâmetro de Bresse, tomado como referência de ordem de grandeza, resulta entre ' +
          n(v.bresse.k07, 0) + ' e ' + n(v.bresse.k13, 0) + ' mm para a vazão do trecho ' + D.usar('tsutiya') + '.');
    }
  };

  /* ================================================================
     Perfil e envoltórias
     ================================================================ */

  MEM.capituloPerfil = function (D) {
    var st = D.st, ctx = D.ctx, res = D.res;
    var env = res.envoltoria;
    D.capitulo('Perfil da linha e verificação de pressões');
    D.p('O perfil da tubulação foi lançado com ' + env.pontos.length + ' pontos, cobrindo ' +
        n(env.lTrechos, 0) + ' m de extensão. A linha piezométrica em regime permanente foi interpolada a ' +
        'partir das perdas de carga de cada trecho, e a pressão disponível em cada ponto corresponde à ' +
        'diferença entre a linha piezométrica e a cota da geratriz da tubulação.');
    D.p('Sobre a linha piezométrica permanente foram traçadas as envoltórias de pressão máxima e mínima do ' +
        'regime transitório, pela hipótese de anteprojeto em que a sobrepressão vale integralmente na ' +
        'elevatória e decai linearmente até zero no ponto de chegada, onde o nível do reservatório é fixo ' +
        D.usar('porto') + ' ' + MEM.cit('nbr12215') + '.');
    D.usar('nbr12215');
    D.formula('p_{max}(x) = LP(x) + \\Delta h \\cdot ( 1 - \\frac{x}{L} ) - cota(x)',
      'LP(x) é a linha piezométrica em regime permanente (m); \u0394h, a sobrepressão na elevatória (mca); ' +
      'x, a distância desde a elevatória (m); e L, a extensão total da linha (m).');
    D.aplicacao('\\Delta h = ' + n(env.dh, 2) + '\\ \\text{mca}',
                'p_{max} = ' + n(env.criticoMax.pMax, 2) + '\\ \\text{mca}\\qquad \\text{(x = ' +
                n(env.criticoMax.x, 0) + ' m)}',
                'p_{min} = ' + n(env.criticoMin.pMin, 2) + '\\ \\text{mca}\\qquad \\text{(x = ' +
                n(env.criticoMin.x, 0) + ' m)}');

    D.figura('Perfil da linha com a piezométrica e as envoltórias de pressão',
      PDA.Pf.grafico(st, ctx, res),
      'Elaborado pelo programa a partir do perfil lançado e das perdas calculadas.');

    var linhas = env.pontos.map(function (p) {
      return h('tr', {},
        h('td', {}, n(p.x, 1)),
        h('td', { class: 'esq' }, p.rot || '—'),
        h('td', {}, n(p.cota, 2)),
        h('td', {}, n(p.hgl, 2)),
        h('td', {}, n(p.pPerm, 2)),
        h('td', {}, n(p.pMax, 2)),
        h('td', {}, n(p.pMin, 2)),
        h('td', {}, p.pn ? n(p.pn, 0) : '—'),
        h('td', { class: 'esq' }, ({ bom: 'adequado', atencao: 'atenção', ruim: 'verificar', na: '—' })[p.classe]));
    });
    D.tabela('Pressões ao longo da linha', ['Distância (m)', { rot: 'Ponto', esq: true }, 'Cota (m)',
      'L.P. (m)', 'p permanente (mca)', 'p máxima (mca)', 'p mínima (mca)', 'PN (mca)',
      { rot: 'Situação', esq: true }], linhas,
      'Resultados calculados pelo programa.');

    var crit = env.pontos.filter(function (p) { return p.classe === 'ruim'; });
    if (crit.length) {
      D.p('Foram identificados ' + crit.length + ' ponto(s) em que a pressão calculada extrapola os limites ' +
          'adotados. A pré-avaliação do transitório considera a tubulação sem dispositivos de proteção; ' +
          'nesses casos, o passo seguinte é o estudo específico do transitório e o dimensionamento da ' +
          'proteção ' + D.usar('streeter') + '.');
    }
  };

  /* ================================================================
     Resumo das perdas
     ================================================================ */

  MEM.capituloResumo = function (D) {
    var c = D.res.projeto, ctx = D.ctx;
    D.capitulo('Resumo das perdas de carga e altura manométrica');

    var linhas = [
      h('tr', {}, h('td', { class: 'esq' }, 'Altura geométrica (Hg)'), h('td', {}, n(c.HgMax, 3))),
      h('tr', {}, h('td', { class: 'esq' }, 'Perda de carga distribuída na sucção'), h('td', {}, n(c.hfSuccao, 3))),
      h('tr', {}, h('td', { class: 'esq' }, 'Perda de carga localizada na sucção'), h('td', {}, n(c.hlSuccao, 3))),
      h('tr', {}, h('td', { class: 'esq' }, 'Perda de carga distribuída no recalque'), h('td', {}, n(c.hfRecalque, 3))),
      h('tr', {}, h('td', { class: 'esq' }, 'Perda de carga localizada no recalque'), h('td', {}, n(c.hlRecalque, 3))),
      h('tr', { class: 'total' }, h('td', { class: 'esq' }, 'Altura manométrica total (Hm)'), h('td', {}, n(c.Hm, 3)))
    ];
    D.tabela('Composição da altura manométrica', [{ rot: 'Parcela', esq: true }, 'Valor (m)'], linhas,
      'Resultados calculados pelo programa.');

    D.aplicacao('Hm = ' + n(c.HgMax, 3) + ' + ' + n(c.hfSuccao + c.hfRecalque, 3) + ' + ' +
                n(c.hlSuccao + c.hlRecalque, 3) + ' = ' + n(c.Hm, 3) + '\\ \\text{mca}');

    var hTot = c.hSuccao + c.hRecalque;
    D.p('As perdas de carga respondem por ' + n(c.Hm > 0 ? hTot / c.Hm * 100 : 0, 1) + ' % da altura ' +
        'manométrica total, sendo ' + n(hTot > 0 ? (c.hfSuccao + c.hfRecalque) / hTot * 100 : 0, 1) +
        ' % de perda distribuída e ' + n(hTot > 0 ? (c.hlSuccao + c.hlRecalque) / hTot * 100 : 0, 1) +
        ' % de perda localizada. Com o nível de sucção máximo, a altura manométrica se reduz a ' +
        n(c.HmMin, 2) + ' mca.');

    /* cenários */
    var linhasC = D.res.cenarios.map(function (x) {
      return h('tr', { class: x.n === ctx.nOp ? 'destaque' : null },
        h('td', {}, x.n + (x.n === ctx.nOp ? '  (projeto)' : '')),
        h('td', {}, n(x.qTotal * 1000, 1)),
        h('td', {}, n(x.qBomba * 1000, 1)),
        h('td', {}, n(x.Hg, 2)),
        h('td', {}, n(x.hSuccao + x.hRecalque, 2)),
        h('td', {}, n(x.Hm, 2)),
        h('td', {}, n(x.bhpCv, 1)),
        h('td', {}, ne(x.motorCv)));
    });
    D.tabela('Cenários de operação por número de conjuntos',
      ['Bombas', 'Q total (L/s)', 'Q por bomba (L/s)', 'Hg (m)', 'Perdas (m)', 'Hm (mca)',
       'BHP por bomba (cv)', 'Motor (cv)'], linhasC,
      'Resultados calculados pelo programa.');
    D.p('A altura manométrica cresce com a vazão porque as perdas variam aproximadamente com o quadrado dela. ' +
        'Nesta tabela a vazão por bomba é mantida constante, simplificação usual em pré-dimensionamento; ' +
        'o comportamento real em paralelo depende da curva característica dos conjuntos.');
  };

  /* ================================================================
     Bomba
     ================================================================ */

  MEM.capituloBomba = function (D) {
    var st = D.st, ctx = D.ctx, c = D.res.projeto;
    D.capitulo('Conjuntos elevatórios');
    D.p('A potência hidráulica útil corresponde ao produto do peso específico do fluido pela vazão e pela ' +
        'altura manométrica. A potência no eixo resulta da divisão pela eficiência do conjunto ' + D.usar('az') + '.');
    D.formula('P = \\frac{\\gamma \\cdot Q \\cdot Hm}{75 \\cdot \\eta}',
      'P é a potência no eixo (cv); \u03b3, o peso específico do fluido (kgf/m³); Q, a vazão por bomba (m³/s); ' +
      'Hm, a altura manométrica (mca); e \u03b7, o rendimento da bomba (decimal).');
    D.aplicacao('\\gamma = ' + n(ctx.gama, 0) + '\\ \\text{N/m}^3 \\qquad \\text{(a ' +
                ne(st.fluido.temperatura) + ' °C)}',
                'P = \\frac{' + n(ctx.qBomba * 1000, 2) + ' \\cdot ' + n(c.Hm, 2) + '}{75 \\cdot ' +
                n(st.bombas.rendBomba / 100, 2) + '} = ' + n(c.bhpCv, 2) + '\\ \\text{cv} = ' +
                n(c.bhpKw, 2) + '\\ \\text{kW}');
    D.p('Sobre a potência calculada foi aplicada folga de ' + n(c.folgaPct, 0) + ' %, resultando na adoção de ' +
        'motor comercial de ' + ne(c.motorCv) + ' cv (' + n(c.motorKw, 1) + ' kW) por conjunto. ' +
        'Com ' + ctx.nOp + ' conjunto(s) em operação simultânea, a potência instalada em funcionamento é de ' +
        n(c.potTotalKw, 1) + ' kW.');

    var linhas = [
      h('tr', {}, h('td', { class: 'esq' }, 'Vazão por bomba'), h('td', {}, n(ctx.qBomba * 1000, 2) + ' L/s')),
      h('tr', {}, h('td', { class: 'esq' }, 'Altura manométrica'), h('td', {}, n(c.Hm, 2) + ' mca')),
      h('tr', {}, h('td', { class: 'esq' }, 'Rendimento adotado da bomba'), h('td', {}, ne(st.bombas.rendBomba) + ' %')),
      h('tr', {}, h('td', { class: 'esq' }, 'Potência útil'), h('td', {}, n(c.potUtilCv, 2) + ' cv')),
      h('tr', {}, h('td', { class: 'esq' }, 'Potência no eixo (BHP)'), h('td', {}, n(c.bhpCv, 2) + ' cv  (' + n(c.bhpKw, 2) + ' kW)')),
      h('tr', {}, h('td', { class: 'esq' }, 'Folga aplicada'), h('td', {}, n(c.folgaPct, 0) + ' %')),
      h('tr', { class: 'total' }, h('td', { class: 'esq' }, 'Motor comercial adotado'), h('td', {}, ne(c.motorCv) + ' cv  (' + n(c.motorKw, 1) + ' kW)')),
      st.bombas.usarRendMotor ? h('tr', {}, h('td', { class: 'esq' }, 'Potência elétrica consumida por bomba'), h('td', {}, n(c.eletricaKw, 2) + ' kW')) : null,
      h('tr', {}, h('td', { class: 'esq' }, 'Conjuntos instalados / em operação'), h('td', {}, ctx.nInst + ' / ' + ctx.nOp))
    ].filter(Boolean);
    D.tabela('Dimensionamento dos conjuntos elevatórios', [{ rot: 'Item', esq: true }, 'Valor'], linhas,
      'Resultados calculados pelo programa; linha de motores comerciais conforme a norma IEC.');
  };

  /* ================================================================
     NPSH
     ================================================================ */

  MEM.capituloNPSH = function (D) {
    var st = D.st, ctx = D.ctx, c = D.res.projeto;
    D.capitulo('NPSH disponível');
    D.p('O NPSH disponível é uma propriedade da instalação e corresponde à energia absoluta disponível na ' +
        'entrada da bomba, acima da pressão de vaporização do fluido. A instalação é viável quando o NPSH ' +
        'disponível supera o NPSH requerido pela bomba, obtido na curva do fabricante, com margem de segurança ' +
        D.usar('nbr12214') + ' ' + MEM.cit('tsutiya') + '.');
    D.usar('tsutiya');
    D.formula('NPSH_d = \\frac{p_{atm} - p_v}{\\gamma} \\pm z - hf_{suc}',
      'p_{atm} é a pressão atmosférica local; p_v, a pressão de vapor do fluido na temperatura de trabalho; ' +
      'z, o desnível entre o nível de sucção e o eixo da bomba, positivo quando a bomba está afogada; ' +
      'e hf_{suc}, a perda de carga total na sucção.');
    D.aplicacao('\\frac{p_{atm}}{\\gamma} = ' + n(ctx.patm, 3) + '\\ \\text{mca} \\qquad ' +
                  '\\text{(altitude de ' + ne(st.fluido.altitude) + ' m)}',
                '\\frac{p_v}{\\gamma} = ' + n(ctx.pvapor, 3) + '\\ \\text{mca} \\qquad \\text{(a ' +
                  ne(st.fluido.temperatura) + ' °C)}',
                'z = ' + n(st.cotas.nivelSuccaoMin, 2) + ' - ' + n(st.cotas.eixoBomba, 2) + ' = ' +
                  n(c.zSuccao, 2) + '\\ \\text{m} \\qquad \\text{(bomba ' +
                  (c.zSuccao >= 0 ? 'afogada' : 'aspirando') + ')}',
                'hf_{suc} = ' + n(c.hSuccao, 4) + '\\ \\text{m}',
                'NPSH_d = ' + n(ctx.patm, 3) + ' - ' + n(ctx.pvapor, 3) + ' + ( ' + n(c.zSuccao, 2) + ' ) - ' +
                  n(c.hSuccao, 4) + ' = ' + n(c.npshd, 3) + '\\ \\text{mca}');

    if (st.curvaBomba && st.curvaBomba.npshr) {
      var margem = c.npshd - Number(st.curvaBomba.npshr);
      D.p('O NPSH requerido informado para a bomba é de ' + ne(st.curvaBomba.npshr) + ' mca, resultando em ' +
          'margem de ' + n(margem, 2) + ' mca. ' +
          (margem < 0.5 ? 'A margem é inferior a 0,5 mca, valor mínimo usualmente recomendado — a configuração ' +
            'da sucção deve ser revista.' : 'A margem atende à recomendação usual de 0,5 a 1,0 mca.'));
    } else {
      D.p('O NPSH requerido deve ser obtido na curva característica da bomba selecionada e comparado ao valor ' +
          'acima, adotando-se margem mínima da ordem de 0,5 a 1,0 mca.');
    }

    D.figura('Composição do NPSH disponível', PDA.Q.npsh(st, ctx, c),
      'Elaborado pelo programa a partir dos dados do projeto.');
  };

  /* ================================================================
     Curva do sistema e ponto de operação
     ================================================================ */

  MEM.capituloOperacao = function (D) {
    var st = D.st, ctx = D.ctx, res = D.res;
    var op = res.operacao, cv = res.curvaBomba;
    D.capitulo('Curva do sistema e ponto de operação');
    D.p('A curva do sistema representa a altura manométrica exigida pela instalação em função da vazão, para ' +
        'os diâmetros e as singularidades adotados. O ponto de operação real é a interseção entre a curva do ' +
        'sistema e a curva característica da bomba ' + D.usar('az') + '.');
    D.formula('H_{sistema}(Q) = Hg + \\Sigma hf(Q) + \\Sigma h_l(Q)', null);
    D.p('A curva da bomba foi ajustada por mínimos quadrados sobre os pontos informados, na forma polinomial ' +
        'de segundo grau usual para bombas centrífugas.');
    D.formula('H_{bomba}(Q) = a_0 + a_1 \\cdot Q + a_2 \\cdot Q^2', null);
    D.aplicacao('a_0 = ' + n(cv.a0, 4) + '\\qquad a_1 = ' + n(cv.a1, 4) + '\\qquad a_2 = ' + n(cv.a2, 4),
                { rot: 'com H em mca e Q em m³/s.' });

    var linhasP = cv.pontos.map(function (p) {
      return h('tr', {}, h('td', {}, n(p.q * 1000, 1)), h('td', {}, n(p.H, 2)),
        h('td', {}, n(cv.H(p.q), 2)), h('td', {}, n(cv.H(p.q) - p.H, 3)));
    });
    D.tabela('Pontos da curva característica da bomba',
      ['Q (L/s)', 'H informado (mca)', 'H ajustado (mca)', 'Desvio (mca)'], linhasP,
      'Pontos informados a partir da curva do fabricante.');

    D.aplicacao({ rot: 'Ponto de operação com ' + op.n + ' bomba(s):' },
                'Q = ' + n(op.qTotal * 1000, 2) + '\\ \\text{L/s} \\qquad \\text{(' +
                  n(op.qBomba * 1000, 2) + ' L/s por bomba)}',
                'H = ' + n(op.H, 2) + '\\ \\text{mca}',
                'P = ' + n(op.bhpCv, 2) + '\\ \\text{cv por bomba}',
                '\\Delta Q = ' + n(op.desvioQ, 1) + '\\ \\text{% em relação à vazão de projeto}');

    D.figura('Curva do sistema e curva da bomba, com o ponto de operação',
      PDA.F.graficoCurvas(st, ctx, res),
      'Elaborado pelo programa a partir da curva informada e dos diâmetros adotados.');

    if (res.operacaoPorN && res.operacaoPorN.length > 1) {
      var linhasN = res.operacaoPorN.map(function (x, i) {
        if (!x.op || x.op.erro) {
          return h('tr', {}, h('td', {}, x.n), h('td', { class: 'esq', colspan: 5 }, x.op ? x.op.erro : '—'));
        }
        /* o ganho só faz sentido quando o cenário anterior também tem interseção */
        var pre = i > 0 ? res.operacaoPorN[i - 1].op : null;
        var temAnt = !!(pre && !pre.erro);
        return h('tr', { class: x.n === ctx.nOp ? 'destaque' : null },
          h('td', {}, x.n), h('td', {}, n(x.op.qTotal * 1000, 1)), h('td', {}, n(x.op.qBomba * 1000, 1)),
          h('td', {}, n(x.op.H, 2)), h('td', {}, n(x.op.bhpCv, 1)),
          h('td', {}, temAnt ? '+' + n((x.op.qTotal - pre.qTotal) * 1000, 1) : '—'));
      });
      D.tabela('Operação em paralelo', ['Bombas', 'Q total (L/s)', 'Q por bomba (L/s)', 'H (mca)',
        'BHP por bomba (cv)', 'Ganho de vazão (L/s)'], linhasN,
        'Resultados calculados pelo programa.');
      D.p('Em associação em paralelo o ganho de vazão obtido ao acionar um conjunto adicional é sempre inferior ' +
          'à vazão de uma bomba operando isoladamente, porque a altura exigida pelo sistema cresce com a vazão.');
    }
  };

  /* ================================================================
     Blocos de ancoragem
     ================================================================ */

  MEM.capituloBlocos = function (D) {
    var st = D.st, ctx = D.ctx, res = D.res;
    var infos = PDA.C.blocosResolvidos(st, ctx, res)
      .filter(function (i) { return i.deMm > 0 && i.pMca > 0; });
    if (!infos.length) return;

    D.capitulo('Blocos de ancoragem');
    D.p('Nas mudanças de direção e de seção de tubulação com junta não travada, a pressão interna gera um ' +
        'empuxo que precisa ser transmitido ao terreno por blocos de ancoragem. O empuxo foi calculado com o ' +
        'diâmetro EXTERNO do tubo, porque a pressão atua na seção da junta ' + D.usar('az') + ' ' +
        MEM.cit('m41') + '.');
    D.usar('m41');
    D.formula(['E = p \\cdot A', 'E = 2 \\cdot p \\cdot A \\cdot sen ( \\frac{\\theta}{2} )',
               'E = p \\cdot ( A_1 - A_2 )'],
      'E é o empuxo (kgf); p, a pressão de cálculo (mca, tomada como kgf/m² por metro de coluna); ' +
      'A, a área da seção externa do tubo (m²); \u03b8, o ângulo da curva. A primeira forma vale para ' +
      'extremidades, tês e válvulas fechadas; a segunda, para curvas; a terceira, para reduções.');

    D.p('Cada bloco foi pré-dimensionado por duas vias: a seleção entre os blocos padronizados da ' +
        'concessionária, pela capacidade tabelada por DN e recobrimento, e a verificação clássica de apoio ' +
        'no solo, em que a área de encosto na parede não escavada da vala deve transmitir o empuxo majorado ' +
        'sem exceder a tensão admissível do terreno ' + MEM.cit('m41') + '.');
    D.formula('A_{nec} = \\frac{FS \\cdot E}{\\sigma_{adm}}',
      'A_{nec} é a área de encosto necessária (m²); FS, o fator de segurança adotado (' +
      ne(st.blocos.fs) + '); e \u03c3_{adm}, a tensão admissível de apoio do solo (kgf/m²).');

    infos.forEach(function (info) {
      var calc = info.calc;
      D.secao(info.b.rot + ' — ' + PDA.BA.peca(info.b.pecaId).rot +
              (info.dn ? ', DN ' + info.dn : ''));
      D.p('Tubo com DE de ' + n(info.deMm, 1) + ' mm' +
          (info.trechoRot ? ' (herdado de ' + info.trechoRot + ')' : '') +
          '. Pressão de cálculo de ' + n(info.pMca, 1) + ' mca — ' + info.pOrigem + '. ' +
          'Solo de apoio: ' + calc.solo.rot.toLowerCase() + ', com σ admissível de ' +
          n(calc.sigma, 0) + ' kgf/m².');

      D.aplicacao('E = ' + n(calc.unit, 2) + ' \\cdot ' + n(info.pMca, 1) + ' = ' +
                  n(calc.E, 0) + '\\ \\text{kgf}' );

      if (calc.orientacao === 'horizontal') {
        var adotado = calc.escolhido ||
          (calc.padrao && calc.padrao.achou ? calc.padrao.linha : null);
        if (adotado) {
          var tipoN = calc.escolhido ? calc.escolhido.tipo : calc.padrao.linha.tipo;
          var recAd = calc.escolhido ? info.b.recobrimento : calc.padrao.rec;
          D.p('Bloco padronizado adotado: tipo ' + tipoN + ' (capacidade de ' +
              n(adotado.cap || 0, 0) + ' kgf com recobrimento de ' + ne(recAd) +
              ' m), com ' + n(adotado.concreto, 2) + ' m³ de concreto, ' + n(adotado.forma, 2) +
              ' m² de forma e ' + n(adotado.aco, 0) + ' kg de aço.');
        } else {
          D.p('Nenhum bloco padronizado resiste ao empuxo — vale o bloco calculado pelo apoio.');
        }
        if (calc.apoio && calc.apoio.ok) {
          D.aplicacao('A_{nec} = \\frac{' + ne(st.blocos.fs) + ' \\cdot ' + n(calc.E, 0) + '}{' +
                      n(calc.sigma, 0) + '} = ' + n(calc.apoio.Anec, 2) + '\\ \\text{m}^2',
                      { rot: 'Encosto sugerido: ' + n(calc.apoio.b, 2) + ' × ' + n(calc.apoio.L, 2) +
                        ' m (' + n(calc.apoio.Aefetiva, 2) + ' m²), com ' + n(calc.apoio.concreto, 2) +
                        ' m³ de concreto.' });
        }
      } else if (calc.orientacao === 'vert_cima' && calc.peso) {
        D.p('Curva vertical convexa: o empuxo é ascendente e a resistência vem do peso próprio do bloco.');
        D.aplicacao('G = ' + ne(st.blocos.fs) + ' \\cdot ' + n(calc.E, 0) + ' = ' + n(calc.peso.G, 0) +
                    '\\ \\text{kgf}',
                    'V = \\frac{' + n(calc.peso.G, 0) + '}{' + ne(st.blocos.gamaConcreto) + '} = ' +
                    n(calc.peso.concreto, 2) + '\\ \\text{m}^3');
      } else if (calc.apoio && calc.apoio.ok) {
        D.p('Curva vertical côncava: o empuxo é descendente, apoiado no fundo da vala.');
        D.aplicacao('A_{nec} = \\frac{' + ne(st.blocos.fs) + ' \\cdot ' + n(calc.E, 0) + '}{' +
                    n(calc.sigma, 0) + '} = ' + n(calc.apoio.Anec, 2) + '\\ \\text{m}^2');
      }
      /* vistas do bloco adotado, com as dimensões */
      var solM = PDA.BA.solucao(calc, info.b);
      if (solM && PDA.UB && PDA.UB.desenhoBloco) {
        D.figura(info.b.rot + ' — vistas do bloco adotado (' +
          (solM.via === 'padrao' ? 'padronizado tipo ' + solM.tipo : 'calculado') + ', ' +
          n(solM.largura, 2) + ' × ' + n(solM.altura, 2) + ' × ' + n(solM.espessura, 2) + ' m)',
          PDA.UB.desenhoBloco(info, solM),
          'Elaborado pelo programa. Dimensões em metros; armadura ' +
          (solM.acoEstimado ? 'estimada por ' + PDA.BA.TAXA_ACO + ' kg/m³, a detalhar no projeto estrutural.'
                            : 'conforme o padrão da concessionária.'));
      }

      info.avisos.forEach(function (avz) { D.nota('Atenção: ' + avz); });
    });

    /* tabela-resumo */
    var linhasB = infos.map(function (info) {
      var calc = info.calc;
      var adot = calc.escolhido || (calc.padrao && calc.padrao.achou ? calc.padrao.linha : null);
      return h('tr', {},
        h('td', { class: 'esq' }, info.b.rot),
        h('td', { class: 'esq' }, PDA.BA.peca(info.b.pecaId).rot),
        h('td', {}, info.dn ? String(info.dn) : '—'),
        h('td', {}, n(info.deMm, 0)),
        h('td', {}, n(info.pMca, 1)),
        h('td', {}, n(calc.E, 0)),
        h('td', { class: 'esq' }, calc.orientacao === 'horizontal'
          ? (adot ? 'tipo ' + (calc.escolhido ? calc.escolhido.tipo : calc.padrao.linha.tipo) : 'calculado')
          : (calc.orientacao === 'vert_cima' ? 'peso' : 'apoio no fundo')),
        h('td', {}, adot ? n(adot.concreto, 2)
          : (calc.peso ? n(calc.peso.concreto, 2)
            : (calc.apoio && calc.apoio.ok ? n(calc.apoio.concreto, 2) : '—'))));
    });
    D.tabela('Blocos de ancoragem', [{ rot: 'Bloco', esq: true }, { rot: 'Peça', esq: true },
      'DN', 'DE (mm)', 'p (mca)', 'E (kgf)', { rot: 'Solução', esq: true }, 'Concreto (m³)'], linhasB,
      'Resultados calculados pelo programa; blocos padronizados conforme padrão da concessionária.');

    D.p('O dimensionamento acima é de anteprojeto e considera o empuxo transmitido a solo firme, não ' +
        'escavado. Blocos de grande porte, solos moles e travessias exigem verificação geotécnica e ' +
        'estrutural específicas.');
  };

  /* ================================================================
     Transitório
     ================================================================ */

  MEM.capituloTransitorio = function (D) {
    var st = D.st, res = D.res;
    D.capitulo('Transitório hidráulico – pré-avaliação');
    D.p('A parada abrupta dos conjuntos ou o fechamento rápido de uma válvula provocam variação brusca da ' +
        'velocidade e, em consequência, sobrepressões e subpressões que se propagam pela tubulação com ' +
        'celeridade própria do conjunto fluido-tubo ' + D.usar('streeter') + '. A verificação a seguir é ' +
        'preliminar e destina-se a conferir se a classe de pressão adotada possui folga.');
    D.formula('a = \\frac{1}{\\sqrt{\\rho \\cdot ( \\frac{1}{K} + \\frac{\\psi \\cdot D}{e \\cdot E} )}}',
      'a é a celeridade da onda (m/s); \u03c1, a massa específica do fluido (kg/m³); K, o módulo de ' +
      'elasticidade volumétrica da água, 2,19 GPa; \u03c8, o coeficiente de ancoragem longitudinal; ' +
      'D, o diâmetro interno (m); e, a espessura de parede (m); e E, o módulo de elasticidade do material (Pa).');
    var anc = PDA.H.ancoragem.filter(function (a) { return a.id === (st.golpe.ancoragem || 'juntas'); })[0];
    D.p('Foi adotada a condição de ancoragem "' + (anc ? anc.rot.toLowerCase() : '—') + '" ' +
        D.usar('halliwell') + '.');
    D.formula('t_c = \\frac{2 \\cdot L}{a} \\qquad \\Delta h = \\frac{a \\cdot \\Delta v}{g}',
      't_c é o tempo crítico de manobra (s); e \u0394v, a variação de velocidade (m/s). ' +
      'Vale para manobra rápida, isto é, quando o tempo de manobra é menor que t_c.');
    D.formula('\\Delta h = \\frac{2 \\cdot L \\cdot v}{g \\cdot t}',
      't é o tempo de manobra (s). Vale para manobra lenta, quando t é maior que t_c.');
    D.usar('joukowsky');

    res.golpe.forEach(function (g) {

/* ------------------------------------------------------------------
 * Paginação e exportação do memorial.
 *
 * O documento é distribuído em páginas A4 medidas de verdade, o que
 * permite numerar o sumário e os índices. Daí saem duas saídas: a
 * impressão (PDF pelo próprio navegador) e um arquivo .doc que o Word
 * e o LibreOffice abrem para edição.
 * ------------------------------------------------------------------ */
(function (PDA) {
  'use strict';

  var X = {};
  var UI, h;

  X.init = function () { UI = PDA.UI; h = UI.h; };

  var MM = 96 / 25.4;              /* 1 mm em px a 96 dpi */
  /* margens da ABNT (NBR 14724): 3 cm em cima e à esquerda, 2 cm embaixo
     e à direita. Com timbrado, as margens de cima e de baixo passam a ser
     as informadas pelo usuário, para o texto não invadir a arte. */
  X.PAG = {
    largura: 210, altura: 297,
    margEsq: 30, margDir: 20, margSup: 30, margInf: 20
  };

  X.margens = function () {
    var t = PDA.M.timbrado && PDA.M.timbrado();
    return {
      esq: X.PAG.margEsq, dir: X.PAG.margDir,
      sup: t ? t.margSup : X.PAG.margSup,
      inf: t ? t.margInf : X.PAG.margInf
    };
  };

  X.larguraUtilMm = function () {
    var m = X.margens();
    return X.PAG.largura - m.esq - m.dir;
  };
  X.alturaUtilMm = function () {
    var m = X.margens();
    return X.PAG.altura - m.sup - m.inf;
  };

  /* ================================================================
     Medição
     ================================================================ */

  function abrirMedidor() {
    var m = document.getElementById('doc-medidor');
    if (!m) {
      m = document.createElement('div');
      m.id = 'doc-medidor';
      document.body.appendChild(m);
    }
    m.className = 'doc doc-medidor';
    m.style.width = X.larguraUtilMm() * MM + 'px';
    UI.limpar(m);
    return m;
  }

  /* Altura ocupada pelo bloco, MARGENS INCLUÍDAS. Sem elas a soma fica
     menor que o layout real e a última tabela da página estoura o rodapé. */
  function medir(medidor, el) {
    medidor.appendChild(el);
    var cs = window.getComputedStyle(el);
    var alt = el.getBoundingClientRect().height +
              (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
    medidor.removeChild(el);
    return alt;
  }

  /* ================================================================
     Divisão de tabelas entre páginas
     ================================================================ */

  function dividirTabela(quadro, medidor, alturaPrimeira, alturaCheia) {
    var clone = quadro.cloneNode(true);
    medidor.appendChild(clone);
    var cap = clone.querySelector('.doc-cap-tab');
    var tab = clone.querySelector('table');
    var fonte = clone.querySelector('.doc-fonte');
    if (!tab) { medidor.removeChild(clone); return null; }

    var thead = tab.querySelector('thead');
    var linhas = Array.prototype.slice.call(tab.querySelectorAll('tbody tr'));
    var alturas = linhas.map(function (tr) { return tr.getBoundingClientRect().height; });
    medidor.removeChild(clone);

    if (!linhas.length) return null;

    /* Monta uma parte da tabela com as linhas indicadas. */
    function montar(de, ate, continuacao, comFonte) {
      var parte = quadro.cloneNode(false);
      parte.removeAttribute('data-ref');
      if (!continuacao && quadro.getAttribute('data-ref')) {
        parte.setAttribute('data-ref', quadro.getAttribute('data-ref'));
      }
      if (cap) {
        var c2 = cap.cloneNode(true);
        if (continuacao) c2.textContent = cap.textContent + '  (continuação)';
        parte.appendChild(c2);
      }
      var t2 = tab.cloneNode(false);
      if (thead) t2.appendChild(thead.cloneNode(true));
      var tb = document.createElement('tbody');
      for (var k = de; k < ate; k++) tb.appendChild(linhas[k].cloneNode(true));
      t2.appendChild(tb);
      parte.appendChild(t2);
      if (comFonte && fonte) parte.appendChild(fonte.cloneNode(true));
      return parte;
    }

    /* O que a parte gasta além das próprias linhas: legenda, cabeçalho da
       tabela, bordas e o espaçamento do quadro. Medido de verdade, senão a
       parte "cabe" na conta e não cabe na página. */
    function sobrecarga(continuacao, comFonte) {
      return medir(medidor, montar(0, 1, continuacao, comFonte)) - alturas[0];
    }
    var sobreNormal = sobrecarga(false, false);
    var sobreCont = sobrecarga(true, false);
    var sobreUlt = sobrecarga(false, true) - sobrecarga(false, false);   /* só a fonte */

    var partes = [], idx = 0, primeira = true;
    var MIN_LINHAS = 2;
    while (idx < linhas.length) {
      var cont = partes.length > 0;
      var disp = (primeira ? alturaPrimeira : alturaCheia) - (cont ? sobreCont : sobreNormal);
      var n = 0, acc = 0;
      while (idx + n < linhas.length && acc + alturas[idx + n] <= disp) { acc += alturas[idx + n]; n++; }
      /* se termina a tabela nesta parte, a fonte entra e pode não caber mais */
      if (idx + n >= linhas.length) {
        while (n > 1 && acc + sobreUlt > disp) { n--; acc -= alturas[idx + n]; }
      }
      /* não deixa uma linha órfã na continuação */
      if (linhas.length - (idx + n) === 1 && n > MIN_LINHAS) n--;
      /* não coube nem o mínimo no resto da página: começa a tabela na próxima */
      if (n < MIN_LINHAS && primeira) { primeira = false; continue; }
      if (!n) n = 1;                                 /* linha maior que a página */

      var ultima = idx + n >= linhas.length;
      partes.push({ el: montar(idx, idx + n, cont, ultima), primeira: primeira });
      idx += n;
      primeira = false;
    }
    return partes;
  }

  /* ================================================================

     ================================================================ */

  /* blocos: array de elementos. Devolve páginas (arrays de elementos). */
  X.paginar = function (blocos) {
    var medidor = abrirMedidor();
    var H = X.alturaUtilMm() * MM - 4;   /* folga de 4 px contra arredondamento */
    var paginas = [[]];
    var atual = 0;

    function novaPagina() { paginas.push([]); atual = 0; }
    function vazia() { return !paginas[paginas.length - 1].length; }

    /* um título não pode ficar sozinho no pé da página */
    function ehTitulo(el) {
      return el.classList && (el.classList.contains('doc-h1') || el.classList.contains('doc-h2'));
    }
    var MIN_APOS = 62;      /* espaço mínimo que precisa sobrar depois do título */

    blocos.forEach(function (b) {
      var alt = medir(medidor, b);
      var restante = H - atual;

      /* seção primária começa em folha nova (NBR 14724) */
      if (b.classList && b.classList.contains('pagina-nova') && !vazia()) {
        novaPagina();
        restante = H;
      }

      if (ehTitulo(b) && alt + MIN_APOS > restante && !vazia()) {
        novaPagina();
        restante = H;
      }

      if (alt <= restante) {
        paginas[paginas.length - 1].push(b);
        atual += alt;
        return;
      }

      /* tabela grande: divide entre páginas */
      if (b.classList && b.classList.contains('bloco-tabela') && alt > H * 0.2) {
        var partes = dividirTabela(b, medidor, restante, H);
        if (partes && partes.length) {
          partes.forEach(function (p, i) {
            if (i > 0 || !p.primeira) {
              if (paginas[paginas.length - 1].length) novaPagina();
            }
            var hp = medir(medidor, p.el);
            if (hp > H - atual && paginas[paginas.length - 1].length) novaPagina();
            paginas[paginas.length - 1].push(p.el);
            atual += hp;
          });
          return;
        }
      }

      /* quebra de página normal */
      if (paginas[paginas.length - 1].length) novaPagina();
      paginas[paginas.length - 1].push(b);
      atual += alt;
      if (atual > H) atual = H;    /* bloco maior que a página: segue na próxima */
    });

    UI.limpar(medidor);
    return paginas.filter(function (p) { return p.length; });

  X.montar = function (st, ctx, res) {

    var paginas, mapa, i;

    for (i = 0; i < 6; i++) {
      paginas = X.paginar(D.blocos.map(function (b) { return b.cloneNode(true); }));
      /* capa (1) + páginas de sumário/índices (nFrente) ficam antes do corpo,

      nFrente = frente.length;

      D: D,

        for (k = 0; k < dentro.length; k++) refs.push(dentro[k].getAttribute('data-ref'));
