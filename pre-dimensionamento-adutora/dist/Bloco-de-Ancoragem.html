  /* ================================================================
     Tabela de peças
     ================================================================ */

  F.tabelaPecas = function (st, ctx, conj, base) {
    var cats = {}, ordem = [];
    PDA.P.pecas.forEach(function (p) {
      if (!cats[p.cat]) { cats[p.cat] = []; ordem.push(p.cat); }
      cats[p.cat].push(p);
    });

    var Q = 0;
    try { Q = PDA.C.vazaoConjunto(F.raizChave(base), conj, ctx.nOp, ctx); } catch (e) { Q = 0; }
    var tubo = PDA.C.resolverTubo(conj, ctx);
    var somaK = 0, somaH = 0;

    /* DN da peça: escolhido entre os itens do catálogo do trecho, e o
       programa busca o DI correspondente */
    function selectDN(p, i) {
      if (!tubo || !tubo.cat) return h('span', { class: 'nota' }, '—');
      return h('select', {
        'data-bind': base + '.pecas.' + i + '.dnLocal', 'data-tipo': 'texto', 'data-estrutural': '1',
        class: p.dnLocal ? 'editado' : '',
        title: 'DN da peça, quando diferente do tubo do trecho. O DI correspondente é buscado no catálogo.'
      }, [h('option', { value: '', selected: !p.dnLocal },
            'igual ao trecho' + (tubo.item && !tubo.semDiametro ? ' — ' + tubo.item.rot : ''))].concat(
        tubo.cat.itens.map(function (it) {
          return h('option', { value: it.rot, selected: it.rot === p.dnLocal },
            it.rot + ' — DI ' + UI.num(PDA.CAT.diInterno(tubo.cat, it), 0) + ' mm');
        })));
    }

    var caminhoArr = base + '.pecas';
    var total = (conj.pecas || []).length;

    var linhas = (conj.pecas || []).map(function (p, i) {
      var def = PDA.P.buscarPeca(PDA.P.pecas, p.pecaId);
      var K = (p.kOverride !== null && p.kOverride !== undefined && p.kOverride !== '') ? Number(p.kOverride) : (def ? def.K : 0);
      var qtd = Number(p.qtd) || 0;
      var diMm = PDA.C.diPeca(p, tubo);
      var v = diMm > 0 ? PDA.H.velocidade(Q, diMm / 1000) : 0;
      var perda = K * qtd * v * v / (2 * PDA.H.g);
      somaK += K * qtd; somaH += perda;

      return UI.linhaArrastavel(h('tr', {},
        UI.celulaMover(caminhoArr, i, total),
        h('td', { class: 'esq' },
          h('select', { 'data-bind': base + '.pecas.' + i + '.pecaId', 'data-tipo': 'texto', 'data-estrutural': '1' },
            ordem.map(function (c) {
              return h('optgroup', { label: c }, cats[c].map(function (d) {
                return h('option', { value: d.id, selected: d.id === p.pecaId }, d.rot);
              }));
            }))),
        h('td', { class: 'col-qtd' },
          h('input', { type: 'text', class: 'num', value: UI.numEdit(p.qtd),
                       'data-bind': base + '.pecas.' + i + '.qtd', 'data-tipo': 'num', inputmode: 'decimal' })),
        h('td', { class: 'col-k' },
          h('input', { type: 'text', class: 'num' + (p.kOverride ? ' editado' : ''),
                       value: p.kOverride === null || p.kOverride === undefined || p.kOverride === '' ? '' : UI.numEdit(p.kOverride),
                       placeholder: def ? UI.numEdit(def.K) : '', title: def ? ('Padrão: ' + UI.numEdit(def.K)) : '',
                       'data-bind': base + '.pecas.' + i + '.kOverride', 'data-tipo': 'num', inputmode: 'decimal' })),
        h('td', { class: 'col-dn' }, selectDN(p, i)),
        h('td', {}, UI.num(diMm, 0)),
        h('td', {}, UI.num(K * qtd, 2)),
        h('td', {}, UI.num(v, 2)),
        h('td', {}, UI.num(perda, 3)),
        h('td', { class: 'col-x naoimprime' },
          h('button', { class: 'btn mini icone perigo', type: 'button',
                        'data-acao': 'removerPeca', 'data-base': base, 'data-i': i, title: 'Remover' }, '×'))),
        caminhoArr, i);
    });

    var seletorNovo = h('select', { style: 'max-width:250px', 'data-acao-change': 'addPeca', 'data-base': base },
      [h('option', { value: '' }, '+ adicionar peça…')].concat(
        ordem.map(function (c) {
          return h('optgroup', { label: c }, cats[c].map(function (d) {
            return h('option', { value: d.id }, d.rot + '  (K = ' + UI.numEdit(d.K) + ')');
          }));
        })));

    return h('div', {},
      h('div', { class: 'linha naoimprime', style: 'margin-bottom:8px' }, seletorNovo,
        h('span', { class: 'nota' }, 'A peça entra no fim da lista.')),
      linhas.length ? h('div', { class: 'rolagem' }, h('table', { class: 'pecas-tab enxuta' },
        h('thead', {}, h('tr', {},
          h('th', { class: 'naoimprime' }, 'Ordem',
            UI.dica('Arraste a linha pela alça ⠿ para reordenar, ou use as setas. A ordem não altera o cálculo — a perda localizada é a soma das peças — mas deixa a lista na sequência física do barrilete, o que ajuda a conferir e a montar a lista de materiais.')),
          h('th', { class: 'esq' }, 'Peça'),
          h('th', {}, 'Qtd.'),
          h('th', {}, 'K', UI.dica('Coeficiente de perda localizada. O campo mostra o valor padrão como sugestão; digite outro para sobrepor apenas nesta peça.\n\n' + PDA.P.fontePecas.az)),
          h('th', {}, 'DN da peça', UI.dica('Use quando a peça tem diâmetro diferente do tubo do trecho — uma redução de DN 400 para DN 300, uma válvula menor que a linha, um medidor estrangulado.\n\nEscolha o DN comercial: o programa busca o diâmetro interno correspondente no catálogo do trecho e calcula a perda com a velocidade nesse diâmetro. Você não precisa saber o DI de cabeça.')),
          h('th', {}, 'DI (mm)'),
          h('th', {}, 'ΣK'),
          h('th', {}, 'v (m/s)'),
          h('th', {}, 'Perda (m)'),
          h('th', {}, ''))),
        h('tbody', {}, linhas),
        h('tfoot', {}, h('tr', {},
          h('td', { class: 'naoimprime' }, ''),
          h('td', { class: 'esq', colspan: 5 }, 'Total'),
          h('td', {}, UI.num(somaK, 2)),
          h('td', {}, ''),
          h('td', {}, UI.num(somaH, 3)),
          h('td', {}, ''))))) : h('p', { class: 'vazio' }, 'Nenhuma peça lançada neste trecho.'));
  };

  F.raizChave = function (base) {
    if (base.indexOf('adutoras') === 0) return 'adutora';
    if (base.indexOf('succaoComum') === 0) return 'succaoComum';
    if (base.indexOf('barrileteComum') === 0) return 'barrileteComum';
    if (base.indexOf('succaoIndividual') === 0) return 'succaoIndividual';
    return 'barrileteIndividual';
  };

  /* ================================================================
     Tabela de varredura de diâmetros
     ================================================================ */

  F.varredura = function (st, ctx, conj, chave, base) {
    var v = PDA.C.varrer(st, ctx, conj, chave, ctx.nOp);
    if (!v.linhas.length) return h('p', { class: 'vazio' }, 'Catálogo sem itens.');
    var usaHW = st.calculo.metodo === 'hw';
    var eco = v.ecoAtiva;

    var linhas = v.linhas.map(function (l) {
      var sel = l.rot === conj.itemRot;
      return h('tr', {
        class: l.classe + (sel ? ' selecionada' : ''),
        style: 'cursor:pointer',
        title: l.motivos.join(' · '),
        'data-acao': 'escolherDiametro', 'data-base': base, 'data-rot': l.rot
      },
        h('td', { class: 'esq' },
          l.recomendado ? h('span', { title: 'Sugestão do programa: menor diâmetro que atende aos critérios', style: 'color:var(--teal-vivo)' }, '★ ') : null,
          l.otimoEconomico ? h('span', { title: 'Menor custo anual total (tubo + energia)', style: 'color:var(--verde);font-weight:700' }, '$ ') : null,
          l.rot,
          l.verificar ? h('span', { class: 'tag atencao', style: 'margin-left:5px', title: 'Dimensão a confirmar no catálogo do fabricante' }, '!') : null),
        h('td', {}, UI.num(l.diMm, 1)),
        h('td', {}, l.eMm ? UI.num(l.eMm, 1) : '—'),
        h('td', {}, l.pn ? UI.numEdit(l.pn) : '—'),
        h('td', {}, UI.num(l.v, 2)),
        h('td', {}, UI.tab(l.jKm)),
        h('td', {}, UI.tab(l.hf)),
        h('td', {}, UI.tab(l.hl)),
        h('td', {}, UI.tab(l.htotal)),
        usaHW ? h('td', {}, UI.num(l.C, 0)) : h('td', {}, l.f ? UI.num(l.f, 4) : '—'),
        h('td', {}, l.Re ? UI.num(l.Re / 1000, 0) + 'k' : '—'),
        h('td', {}, UI.num(l.vMin1, 2)),
        eco ? h('td', {}, UI.tab(l.eco.custoTubo / 1000)) : null,
        eco ? h('td', {}, UI.tab(l.eco.anualEnergia / 1000)) : null,
        eco ? h('td', {}, h('b', {}, UI.tab(l.eco.anualTotal / 1000))) : null,
        h('td', {}, UI.tagClasse(l.classe)));
    });

    var crit = v.crit;
    var cabs = [
      { rot: 'Diâmetro', esq: true }, 'DI (mm)', 'e (mm)', 'PN',
      'v (m/s)', 'J (m/km)', 'hf (m)', 'Σhₗ (m)', 'Total (m)',
      usaHW ? 'C' : 'f', 'Re',
      { rot: 'v c/ 1 bomba', dica: 'Velocidade no trecho quando apenas uma bomba opera. É a condição crítica para a velocidade mínima de autolimpeza, especialmente em linhas de recalque de esgoto (0,6 m/s pela NBR 12208).' }
    ];
    if (eco) {
      cabs.push({ rot: 'Tubo (mil R$)', dica: 'Custo estimado de fornecimento e assentamento do trecho, por lei de potência sobre o DN. Serve para comparar diâmetros entre si, não para orçar.' });
      cabs.push({ rot: 'Energia (mil R$/ano)', dica: 'Custo anual da energia associada à perda de carga deste trecho, com a tarifa e as horas de operação da aba Parâmetros de cálculo.' });
      cabs.push({ rot: 'Total (mil R$/ano)', dica: 'Custo do tubo anualizado pelo fator de recuperação de capital, somado ao custo anual de energia. O menor valor é marcado com $.' });
    }
    cabs.push('Situação');

    return h('div', {},
      h('div', { class: 'nota', style: 'margin-bottom:6px;display:flex;gap:14px;flex-wrap:wrap' },
        h('span', {}, 'Vazão do trecho: ', h('b', {}, UI.num(v.Q * 1000, 1) + ' L/s'),
          ' (', UI.num(v.Q * 3600, 1), ' m³/h)'),
        h('span', {}, 'Critério: v de ', UI.numEdit(crit.vBom[0]), ' a ', UI.numEdit(crit.vBom[1]),
          ' m/s (máx. ', UI.numEdit(crit.vMax), ', mín. ', UI.numEdit(crit.vMin), ') · J de ',
          UI.numEdit(crit.jBom[0]), ' a ', UI.numEdit(crit.jBom[1]), ' m/km (máx. ', UI.numEdit(crit.jMax), ')',
          UI.dica(crit.nota + '\n\nAs faixas são editáveis na aba Parâmetros de cálculo.')),
        h('span', {}, 'Bresse: ', UI.num(v.bresse.k07, 0), ' a ', UI.num(v.bresse.k13, 0), ' mm',
          ' (K = 1,0 → ', UI.num(v.bresse.k10, 0), ' mm)',
          UI.dica('Diâmetro econômico de Bresse D = K·√Q, com K entre 0,7 e 1,3. É apenas uma referência de ordem de grandeza.\n\n' +
                  PDA.H.fontes.filter(function (f) { return f.id === 'bresse'; })[0].txt))),
      UI.tabela(cabs, linhas),
      h('p', { class: 'nota', style: 'margin-top:6px' },
        'Clique em uma linha para adotar o diâmetro. ★ é a sugestão do programa: o menor diâmetro que atende integralmente aos critérios.' +
        (eco ? '  $ marca o de menor custo anual total.' : '')));
  };

  /* ================================================================
     Editor de um conjunto
     ================================================================ */

  F.conjunto = function (st, ctx, conj, op) {
    var base = op.base;
    var caixa = h('div', { class: 'conjunto' });
    var cabecalho = [
      op.arr ? UI.alcaBloco(caixa, op.arr, op.i, op.total) : null,
      op.ativavel ? h('input', { type: 'checkbox', checked: conj.ativo !== false,
                                 'data-bind': base + '.ativo', 'data-tipo': 'bool', 'data-estrutural': '1',
                                 title: 'Considerar este trecho no cálculo' }) : null,
      op.tituloEditavel
        ? h('input', { class: 'titulo', type: 'text', value: conj.rot || '', 'data-bind': base + '.rot', 'data-tipo': 'texto' })
        : h('h3', { style: 'flex:1;font-size:13px' }, op.titulo || conj.rot),
      h('div', { class: 'dir', style: 'margin-left:auto' },
        op.removivel ? h('button', { class: 'btn mini perigo naoimprime', type: 'button',
                                     'data-acao': op.acaoRemover, 'data-i': op.i }, 'Remover') : null)
    ];

    if (conj.ativo === false) {
      caixa.className = 'conjunto desativado';
      caixa.appendChild(h('div', { class: 'cab-conj' }, cabecalho));
      return op.arr ? UI.blocoArrastavel(caixa, op.arr, op.i) : caixa;
    }

    var campos = [
      h('label', { class: 'campo' }, h('span', { class: 'rot' }, 'Catálogo / material do tubo'),
        F.selectCatalogo(st, ctx.cats, base + '.catalogoId')),
      h('label', { class: 'campo' + (op.adutora ? ' chave' : '') },
        h('span', { class: 'rot' }, 'Diâmetro adotado'),
        F.selectDiametro(st, ctx.cats, conj, base + '.itemRot')),
      UI.campo(st, 'Extensão', base + '.extensao',
        { unid: { grandeza: 'extensao', caminho: base + '.unidExt' }, chave: !!op.adutora })
    ];

    if (op.adutora) {
      campos.push(UI.select(st, 'Vazão do trecho', base + '.vazaoModo', [
        { v: 'pct', rot: 'Fração da vazão total' },
        { v: 'abs', rot: 'Vazão informada' }
      ], { dica: 'Em adutoras que se ramificam, cada trecho a jusante da derivação conduz menos vazão. Informe a fração (%) da vazão total bombeada ou a vazão absoluta do trecho.' }));
      if (conj.vazaoModo === 'abs') {
        campos.push(UI.campo(st, 'Vazão do trecho', base + '.vazaoAbs',
          { unid: { grandeza: 'vazao', caminho: base + '.unidVazaoAbs' } }));
      } else {
        campos.push(UI.campo(st, 'Fração da vazão total', base + '.vazaoPct', { sufixo: '%' }));
      }
    }

    if (op.nBombas) {
      campos.push(UI.campo(st, 'Bombas que o trecho coleta', base + '.nBombas', {
        sufixo: 'ud',
        dica: 'Número de bombas cuja vazão passa por este trecho do barrilete comum. O primeiro trecho após a primeira derivação conduz 1 bomba, o seguinte 2, e assim por diante.\n\nQuando o cenário simulado tiver menos bombas em operação do que este número, o programa usa a quantidade em operação.'
      }));
    }

    var corpo = [
      h('div', { class: 'grade' }, campos),
      F.infoTubo(st, ctx, conj),
      UI.sub('Rugosidade'),
      F.blocoRugosidade(st, ctx, conj, base)
    ];

    if (op.adutora) {
      var tuboAtual = PDA.C.resolverTubo(conj, ctx);
      var pnCat = tuboAtual && tuboAtual.item && tuboAtual.item.pn ? Number(tuboAtual.item.pn) * 10 : null;
      var pnInfo = PDA.C.pnInfo(conj, tuboAtual);
      var pfaCorpo = PDA.C.pfaCorpoBar(tuboAtual);
      corpo.push(UI.sub('Pressão admissível e cotas do trecho'));
      corpo.push(h('div', { class: 'grade' },
        UI.campo(st, 'PN / PFA do tubo (mca)', base + '.pnMcaOverride', {
          chave: pnInfo.mca === null,
          editado: conj.pnMcaOverride !== null && conj.pnMcaOverride !== '' && conj.pnMcaOverride !== undefined,
          placeholder: pnCat !== null ? UI.num(pnCat, 0) : 'informar',
          dica: 'Pressão de serviço admissível do tubo, em mca, usada para conferir a pressão em regime permanente e a sobrepressão do transitório.\n\n' +
                pnInfo.nota +
                (pnCat !== null ? '\n\nO campo é preenchido automaticamente quando o catálogo traz o PN; troque o valor se o seu fornecedor indicar outro.' : '') +
                (pfaCorpo ? '\n\nA resistência do CORPO deste tubo, pela expressão da EN 545 (PFA = 20·e·σ/(DE−e), com σ = ' +
                  PDA.C.SIGMA_ADM[tuboAtual.material] + ' MPa), é de ' + UI.num(pfaCorpo, 0) + ' bar. ' +
                  'Na prática a pressão admissível do conjunto é limitada pela JUNTA e costuma ser bem menor — ' +
                  'por isso o programa não adota esse número sozinho.' : '')
        }),
        F.seletorPFA(st, conj, base, tuboAtual, pfaCorpo),
        UI.check(st, 'Informar cotas deste trecho', base + '.usarCotas',
          { dica: 'Serve para traçar o perfil e verificar a pressão em cada nó. A cota final do ÚLTIMO trecho é a mesma "cota de chegada" da aba Bombas e níveis — o programa mantém as duas iguais automaticamente.' }),
        conj.usarCotas ? UI.campo(st, 'Cota inicial (m)', base + '.cotaIni',
          { title: 'Altitude absoluta do início do trecho' }) : null,
        conj.usarCotas ? UI.campo(st, 'Cota final (m)', base + '.cotaFim',
          { title: 'Altitude absoluta do fim do trecho' }) : null));
    }

    corpo.push(UI.sub('Peças e conexões do trecho'));
    corpo.push(F.tabelaPecas(st, ctx, conj, base));
    corpo.push(UI.sub('Comparação de diâmetros'));
    corpo.push(F.varredura(st, ctx, conj, op.chave, base));

    caixa.appendChild(h('div', { class: 'cab-conj' }, cabecalho));
    caixa.appendChild(h('div', { class: 'corpo-conj' }, corpo));
    return op.arr ? UI.blocoArrastavel(caixa, op.arr, op.i) : caixa;
  };

  /* Escolha rápida da pressão admissível, quando o catálogo não traz PN */
  F.seletorPFA = function (st, conj, base, tubo, pfaCorpo) {
    if (tubo && tubo.item && tubo.item.pn) return null;   /* já vem do catálogo */
    var opcoes = [{ v: '', rot: '— escolher um degrau —' }].concat(
      PDA.C.DEGRAUS_PFA_BAR.map(function (b) {
        return { v: String(b * 10), rot: 'PN ' + b + ' bar   (' + (b * 10) + ' mca)' };
      }));
    var atual = conj.pnMcaOverride === null || conj.pnMcaOverride === undefined ? '' : String(conj.pnMcaOverride);
    return h('label', { class: 'campo' },
      h('span', { class: 'rot' }, 'Preencher com um degrau normativo',
        UI.dica('As classes K do ferro fundido dúctil não têm uma pressão admissível única: a PFA depende da classe, do DN e do tipo de junta, e o valor que governa costuma ser o da junta, não o da parede.\n\n' +
                'Esta lista traz os degraus usuais de pressão da EN 545 para escolha rápida — ela NÃO diz qual deles se aplica ao seu DN. Confirme no catálogo do fabricante.\n\n' +
                'Se o tubo for flangeado, prefira os catálogos "Flangeado PN 10/16/25/40": eles já trazem o PN e preenchem o campo sozinhos.' +
                (pfaCorpo ? '\n\nReferência: a resistência do corpo deste tubo pela EN 545 é de ' + UI.num(pfaCorpo, 0) + ' bar — um limite superior, não a PFA do conjunto.' : ''))),
      h('select', { 'data-bind': base + '.pnMcaOverride', 'data-tipo': 'num', 'data-estrutural': '1' },
        opcoes.map(function (o) {
          return h('option', { value: o.v, selected: o.v === atual }, o.rot);
        })));
  };

  /* ================================================================
     ABA: Resumo — entrada rápida do essencial + panorama
     ================================================================ */

  F.abaResumo = function (st, ctx, res) {
    var cen = res.projeto;
    var deCota = ['cotaChegada', 'cotaPartida', 'niveis', 'eixoDistante'];

  F.cartaoPanorama = function (st, ctx, res) {
    var cen = res.projeto;
    var todos = cen.succao.map(function (r) { return { r: r, g: 'Sucção' }; })

      .concat(cen.adutoras.map(function (r) { return { r: r, g: 'Adutora' }; }));

    var somaL = 0, somaHf = 0, somaHl = 0;
    var linhas = todos.map(function (x) {
      var r = x.r;
      somaL += r.L; somaHf += r.hf; somaHl += r.hl;
      var crit = PDA.C.criterioDe(st, ctx, r.conj.tipo || 'adutora');
      var cl = PDA.C.classificar(r.v, r.J, crit);
      return h('tr', { class: cl.classe === 'ruim' ? 'ruim' : null },
        h('td', { class: 'esq' }, x.g),
        h('td', { class: 'esq' }, r.rot),
        h('td', { class: 'esq' }, r.tubo ? r.tubo.cat.nome.split('—')[0].trim() : '—'),
        h('td', { class: 'esq' }, r.tubo && r.tubo.item ? r.tubo.item.rot : '—'),

        h('td', {}, UI.num(r.L, 1)),
        h('td', {}, UI.num(r.Q * 1000, 1)),
        h('td', {}, UI.num(r.v, 2),
          cl.classe === 'ruim' ? h('span', { class: 'sinal', title: cl.motivos.join('; ') }, ' !') : null),
        h('td', {}, UI.tab(r.J * 1000)),
        h('td', {}, UI.tab(r.hf)),
        h('td', {}, UI.tab(r.hl)),
        h('td', {}, h('b', {}, UI.tab(r.htotal))));
    });

    var rodape = h('tr', {},
      h('td', { class: 'esq', colspan: 5 }, 'Total'),
      h('td', {}, UI.num(somaL, 1)),
      h('td', {}, ''), h('td', {}, ''), h('td', {}, ''),
      h('td', {}, UI.tab(somaHf)),
      h('td', {}, UI.tab(somaHl)),
      h('td', {}, UI.tab(somaHf + somaHl)));

    return UI.cartao('Panorama do sistema',
      'Cenário de projeto: ' + ctx.nOp + ' de ' + ctx.nInst + ' bombas em operação', [

        F.chip('Perda distribuída', UI.num(somaHf, 2), 'm'),
        F.chip('Perda localizada', UI.num(somaHl, 2), 'm'),
        chip('Altura manométrica', UI.num(cen.Hm, 2), 'mca', 'forte'),
        F.chip('BHP por bomba', UI.num(cen.bhpCv, 1), 'cv  (' + UI.num(cen.bhpKw, 1) + ' kW)'),
        chip('Motor por bomba', UI.numEdit(cen.motorCv), 'cv  (' + UI.num(cen.motorKw, 1) + ' kW)', 'forte'),
        F.chip('Potência em operação', UI.num(cen.potTotalKw, 1), 'kW com ' + ctx.nOp + ' conjunto(s)'),
        cen.npshd !== null ? F.chip('NPSH disponível', UI.num(cen.npshd, 2), 'mca') : null)
    ], h('button', { class: 'btn mini naoimprime', type: 'button', 'data-acao': 'irAba', 'data-aba': 'resultados' },
      'Ver resultados completos'));

  F.cartaoConferencia = function (st, ctx, res) {

    item(st.adutoras.some(function (a) { return PDA.C.pnMca(a, PDA.C.resolverTubo(a, ctx)) !== null; }),
      'Pressão admissível do tubo conhecida — habilita a verificação de pressão', 'adutoras');
    item(st.perfil.ativo && st.perfil.pontos.length > 1,
      'Perfil da linha lançado — habilita a envoltória de pressões do transitório', 'perfil');
    item(st.curvaBomba.ativo && (st.curvaBomba.pontos || []).length >= 3,
      'Curva da bomba lançada — habilita o ponto de operação real', 'bombas');

    return UI.cartao('Conferência do preenchimento', 'Os três últimos itens são opcionais',

  /* ================================================================

  F.abaBombas = function (st, ctx, res) {

    var cen = res.projeto;
    var avisos = (res.avisosDados || []).filter(function (a) {
      return ['cotaChegada', 'cotaPartida', 'niveis', 'eixoDistante',

    var cartaoCotas = UI.cartao('Níveis e cotas',

      PDA.Q.caixa('Onde cada cota entra no desenho', PDA.Q.niveisCotas(st, ctx, cen),
        'Nível de sucção: cota da SUPERFÍCIE DA ÁGUA no poço, no nível mais baixo e no mais alto de operação. ' +

      h('div', { class: 'grade' },
        UI.campo(st, 'Cota do N.A. de sucção — mínimo', 'cotas.nivelSuccaoMin', {

        UI.campo(st, 'Cota do N.A. de sucção — máximo', 'cotas.nivelSuccaoMax', {

        submersivel ? null : UI.campo(st, 'Cota do eixo da bomba', 'cotas.eixoBomba', {
          dica: 'ALTITUDE do eixo do rotor. Usada só no NPSH disponível. Se o eixo está abaixo do nível de sucção, a bomba está afogada e a parcela geométrica ajuda o NPSH.' }),

        UI.campo(st, 'Cota de chegada', 'cotas.nivelChegada', {

        st.perfil.ativo ? null : UI.campo(st, 'Cota do ponto mais alto (m)', 'cotas.cotaPontoAlto', {

      (function () {

        var okP = pa.pPerm !== null && pa.pPerm >= 0;
        return h('div', { class: 'aviso' + (okP ? ' info' : ' erro'), style: 'margin-top:9px' },

      })(),

      h('div', { class: 'faixa-resumo', style: 'margin:11px 0 0' },

        F.chip('Hg mínima', UI.num(cen.HgMin, 2), 'm  (N.A. de sucção máximo)'),
        submersivel ? null : F.chip('Carga na sucção',

          'm  —  ' + (cen.zSuccao >= 0 ? 'bomba afogada' : 'bomba aspirando')),

  F.cartaoCurvaBomba = function (st, ctx, res) {

      })

        : h('p', { class: 'vazio' }, 'Sem pontos lançados.'));

      if (res.curvaBomba && res.operacao) {

        } else {
          var op = res.operacao;
          var desvio = Math.abs(op.desvioQ);
          corpo.push(h('div', { class: 'faixa-resumo', style: 'margin-top:11px' },
            chip('Vazão de operação', UI.num(op.qTotal * 1000, 1), 'L/s total', 'forte'),
            F.chip('Por bomba', UI.num(op.qBomba * 1000, 1), 'L/s'),
            chip('Altura de operação', UI.num(op.H, 2), 'mca', 'forte'),
            F.chip('BHP no ponto', UI.num(op.bhpCv, 1), 'cv'),
            F.chipAlerta('Desvio da vazão de projeto',
              (op.desvioQ >= 0 ? '+' : '') + UI.num(op.desvioQ, 1), '%',
              desvio > 10 ? { grave: desvio > 20,

  /* gráfico: curva do sistema x curva da bomba */
  F.graficoCurvas = function (st, ctx, res) {
    var SVG = 'http://www.w3.org/2000/svg';
    function sv(t, a, txt) {
      var e = document.createElementNS(SVG, t), k;
      for (k in a) if (a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]);
      if (txt !== undefined) e.textContent = txt;
      return e;
    }
    var op = res.operacao, curva = res.curvaBomba;
    var n = ctx.nOp;
    var qMax = Math.max(op.qTotal, ctx.qTotal, curva.qMax * n) * 1.15;
    if (!(qMax > 0)) return h('div');
    var fator = ctx.qTotal > 0 ? qMax / ctx.qTotal : 1;
    var sis = PDA.C.curvaSistema(st, ctx, n, 24, fator);
    var hMax = Math.max(curva.H(0), op.H, res.projeto.Hm) * 1.2;
    if (!(hMax > 0)) return h('div');

    var W = 640, HH = 300, mE = 52, mD = 14, mT = 16, mB = 34;
    var s = sv('svg', { viewBox: '0 0 ' + W + ' ' + HH, class: 'perfil' });
    function px(q) { return mE + q / qMax * (W - mE - mD); }
    function py(hh) { return mT + (1 - hh / hMax) * (HH - mT - mB); }

    var i, nd = 5, hv, qv;
    for (i = 0; i <= nd; i++) {
      hv = hMax * i / nd;
      s.appendChild(sv('line', { class: 'grade-l', x1: mE, x2: W - mD, y1: py(hv), y2: py(hv) }));
      s.appendChild(sv('text', { x: mE - 5, y: py(hv) + 3, 'text-anchor': 'end' }, UI.num(hv, 0)));
    }
    for (i = 0; i <= nd; i++) {
      qv = qMax * i / nd;
      s.appendChild(sv('line', { class: 'grade-l', x1: px(qv), x2: px(qv), y1: mT, y2: HH - mB }));
      s.appendChild(sv('text', { x: px(qv), y: HH - mB + 13, 'text-anchor': 'middle' }, UI.num(qv * 1000, 0)));
    }

    s.appendChild(sv('polyline', { class: 'lp',
      points: sis.map(function (p) { return px(p.q) + ',' + py(p.H); }).join(' ') }));

    var ptsB = [], k, qb;
    for (k = 0; k <= 30; k++) {
      qb = curva.qMax * k / 30;
      ptsB.push(px(qb * n) + ',' + py(curva.H(qb)));
    }
    s.appendChild(sv('polyline', { points: ptsB.join(' '), fill: 'none',
                                   stroke: 'var(--vermelho)', 'stroke-width': 2 }));
    curva.pontos.forEach(function (p) {
      s.appendChild(sv('circle', { cx: px(p.q * n), cy: py(p.H), r: 2.6, fill: 'var(--vermelho)' }));
    });

    s.appendChild(sv('circle', { cx: px(op.qTotal), cy: py(op.H), r: 5, fill: 'none',
                                 stroke: 'var(--teal-vivo)', 'stroke-width': 2.5 }));
    s.appendChild(sv('text', { x: px(op.qTotal) + 8, y: py(op.H) - 5, fill: 'var(--teal)' },
      UI.num(op.qTotal * 1000, 0) + ' L/s · ' + UI.num(op.H, 1) + ' mca'));

    s.appendChild(sv('line', { x1: px(ctx.qTotal), x2: px(ctx.qTotal), y1: mT, y2: HH - mB,
                               stroke: 'var(--texto-3)', 'stroke-width': 1, 'stroke-dasharray': '4 3' }));
    s.appendChild(sv('text', { x: px(ctx.qTotal) + 4, y: mT + 11 }, 'vazão de projeto'));

    s.appendChild(sv('text', { x: mE + 6, y: py(res.projeto.Hm) - 5, fill: 'var(--azul)' }, 'curva do sistema'));
    s.appendChild(sv('text', { x: mE + 6, y: py(curva.H(0)) + 13, fill: 'var(--vermelho)' },
      'curva da bomba' + (n > 1 ? ' — ' + n + ' em paralelo' : '')));
    s.appendChild(sv('text', { x: W - mD, y: HH - 4, 'text-anchor': 'end' }, 'vazão total (L/s)'));
    s.appendChild(sv('text', { x: 4, y: mT + 9 }, 'H (mca)'));

    return h('div', { style: 'margin-top:11px' }, s,
      h('p', { class: 'nota' },
        'A curva do sistema é a altura manométrica em função da vazão, com os diâmetros e as peças lançados. ' +
        'A curva da bomba está plotada na escala de vazão TOTAL' +
        (n > 1 ? ': com ' + n + ' bombas em paralelo, cada vazão da curva individual foi multiplicada por ' + n : '') + '. ' +
        'O cruzamento é o ponto de operação real.'));
  };

  Pf.grafico = function (st, ctx, res) {

    function px(x) { return mE + (xMax > 0 ? x / xMax : 0) * (W - mE - mD); }
    function py(c) { return mT + (yMax - c) / (yMax - yMin) * (HH - mT - mB); }

    var s = sv('svg', { viewBox: '0 0 ' + W + ' ' + HH, class: 'perfil',
                        preserveAspectRatio: 'xMidYMid meet' });

    var i, nd = 6, c, x;
    for (i = 0; i <= nd; i++) {

      s.appendChild(sv('line', { class: 'grade-l', x1: mE, x2: W - mD, y1: py(c), y2: py(c) }));
      s.appendChild(sv('text', { x: mE - 5, y: py(c) + 3, 'text-anchor': 'end' }, UI.num(c, 1)));
    }
    for (i = 0; i <= nd; i++) {
      x = xMax * i / nd;
      s.appendChild(sv('line', { class: 'grade-l', x1: px(x), x2: px(x), y1: mT, y2: HH - mB }));
      s.appendChild(sv('text', { x: px(x), y: HH - mB + 14, 'text-anchor': 'middle' }, UI.num(x, 0)));
    }

    function poli(campo) {
      return pts.map(function (p) { return px(p.x) + ',' + py(p[campo]); }).join(' ');
    }

    /* faixa entre as envoltórias */
    var area = pts.map(function (p) { return px(p.x) + ',' + py(p.envMax); })
      .concat(pts.slice().reverse().map(function (p) { return px(p.x) + ',' + py(p.envMin); })).join(' ');
    s.appendChild(sv('polygon', { points: area, fill: 'var(--vermelho)', opacity: 0.07 }));

    /* terreno preenchido */
    s.appendChild(sv('polygon', {
      points: poli('cota') + ' ' + px(xMax) + ',' + py(yMin) + ' ' + px(0) + ',' + py(yMin),
      fill: 'var(--texto-3)', opacity: 0.16

    s.appendChild(sv('polyline', { class: 'terreno', points: poli('cota'), 'stroke-dasharray': 'none',

    s.appendChild(sv('polyline', { points: poli('envMax'), fill: 'none',

    s.appendChild(sv('polyline', { points: poli('envMin'), fill: 'none',
                                   stroke: 'var(--teal)', 'stroke-width': 1.6, 'stroke-dasharray': '5 3' }));
    s.appendChild(sv('polyline', { class: 'lp', points: poli('hgl') }));

    pts.forEach(function (p) {
      if (p.classe === 'ruim') {
        s.appendChild(sv('circle', { cx: px(p.x), cy: py(p.cota), r: 3.6,
                                     fill: 'var(--vermelho)', stroke: 'var(--surface)', 'stroke-width': 1 }));
      }

    s.appendChild(sv('text', { x: W - mD, y: HH - 6, 'text-anchor': 'end' }, 'distância (m)'));
    s.appendChild(sv('text', { x: 4, y: 11 }, 'cota (m)'));

    var leg = [
      ['var(--vermelho)', 'envoltória máxima — permanente + Δh', false],
      ['var(--azul)', 'linha piezométrica em regime permanente', false],
      ['var(--teal)', 'envoltória mínima — permanente − Δh', true],
      ['var(--texto-3)', 'perfil do terreno / geratriz da tubulação', false]

/* ------------------------------------------------------------------
 * Aba Blocos de ancoragem.
 *
 * Cada bloco é um cartão: peça, tubo (herdado da adutora ou manual),
 * pressão de cálculo, solo e recobrimento. O resultado sai em duas
 * vias lado a lado — o bloco padronizado sugerido (★, clique para
 * adotar outro) e o bloco calculado pelo apoio no solo.

(function (PDA) {
  'use strict';

  var UB = {};

  /* ================================================================
     Esquema: planta da curva com o empuxo e o encosto no terreno
     ================================================================ */

  UB.esquema = function (info) {
    var p = BA.peca(info.b.pecaId);
    var svg = sv('svg', { viewBox: '0 0 340 150', class: 'esquema', role: 'img' });
    var cx = 150, cy = 78;

    function tubo(x1, y1, x2, y2) {
      svg.appendChild(sv('line', { x1: x1, y1: y1, x2: x2, y2: y2,
        stroke: 'var(--azul)', 'stroke-width': 13, 'stroke-linecap': 'butt', opacity: 0.85 }));
      svg.appendChild(sv('line', { x1: x1, y1: y1, x2: x2, y2: y2,
        stroke: 'var(--surface)', 'stroke-width': 7, 'stroke-linecap': 'butt' }));
    }

    function seta(x1, y1, x2, y2, cor) {
      var ang = Math.atan2(y2 - y1, x2 - x1);
      svg.appendChild(sv('line', { x1: x1, y1: y1, x2: x2, y2: y2, stroke: cor, 'stroke-width': 2.4 }));
      svg.appendChild(sv('path', {
        d: 'M ' + x2 + ' ' + y2 +
           ' L ' + (x2 - 9 * Math.cos(ang - 0.44)) + ' ' + (y2 - 9 * Math.sin(ang - 0.44)) +
           ' L ' + (x2 - 9 * Math.cos(ang + 0.44)) + ' ' + (y2 - 9 * Math.sin(ang + 0.44)) + ' Z',
        fill: cor }));
    }

    /* bloco: retângulo entre a peça e a parede da vala */
    function bloco(x, y, w, hh) {
      svg.appendChild(sv('rect', { x: x, y: y, width: w, height: hh, rx: 2,
        fill: 'var(--teal)', opacity: 0.30, stroke: 'var(--teal-escuro, #0E6F66)', 'stroke-width': 1.4 }));
    }

    var eDir; /* direção do empuxo (para a legenda do encosto) */
    if (p.reducao || p.axial) {
      tubo(30, cy, cx, cy);
      if (p.reducao) {
        svg.appendChild(sv('line', { x1: cx, y1: cy, x2: 285, y2: cy, stroke: 'var(--azul)', 'stroke-width': 8, opacity: 0.85 }));
        svg.appendChild(sv('line', { x1: cx, y1: cy, x2: 285, y2: cy, stroke: 'var(--surface)', 'stroke-width': 4 }));
        svg.appendChild(sv('path', { d: 'M ' + (cx - 2) + ' ' + (cy - 8) + ' L ' + (cx + 16) + ' ' + (cy - 5) +
          ' L ' + (cx + 16) + ' ' + (cy + 5) + ' L ' + (cx - 2) + ' ' + (cy + 8) + ' Z',
          fill: 'var(--azul)' }));
      } else {
        svg.appendChild(sv('rect', { x: cx - 3, y: cy - 11, width: 8, height: 22, fill: 'var(--azul)' }));
      }
      bloco(cx + 12, cy - 26, 16, 52);
      seta(cx - 42, cy - 24, cx + 4, cy - 24, 'var(--vermelho, #b3261e)');
      svg.appendChild(sv('text', { x: cx - 46, y: cy - 20, 'text-anchor': 'end', 'font-size': 12,
        fill: 'var(--vermelho, #b3261e)', 'font-weight': 700 }, 'E'));
      eDir = { x: cx + 34, y: cy };
    } else {
      var ang = (180 - p.ang) * Math.PI / 180;   /* direção do segundo trecho */
      var x2 = cx + 110 * Math.cos(ang), y2 = cy - 110 * Math.sin(ang);
      tubo(30, cy, cx, cy);
      tubo(cx, cy, x2, y2);
      /* bissetriz externa: direção da resultante */

      seta(cx - ex * 4, cy - ey * 4, cx + ex * 44, cy + ey * 44, 'var(--vermelho, #b3261e)');
      svg.appendChild(sv('text', { x: cx + ex * 56, y: cy + ey * 56 + 4, 'text-anchor': 'middle',
        'font-size': 12, fill: 'var(--vermelho, #b3261e)', 'font-weight': 700 }, 'E'));
      svg.appendChild(sv('text', { x: cx - 8, y: cy + 22, 'font-size': 10, fill: 'var(--texto-suave, #667)' },
        'θ = ' + p.ang + '°'));

      fill: 'var(--teal)', opacity: 0.30, stroke: 'var(--teal-escuro, #0E6F66)', 'stroke-width': 1 }));
    svg.appendChild(sv('text', { x: 24, y: 16, 'font-size': 10,
      fill: 'var(--teal-escuro, #0E6F66)' }, 'bloco contra o terreno firme'));
    svg.appendChild(sv('text', { x: 8, y: 143, 'font-size': 10, fill: 'var(--texto-suave, #667)' },

    g.appendChild(sv('line', { x1: x1, y1: y, x2: x2, y2: y, stroke: c, 'stroke-width': 1 }));

      g.appendChild(sv('line', { x1: p[0], y1: y - 5, x2: p[0], y2: y + 5, stroke: c, 'stroke-width': 1 }));
    });
    g.appendChild(sv('text', { x: (x1 + x2) / 2, y: y - 4, 'text-anchor': 'middle',
      'font-size': 9.5, fill: c, stroke: 'var(--surface)', 'stroke-width': 3,
      'paint-order': 'stroke', 'stroke-linejoin': 'round' }, rot));
  }

  function cotaV(g, x, y1, y2, rot) {

    g.appendChild(sv('line', { x1: x, y1: y1, x2: x, y2: y2, stroke: c, 'stroke-width': 1 }));
    [[y1, 1], [y2, -1]].forEach(function (p) {
      g.appendChild(sv('path', { d: 'M ' + x + ' ' + p[0] + ' l -2.6 ' + (6 * p[1]) + ' l 5.2 0 Z', fill: c }));
      g.appendChild(sv('line', { x1: x - 5, y1: p[0], x2: x + 5, y2: p[0], stroke: c, 'stroke-width': 1 }));
    });
    var t = sv('text', { x: x + 4, y: (y1 + y2) / 2 + 3, 'font-size': 9.5, fill: c,
      stroke: 'var(--surface)', 'stroke-width': 3, 'paint-order': 'stroke',
      'stroke-linejoin': 'round' });

    svg.appendChild(sv('text', { x: viewW / 2, y: 13, 'text-anchor': 'middle', 'font-size': 10.5,

  /* 4 vistas do bloco adotado. info: C.blocoInfo; sol: BA.solucao */
  UB.desenhoBloco = function (info, sol) {

    var rec = sol.rec || 0.65;

    var esc = 120 / maxDim;
    function m2px(v) { return v * esc; }

    var vistas = [];

    /* ---- PLANTA ---- */
    vistas.push(vista('PLANTA', 230, 190, function (svg) {
      var L = m2px(sol.largura), T = m2px(sol.espessura);
      var x0 = 115 - L / 2, y0 = 95 - T / 2;
      /* tubo passando */
      var dTubo = Math.max(6, m2px(deM));
      svg.appendChild(sv('rect', { x: 10, y: 95 - dTubo / 2, width: 210, height: dTubo,
        fill: COR_TUBO, opacity: 0.75 }));

       o tubo; sob ele, o berço de concreto magro. */
    var RECB_BLOCO = 0.20;
    var profValaDes = Math.max(profVala, RECB_BLOCO + sol.altura + lastro);

      var dTubo = Math.max(8, m2px(deM));
      var yTuboTopo = terreno + m2px(rec);
      var yBloco = terreno + m2px(RECB_BLOCO);

  /* quantidades e dimensões da solução adotada */
  UB.quadroSolucao = function (info, sol) {
    var deM = info.deMm / 1000;
    var profVala = (sol.rec || 0) + deM + BA.LASTRO;
    var linhas = [
      ['Bloco adotado', sol.via === 'padrao'
        ? 'padronizado tipo ' + sol.tipo + ' (recobrimento ' + UI.numEdit(sol.rec) + ' m)'
        : (sol.via === 'peso' ? 'calculado — bloco de peso' : 'calculado — apoio no solo')],
      ['Dimensões (largura × altura × espessura)',
        UI.num(sol.largura, 2) + ' × ' + UI.num(sol.altura, 2) + ' × ' + UI.num(sol.espessura, 2) + ' m' +
        (sol.espessuraEquivalente ? '  (espessura média equivalente ao volume tabelado)' : '')],
      sol.via === 'padrao' ? ['Capacidade tabelada', UI.num(sol.cap, 0) + ' kgf  ≥  E = ' + UI.num(info.calc.E, 0) + ' kgf'] : null,
      sol.Anec ? ['Área de encosto  A = FS·E/σ', UI.num(sol.Anec, 2) + ' m²  (adotada ' + UI.num(sol.largura * sol.altura, 2) + ' m²)'] : null,
      sol.G ? ['Peso necessário  G = FS·E', UI.num(sol.G, 0) + ' kgf'] : null,
      ['Profundidade da vala', UI.num(Math.max(profVala, 0.20 + sol.altura + BA.LASTRO), 2) +
        ' m  (governa o maior entre recobrimento + DE + berço e 0,20 m + altura do bloco + berço)'],
      ['Concreto', UI.num(sol.concreto, 2) + ' m³'],
      ['Forma', UI.num(sol.forma, 2) + ' m²'],
      ['Armadura', UI.num(sol.aco, 0) + ' kg' + (sol.acoEstimado
        ? '  (previsão: ' + BA.TAXA_ACO + ' kg/m³ — malha nas faces, a detalhar no projeto estrutural)'
        : '  (do padrão da concessionária)')]
    ].filter(Boolean);
    return h('table', { class: 'tab-apoio' }, h('tbody', {},
      linhas.map(function (l) {
        return h('tr', {}, h('td', { class: 'esq' }, l[0]), h('td', {}, l[1]));
      })));
  };

  /* ================================================================
     Cartão de um bloco
     ================================================================ */

  function selectPeca(st, base, b) {
    return UI.select(st, 'Peça', base + '.pecaId',
      BA.pecas.map(function (p) { return { v: p.id, rot: p.rot }; }),
      { dica: 'A peça define a geometria do empuxo: E = p·A em tês, caps, flanges cegos e válvulas fechadas; E = 2·p·A·sen(θ/2) nas curvas; E = p·(A₁−A₂) nas reduções. A é a área da seção EXTERNA (DE).' });
  }

  function selectTubo(st, ctx, base, b) {
    var ops = (st.adutoras || []).map(function (a, i) {
      return { v: 'adutora.' + i, rot: a.rot + (a.itemRot ? ' — ' + a.itemRot : ' (sem diâmetro)') };
    });
    ops.push({ v: 'manual', rot: 'Escolher o tubo aqui' });
    return UI.select(st, 'Tubo', base + '.tuboOrigem', ops,
      { dica: 'Herdar do trecho da adutora traz catálogo, DN e DE automaticamente — e o bloco acompanha se o diâmetro do trecho mudar. "Escolher aqui" libera catálogo e DN próprios (é o modo da versão avulsa).' });
  }

  function camposTuboManual(st, ctx, base, b) {
    var cat = PDA.CAT.buscar(ctx.cats.todos, b.catalogoId);
    var itens = cat ? cat.itens : [];
    return [
      UI.select(st, 'Catálogo', base + '.catalogoId',
        ctx.cats.todos.map(function (c) { return { v: c.id, rot: c.nome }; })),
      UI.select(st, 'DN', base + '.itemRot',
        [{ v: '', rot: '—' }].concat(itens.map(function (it) {
          return { v: it.rot, rot: it.rot + (it.de ? '  (DE ' + UI.num(it.de, 0) + ')' : '') };
        }))),
      UI.campo(st, 'DE (mm)', base + '.deOverride',
        { dica: 'Deixe em branco para usar o DE do catálogo. Preencha para forçar outro diâmetro externo — por exemplo, o DE da bolsa da junta.', placeholder: 'do catálogo' })
    ];
  }

  function camposPressao(st, res, base, b) {
    var temRes = !!res;
    var ops = [];
    if (temRes) {
      ops.push({ v: 'transitorio', rot: 'Envoltória do transitório (recomendado)' });
      ops.push({ v: 'ensaio', rot: 'Pressão de ensaio (fator × Hm)' });
    }
    ops.push({ v: 'informada', rot: 'Pressão informada' });
    var out = [
      UI.select(st, 'Pressão de cálculo', base + '.pressaoFonte', ops,
        { chave: true,
          dica: 'O empuxo é proporcional à pressão. A envoltória do transitório usa a maior pressão calculada na linha (com a linha já protegida, se for o caso). A pressão de ensaio segue o critério clássico de bloco: fator (usualmente 1,5) sobre a pressão de serviço. A terceira opção aceita qualquer valor — por exemplo, o resultado de um estudo de transiente externo.' })
    ];
    if (b.pressaoFonte === 'ensaio') {
      out.push(UI.campo(st, 'Fator de ensaio', base + '.fatorEnsaio', { larg: 70 }));
    }
    if (b.pressaoFonte === 'informada' || !temRes) {
      out.push(UI.campo(st, 'Pressão (mca)', base + '.pressaoInformada', { chave: true }));
    }
    return out;
  }

  function camposSolo(st, base, b) {
    return [
      UI.select(st, 'Recobrimento (m)', base + '.recobrimento',
        BA.RECOBRIMENTOS.map(function (r) { return { v: r, rot: UI.numEdit(r) + ' m' }; }),
        { tipo: 'num',
          dica: 'Altura de solo sobre a geratriz do tubo. As capacidades dos blocos padronizados dependem dela: mais recobrimento, mais capacidade.' }),
      UI.select(st, 'Solo de apoio', base + '.soloId',
        BA.solos.map(function (s) {
          return { v: s.id, rot: s.rot + (s.sigma > 0 ? '  (' + UI.num(s.sigma / 1000, 0) + ' tf/m²)' : '') };
        }),
        { dica: 'Tensão admissível de apoio para anteprojeto (AWWA M41 / DIPRA; Azevedo Netto). O bloco encosta na parede NÃO escavada da vala — solo revolvido não conta. Confirmar com sondagem quando o bloco for grande.' }),
      UI.campo(st, 'σ adm (kgf/m²)', base + '.sigmaOverride',
        { placeholder: 'da tabela', dica: 'Preencha para adotar uma tensão admissível própria (sondagem, SPT). Em branco, vale o valor da tabela para o solo escolhido.' })
    ];
  }

  /* tabela dos blocos padronizados, com ★ no sugerido e clique para adotar */
  function tabelaPadrao(info, base) {
    var calc = info.calc;
    /* quando a sugestão só coube em recobrimento maior, é a tabela DESSE
       recobrimento que interessa ver — com a estrela nela */
    var recExib = (calc.padrao && calc.padrao.achou && !calc.padrao.recPedido)
      ? calc.padrao.rec : null;
    if (recExib !== null && info.dn) {
      calc = Object.assign({}, calc, { tabela: BA.tabelaPadrao(info.dn, recExib) });
    }
    if (!calc.tabela) {
      return h('p', { class: 'vazio' }, info.dn
        ? 'Não há blocos padronizados para DN ' + info.dn + ' com este recobrimento — vale o bloco calculado ao lado.'
        : 'Escolha o tubo para listar os blocos padronizados.');
    }
    var sugerido = calc.padrao && calc.padrao.achou &&
      (calc.padrao.recPedido || recExib !== null) ? calc.padrao.linha.tipo : null;
    var adotado = calc.escolhido ? calc.escolhido.tipo : sugerido;

    var linhas = calc.tabela.linhas.filter(function (l) { return l.cap !== null; }).map(function (l) {
      var atende = l.cap >= calc.E;
      var classe = atende ? (l.tipo === sugerido ? 'bom' : '') : 'ruim';
      return h('tr', {
        class: classe + (l.tipo === adotado ? ' selecionada' : ''),
        style: 'cursor:pointer',
        title: atende ? 'Resiste ao empuxo. Clique para adotar.' : 'NÃO resiste ao empuxo calculado.',
        'data-acao': 'blocoTipo', 'data-base': base, 'data-tipo-bloco': l.tipo
      },
        h('td', { class: 'esq' },
          l.tipo === sugerido ? h('span', { title: 'Sugestão: o menor bloco padronizado que resiste ao empuxo com o recobrimento pedido', style: 'color:var(--teal-vivo)' }, '★ ') : null,
          'Tipo ' + l.tipo),
        h('td', {}, UI.num(l.cap, 0)),
        h('td', {}, UI.num(l.H, 2) + ' × ' + UI.num(l.A, 2)),
        h('td', {}, UI.num(l.concreto, 2)),
        h('td', {}, UI.num(l.forma, 2)),
        h('td', {}, UI.num(l.aco, 0)),
        h('td', {}, UI.tagClasse(atende ? 'bom' : 'ruim')));
    });

    return h('div', {},
      UI.tabela([{ rot: 'Bloco', esq: true },
        { rot: 'E máx (kgf)', dica: 'Capacidade tabelada do bloco padronizado para este DN e recobrimento (tabela da concessionária transcrita da sua planilha, com as correções registradas na aba Fontes do memorial).' },
        'H × A (m)', 'Concreto (m³)', 'Forma (m²)', 'Aço (kg)', 'Situação'], linhas),
      h('p', { class: 'nota', style: 'margin-top:5px' },
        'DN da tabela: ' + calc.tabela.dnTabela + ' · recobrimento ' + UI.numEdit(calc.tabela.rec) + ' m' +
        (recExib !== null ? ' (nenhum tipo coube com o recobrimento pedido; esta é a tabela em que a sugestão coube)' : '') +
        '. Clique para adotar um tipo; ★ é a sugestão. ',
        info.b.tipoEscolhido ? h('button', { class: 'btn mini', type: 'button', 'data-acao': 'blocoTipo',
          'data-base': base, 'data-tipo-bloco': '' }, 'Voltar à sugestão') : null));
  }

  function resultado(info, base) {
    var calc = info.calc;
    var out = [];

    if (!(info.deMm > 0) || !(info.pMca > 0)) {
      return h('div', { class: 'aviso info' },
        'Escolha o tubo e a pressão de cálculo para o bloco ser dimensionado.');
    }

    /* linha-resumo do empuxo */
    out.push(h('div', { class: 'linha', style: 'gap:16px;flex-wrap:wrap;margin:7px 0' },
      h('span', {}, 'DE: ', h('b', {}, UI.num(info.deMm, 1) + ' mm'),
        info.trechoRot ? h('span', { class: 'nota' }, '  (de ' + info.trechoRot + ')') : null),
      h('span', {}, 'Pressão de cálculo: ', h('b', {}, UI.num(info.pMca, 1) + ' mca'),
        h('span', { class: 'nota' }, '  — ' + info.pOrigem)),
      h('span', {}, 'Empuxo: ', h('b', { style: 'font-size:15px' }, UI.num(calc.E, 0) + ' kgf'),
        h('span', { class: 'nota' }, '  (' + UI.num(calc.E / 1000, 2) + ' tf; ' +
          UI.num(calc.unit, 1) + ' kgf por mca)'))));

    info.avisos.forEach(function (a) {
      out.push(h('div', { class: 'aviso' }, a));
    });

    /* a solução que vale, dita com todas as letras — o tipo de solo altera
       só a verificação de apoio, nunca o bloco padronizado */
    var sol = BA.solucao(calc, info.b);
    if (sol) {
      out.push(h('div', { class: 'solucao-bloco ' + (sol.atende ? 'bom' : 'ruim') },
        h('b', {}, 'Solução adotada: '),
        sol.via === 'padrao'
          ? 'bloco padronizado tipo ' + sol.tipo + ' — ' + UI.num(sol.largura, 2) + ' × ' +
            UI.num(sol.altura, 2) + ' × ' + UI.num(sol.espessura, 2) + ' m, ' +
            UI.num(sol.concreto, 2) + ' m³ de concreto (capacidade ' + UI.num(sol.cap, 0) +
            ' kgf ≥ E = ' + UI.num(calc.E, 0) + ' kgf)'
          : 'bloco calculado — ' + UI.num(sol.largura, 2) + ' × ' + UI.num(sol.altura, 2) + ' × ' +
            UI.num(sol.espessura, 2) + ' m, ' + UI.num(sol.concreto, 2) + ' m³ de concreto' +
            (sol.via === 'peso' ? ' (bloco de peso)' : ' (apoio no solo)')));
    }

    if (calc.orientacao === 'horizontal') {
      out.push(h('div', { class: 'blocos-vias' },
        h('div', { class: 'via' },
          h('h4', {}, 'Bloco padronizado', UI.dica('Seleção entre os blocos-padrão da concessionária (tipos 1 a 26), pela capacidade tabelada por DN e recobrimento — a sistemática da sua planilha, com o empuxo calculado pelo DE. As capacidades são tabeladas: NÃO dependem do tipo de solo escolhido.')),
          tabelaPadrao(info, base)),
        h('div', { class: 'via' },
          h('h4', {}, 'Verificação de apoio no solo (bloco calculado)', UI.dica('Método clássico de anteprojeto: a área de encosto na parede da vala precisa transmitir FS·E ao terreno sem exceder a tensão admissível σ. A = FS·E/σ (Azevedo Netto; AWWA M41).\n\nÉ ESTA coluna que muda quando o tipo de solo muda — o bloco padronizado ao lado continua o mesmo. As duas vias são independentes: a tabela dá o bloco-padrão; o cálculo dá o bloco mínimo para o SEU solo.')),
          viaApoio(calc))));
    } else {
      out.push(h('div', { class: 'blocos-vias' },
        h('div', { class: 'via' },
          h('h4', {}, calc.orientacao === 'vert_cima'
            ? 'Curva vertical convexa — bloco de peso'
            : 'Curva vertical côncava — apoio no fundo da vala'),
          calc.orientacao === 'vert_cima' ? viaPeso(calc) : viaApoio(calc))));
    }

    /* desenho do bloco adotado + quantidades */
    if (sol) {
      out.push(h('div', { style: 'margin-top:12px' },
        h('h4', { class: 'titulo-desenho' }, 'Desenho do bloco adotado'),
        UB.desenhoBloco(info, sol),
        h('div', { style: 'max-width:640px;margin-top:8px' }, UB.quadroSolucao(info, sol))));
    }
    return h('div', {}, out);
  }

  function viaApoio(calc) {
    var a = calc.apoio;
    if (!a || !a.ok) {
      return h('div', { class: 'aviso' }, 'O solo escolhido não tem capacidade de apoio — solução específica.');
    }
    return h('div', {},
      h('table', { class: 'tab-apoio' }, h('tbody', {},
        h('tr', {}, h('td', { class: 'esq' }, 'Área de encosto necessária  A = FS·E/σ'),
          h('td', {}, h('b', {}, UI.num(a.Anec, 2) + ' m²'))),
        h('tr', {}, h('td', { class: 'esq' }, 'Sugestão de encosto (altura × largura)'),
          h('td', {}, UI.num(a.b, 2) + ' × ' + UI.num(a.L, 2) + ' m  (' + UI.num(a.Aefetiva, 2) + ' m²)')),
        h('tr', {}, h('td', { class: 'esq' }, 'Espessura no sentido do empuxo'),
          h('td', {}, UI.num(a.esp, 2) + ' m')),
        h('tr', {}, h('td', { class: 'esq' }, 'Concreto do bloco calculado (muda com o solo)'),
          h('td', {}, UI.num(a.concreto, 2) + ' m³')),
        h('tr', {}, h('td', { class: 'esq' }, 'Tensão atuante com o encosto sugerido'),
          h('td', {}, UI.num(a.sigmaAtuante, 0) + ' kgf/m²  (FS efetivo ' + UI.num(a.fsEfetivo, 2) + ')')))),
      h('p', { class: 'nota', style: 'margin-top:5px' },
        'O encosto vale contra solo firme, não escavado. Curvas verticais e blocos grandes pedem verificação estrutural própria.'));
  }

  function viaPeso(calc) {
    var p = calc.peso;
    return h('div', {},
      h('table', { class: 'tab-apoio' }, h('tbody', {},
        h('tr', {}, h('td', { class: 'esq' }, 'Peso necessário  G = FS·E'),
          h('td', {}, h('b', {}, UI.num(p.G, 0) + ' kgf'))),
        h('tr', {}, h('td', { class: 'esq' }, 'Concreto  V = G/γ'),
          h('td', {}, h('b', {}, UI.num(p.concreto, 2) + ' m³'))),
        h('tr', {}, h('td', { class: 'esq' }, 'Sugestão (base × largura)'),
          h('td', {}, UI.num(p.b, 2) + ' × ' + UI.num(p.L, 2) + ' m')))),
      h('p', { class: 'nota', style: 'margin-top:5px' },
        'Na curva vertical convexa o empuxo é para cima e quem resiste é o peso próprio do bloco (o solo de cobertura é desprezado a favor da segurança). Verificar a tração no tubo e o envolvimento da peça.'));
  }

  UB.cartaoBloco = function (st, ctx, res, b, i, total) {
    var base = 'blocos.itens.' + i;
    var info = PDA.C.blocoInfo(st, ctx, res, b);
    var manual = b.tuboOrigem === 'manual' || !(st.adutoras || []).length;

    var linha1 = [selectPeca(st, base, b)];
    if (b.pecaId === 'reducao') {
      linha1.push(UI.campo(st, 'DN de saída', base + '.dn2',
        { dica: 'DN comercial do lado menor da redução. O programa busca o DE correspondente no catálogo.' }));
    }
    linha1.push(UI.select(st, 'Orientação', base + '.orientacao', [
      { v: 'horizontal', rot: 'Horizontal (planta)' },
      { v: 'vert_baixo', rot: 'Vertical — empuxo para baixo' },
      { v: 'vert_cima', rot: 'Vertical — empuxo para cima' }
    ], { dica: 'Curva em planta: o bloco encosta na parede da vala. Curva vertical côncava (fundo de vale): o empuxo é para baixo, apoiado no fundo. Curva vertical convexa (crista): o empuxo é para cima e quem segura é o peso do bloco.' }));
    if (!PDA.MODO_BLOCO) linha1.push(selectTubo(st, ctx, base, b));
    if (manual || PDA.MODO_BLOCO) camposTuboManual(st, ctx, base, b).forEach(function (c) { linha1.push(c); });

    return UI.cartao(
      h('span', {}, h('input', { type: 'text', value: b.rot, 'data-bind': base + '.rot', 'data-tipo': 'texto',
                                 class: 'titulo', 'aria-label': 'Nome do bloco' }),
        ' ', UI.tagClasse(info.classe)),
      null,
      h('div', {},
        h('div', { class: 'linha campos' }, linha1),
        h('div', { class: 'linha campos' },
          camposPressao(st, res, base, b).concat(camposSolo(st, base, b))),
        h('div', { class: 'linha', style: 'align-items:flex-start;gap:14px;flex-wrap:wrap' },
          h('div', { style: 'flex:0 0 340px;max-width:100%' }, UB.esquema(info)),
          h('div', { style: 'flex:1 1 420px;min-width:280px' }, resultado(info, base)))),
      h('div', { class: 'linha', style: 'gap:6px' },
        i > 0 ? h('button', { class: 'btn mini', type: 'button', 'data-acao': 'blocoMover', 'data-i': i, 'data-d': -1, title: 'Mover para cima' }, '↑') : null,
        i < total - 1 ? h('button', { class: 'btn mini', type: 'button', 'data-acao': 'blocoMover', 'data-i': i, 'data-d': 1, title: 'Mover para baixo' }, '↓') : null,
        h('button', { class: 'btn mini', type: 'button', 'data-acao': 'blocoDuplicar', 'data-i': i }, 'Duplicar'),
        h('button', { class: 'btn mini perigo', type: 'button', 'data-acao': 'blocoExcluir', 'data-i': i }, 'Excluir')));
  };

  /* ================================================================
     Memória de cálculo na tela (card separado, no fim da aba)
     ================================================================ */

  function memoriaDeUm(st, info) {
    var calc = info.calc;
    var b = info.b;
    if (!(info.deMm > 0) || !(info.pMca > 0)) return null;
    var p = BA.peca(b.pecaId);
    var deM = info.deMm / 1000;
    var A = Math.PI * deM * deM / 4;
    var nn = function (v, d) { return UI.num(v, d === undefined ? 2 : d); };
    var linhas = [];

    /* empuxo */
    linhas.push('A = \\frac{\\pi \\cdot ' + nn(deM, 4) + '^2}{4} = ' + nn(A, 4) + '\\ \\text{m}^2');
    if (p.reducao) {
      var de2M = info.de2Mm / 1000;
      var A2 = Math.PI * de2M * de2M / 4;
      linhas.push('A_2 = \\frac{\\pi \\cdot ' + nn(de2M, 4) + '^2}{4} = ' + nn(A2, 4) + '\\ \\text{m}^2');
      linhas.push('E = 1000 \\cdot p \\cdot ( A - A_2 ) = 1000 \\cdot ' + nn(info.pMca, 1) +
        ' \\cdot ' + nn(A - A2, 4) + ' = ' + nn(calc.E, 0) + '\\ \\text{kgf}');
    } else if (p.axial) {
      linhas.push('E = 1000 \\cdot p \\cdot A = 1000 \\cdot ' + nn(info.pMca, 1) +
        ' \\cdot ' + nn(A, 4) + ' = ' + nn(calc.E, 0) + '\\ \\text{kgf}');
    } else {
      linhas.push('E = 2 \\cdot 1000 \\cdot p \\cdot A \\cdot sen ( \\frac{' + nn(p.ang, 1) +
        '°}{2} ) = ' + nn(calc.E, 0) + '\\ \\text{kgf}');
    }

    var passos = [
      h('p', { class: 'nota' }, 'Pressão de cálculo: ' + nn(info.pMca, 1) + ' mca — ' + info.pOrigem +
        '. DE = ' + nn(info.deMm, 1) + ' mm' + (info.trechoRot ? ' (de ' + info.trechoRot + ')' : '') + '.'),
      PDA.FX.bloco(linhas, { tam: 15 })
    ];

    /* seleção do padronizado */
    if (calc.orientacao === 'horizontal' && calc.padrao && calc.padrao.achou) {
      passos.push(h('p', { class: 'nota' },
        'Bloco padronizado: menor tipo com capacidade ≥ E na tabela do DN ' +
        (calc.tabela ? calc.tabela.dnTabela : info.dn) + ' → tipo ' + calc.padrao.linha.tipo +
        ' (capacidade ' + nn(calc.padrao.linha.cap, 0) + ' kgf, recobrimento ' +
        UI.numEdit(calc.padrao.rec) + ' m)' +
        (calc.escolhido ? '; adotado manualmente o tipo ' + calc.escolhido.tipo + '.' : '.')));
    }

    /* apoio / peso */
    if (calc.apoio && calc.apoio.ok && calc.orientacao !== 'vert_cima') {
      var ap = calc.apoio;
      passos.push(PDA.FX.bloco([
        'A_{nec} = \\frac{FS \\cdot E}{\\sigma_{adm}} = \\frac{' + UI.numEdit(calc.fs) +
          ' \\cdot ' + nn(calc.E, 0) + '}{' + nn(calc.sigma, 0) + '} = ' + nn(ap.Anec, 2) + '\\ \\text{m}^2',
        '\\sigma = \\frac{' + nn(calc.E, 0) + '}{' + nn(ap.b, 2) + ' \\cdot ' + nn(ap.L, 2) +
          '} = ' + nn(ap.sigmaAtuante, 0) + '\\ \\text{kgf/m}^2 \\qquad \\text{(admissível: ' +
          nn(calc.sigma, 0) + ' kgf/m², ' + calc.solo.rot.toLowerCase() + ')}'
      ], { tam: 15 }));
    }
    if (calc.peso) {

(function (PDA) {

    var c = res.projeto, av = {};

    if (c.Hg <= 0) {
      av.hg = { grave: true, txt: 'Altura geométrica nula ou negativa: a cota de chegada não é superior ao nível de sucção. Confira se as duas cotas estão na mesma referência de nível.' };
    } else if ((res.avisosDados || []).some(function (a) { return a.grave; })) {
      av.hg = { grave: true, txt: 'Há incoerência entre a cota de chegada e a cota final do último trecho da adutora. Veja a aba Resumo.' };
    }

    var perdas = c.hSuccao + c.hRecalque;
    if (c.Hm > 0) {
      var fracao = perdas / c.Hm;
      if (fracao > 0.6) {
        av.perdas = { grave: fracao > 0.8,
          txt: 'As perdas de carga respondem por ' + UI.num(fracao * 100, 0) + ' % da altura manométrica. ' +
               'Acima de 50 a 60 % é sinal de diâmetro apertado: normalmente compensa aumentar o diâmetro, ' +
               'porque o custo de energia domina o custo do tubo.' };
      }
    }
    if (perdas > 0 && (c.hlSuccao + c.hlRecalque) / perdas > 0.5) {
      av.perdas = av.perdas || {};
      av.perdas.txt = (av.perdas.txt ? av.perdas.txt + ' ' : '') +
        'As perdas localizadas são mais da metade do total (' +
        UI.num((c.hlSuccao + c.hlRecalque) / perdas * 100, 0) + ' %). Em adutoras longas isso é atípico — ' +
        'confira as quantidades de peças e os diâmetros lançados nelas.';
    }

    if (c.Hm > 0 && c.Hg > 0 && c.Hm / c.Hg > 3) {
      av.hm = { grave: false,
        txt: 'A altura manométrica é ' + UI.num(c.Hm / c.Hg, 1) + ' vezes a altura geométrica. ' +
             'Reveja o diâmetro da adutora — a energia gasta em perda de carga é maior que a gasta em elevar a água.' };
    }
    if (c.Hm <= 0) av.hm = { grave: true, txt: 'Altura manométrica não positiva. Revise cotas e perdas.' };

    if (c.motorCv && c.bhpCv > 0 && c.motorCv / c.bhpCv > 1.6) {
      av.motor = { grave: false,
        txt: 'O motor comercial escolhido tem ' + UI.num((c.motorCv / c.bhpCv - 1) * 100, 0) +
             ' % de folga sobre a potência de eixo, porque a potência calculada caiu logo acima de uma faixa ' +
             'comercial. Vale conferir se um ajuste de diâmetro traz o BHP para a faixa de baixo.' };
    }

    if (c.npshd !== null) {
      if (c.npshd < 0) av.npsh = { grave: true, txt: 'NPSH disponível negativo: a bomba não consegue aspirar nessa configuração.' };
      else if (c.npshd < 3) av.npsh = { grave: true, txt: 'NPSH disponível de apenas ' + UI.num(c.npshd, 2) + ' mca. Confira o NPSH requerido da bomba — a margem usual mínima é de 0,5 a 1,0 mca.' };
      else if (st.curvaBomba.npshr && c.npshd - Number(st.curvaBomba.npshr) < 0.5) {
        av.npsh = { grave: c.npshd - Number(st.curvaBomba.npshr) < 0,
          txt: 'Margem de apenas ' + UI.num(c.npshd - Number(st.curvaBomba.npshr), 2) + ' mca sobre o NPSH requerido.' };
      }
    }

    var pior = null;
    (res.golpe || []).forEach(function (g) {
      if (g.atende === false) pior = { grave: true, txt: g.rot + ': pressão máxima de ' + UI.num(g.pressaoMaxMca, 1) +
        ' mca com o transitório, acima da admissível do tubo (' + UI.num(g.pnMca, 0) + ' mca).' };

      if (res.envoltoria.criticoMin.pMin <= -10) {
        pior = { grave: true, txt: 'Separação de coluna prevista em ' + UI.num(res.envoltoria.criticoMin.x, 0) +
          ' m (pressão mínima de ' + UI.num(res.envoltoria.criticoMin.pMin, 1) + ' mca). Veja a aba Perfil.' };
      } else if (!pior && res.envoltoria.criticoMin.pMin < 0) {
        pior = { grave: false, txt: 'Subpressão de ' + UI.num(res.envoltoria.criticoMin.pMin, 1) + ' mca em ' +

  Res.naoIniciado = function (st, ctx, res) {

    return !temDiametro && Math.abs(res.projeto.Hg) < 1e-9;

  Res.coletarAvisos = function (st, ctx, res) {
    var av = [], c = res.projeto, vistos = {};
    function push(t) { if (!vistos[t]) { vistos[t] = 1; av.push(t); } }

    if (Res.naoIniciado(st, ctx, res)) return av;

    c.avisos.forEach(push);

    /* velocidades e perdas fora de faixa em cada trecho */
    var todos = c.succao.map(function (r) { return { r: r, tipo: 'succao' }; })
      .concat(c.recalque.map(function (r) { return { r: r, tipo: 'barrilete' }; }))
      .concat(c.adutoras.map(function (r) { return { r: r, tipo: 'adutora' }; }));

    todos.forEach(function (x) {
      if (!x.r.tubo || !(x.r.v > 0)) {
        if (!x.r.tubo || !x.r.tubo.item || !x.r.conj.itemRot) push(x.r.rot + ': diâmetro ainda não escolhido.');
        return;
      }
      var crit = PDA.C.criterioDe(st, ctx, x.tipo);
      var cl = PDA.C.classificar(x.r.v, x.r.J, crit);
      if (cl.classe === 'ruim') push(x.r.rot + ': ' + cl.motivos.join('; ') + '.');
    });

    /* autolimpeza com uma bomba */
    if (ctx.familiaCriterio === 'esgoto' && res.cenarios.length) {
      var c1 = res.cenarios[0];
      c1.adutoras.concat(c1.recalque).forEach(function (r) {
        if (!r.tubo || !(r.v > 0)) return;
        var crit = PDA.C.criterioDe(st, ctx, r.conj.tipo || 'adutora');
        if (r.v < crit.vMin) {

    if (c.npshd !== null && c.npshd < 3) {

  Res.svgPerfil = function (st, ctx, res) {
    var L = 0, pontos = [], cotaMin = Infinity, cotaMax = -Infinity;
    var nsMin = Number(st.cotas.nivelSuccaoMin) || 0;
    var hglAtual = nsMin + res.projeto.Hm;
    var hInterno = 0;
    res.projeto.recalque.forEach(function (r) { hInterno += r.htotal; });
    hglAtual -= hInterno;

    pontos.push({ x: 0, cota: nsMin, hgl: hglAtual });
    cotaMin = Math.min(cotaMin, nsMin); cotaMax = Math.max(cotaMax, hglAtual);

    res.projeto.adutoras.forEach(function (r, i) {
      var a = st.adutoras[i] || {};
      L += r.L;
      hglAtual -= r.htotal;
      var cota = a.usarCotas ? (Number(a.cotaFim) || 0) : nsMin;
      pontos.push({ x: L, cota: cota, hgl: hglAtual });
      cotaMin = Math.min(cotaMin, cota); cotaMax = Math.max(cotaMax, hglAtual, cota);
    });

    if (!(L > 0)) return h('p', { class: 'vazio' }, 'Informe a extensão dos trechos para desenhar o perfil.');

    var W = 900, Hh = 300, mE = 54, mD = 16, mT = 14, mB = 34;
    var faixa = Math.max(1, cotaMax - cotaMin);
    var pad = faixa * 0.1;
    var yMin = cotaMin - pad, yMax = cotaMax + pad;
    function px(x) { return mE + x / L * (W - mE - mD); }
    function py(c) { return mT + (yMax - c) / (yMax - yMin) * (Hh - mT - mB); }

    var terreno = pontos.map(function (p) { return px(p.x) + ',' + py(p.cota); }).join(' ');
    var lp = pontos.map(function (p) { return px(p.x) + ',' + py(p.hgl); }).join(' ');

    var i, nDiv = 5;

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
    svg.setAttribute('class', 'perfil');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    function sv(tag, attrs, txt) {
      var e = document.createElementNS('http://www.w3.org/2000/svg', tag), k;
      for (k in attrs) if (attrs[k] !== null) e.setAttribute(k, attrs[k]);
      if (txt !== undefined) e.textContent = txt;
      return e;
    }
    for (i = 0; i <= nDiv; i++) {
      var cc = yMin + (yMax - yMin) * i / nDiv;
      svg.appendChild(sv('line', { class: 'grade-l', x1: mE, x2: W - mD, y1: py(cc), y2: py(cc) }));
      svg.appendChild(sv('text', { x: mE - 5, y: py(cc) + 3, 'text-anchor': 'end' }, UI.num(cc, 1)));
    }
    pontos.forEach(function (p, k) {
      svg.appendChild(sv('line', { class: 'grade-l', x1: px(p.x), x2: px(p.x), y1: mT, y2: Hh - mB }));
      svg.appendChild(sv('text', {
        x: px(p.x), y: Hh - mB + 14,
        'text-anchor': k === 0 ? 'start' : (k === pontos.length - 1 ? 'end' : 'middle')
      }, UI.num(p.x, 0)));
    });
    svg.appendChild(sv('polyline', { class: 'terreno', points: terreno }));
    svg.appendChild(sv('polyline', { class: 'lp', points: lp }));
    svg.appendChild(sv('text', { x: mE + 4, y: mT + 11 }, 'Linha piezométrica'));
    svg.appendChild(sv('text', { x: W - mD, y: Hh - 4, 'text-anchor': 'end' }, 'distância (m)'));
    svg.appendChild(sv('text', { x: 4, y: mT + 9 }, 'cota (m)'));

    return h('div', {},
      svg,
      h('p', { class: 'nota', style: 'margin-top:5px' },
        'Linha cheia fina: perfil do terreno pelas cotas informadas. Linha azul: linha piezométrica ' +
        'a partir da saída da elevatória, descontando as perdas de cada trecho. ' +
        'A distância vertical entre as duas é a pressão disponível.'));
  };

    return UI.cartao('Transitório hidráulico — pré-avaliação',

                 { rot: 'ψ', dica: 'Coeficiente de ancoragem longitudinal, do caso escolhido na aba Adutora. ψ = 1 para tubo com juntas de dilatação; 1 − ν/2 ancorado só a montante; 1 − ν² ancorado em todo o comprimento (o caso mais desfavorável).' },
                 'e (mm)', 'v (m/s)',
                 { rot: 'Celeridade (m/s)', dica: 'a = 1/√[ρ(1/K + ψD/(eE))], com K = 2,19 GPa para a água. Quanto mais rígido o tubo, maior a celeridade e maior a sobrepressão.' },
                 { rot: 'tc = 2L/a (s)', dica: 'Tempo crítico: o tempo que a onda leva para ir até a extremidade e voltar. Se a manobra for mais rápida que isso, vale a sobrepressão integral de Joukowsky.' },
                 'Manobra', 'Δh Joukowsky', 'Δh Michaud', 'Δh adotado (mca)',
                 { rot: 'p máx. (mca)', dica: 'Hm + Δh — o que a classe de pressão do tubo tem de suportar.' },
                 { rot: 'p mín. (mca)', dica: 'Hm − Δh. Valor negativo indica subpressão na elevatória, com risco de cavitação e de entrada de ar.' },
                 'PN (mca)', 'Situação'], linhas),
      h('div', { class: 'aviso' },
        h('b', {}, 'Como este resultado é obtido, e até onde ele vale'),
        h('p', { style: 'margin:0 0 5px' },
          'Passo 1 — celeridade da onda no tubo escolhido: a = 1/√[ρ(1/K + ψ·D/(e·E))], com K = 2,19 GPa da água, ' +
          'E e ν do material, e ψ do caso de ancoragem selecionado. Passo 2 — tempo crítico tc = 2L/a. ' +
          'Passo 3 — se o tempo de manobra informado é menor que tc, a manobra é rápida e a sobrepressão é a de ' +
          'Joukowsky, Δh = a·Δv/g, com Δv igual à velocidade de regime (parada total do escoamento). ' +
          'Se é maior, aplica-se a fórmula de manobra lenta de Michaud/Allievi, Δh = 2·L·v/(g·t), e o programa ' +
          'adota o menor dos dois. Passo 4 — a pressão de conferência é Hm ± Δh.'),
        h('p', { style: 'margin:0' },
          'É a tubulação NUA: não há tanque de alívio, chaminé de equilíbrio, válvula antecipadora de onda, ' +
          'ventosa de duplo efeito nem volante de inércia. Também não há integração das equações do transitório ' +
          'pelo método das características, nem reflexão de ondas nas mudanças de diâmetro e material, nem ' +
          'modelagem da separação e do retorno da coluna líquida. Serve para saber se a classe de pressão tem ' +
          'folga e se o transitório é crítico o suficiente para exigir estudo específico — e, se estourar, o ' +

    function z(n) { return (n < 10 ? '0' : '') + n; }
    return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear() +

      if (c === 'salvoEm') {

        return desc ? String(vb).localeCompare(String(va)) : String(va).localeCompare(String(vb));
      }
      va = String(va || '').toLowerCase();
      vb = String(vb || '').toLowerCase();

            'Recomeçar com o projeto padrão'))));

  /* No papel um <select> aparece cortado na largura da caixa. Ao lado de cada
