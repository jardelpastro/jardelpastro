<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloco de Ancoragem — pré-dimensionamento</title>
<meta name="description" content="Pré-dimensionamento de adutoras e linhas de recalque de água e esgoto por Hazen-Williams e Colebrook-White.">
<style>/* ==================================================================
   Pré-dimensionamento de Adutora / Linha de Recalque
   ================================================================== */

:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --border: #d6dde6;
  --border-forte: #b3bdca;
  --texto: #1b2733;
  --texto-2: #5b6875;
  --texto-3: #8a97a4;
  --azul: #0E2148;            /* navy da marca */
  --azul-claro: #e7ecf4;
  --azul-escuro: #060f24;
  --teal: #0E6F66;            /* teal da marca */
  --teal-claro: #e2f4f2;
  --teal-vivo: #14A5A0;
  --verde: #0f7b3f;
  --verde-bg: #e4f4ea;
  --ambar: #8a5a00;
  --ambar-bg: #fff3d4;
  --vermelho: #a8231f;
  --vermelho-bg: #fdeaea;
  --sombra: 0 1px 2px rgba(16, 30, 46, .06), 0 2px 8px rgba(16, 30, 46, .05);
  --r: 6px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}

[data-tema="escuro"] {
  --bg: #12171d;
  --surface: #1a2129;
  --surface-2: #202832;
  --border: #2e3945;
  --border-forte: #3d4a59;
  --texto: #e6ebf0;
  --texto-2: #a4b1bf;
  --texto-3: #76838f;
  --azul: #7fb2e8;
  --azul-claro: #17253c;
  --azul-escuro: #a9cdf5;
  --teal: #35c3ba;
  --teal-claro: #10302e;
  --teal-vivo: #3ad2c8;
  --verde: #56c98a;
  --verde-bg: #14301f;
  --ambar: #e0b050;
  --ambar-bg: #33260c;
  --vermelho: #f0837f;
  --vermelho-bg: #351717;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--texto);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0 0 .6em; }
a { color: var(--azul); }

/* ---------------- estrutura ---------------- */

header.topo {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 40;
}
header.topo .marca { display: flex; align-items: center; gap: 13px; min-width: 0; }
header.topo h1 { font-size: 15px; letter-spacing: -.2px; }
header.topo h1 .sub { display: block; font-size: 11px; font-weight: 400; color: var(--texto-3); letter-spacing: .3px; }
header.topo .versao { font-size: 11px; color: var(--texto-3); }

.marca-bloco { display: flex; align-items: center; gap: 9px; color: var(--azul); }
[data-tema="escuro"] .marca-bloco { color: #cfe0f5; }
.marca-simbolo { display: block; line-height: 0; }
/* qualquer logo cabe na mesma caixa: comprida encolhe pela largura,
   alta encolhe pela altura, e nunca distorce nem empurra o cabeçalho */
.marca-moldura { display: flex; align-items: center; justify-content: flex-start; overflow: hidden; }
.marca-img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
.marca-bloco.marca-vazia { display: none; }
.marca-nome { display: flex; flex-direction: column; line-height: 1; font-family: Georgia, "Times New Roman", serif; }
.marca-nome b { font-size: 19px; letter-spacing: .5px; color: var(--azul); }
.marca-nome i { font-size: 10.5px; font-style: normal; letter-spacing: 1.6px; color: var(--teal); font-weight: 600; }
[data-tema="escuro"] .marca-nome b { color: #cfe0f5; }
.marca-divisoria { width: 1px; align-self: stretch; background: var(--border); margin: 2px 3px; }
header.topo .acoes { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

nav.abas {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  position: sticky;
  top: 51px;
  z-index: 39;
}
nav.abas button {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 13px;
  font: inherit;
  font-weight: 500;
  color: var(--texto-2);
  cursor: pointer;
  white-space: nowrap;
}
nav.abas button:hover { color: var(--texto); background: var(--surface-2); }
nav.abas button[aria-selected="true"] { color: var(--azul); border-bottom-color: var(--teal-vivo); background: var(--surface-2); }
[data-tema="escuro"] nav.abas button[aria-selected="true"] { color: var(--azul-escuro); }
nav.abas .sep { width: 1px; background: var(--border); margin: 7px 6px; flex: none; }
nav.abas button .marcador {
  display: inline-block; min-width: 16px; height: 16px; line-height: 16px; margin-left: 6px;
  border-radius: 8px; background: var(--ambar); color: #fff; font-size: 10.5px; font-weight: 700;
  text-align: center; padding: 0 4px; vertical-align: 1px;
}

main { max-width: 1500px; margin: 0 auto; padding: 16px; }

/* faixa de resumo fixa logo abaixo das abas */
.faixa-fixa {
  position: sticky;
  top: var(--topo-h, 100px);
  z-index: 37;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px 9px;
  display: none;
}
.faixa-fixa.ativa { display: block; }
.faixa-fixa .interno { max-width: 1500px; margin: 0 auto; }
.faixa-fixa .faixa-resumo { margin: 0; }

#cabecalho-impressao { display: none; }
.somenteimprime { display: none; }
.valor-impresso { display: none; }

.faixa-resumo {
  display: flex; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 10px 12px; margin-bottom: 14px;
  box-shadow: var(--sombra);
}
.chip { display: flex; flex-direction: column; gap: 1px; min-width: 92px; }
.chip .rot { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-3); }
.chip .val { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.forte { padding: 2px 11px 3px; border-left: 3px solid var(--teal-vivo); background: var(--teal-claro); border-radius: 0 4px 4px 0; }
.chip.forte .val { font-size: 18px; }
.chip.alerta { padding: 2px 11px 3px; border-left: 3px solid var(--vermelho); background: var(--vermelho-bg); border-radius: 0 4px 4px 0; }
.chip .val .sinal { color: var(--vermelho); font-weight: 700; margin-left: 4px; cursor: help; }
.chip .val .sinal.atencao { color: var(--ambar); }
.chip .val small { font-size: 11px; font-weight: 500; color: var(--texto-2); }

/* ---------------- cartões ---------------- */

.cartao {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 14px;
  box-shadow: var(--sombra);
  overflow: hidden;
}
.cartao > .cab {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}
.cartao > .cab::before {
  content: ''; width: 3px; align-self: stretch; margin: -10px 4px -10px -13px;
  background: var(--teal-vivo); flex: none;
}
.cartao.destaque { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal), var(--sombra); }
.cartao.destaque > .cab { background: var(--teal-claro); }
.cartao.neutro > .cab::before { background: var(--border-forte); }
.cartao > .cab h2, .cartao > .cab h3 { font-size: 13.5px; }
.cartao > .cab .sub { font-size: 12px; color: var(--texto-2); font-weight: 400; }
.cartao > .cab .dir { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.cartao > .corpo { padding: 13px; }
.cartao.recolhido > .corpo { display: none; }

.grade { display: grid; gap: 11px 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.grade.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grade.g4 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.linha { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }

/* ---------------- campos ---------------- */

label.campo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
label.campo.chave {
  background: var(--teal-claro); border: 1px solid var(--teal); border-radius: 5px;
  padding: 7px 9px 8px;
}
label.campo.chave > span.rot { color: var(--teal); font-weight: 700; }
[data-tema="escuro"] label.campo.chave > span.rot { color: var(--teal); }
label.campo.chave input { border-color: var(--teal); font-weight: 600; }

label.campo > span.rot {
  font-size: 11.5px; font-weight: 600; color: var(--texto-2);
  display: flex; align-items: center; gap: 5px;
}
label.campo.compacto { max-width: 130px; }

input, select, textarea, button { font: inherit; color: inherit; }
input[type="text"], input[type="number"], select, textarea {
  background: var(--surface);
  border: 1px solid var(--border-forte);
  border-radius: 4px;
  padding: 6px 8px;
  width: 100%;
  min-width: 0;
}
input[type="text"], input[type="number"] { font-variant-numeric: tabular-nums; }
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--azul); outline-offset: -1px; border-color: var(--azul);
}
input.num { text-align: right; }
input:disabled, select:disabled { background: var(--surface-2); color: var(--texto-3); }
input.editado, select.editado { border-color: var(--ambar); background: var(--ambar-bg); }
textarea { resize: vertical; min-height: 54px; }
.par-unid { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
.par-unid select { width: auto; }

label.check { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
label.check input { width: auto; }

button.btn {
  background: var(--surface); border: 1px solid var(--border-forte);
  border-radius: 4px; padding: 6px 11px; cursor: pointer; font-weight: 500;
  white-space: nowrap;
}
button.btn:hover { background: var(--surface-2); border-color: var(--texto-3); }
button.btn.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
button.btn.primario:hover { background: var(--azul-escuro); border-color: var(--azul-escuro); }
[data-tema="escuro"] button.btn.primario { background: var(--teal); border-color: var(--teal); color: #06231f; }
button.btn.teal { background: var(--teal); border-color: var(--teal); color: #fff; }
button.btn.teal:hover { filter: brightness(1.12); }
button.btn.perigo:hover { background: var(--vermelho-bg); border-color: var(--vermelho); color: var(--vermelho); }
button.btn.mini { padding: 3px 7px; font-size: 12px; }
button.btn.icone { padding: 3px 7px; line-height: 1; }

.dica {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--azul-claro); color: var(--azul);
  font-size: 10px; font-weight: 700; cursor: help; border: none; flex: none;
}
.dica:hover { background: var(--azul); color: #fff; }

/* ---------------- tabelas ---------------- */

.rolagem { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--border); }
th { background: var(--surface-2); font-weight: 600; font-size: 11.5px; color: var(--texto-2); white-space: nowrap; position: relative; }
th:first-child, td:first-child { text-align: left; }
th.esq, td.esq { text-align: left; }
th.ordenavel { cursor: pointer; user-select: none; }
th.ordenavel:hover { color: var(--azul); background: var(--azul-claro); }
th .seta { color: var(--teal); }
td { font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--surface-2); }
tfoot td { font-weight: 600; background: var(--surface-2); border-top: 2px solid var(--border-forte); }
table.enxuta th, table.enxuta td { padding: 3px 6px; }

tr.bom     td:first-child { box-shadow: inset 3px 0 var(--verde); }
tr.atencao td:first-child { box-shadow: inset 3px 0 var(--ambar); }
tr.ruim    td:first-child { box-shadow: inset 3px 0 var(--vermelho); }
tr.bom     { background: var(--verde-bg); }
tr.atencao { background: var(--ambar-bg); }
tr.ruim    { background: var(--vermelho-bg); }
tr.bom:hover, tr.atencao:hover, tr.ruim:hover { filter: brightness(.97); }
tr.selecionada { outline: 2px solid var(--azul); outline-offset: -2px; }
tr.selecionada td { font-weight: 600; }

.tag {
  display: inline-block; padding: 1px 6px; border-radius: 9px;
  font-size: 10.5px; font-weight: 600; white-space: nowrap;
}
.tag.bom { background: var(--verde-bg); color: var(--verde); border: 1px solid var(--verde); }
.tag.atencao { background: var(--ambar-bg); color: var(--ambar); border: 1px solid var(--ambar); }
.tag.ruim { background: var(--vermelho-bg); color: var(--vermelho); border: 1px solid var(--vermelho); }
.tag.neutro { background: var(--azul-claro); color: var(--azul); border: 1px solid var(--azul); }
.tag.cinza { background: var(--surface-2); color: var(--texto-2); border: 1px solid var(--border-forte); }

.aviso {
  border-left: 3px solid var(--ambar); background: var(--ambar-bg);
  padding: 8px 11px; border-radius: 0 4px 4px 0; font-size: 12.5px; margin: 8px 0;
  color: var(--texto);
}
.aviso.erro { border-color: var(--vermelho); background: var(--vermelho-bg); }
.aviso.ok { border-color: var(--verde); background: var(--verde-bg); }
.aviso.info { border-color: var(--azul); background: var(--azul-claro); }
.aviso b { display: block; margin-bottom: 2px; }
.aviso ul { margin: 4px 0 0; padding-left: 18px; }

.vazio { color: var(--texto-3); font-size: 13px; text-align: center; padding: 18px; font-style: italic; }
.nota { font-size: 11.5px; color: var(--texto-2); line-height: 1.45; }
.nota-fonte { font-size: 11px; color: var(--texto-3); }
.mono { font-family: var(--mono); font-size: 12px; }

/* ---------------- listas de peças ---------------- */

.pecas-tab select { padding: 3px 5px; font-size: 12.5px; }
.pecas-tab input { padding: 3px 5px; font-size: 12.5px; }
.pecas-tab td { padding: 3px 5px; }
.pecas-tab .col-qtd { width: 74px; }
.pecas-tab .col-k { width: 88px; }
.pecas-tab .col-di { width: 104px; }
.pecas-tab .col-dn { width: 168px; }
.pecas-tab .col-dn select { max-width: 168px; }
.pecas-tab .col-x { width: 32px; }
.pecas-tab .col-mover { width: 74px; white-space: nowrap; }

tr.arrastavel .alca {
  display: inline-block; cursor: grab; color: var(--texto-3); font-size: 14px;
  padding: 0 3px; user-select: none; line-height: 1;
}
/* dentro dos campos o gesto é seleção de texto, nunca arraste */
tr.arrastavel input, tr.arrastavel select, tr.arrastavel textarea,
.conjunto.arrastavel input, .conjunto.arrastavel select, .conjunto.arrastavel textarea {
  -webkit-user-drag: none; user-select: text;
}
tr.arrastavel .alca:active { cursor: grabbing; }
tr.arrastavel:hover .alca { color: var(--teal); }
tr.arrastando { opacity: .45; }
tr.alvo-acima td { box-shadow: inset 0 2px 0 var(--teal-vivo); }
tr.alvo-abaixo td { box-shadow: inset 0 -2px 0 var(--teal-vivo); }
.col-mover button { padding: 1px 5px; line-height: 1.2; }
.col-mover button:disabled { opacity: .3; cursor: default; }

/* cabeçalho de conjunto arrastável (trechos) */
.conjunto.arrastavel > .cab-conj .alca {
  cursor: grab; color: var(--texto-3); font-size: 15px; padding: 0 2px; user-select: none;
}
.conjunto.arrastando { opacity: .45; }
.conjunto.alvo-acima { box-shadow: inset 0 3px 0 var(--teal-vivo); }
.conjunto.alvo-abaixo { box-shadow: inset 0 -3px 0 var(--teal-vivo); }

/* ---------------- conjuntos / trechos ---------------- */

.conjunto { border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 11px; background: var(--surface); }
.conjunto > .cab-conj {
  display: flex; align-items: center; gap: 9px; padding: 8px 11px;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  border-radius: var(--r) var(--r) 0 0;
}
.conjunto > .cab-conj input.titulo {
  border: 1px solid transparent; background: transparent; font-weight: 600; width: auto; flex: 1;
}
.conjunto > .cab-conj input.titulo:hover { border-color: var(--border-forte); }
.conjunto > .corpo-conj { padding: 11px; }
.conjunto.desativado > .corpo-conj { display: none; }
.conjunto.desativado > .cab-conj { opacity: .6; border-radius: var(--r); border-bottom: none; }

.subtitulo {
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  color: var(--texto-3); margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--border);
}
.subtitulo:first-child { margin-top: 0; }

/* ---------------- esquemas explicativos ---------------- */

.esquema { width: 100%; max-width: 760px; height: auto; display: block; margin: 4px auto 2px; }
.esquema text { font-size: 9.5px; fill: var(--texto-2); font-family: inherit; }
.esquema text.rotulo { font-weight: 700; fill: var(--azul); }
[data-tema="escuro"] .esquema text.rotulo { fill: var(--azul-escuro); }
.esquema .agua { fill: var(--teal-vivo); opacity: .28; }
.esquema .agua-l { stroke: var(--teal); stroke-width: 1.2; fill: none; }
.esquema .estrutura { stroke: var(--texto-2); stroke-width: 1.4; fill: none; }
.esquema .terreno { stroke: var(--texto-3); stroke-width: 1.2; fill: none; stroke-dasharray: 3 2; }
.esquema .tubo { stroke: var(--azul); stroke-width: 2.6; fill: none; }
[data-tema="escuro"] .esquema .tubo { stroke: var(--azul-escuro); }
.esquema .cota { stroke: var(--vermelho); stroke-width: .9; }
.esquema .cota-t { fill: var(--vermelho); font-weight: 600; }
.esquema .bomba { fill: var(--teal); stroke: var(--azul); stroke-width: 1.2; }

.caixa-esquema {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r);
  padding: 9px 11px; margin: 4px 0 11px;
}
.caixa-esquema > .tit {
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  color: var(--texto-3); margin-bottom: 4px; display: flex; align-items: center; gap: 7px;
}
.caixa-esquema.recolhida svg, .caixa-esquema.recolhida .leg { display: none; }
.caixa-esquema .leg { font-size: 11.5px; color: var(--texto-2); margin-top: 5px; }

/* ---------------- perfil piezométrico ---------------- */

.perfil { width: 100%; height: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; }
.perfil text { font-size: 10px; fill: var(--texto-2); font-family: inherit; }
.perfil .terreno { fill: none; stroke: var(--texto-2); stroke-width: 1.5; }
.perfil .lp { fill: none; stroke: var(--azul); stroke-width: 2; }
.perfil .lps { fill: none; stroke: var(--vermelho); stroke-width: 1.5; stroke-dasharray: 5 3; }
.perfil .grade-l { stroke: var(--border); stroke-width: .5; }

/* ---------------- modal ---------------- */

.fundo-modal {
  position: fixed; inset: 0; background: rgba(12, 20, 30, .55);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; z-index: 100; overflow-y: auto;
}
.modal {
  background: var(--surface); border-radius: 8px; max-width: 780px; width: 100%;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .3); border: 1px solid var(--border);
}
.modal > .cab { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--border); }
.modal > .cab h3 { font-size: 15px; }
.modal > .cab button { margin-left: auto; }
.modal > .corpo { padding: 16px; max-height: 70vh; overflow-y: auto; }
.modal > .pe { padding: 11px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--texto); color: var(--bg); padding: 9px 16px; border-radius: 20px;
  font-size: 13px; z-index: 200; box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
}

/* ---------------- escolha da logo ---------------- */

.previa-logo { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0; }
.previa-timbrado { margin-top: 8px; }
.timb-folha {
  position: relative; width: 132px; aspect-ratio: 210 / 297; margin: 0 0 7px;
  border: 1px solid var(--borda); background: #fff; overflow: hidden;
}
.timb-folha img { width: 100%; height: 100%; object-fit: fill; display: block; }

/* ==================================================================
   Memorial: documento paginado
   ================================================================== */

/* ------------------------------------------------------------------
   Memorial em A4, formatado conforme a ABNT (NBR 14724, 6024, 6027,
   6023 e 10520), com uma exceção pedida pelo usuário: entrelinhas 1,2
   no lugar de 1,5.
   ------------------------------------------------------------------ */
.doc {
  font-family: Arial, Helvetica, sans-serif;
  color: #000;
  font-size: 12pt;
  line-height: 1.2;
}
.doc-medidor { position: absolute; left: -20000px; top: 0; visibility: hidden; }

.doc .pagina {
  width: 210mm;
  height: 297mm;
  background: #fff;
  margin: 0 auto 10mm;
  box-shadow: 0 2px 10px rgba(16, 30, 46, .18);
  /* margens ABNT: 3 cm em cima e à esquerda, 2 cm embaixo e à direita */
  padding: 30mm 20mm 20mm 30mm;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}
/* timbrado do escritório, quando carregado */
.doc .pagina .pag-timbrado {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: fill; z-index: 0;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.doc .pagina > .pag-corpo, .doc .pagina > .doc-capa { position: relative; z-index: 1; }

/* número da página: canto superior direito, a 2 cm da borda (NBR 14724) */
.doc .pag-num {
  position: absolute; top: 20mm; right: 20mm; z-index: 2;
  font-size: 10pt; color: #000; line-height: 1;
}
.doc .pag-corpo { flex: 1 1 auto; overflow: hidden; }
.doc .pag-corpo > * { margin-top: 0 !important; margin-bottom: 0 !important; }

/* --- títulos (NBR 6024): indicativo, um espaço, título --- */
.doc .doc-h1 {
  font-size: 12pt; font-weight: bold; color: #000; text-transform: uppercase;
  margin: 0; padding: 0 0 8pt; text-align: left;
}
.doc .doc-h1-frente { text-align: center; padding-bottom: 12pt; }
.doc .doc-h2 {
  font-size: 12pt; font-weight: bold; color: #000;
  margin: 0; padding: 10pt 0 6pt;
}
.doc .doc-h3 {
  font-size: 12pt; font-weight: normal; font-style: italic; color: #000;
  margin: 0; padding: 8pt 0 5pt;
}

/* --- texto --- */
.doc .doc-p {
  margin: 0; padding-bottom: 6pt; text-align: justify;
  text-indent: 12.5mm;                      /* recuo de primeira linha */
  hyphens: auto;
}
.doc .doc-p.sem-recuo { text-indent: 0; }
.doc .doc-alineas { margin: 0; padding: 0 0 6pt 12.5mm; list-style: none; }
.doc .doc-alineas li { text-align: justify; padding: 0 0 3pt 6mm; text-indent: -6mm; }
.doc .doc-nota { font-size: 10pt; margin: 0; padding-bottom: 6pt; text-align: justify; }
.doc .doc-ref {
  margin: 0; padding-bottom: 11pt; text-align: left; font-size: 12pt;
  line-height: 1.0;                          /* referências em espaço simples */
}

/* --- equações: centralizadas, com o número entre parênteses à direita --- */
.doc .doc-formula {
  margin: 0; padding: 8pt 0; display: flex; align-items: center; gap: 6mm;
}
.doc .doc-formula .formula-corpo { flex: 1 1 auto; text-align: center; }
.doc .doc-formula .formula-num { flex: none; font-size: 12pt; }
.doc .formula-svg { max-width: 100%; height: auto; vertical-align: middle; }
.doc .formula-leg { font-size: 12pt; margin: 0; padding: 0 0 6pt; text-align: justify; }
.doc .doc-aplicacao { margin: 0; padding: 4pt 0 8pt 12.5mm; }

/* --- ilustrações e tabelas --- */
.doc .doc-quadro { margin: 0; padding: 6pt 0 10pt; }
.doc .doc-cap-tab, .doc .doc-cap-fig {
  font-size: 10pt; font-weight: bold; text-align: left; margin-bottom: 3pt;
}
.doc .doc-fonte { font-size: 10pt; text-align: left; margin-top: 3pt; }
.doc .doc-fig { text-align: center; }
.doc .doc-fig svg, .doc .doc-fig img { max-width: 100%; height: auto; }

/* tabela no padrão IBGE/ABNT: fechada em cima e embaixo, sem traços
   verticais; largura total da mancha; corpo 10 pt; linhas de 0,6 cm */
.doc .doc-tabela {
  border-collapse: collapse; width: 100%; font-size: 10pt;
  border-top: 1pt solid #000; border-bottom: 1pt solid #000;
}
.doc .doc-tabela th, .doc .doc-tabela td {
  border: 0; padding: 1.6mm 2mm; text-align: right; height: 6mm;
  vertical-align: middle; line-height: 1.15;
}
.doc .doc-tabela thead th {
  border-bottom: .75pt solid #000; font-weight: bold; text-align: center;
  background: transparent; color: #000;
}
.doc .doc-tabela td.esq, .doc .doc-tabela th.esq { text-align: left; }
.doc .doc-tabela tr.total td { font-weight: bold; border-top: .75pt solid #000; }
.doc .doc-tabela tr.destaque td { background: #ececec;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.doc .doc-tabela td, .doc .doc-tabela th { color: #000; }

/* --- sumário e listas (NBR 6027) --- */
.doc .doc-sum {
  display: flex; align-items: baseline; gap: 4px; margin: 0;
  padding: 3pt 0; font-size: 12pt;
}
.doc .doc-sum.nivel1 { font-weight: bold; text-transform: uppercase; }
.doc .doc-sum.nivel2 { padding-left: 8mm; }
.doc .sum-pts { flex: 1 1 auto; border-bottom: 1px dotted #555; height: .8em; }
.doc .sum-pag { flex: none; font-variant-numeric: tabular-nums; }

/* --- capa --- */
.doc .pagina-capa { padding: 30mm 20mm 20mm 30mm; }
.doc .doc-capa { display: flex; flex-direction: column; height: 100%; text-align: center; }
.doc .capa-topo { display: flex; justify-content: center; }
.doc .capa-meio { margin-top: 38mm; }
.doc .capa-tipo {
  text-transform: uppercase; letter-spacing: 2px; font-size: 12pt; font-weight: bold;
}
.doc .capa-titulo { font-size: 16pt; font-weight: bold; margin: 10mm 0 5mm; line-height: 1.3; }
.doc .capa-sub { font-size: 12pt; }
.doc .capa-linha { width: 60mm; height: 1pt; background: #000; margin: 8mm auto 0; }
.doc .capa-dados { margin-top: auto; font-size: 12pt; line-height: 1.6; }
.doc .capa-rodape { margin-top: 10mm; font-size: 10pt; }

.visor-doc {
  background: #48525e; background: #48525e; padding: 10mm 0;
  max-height: 62vh; overflow: auto; border-radius: 4px;
}
.visor-doc .doc { transform: scale(.62); transform-origin: top center; }
.visor-doc #doc-saida { width: 210mm; margin: 0 auto; }

#doc-saida { display: none; }
html.imprimindo-doc #doc-saida { display: block; }

@media print {
  html.imprimindo-doc body > * { display: none !important; }
  html.imprimindo-doc #doc-saida { display: block !important; }
  html.imprimindo-doc #cabecalho-impressao { display: none !important; }
  html.imprimindo-doc { background: #fff; }
  html.imprimindo-doc .doc .pagina {
    box-shadow: none; margin: 0; page-break-after: always; break-after: page;
  }
  html.imprimindo-doc .doc .pagina:last-child { page-break-after: auto; break-after: auto; }
}

/* ---------------- blocos de ancoragem ---------------- */
.blocos-vias { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; }

<script>window.PDA_BLOCO = true;
/* ===== 00-marca.js ===== */
/* ------------------------------------------------------------------
 * Identidade visual: marca no cabeçalho.
 *
 * O símbolo abaixo é uma reprodução em SVG (engrenagem + gota + onda).
 * Para usar o arquivo oficial da logo, o botão "Logo" no cabeçalho
 * carrega uma imagem PNG/JPG/SVG, que fica gravada no navegador como
 * data URI e passa a ser usada no lugar do desenho — inclusive na
 * impressão do memorial.
 * ------------------------------------------------------------------ */
(function (PDA) {
  'use strict';

  var M = {};
  var LS_LOGO = 'pda.logo.v1';
  var LS_MODO = 'pda.logo.modo.v1';
  var SVG_NS = 'http://www.w3.org/2000/svg';

  /* Caixa em que qualquer logo tem de caber, na tela e no papel. A imagem é
     ajustada por object-fit: contain, então uma logo comprida encolhe pela
     largura e uma logo alta encolhe pela altura — nas duas situações ela cabe
     inteira, sem distorcer e sem empurrar o resto do cabeçalho. */
  M.CAIXA = { larguraTela: 250, larguraImpressao: 210, alturaTela: 46, alturaCapa: 96 };

  M.cores = {
    navy: '#0E2148',
    navy2: '#16305F',
    teal: '#14A5A0',
    tealEscuro: '#0E6F66',
    verdeTeal: '#1A6B5A'
  };

  function sv(tag, attrs, filho) {
    var e = document.createElementNS(SVG_NS, tag), k;
    for (k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    if (filho) (Array.isArray(filho) ? filho : [filho]).forEach(function (f) { e.appendChild(f); });
    return e;
  }

  /* símbolo: engrenagem envolvendo uma gota com onda */
  M.simbolo = function (alturaPx) {
    var svg = sv('svg', {
      viewBox: '0 0 120 124', width: alturaPx * 120 / 124, height: alturaPx,
      role: 'img', 'aria-label': 'Pastro Engenharia'
    });

    var defs = sv('defs');
    var grad = sv('linearGradient', { id: 'pdaOnda', x1: '0', y1: '1', x2: '1', y2: '0' });
    grad.appendChild(sv('stop', { offset: '0', 'stop-color': M.cores.tealEscuro }));
    grad.appendChild(sv('stop', { offset: '1', 'stop-color': '#1FC6BE' }));
    defs.appendChild(grad);
    var clip = sv('clipPath', { id: 'pdaGota' });
    clip.appendChild(sv('path', { d: 'M60 22 C60 22 88 58 88 76 A28 28 0 1 1 32 76 C32 58 60 22 60 22 Z' }));
    defs.appendChild(clip);
    svg.appendChild(defs);

    /* engrenagem: anel + dentes */
    var g = sv('g', { fill: 'none', stroke: 'currentColor', 'stroke-width': 8,
                      'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
    var i, ang, dentes = 10;
    for (i = 0; i < dentes; i++) {
      ang = -90 + (360 / dentes) * i;
      if (ang > -140 && ang < -40) continue;            /* abertura no topo, para a gota */
      g.appendChild(sv('rect', {
        x: 54, y: 6, width: 12, height: 16, rx: 2,
        transform: 'rotate(' + (ang + 90) + ' 60 70)'
      }));
    }
    g.appendChild(sv('circle', { cx: 60, cy: 70, r: 48 }));
    svg.appendChild(g);

    /* gota */
    svg.appendChild(sv('path', {
      d: 'M60 22 C60 22 88 58 88 76 A28 28 0 1 1 32 76 C32 58 60 22 60 22 Z',
      fill: 'var(--surface)', stroke: 'currentColor', 'stroke-width': 8, 'stroke-linejoin': 'round'
    }));

    /* onda dentro da gota */
    svg.appendChild(sv('path', {
      d: 'M32 82 C42 74 52 88 64 84 C74 81 82 74 88 68 L88 84 A28 28 0 0 1 34 92 Z',
      fill: 'url(#pdaOnda)', 'clip-path': 'url(#pdaGota)'
    }));

    return svg;
  };

  /* marca completa para o cabeçalho.
     op: { altura, larguraMax, semTexto } */
  M.marca = function (alturaPx, op) {
    op = op || {};
    var modo = M.modo();
    var caixa = document.createElement('div');
    caixa.className = 'marca-bloco';
    if (modo === 'nenhuma') { caixa.className += ' marca-vazia'; return caixa; }

    var alt = alturaPx || 38;
    var larg = op.larguraMax || M.CAIXA.larguraTela;

    if (modo === 'usuario') {
      var logo = M.logoGravada();
      if (logo) {
        var moldura = document.createElement('span');
        moldura.className = 'marca-moldura';
        moldura.style.height = alt + 'px';
        moldura.style.maxWidth = larg + 'px';
        var img = document.createElement('img');
        img.src = logo;
        img.alt = 'Logo';
        img.className = 'marca-img';
        moldura.appendChild(img);
        caixa.appendChild(moldura);
        return caixa;
      }
    }

    var simb = document.createElement('span');
    simb.className = 'marca-simbolo';
    simb.appendChild(M.simbolo(alt));
    caixa.appendChild(simb);

    if (!op.semTexto) {
      var txt = document.createElement('span');
      txt.className = 'marca-nome';

/* ------------------------------------------------------------------
 * Núcleo hidráulico
 *
 * Unidades internas: Q [m³/s], D [m], L [m], v [m/s], J [m/m], h [m]
 *
 * Referências das formulações estão em PDA.H.fontes
 * ------------------------------------------------------------------ */
(function (PDA) {
  'use strict';

  var H = {};

  H.g = 9.80665;               /* m/s²  – aceleração da gravidade normal */
  H.GAMA_AGUA = 9806.65;       /* N/m³ a 4 °C (peso específico de referência) */

  /* Constantes de Hazen-Williams expostas para ajuste fino do usuário.
     Padrão: J = 10,643 · Q^1,852 · C^-1,852 · D^-4,871  (Azevedo Netto) */

  /* Viscosidade cinemática da água [m²/s] em função da temperatura [°C].
     Correlação de Poiseuille/Helmholtz (forma usual em hidráulica):
       ni = 1,792e-6 / (1 + 0,0337 T + 0,000221 T²) */
  H.viscosidadeAgua = function (T) {
    if (T === undefined || T === null || isNaN(T)) T = 20;
    return 1.792e-6 / (1 + 0.0337 * T + 0.000221 * T * T);

    return pkPa / 9.80665;

  H.velocidade = function (Q, D) { return Q / H.area(D); };

  /* Colebrook-White resolvido iterativamente (ponto fixo amortecido).

  H.fColebrook = function (Re, epsRel) {
    if (!(Re > 0)) return { f: 0, iter: 0, regime: 'nulo' };
    if (Re < 2000) return { f: 64 / Re, iter: 0, regime: 'laminar' };

    var regime = (Re < 4000) ? 'transicao' : 'turbulento';
    /* semente de Swamee-Jain */
    var x = 1 / Math.sqrt(H.fSwameeJain(Re, epsRel));
    var i, xn;
    for (i = 0; i < 60; i++) {
      xn = -2 * Math.log10(epsRel / 3.7 + 2.51 * x / Re);
      if (Math.abs(xn - x) < 1e-12) { x = xn; break; }

     1e-6 <= eps/D <= 1e-2 e 5e3 <= Re <= 1e8 */

    res.bhpCv = etaB > 0 ? res.potUtilCv / etaB : 0;
    res.bhpKw = H.cvParaKW(res.bhpCv);
    res.eletricaKw = st.bombas.usarRendMotor && etaM > 0 ? res.bhpKw / etaM : res.bhpKw;
    var folga = st.bombas.folgaModo === 'auto'
      ? PDA.P.folgaRecomendada(res.bhpCv) : (Number(st.bombas.folgaPct) || 0);
    res.folgaPct = folga;
    res.motorCv = PDA.P.motorComercial(res.bhpCv, folga, st.bombas.motores);
    res.motorKw = H.cvParaKW(res.motorCv);
    res.potTotalCv = res.bhpCv * n;
    res.potTotalKw = res.eletricaKw * n;

    /* --- NPSH disponível --- */
    var eixo = Number(cot.eixoBomba) || 0;
    res.zSuccao = nsMin - eixo;
    res.npshd = H.npshDisponivel(ctx.patm, ctx.pvapor, res.zSuccao, res.hfSuccao + res.hlSuccao);
    if (submersivel) res.npshd = null;

    /* --- avisos --- */
    if (res.Hm <= 0) res.avisos.push('Altura manométrica não positiva — revise cotas e perdas.');
    res.adutoras.concat(res.recalque).forEach(function (r) {
      if (r.regime === 'transicao') {
        res.avisos.push(r.rot + ': escoamento na zona de transição (2000 < Re < 4000) — o fator de atrito é indeterminado nessa faixa.');
      }
      if (r.regime === 'laminar') {
        res.avisos.push(r.rot + ': escoamento laminar (Re < 2000) — Hazen-Williams não é aplicável; usar a fórmula universal.');
      }
    });

    return res;
  };

  /* Cota de partida da adutora: campo próprio ou, em branco, o nível de
     sucção mínimo (a linha piezométrica sai da elevatória) */
  C.cotaPartida = function (st) {
    var c = st.cotas;
    if (c.cotaPartida === null || c.cotaPartida === undefined || c.cotaPartida === '') {
      return Number(c.nivelSuccaoMin) || 0;
    }
    return Number(c.cotaPartida);
  };

  /* ---------------- classificação (cores) ---------------- */

  /* v [m/s], J [m/m] -> {classe:'bom'|'atencao'|'ruim', motivos:[]} */
  /* número no padrão brasileiro, para os motivos saírem legíveis no
     memorial e nas dicas */
  function fmt(v, d) { return Number(v).toFixed(d === undefined ? 2 : d).replace('.', ','); }
  C.fmt = fmt;

  C.classificar = function (v, J, crit) {
    var jKm = J * 1000;
    var motivos = [], classe = 'bom';

    if (!(v > 0)) return { classe: 'na', motivos: ['sem vazão'] };

    if (v < crit.vMin) { classe = 'ruim'; motivos.push('v = ' + fmt(v, 2) + ' m/s abaixo da mínima de ' + fmt(crit.vMin, 2) + ' m/s'); }
    else if (v > crit.vMax) { classe = 'ruim'; motivos.push('v = ' + fmt(v, 2) + ' m/s acima da máxima de ' + fmt(crit.vMax, 2) + ' m/s'); }

    if (jKm > crit.jMax) { classe = 'ruim'; motivos.push('J = ' + fmt(jKm, 2) + ' m/km acima do limite de ' + fmt(crit.jMax, 2) + ' m/km'); }

    if (classe !== 'ruim') {
      var vOk = v >= crit.vBom[0] && v <= crit.vBom[1];
      var jOk = jKm >= crit.jBom[0] && jKm <= crit.jBom[1];
      if (vOk && jOk) { classe = 'bom'; motivos.push('velocidade e perda unitária na faixa recomendada'); }
      else {
        classe = 'atencao';
        if (!vOk) motivos.push('v = ' + fmt(v, 2) + ' m/s fora da faixa recomendada (' + fmt(crit.vBom[0], 2) + ' a ' + fmt(crit.vBom[1], 2) + ' m/s)');
        if (!jOk) motivos.push('J = ' + fmt(jKm, 2) + ' m/km fora da faixa recomendada (' + fmt(crit.jBom[0], 2) + ' a ' + fmt(crit.jBom[1], 2) + ' m/km)');
      }
    }
    return { classe: classe, motivos: motivos };
  };

  /* Classificação de uma carga de pressão contra o PN do tubo E contra os
     limites físicos. Pressão negativa NUNCA é adequada: significa que a linha
     piezométrica passa abaixo da tubulação, o que em regime permanente indica
     que a bomba não entrega carga suficiente para o ponto (ou que as cotas
     estão incoerentes). */
  C.classificarPressao = function (pressao, pnMca, op) {
    op = op || {};
    if (pressao === null || pressao === undefined || isNaN(pressao)) {
      return { classe: 'na', motivos: [] };
    }
    var mot = [];
    /* limite inferior: abaixo de -10 mca a coluna d'água se rompe */
    if (pressao <= -10) {
      mot.push('pressão de ' + fmt(pressao, 2) + ' mca: abaixo do limite físico de vaporização (cerca de −10 mca) — ' +
               (op.transitorio ? 'há separação de coluna neste ponto' : 'a linha piezométrica passa muito abaixo da tubulação, o escoamento previsto é impossível'));
      return { classe: 'ruim', motivos: mot };
    }
    if (pressao < 0) {
      mot.push('pressão negativa de ' + fmt(pressao, 2) + ' mca: a linha piezométrica passa abaixo da tubulação' +
               (op.transitorio ? ' — risco de cavitação e, em tubo de parede fina, de colapso' : ' — reveja as cotas e a altura manométrica'));
      return { classe: 'ruim', motivos: mot };
    }
    var pMin = op.pressaoMinima === undefined ? 0 : op.pressaoMinima;
    if (pressao < pMin) {
      mot.push('pressão de ' + fmt(pressao, 2) + ' mca abaixo da mínima adotada de ' + fmt(pMin, 2) + ' mca');
      return { classe: 'atencao', motivos: mot };
    }
    if (pnMca === null || pnMca === undefined) {
      return { classe: 'na', motivos: ['pressão admissível do tubo não informada'] };
    }
    if (pressao > pnMca) {
      mot.push('pressão de ' + fmt(pressao, 2) + ' mca acima da admissível do tubo (' + fmt(pnMca, 0) + ' mca)');
      return { classe: 'ruim', motivos: mot };
    }
    if (pressao > 0.85 * pnMca) {
      mot.push('pressão de ' + fmt(pressao, 2) + ' mca usa mais de 85 % da admissível do tubo (' + fmt(pnMca, 0) + ' mca)');
      return { classe: 'atencao', motivos: mot };
    }
    mot.push('pressão de ' + fmt(pressao, 2) + ' mca, com folga sobre a admissível de ' + fmt(pnMca, 0) + ' mca');
    return { classe: 'bom', motivos: mot };
  };

  C.criterioDe = function (st, ctx, tipo) {
    var fam = ctx.familiaCriterio;
    var c = (st.criterios[fam] && st.criterios[fam][tipo]) || PDA.P.criterios[fam][tipo];
    return c;
  };

  /* ---------------- varredura de diâmetros ---------------- */

  /* Percorre todos os itens do catálogo do conjunto e devolve a tabela
     comparativa, já classificada, com o item recomendado. */
  C.varrer = function (st, ctx, conj, chave, n) {
    var cat = PDA.CAT.buscar(ctx.cats.todos, conj.catalogoId);
    if (!cat) return { linhas: [], cat: null };
    var tipo = conj.tipo || 'adutora';
    var crit = C.criterioDe(st, ctx, tipo);
    var Q = C.vazaoConjunto(chave.split('.')[0] === 'adutoras' ? 'adutora' : chave.split('.')[0], conj, n, ctx);

    /* vazões extremas para verificar autolimpeza e velocidade máxima */
    var raiz = chave.split('.')[0] === 'adutoras' ? 'adutora' : chave.split('.')[0];
    var Qmin = C.vazaoConjunto(raiz, conj, 1, ctx);
    var Qmax = C.vazaoConjunto(raiz, conj, ctx.nInst, ctx);

    var ecoAtiva = st.economia && st.economia.ativo && tipo === 'adutora';

    var linhas = cat.itens.map(function (it) {
      var r = C.calcConjunto(conj, Q, ctx, it.rot);
      var cl = C.classificar(r.v, r.J, crit);
      var vMin1 = r.tubo.diM > 0 ? H.velocidade(Qmin, r.tubo.diM) : 0;
      var vMaxN = r.tubo.diM > 0 ? H.velocidade(Qmax, r.tubo.diM) : 0;
      var eco = ecoAtiva ? C.custoAnual(st, ctx, cat, it, r.tubo.diMm, r.L, r.htotal, Q) : null;
      return {
        eco: eco,
        item: it, rot: it.rot, diMm: r.tubo.diMm, eMm: r.tubo.eMm, pn: it.pn,
        v: r.v, J: r.J, jKm: r.J * 1000, hf: r.hf, hl: r.hl, htotal: r.htotal,
        Re: r.Re, f: r.f, regime: r.regime, C: r.tubo.C, epsMm: r.tubo.epsMm,
        classe: cl.classe, motivos: cl.motivos,
        vMin1: vMin1, vMaxN: vMaxN,
        autolimpeza: vMin1 >= crit.vMin,
        calc: !!it.calc, verificar: !!it.verificar
      };
    }).filter(function (l) { return l.diMm > 0; });

    /* recomendação: entre os "bons", o de menor diâmetro; se não houver,
       entre os "atenção", o de J mais próximo do centro da faixa boa */
    var alvoJ = (crit.jBom[0] + crit.jBom[1]) / 2;
    var bons = linhas.filter(function (l) { return l.classe === 'bom'; });
    var rec = null;
    if (bons.length) {
      rec = bons.reduce(function (a, b) { return a.diMm <= b.diMm ? a : b; });
    } else {
      var at = linhas.filter(function (l) { return l.classe === 'atencao'; });
      var pool = at.length ? at : linhas;
      if (pool.length) {
        rec = pool.reduce(function (a, b) {
          return Math.abs(a.jKm - alvoJ) <= Math.abs(b.jKm - alvoJ) ? a : b;
        });
      }
    }
    linhas.forEach(function (l) { l.recomendado = !!(rec && l.rot === rec.rot); });

    /* ótimo econômico: menor custo anual total entre os que não são reprovados */
    var eco = null;
    if (ecoAtiva) {
      var cand = linhas.filter(function (l) { return l.classe !== 'ruim' && l.eco; });
      if (!cand.length) cand = linhas.filter(function (l) { return l.eco; });
      if (cand.length) {
        eco = cand.reduce(function (a, b) { return a.eco.anualTotal <= b.eco.anualTotal ? a : b; });
        linhas.forEach(function (l) { l.otimoEconomico = (l.rot === eco.rot); });
      }
    }

    /* diâmetro de Bresse como referência */
    var bresse = { k07: H.bresse(Q, 0.7) * 1000, k10: H.bresse(Q, 1.0) * 1000, k13: H.bresse(Q, 1.3) * 1000 };

    return { linhas: linhas, cat: cat, crit: crit, Q: Q, Qmin: Qmin, Qmax: Qmax,
             recomendado: rec, otimoEconomico: eco, ecoAtiva: ecoAtiva,
             bresse: bresse, tipo: tipo };
  };

  /* ---------------- linha piezométrica e verificação de pressão ---------------- */

  C.piezometrica = function (st, ctx, cen) {
    var nsMin = Number(st.cotas.nivelSuccaoMin) || 0;
    var partida = C.cotaPartida(st);
    var pontos = [];
    var hgl = nsMin + cen.Hm;   /* carga total logo após a bomba */

    /* perdas internas (barriletes) consumidas antes da adutora */
    var hInterno = 0;
    cen.recalque.forEach(function (r) { hInterno += r.htotal; });

    pontos.push({ rot: 'Saída da elevatória', cota: partida, hgl: hgl - hInterno,
                  pressao: hgl - hInterno - partida, trecho: null, pnMca: null, x: 0 });
    hgl -= hInterno;

    var x = 0;
    cen.adutoras.forEach(function (r) {
      var a = r.conj;
      hgl -= r.htotal;
      x += r.L;
      var cf = a.usarCotas ? (Number(a.cotaFim) || 0) : Number(st.cotas.nivelChegada) || 0;
      pontos.push({
        rot: 'Fim de ' + r.rot, cota: cf, hgl: hgl, pressao: hgl - cf,
        trecho: r, usarCotas: !!a.usarCotas, x: x,
        pnMca: C.pnMca(a, r.tubo)
      });
    });

    pontos.forEach(function (p) {
      var cl = C.classificarPressao(p.pressao, p.pnMca);
      p.classe = cl.classe; p.motivos = cl.motivos;
    });
    return pontos;
  };

  /* ---------------- coerência dos dados ----------------
     Devolve a lista de incoerências que o programa não pode resolver sozinho.
     Cada item traz uma ação de correção, aplicável com um clique. */

  /* ---------------- ponto alto da linha ----------------
     O cálculo da bomba usa partida e chegada; um ponto alto no meio pode
     ficar acima da linha piezométrica e governar o dimensionamento. Aqui
     ele é identificado — do perfil, quando lançado, ou do campo manual —
     e a pressão em regime permanente nele é verificada. */
  C.pontoAlto = function (st, ctx, res) {
    var nch = Number(st.cotas.nivelChegada) || 0;
    var manualCota = st.cotas.cotaPontoAlto;
    var temManual = manualCota !== null && manualCota !== undefined && manualCota !== '';
    var out = { fonte: null, cota: null, x: null, pPerm: null,
                deficit: 0, hmNecessaria: null, manualCota: temManual ? Number(manualCota) : null,
                semDistancia: false, divergencia: null };

    /* extensão e perda média da adutora, para a piezométrica aproximada */
    var Ltot = 0, hAdu = 0;
    (res.projeto.adutoras || []).forEach(function (r) { Ltot += r.L; hAdu += r.htotal; });

    if (res.envoltoria && res.envoltoria.pontos && res.envoltoria.pontos.length) {
      /* com perfil: ponto de MENOR pressão permanente (o crítico de verdade) */
      var pior = res.envoltoria.pontos.reduce(function (a, b) { return b.pPerm < a.pPerm ? b : a; });
      var alto = res.envoltoria.pontos.reduce(function (a, b) { return b.cota > a.cota ? b : a; });
      out.fonte = 'perfil';
      out.cota = pior.cota;
      out.x = pior.x;
      out.pPerm = pior.pPerm;
      out.cotaMaxPerfil = alto.cota;
      out.xMax = alto.x;
      if (temManual && Math.abs(Number(manualCota) - alto.cota) > 0.5) {
        out.divergencia = { manual: Number(manualCota), perfil: alto.cota };
      }
    } else if (temManual) {
      out.fonte = 'manual';
      out.cota = Number(manualCota);
      var d = Number(st.cotas.distPontoAlto);
      if (d > 0 && Ltot > 0) {
        out.x = Math.min(d, Ltot);
        /* piezométrica aproximada: cai linearmente da saída da elevatória
           (chegada + perdas da adutora) até a chegada */
        var lp = nch + hAdu * (1 - out.x / Ltot);
        out.pPerm = lp - out.cota;
      } else if (out.cota > nch) {
        /* acima da chegada e sem distância: não dá para verificar */
        out.semDistancia = true;
      } else {
        /* abaixo da chegada, a piezométrica sempre passa por cima */
        out.pPerm = nch - out.cota;
      }
    } else {
      return out;
    }

    if (out.pPerm !== null && out.pPerm < 0) {
      out.deficit = -out.pPerm;
      out.hmNecessaria = res.projeto.Hm + out.deficit;
    }
    return out;
  };

  C.validar = function (st, ctx, res) {
    var av = [];
    var ativas = st.adutoras.filter(function (a) { return a.ativo !== false; });
    var ultima = ativas[ativas.length - 1];
    var nch = Number(st.cotas.nivelChegada) || 0;
    var partida = C.cotaPartida(st);

    if (ultima && ultima.usarCotas) {
      var cf = Number(ultima.cotaFim) || 0;
      if (Math.abs(cf - nch) > 0.01) {
        av.push({
          id: 'cotaChegada',
          grave: true,
          txt: 'A cota de chegada informada em "Bombas e níveis" é ' + nch.toFixed(2) +
               ' m, mas a cota final do último trecho da adutora ("' + (ultima.rot || 'trecho') +
               '") é ' + cf.toFixed(2) + ' m. A altura geométrica é calculada com a cota de chegada, ' +
               'e o perfil é desenhado com as cotas dos trechos — com valores diferentes, os dois se contradizem.',
          acoes: [
            { rot: 'Usar ' + cf.toFixed(2) + ' m como cota de chegada', acao: 'sincCotaChegada' },
            { rot: 'Ajustar o trecho para terminar em ' + nch.toFixed(2) + ' m', acao: 'sincCotaTrecho' }
          ]
        });
      }
    }

    var primeira = ativas[0];
    if (primeira && primeira.usarCotas && Math.abs((Number(primeira.cotaIni) || 0) - partida) > 0.01) {
      av.push({
        id: 'cotaPartida',
        txt: 'A cota de partida da adutora é ' + partida.toFixed(2) + ' m, mas o primeiro trecho começa em ' +
             (Number(primeira.cotaIni) || 0).toFixed(2) + ' m.',
        acoes: [{ rot: 'Ajustar o primeiro trecho para começar em ' + partida.toFixed(2) + ' m', acao: 'sincCotaPartida' }]
      });
    }

    if (Number(st.cotas.nivelSuccaoMax) < Number(st.cotas.nivelSuccaoMin)) {
      av.push({
        id: 'niveis', grave: true,
        txt: 'O nível de sucção máximo (' + Number(st.cotas.nivelSuccaoMax).toFixed(2) +
             ' m) está abaixo do mínimo (' + Number(st.cotas.nivelSuccaoMin).toFixed(2) + ' m).',
        acoes: [{ rot: 'Trocar os dois valores', acao: 'trocarNiveis' }]
      });
    }

    /* cota do eixo muito distante do nível de sucção sugere unidades diferentes */
    var eixo = Number(st.cotas.eixoBomba) || 0;
    if (Math.abs(eixo - Number(st.cotas.nivelSuccaoMin)) > 50) {
      av.push({
        id: 'eixoDistante',
        txt: 'A cota do eixo da bomba (' + eixo.toFixed(2) + ' m) está a mais de 50 m do nível de sucção mínimo (' +
             Number(st.cotas.nivelSuccaoMin).toFixed(2) + ' m). Confirme que os dois campos estão na mesma ' +
             'referência de nível — os quatro campos de cota pedem ALTITUDE ABSOLUTA, não profundidade.',
        acoes: []
      });
    }

    /* Trechos ativos sem diâmetro escolhido. Só vale a pena cobrar quando o
       trecho já foi lançado — tem extensão ou peças; um trecho recém-criado,
       ainda em branco, não é incoerência. */
    var semD = [];
    res.projeto.succao.concat(res.projeto.recalque, res.projeto.adutoras).forEach(function (r) {
      var lancado = r.L > 0 || (r.conj.pecas && r.conj.pecas.length > 0);
      if (r.semDiametro && lancado) semD.push(r.rot);
    });
    if (semD.length) {
      av.push({
        id: 'semDiametro', grave: true,
        txt: (semD.length === 1 ? 'O trecho "' + semD[0] + '" está' : 'Os trechos ' +
              semD.map(function (x) { return '"' + x + '"'; }).join(', ') + ' estão') +
             ' ativo(s) mas sem diâmetro escolhido, e por isso fora do cálculo: as perdas de carga desse(s) ' +
             'trecho(s) não entram na altura manométrica nem no NPSH. Escolha o diâmetro na tabela de ' +
             'comparação, ou desmarque o trecho.',
        acoes: []
      });
    }

    /* ---- ponto alto acima da linha piezométrica ---- */
    var pa = res.pontoAlto;
    if (pa && pa.pPerm !== null && pa.pPerm < 0) {
      av.push({
        id: 'pontoAlto', grave: true,
        txt: 'O ponto alto da linha (cota ' + pa.cota.toFixed(2) + ' m' +
             (pa.x !== null ? ', a ' + pa.x.toFixed(0) + ' m da elevatória' : '') +
             ') fica ACIMA da linha piezométrica em regime permanente: a pressão ali resulta ' +
             pa.pPerm.toFixed(2) + ' mca. A vazão de projeto não se estabelece nessa condição — o ponto ' +
             'alto governa o dimensionamento, não a cota de chegada. Para vencê-lo, a altura manométrica ' +
             'precisaria ser de pelo menos ' + pa.hmNecessaria.toFixed(2) + ' mca (hoje: ' +
             res.projeto.Hm.toFixed(2) + ' mca). Aumente o diâmetro para reduzir as perdas, reveja o ' +
             'traçado, ou trate o trecho final como conduto livre a jusante do ponto alto.',
        acoes: []
      });
    } else if (pa && pa.pPerm !== null && pa.fonte && pa.pPerm < 2 && pa.cota > Math.max(Number(st.cotas.nivelChegada) || 0, C.cotaPartida(st))) {
      av.push({
        id: 'pontoAltoFolga',
        txt: 'A folga de pressão no ponto alto (cota ' + pa.cota.toFixed(2) + ' m) é de apenas ' +
             pa.pPerm.toFixed(2) + ' mca em regime permanente. Pequenas variações de vazão ou de rugosidade ' +
             'podem levá-lo à pressão negativa — considere ventosa no ponto alto e confirme com o perfil completo.',
        acoes: []
      });
    }
    if (pa && pa.semDistancia) {
      av.push({
        id: 'pontoAltoSemDist', grave: true,
        txt: 'A cota do ponto mais alto informada (' + pa.cota.toFixed(2) + ' m) é MAIOR que a cota de ' +
             'chegada (' + (Number(st.cotas.nivelChegada) || 0).toFixed(2) + ' m), mas sem a distância até ' +
             'ele não dá para verificar se a linha piezométrica passa por cima. Informe a distância no campo ' +
             'ao lado, ou lance o perfil da linha (bastam três pontos).',
        acoes: []
      });
    }
    if (pa && pa.divergencia) {
      av.push({
        id: 'pontoAltoDiverge',
        txt: 'A cota do ponto mais alto informada em "Bombas e níveis" é ' + pa.divergencia.manual.toFixed(2) +
             ' m, mas o ponto mais alto do perfil lançado é ' + pa.divergencia.perfil.toFixed(2) +
             ' m. Com o perfil ativo vale o perfil — confira qual dos dois está certo.',
        acoes: []
      });
    }

    if (st.perfil.ativo && st.perfil.pontos.length > 1) {
      var lPerfil = C.perfilPontos(st).ultimoX;
      var lTrechos = 0;
      res.projeto.adutoras.forEach(function (r) { lTrechos += r.L; });
      if (lTrechos > 0 && Math.abs(lPerfil - lTrechos) / lTrechos > 0.02) {
        av.push({
          id: 'perfilExtensao',
          txt: 'A extensão do perfil colado é ' + lPerfil.toFixed(0) + ' m, e a soma das extensões dos trechos ' +
               'da adutora é ' + lTrechos.toFixed(0) + ' m. A envoltória de pressões usa a extensão dos trechos ' +
               'e interpola o perfil proporcionalmente.',
          acoes: []
        });
      }
    }

    return av;
  };

  /* ---------------- perfil da linha ---------------- */

  /* Converte os pontos colados (estaca/extensão + cota) em pontos com
     distância acumulada em metros, ordenados. */
  C.perfilPontos = function (st) {
    var p = st.perfil;
    var f = U[('extensao')][p.unidExt || 'm'].f;
    var acum = 0, saida = [];
    (p.pontos || []).forEach(function (pt) {
      var d = Number(pt.est) || 0;
      var x = p.modo === 'individual' ? (acum += d * f) : d * f;
      saida.push({ x: x, cota: Number(pt.cota) || 0, rot: pt.rot || '' });
    });
    saida.sort(function (a, b) { return a.x - b.x; });
    return { pontos: saida, ultimoX: saida.length ? saida[saida.length - 1].x : 0 };
  };

  /* ---------------- envoltória de pressões ----------------
     Traçado de anteprojeto: a partir da linha piezométrica em regime
     permanente (piecewise linear pelos trechos), soma e subtrai uma
     sobrepressão que vale Δh na elevatória e decai linearmente até zero no
     ponto de chegada (nível fixo do reservatório). */

  C.envoltoria = function (st, ctx, cen, golpe) {
    var perfil = C.perfilPontos(st);
    if (!perfil.pontos.length) return null;

    var nsMin = Number(st.cotas.nivelSuccaoMin) || 0;
    var hInterno = 0;
    cen.recalque.forEach(function (r) { hInterno += r.htotal; });

    /* linha piezométrica permanente em nós de trecho */
    var nos = [{ x: 0, hgl: nsMin + cen.Hm - hInterno }];
    var x = 0;
    cen.adutoras.forEach(function (r) {
      x += r.L;
      nos.push({ x: x, hgl: nos[nos.length - 1].hgl - r.htotal });
    });
    var lTrechos = x;
    if (!(lTrechos > 0)) return null;

    /* maior Δh entre os trechos, e escala do perfil */
    var dh = 0;
    (golpe || []).forEach(function (g) { if (isFinite(g.dh) && g.dh > dh) dh = g.dh; });
    var escala = perfil.ultimoX > 0 ? lTrechos / perfil.ultimoX : 1;

    function hglEm(xx) {
      var i;
      for (i = 1; i < nos.length; i++) {
        if (xx <= nos[i].x || i === nos.length - 1) {
          var a = nos[i - 1], b = nos[i];
          var t = b.x > a.x ? (xx - a.x) / (b.x - a.x) : 0;
          return a.hgl + (b.hgl - a.hgl) * Math.min(1, Math.max(0, t));
        }
      }
      return nos[nos.length - 1].hgl;
    }

    /* PN por posição: do trecho correspondente */
    function pnEm(xx) {
      var acc = 0, i;
      for (i = 0; i < cen.adutoras.length; i++) {
        acc += cen.adutoras[i].L;
        if (xx <= acc + 1e-9) return C.pnMca(cen.adutoras[i].conj, cen.adutoras[i].tubo);
      }
      var u = cen.adutoras[cen.adutoras.length - 1];
      return u ? C.pnMca(u.conj, u.tubo) : null;
    }

    var pontos = perfil.pontos.map(function (pt) {
      var xx = pt.x * escala;
      var frac = 1 - Math.min(1, Math.max(0, xx / lTrechos));   /* Δh cheio na bomba, zero na chegada */
      var hglP = hglEm(xx);
      var pn = pnEm(xx);
      var pPerm = hglP - pt.cota;
      var pMax = hglP + dh * frac - pt.cota;
      var pMin = hglP - dh * frac - pt.cota;
      var clPerm = C.classificarPressao(pPerm, pn);
      var clMax = C.classificarPressao(pMax, pn, { transitorio: true });
      var clMin = C.classificarPressao(pMin, pn, { transitorio: true });
      var pior = [clPerm, clMax, clMin].reduce(function (a, b) {
        var ordem = { ruim: 3, atencao: 2, bom: 1, na: 0 };
        return ordem[b.classe] > ordem[a.classe] ? b : a;
      });
      return {
        x: pt.x, xEscalado: xx, cota: pt.cota, rot: pt.rot,
        hgl: hglP, envMax: hglP + dh * frac, envMin: hglP - dh * frac,
        pPerm: pPerm, pMax: pMax, pMin: pMin, pn: pn,
        classe: pior.classe, motivos: clPerm.motivos.concat(clMax.motivos, clMin.motivos)
      };
    });

    return {
      pontos: pontos, dh: dh, lTrechos: lTrechos, escala: escala,
      criticoMax: pontos.reduce(function (a, b) { return b.pMax > a.pMax ? b : a; }, pontos[0]),
      criticoMin: pontos.reduce(function (a, b) { return b.pMin < a.pMin ? b : a; }, pontos[0])
    };
  };

  /* ---------------- transitório ---------------- */

  var MAP_ELAST = {
    pead: 'pead', pvc: 'pvc', pvc_m: 'pvc', pvc_o: 'pvc_o', prfv: 'prfv',
    fd_cimento: 'fd', fd_asfalto: 'fd', fd_sem_rev: 'fd',
    aco_sold_novo: 'aco', aco_rev_esp: 'aco', aco_galv: 'aco', aco_rebitado: 'aco',
    aco_inox: 'inox', concreto_liso: 'concreto', concreto_comum: 'concreto',
    cimento_amianto: 'fibrocim', cobre_latao: 'cobre', manilha_ceramica: 'concreto'
  };

  C.golpe = function (st, ctx, cen) {
    if (!st.golpe.avaliar || !cen.adutoras.length) return null;
    return cen.adutoras.map(function (r, i) {
      var a = st.adutoras[i] || {};
      var tubo = r.tubo;
      if (!tubo) return null;
      var ekey = MAP_ELAST[tubo.material] || 'aco';
      var mat = R.elasticidade[ekey] || { E: 210, nu: 0.3 };
      var E = mat.E * 1e9;
      var nu = mat.nu === undefined ? 0.3 : mat.nu;
      var psi = H.psiDe(st.golpe.ancoragem || 'juntas', nu, Number(st.golpe.psi) || 1);
      var eM = (tubo.eMm || 0) / 1000;
      var a_cel = eM > 0 ? H.celeridade(tubo.diM, eM, E, ctx.rho, 2.19e9, psi) : null;
      var tc = a_cel ? H.tempoCritico(r.L, a_cel) : null;
      var t = Number(st.golpe.tempoManobra) || 0;
      var rapida = !tc || t <= tc;
      var dhJ = a_cel ? H.joukowsky(a_cel, r.v) : null;
      var dhM = t > 0 ? H.michaud(r.L, r.v, t) : null;
      var dh = rapida ? dhJ : Math.min(dhJ === null ? Infinity : dhJ, dhM === null ? Infinity : dhM);
      var pnMca = C.pnMca(a, tubo);

      return {
        rot: r.rot, material: tubo.material, materialRot: mat.rot,
        E_GPa: E / 1e9, nu: nu, psi: psi,
        eMm: tubo.eMm, diMm: tubo.diMm, L: r.L, v: r.v,
        celeridade: a_cel, tempoCritico: tc, tempoManobra: t, manobraRapida: rapida,
        dhJoukowsky: dhJ, dhMichaud: dhM, dh: dh,
        pressaoMaxMca: cen.Hm + (dh || 0),
        pressaoMinMca: cen.Hm - (dh || 0),
        pnMca: pnMca,
        atende: pnMca === null ? null : (cen.Hm + (dh || 0)) <= pnMca,
        subpressao: (cen.Hm - (dh || 0)) < 0
      };
    }).filter(Boolean);
  };

  /* ================================================================
     Curva do sistema e curva da bomba
     ================================================================ */

  /* Altura manométrica do sistema para uma vazão total qualquer, com n
     bombas em operação. C.cenario deduz as vazões de ctx.qBomba e de n, por
     isso a vazão por bomba tem de ser qTotal/n — e não a de projeto escalada. */
  C.hmDoSistema = function (st, ctx, qTotal, n) {
    n = n || ctx.nOp || 1;
    var ctx2 = {};
    Object.keys(ctx).forEach(function (k) { ctx2[k] = ctx[k]; });
    ctx2.qBomba = n > 0 ? qTotal / n : 0;
    ctx2.qTotal = qTotal;
    ctx2.nOp = n;
    var cen = C.cenario(st, ctx2, n);
    return { Hm: cen.Hm, hf: cen.hfSuccao + cen.hfRecalque, hl: cen.hlSuccao + cen.hlRecalque,
             Hg: cen.Hg, qTotal: qTotal, cen: cen };
  };

  /* Pontos da curva do sistema, de 0 até fatorMax x a vazão de projeto */
  C.curvaSistema = function (st, ctx, n, nPontos, fatorMax) {
    nPontos = nPontos || 22;
    fatorMax = fatorMax || 1.6;
    var pts = [], i, q;
    for (i = 0; i <= nPontos; i++) {
      q = ctx.qTotal * fatorMax * i / nPontos;
      pts.push({ q: q, H: C.hmDoSistema(st, ctx, q, n).Hm });
    }
    return pts;
  };

  /* Ajuste da curva da bomba H = a0 + a1·Q + a2·Q² por mínimos quadrados
     (Q em m³/s, H em mca). Precisa de pelo menos 3 pontos. */
  C.ajustarCurvaBomba = function (pontos) {
    var pts = (pontos || []).map(function (p) {
      return { q: Number(p.q), H: Number(p.H) };
    }).filter(function (p) { return isFinite(p.q) && isFinite(p.H) && p.q >= 0; });
    if (pts.length < 3) return null;

    /* matriz normal 3x3 */
    var S = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], b = [0, 0, 0], i, j, k;
    pts.forEach(function (p) {
      var x = [1, p.q, p.q * p.q];
      for (i = 0; i < 3; i++) {
        for (j = 0; j < 3; j++) S[i][j] += x[i] * x[j];
        b[i] += x[i] * p.H;
      }
    });
    /* eliminação de Gauss */
    var M = [[S[0][0], S[0][1], S[0][2], b[0]],
             [S[1][0], S[1][1], S[1][2], b[1]],
             [S[2][0], S[2][1], S[2][2], b[2]]];
    for (i = 0; i < 3; i++) {
      var piv = i;
      for (k = i + 1; k < 3; k++) if (Math.abs(M[k][i]) > Math.abs(M[piv][i])) piv = k;
      if (Math.abs(M[piv][i]) < 1e-18) return null;
      var tmp = M[i]; M[i] = M[piv]; M[piv] = tmp;
      for (k = i + 1; k < 3; k++) {
        var f = M[k][i] / M[i][i];
        for (j = i; j < 4; j++) M[k][j] -= f * M[i][j];
      }
    }
    var c = [0, 0, 0];
    for (i = 2; i >= 0; i--) {
      var sm = M[i][3];
      for (j = i + 1; j < 3; j++) sm -= M[i][j] * c[j];
      c[i] = sm / M[i][i];
    }
    return {
      a0: c[0], a1: c[1], a2: c[2],
      H: function (q) { return c[0] + c[1] * q + c[2] * q * q; },
      pontos: pts,
      qMax: Math.max.apply(null, pts.map(function (p) { return p.q; }))
    };
  };

  /* Ponto de operação: interseção da curva do sistema com a curva conjunta
     de n bombas em paralelo (mesma altura, vazões somadas). */
  C.pontoOperacao = function (st, ctx, curva, n) {
    if (!curva) return null;
    n = n || ctx.nOp;
    function dif(qTotal) {
      return curva.H(qTotal / n) - C.hmDoSistema(st, ctx, qTotal, n).Hm;
    }
    var qA = 1e-6, qB = curva.qMax * n;
    var dA = dif(qA), dB = dif(qB), i, qM, dM;
    if (dA < 0) return { erro: 'A altura da bomba com vazão nula é inferior à altura geométrica do sistema — a bomba não consegue iniciar o bombeamento.' };
    if (dB > 0) return { erro: 'A interseção fica acima da maior vazão informada na curva da bomba. Acrescente pontos com vazão maior.' };
    for (i = 0; i < 80; i++) {
      qM = (qA + qB) / 2; dM = dif(qM);
      if (dM > 0) { qA = qM; } else { qB = qM; }
      if (Math.abs(qB - qA) < 1e-9) break;
    }
    qM = (qA + qB) / 2;
    var sis = C.hmDoSistema(st, ctx, qM, n);
    var etaB = (Number(st.bombas.rendBomba) || 70) / 100;
    return {
      qTotal: qM, qBomba: qM / n, H: sis.Hm, n: n,
      bhpCv: etaB > 0 ? H.potenciaUtilCV(qM / n, sis.Hm, ctx.gama) / etaB : 0,
      desvioQ: ctx.qTotal > 0 ? (qM - ctx.qTotal) / ctx.qTotal * 100 : 0
    };
  };

  /* ================================================================
     Análise econômica de diâmetro
     ================================================================ */

  /* Custo do tubo por metro estimado por lei de potência:
       custo = A · DN^B  (R$/m, DN em mm)
     O par A/B é editável; serve para comparar diâmetros entre si, não para
     orçar. Um custo por metro informado no catálogo (campo "custoM") tem
     precedência. */
  C.custoMetro = function (st, cat, item, diMm) {
    if (item && item.custoM) return Number(item.custoM);
    var e = st.economia;
    var dn = item && item.dn ? Number(item.dn) : diMm;
    return (Number(e.custoA) || 0) * Math.pow(dn, Number(e.custoB) || 1.2);
  };

  /* Fator de recuperação de capital */
  C.crf = function (taxaPct, anos) {
    var i = (Number(taxaPct) || 0) / 100;
    var nn = Number(anos) || 1;
    if (i <= 0) return 1 / nn;
    return i * Math.pow(1 + i, nn) / (Math.pow(1 + i, nn) - 1);
  };

  /* Custo anual de um trecho com um determinado diâmetro */
  C.custoAnual = function (st, ctx, cat, item, diMm, L, hf, qTotal) {
    var e = st.economia;
    var etaB = (Number(st.bombas.rendBomba) || 70) / 100;
    var etaM = st.bombas.usarRendMotor ? (Number(st.bombas.rendMotor) || 92) / 100 : 1;
    var eta = etaB * etaM;

    var custoTubo = (C.custoMetro(st, cat, item, diMm) * (1 + (Number(e.custoInstalacao) || 0) / 100)) * L;
    var anualTubo = custoTubo * C.crf(e.taxa, e.anos);

    /* energia atribuída à perda de carga deste trecho */
    var potKw = eta > 0 ? ctx.gama * qTotal * hf / 1000 / eta : 0;
    var kwhAno = potKw * (Number(e.horasDia) || 0) * 365;
    var anualEnergia = kwhAno * (Number(e.tarifa) || 0);

    return {
      custoTubo: custoTubo, anualTubo: anualTubo,
      potKw: potKw, kwhAno: kwhAno, anualEnergia: anualEnergia,
      anualTotal: anualTubo + anualEnergia
    };
  };

  /* ---------------- blocos de ancoragem ---------------- */

  /* Resolve um bloco: de onde vem o tubo (trecho da adutora ou escolha
     manual), qual a pressão de cálculo e o resultado do dimensionamento.
     res pode ser null (versão avulsa): aí só vale pressão informada. */
  C.blocoInfo = function (st, ctx, res, b) {
    var avisos = [];

    /* ---- tubo ---- */
    var catId = b.catalogoId, itemRot = b.itemRot, trechoRot = null;
    if (b.tuboOrigem && b.tuboOrigem.indexOf('adutora.') === 0) {
      var i = Number(b.tuboOrigem.split('.')[1]);
      var conj = (st.adutoras || [])[i];
      if (conj) {
        catId = conj.catalogoId;
        itemRot = conj.itemRot;
        trechoRot = conj.rot;
        if (!itemRot) avisos.push('O trecho "' + conj.rot + '" ainda não tem diâmetro escolhido.');
      } else {
        avisos.push('O trecho da adutora indicado não existe mais; escolha o tubo manualmente.');
      }
    }
    var cat = PDA.CAT.buscar(ctx.cats.todos, catId);
    var item = null, k;
    if (cat) for (k = 0; k < cat.itens.length; k++) if (cat.itens[k].rot === itemRot) item = cat.itens[k];

    var deMm = 0;
    if (b.deOverride !== null && b.deOverride !== undefined && b.deOverride !== '' && Number(b.deOverride) > 0) {
      deMm = Number(b.deOverride);
    } else if (item) {
      deMm = item.de || item.dn;
      if (!item.de) avisos.push('O catálogo não traz o DE deste item; o DN foi usado como diâmetro externo.');
    }
    var dn = item ? item.dn : (deMm || null);

    var de2Mm = 0;
    if (b.pecaId === 'reducao') {
      var dn2 = Number(b.dn2) || 0;
      if (cat) for (k = 0; k < cat.itens.length; k++) if (cat.itens[k].dn === dn2) de2Mm = cat.itens[k].de || cat.itens[k].dn;
      if (!de2Mm) de2Mm = dn2;
      if (!(de2Mm > 0)) avisos.push('Informe o DN de saída da redução.');
    }

    /* ---- pressão de cálculo ---- */
    var fonte = b.pressaoFonte || 'informada';
    var pServ = res && res.projeto ? res.projeto.Hm : 0;
    var pTrans = 0, origemTrans = '';
    if (res) {
      if (res.envoltoria && res.envoltoria.criticoMax) {
        pTrans = res.envoltoria.criticoMax.pMax;
        origemTrans = 'maior pressão da envoltória do transitório (perfil da linha)';
      } else if (res.golpe && res.golpe.length) {
        pTrans = res.golpe.reduce(function (a, g) { return Math.max(a, g.pressaoMaxMca || 0); }, 0);
        origemTrans = 'Hm + Δh da pré-avaliação do transitório';
      }
    }

    var pMca = 0, pOrigem = '';
    if (fonte === 'transitorio') {
      if (pTrans > 0) { pMca = pTrans; pOrigem = origemTrans; }
      else {
        fonte = 'informada';
        pMca = Number(b.pressaoInformada) || 0;
        pOrigem = 'valor informado (transitório indisponível)';
        avisos.push('Não há transitório calculado — ative a pré-avaliação ou informe a pressão.');
      }
    } else if (fonte === 'ensaio') {
      var fator = Number(b.fatorEnsaio) || 1.5;
      if (pServ > 0) {
        pMca = pServ * fator;
        pOrigem = fator.toLocaleString('pt-BR') + ' × a altura manométrica de projeto (' +
                  pServ.toFixed(1).replace('.', ',') + ' mca)';
      } else {
        pMca = (Number(b.pressaoInformada) || 0) * fator;
        pOrigem = fator.toLocaleString('pt-BR') + ' × a pressão de serviço informada';
      }
    } else {
      pMca = Number(b.pressaoInformada) || 0;
      pOrigem = 'valor informado';
    }

    /* ---- dimensionamento ---- */
    var calc = PDA.BA.calcular({
      pecaId: b.pecaId, deMm: deMm, de2Mm: de2Mm, pMca: pMca,
      orientacao: b.orientacao, dn: dn, rec: b.recobrimento,
      soloId: b.soloId, sigmaOverride: b.sigmaOverride,
      fs: Number(st.blocos && st.blocos.fs) || 1.5,
      gamaConcreto: Number(st.blocos && st.blocos.gamaConcreto) || 2400,
      tipoEscolhido: b.tipoEscolhido
    });

    if (calc.solo && !(calc.sigma > 0)) {
      avisos.push('Solo sem capacidade de apoio — este ponto exige solução específica (estaca, tirante).');
    }
    if (calc.orientacao !== 'horizontal') {
      avisos.push('Curva vertical: os blocos padronizados valem para empuxo horizontal — aqui o bloco sai pelo cálculo.');
    }
    if (calc.orientacao === 'horizontal' && calc.padrao && !calc.padrao.achou && calc.E > 0) {
      avisos.push('Nenhum bloco padronizado resiste a este empuxo — adotar o bloco calculado pelo apoio.');
    }
    if (calc.padrao && calc.padrao.achou && !calc.padrao.recPedido) {
      avisos.push('O bloco padronizado só atende com recobrimento de ' +
                  calc.padrao.rec.toFixed(2).replace('.', ',') + ' m — confirme a profundidade da vala.');
    }
    if (calc.escolhido && !calc.escolhido.atende) {
      avisos.push('O tipo escolhido manualmente NÃO resiste ao empuxo calculado.');
    }
    if (calc.E > 30000) {
      avisos.push('Empuxo elevado (' + (calc.E / 1000).toFixed(0) + ' tf): avalie junta travada ' +
                  '(autotravamento dos tubos) ou tirantes em vez de bloco — o bloco resultante pode ser antieconômico.');
    }

    /* situação geral do bloco */
    var classe = 'bom';
    if (!(deMm > 0) || !(pMca > 0)) classe = 'na';
    else if (calc.escolhido && !calc.escolhido.atende) classe = 'ruim';
    else if (!(calc.sigma > 0) && calc.orientacao !== 'vert_cima') classe = 'ruim';
    else if (calc.orientacao === 'horizontal' && calc.padrao && !calc.padrao.achou) classe = 'atencao';
    else if (calc.padrao && calc.padrao.achou && !calc.padrao.recPedido) classe = 'atencao';

    return {
      b: b, cat: cat, item: item, trechoRot: trechoRot,
      dn: dn, deMm: deMm, de2Mm: de2Mm,
      pMca: pMca, pOrigem: pOrigem, fonte: fonte,
      pServ: pServ, pTrans: pTrans,
      calc: calc, avisos: avisos, classe: classe
    };
  };

  C.blocosResolvidos = function (st, ctx, res) {
    if (!st.blocos || !st.blocos.ativo) return [];
    return (st.blocos.itens || []).map(function (b) { return C.blocoInfo(st, ctx, res, b); });
  };

  /* ---------------- consolidação ---------------- */

  C.resumo = function (st, catalogos) {
    var ctx = C.contexto(st, catalogos);
    var cenarios = [], i;
    for (i = 1; i <= ctx.nInst; i++) cenarios.push(C.cenario(st, ctx, i));
    var proj = cenarios[ctx.nOp - 1] || cenarios[cenarios.length - 1];

    var golpe = C.golpe(st, ctx, proj);
    var res = {
      ctx: ctx,
      cenarios: cenarios,
      projeto: proj,
      piezometrica: C.piezometrica(st, ctx, proj),
      golpe: golpe,
      envoltoria: (st.perfil && st.perfil.ativo) ? C.envoltoria(st, ctx, proj, golpe) : null
    };
    res.pontoAlto = C.pontoAlto(st, ctx, res);
    res.avisosDados = C.validar(st, ctx, res);

    if (st.curvaBomba && st.curvaBomba.ativo) {
      var pts = (st.curvaBomba.pontos || []).map(function (p) {
        return { q: U.para('vazao', p.q || 0, st.curvaBomba.unidQ || 'L/s'), H: p.H };
      });
      res.curvaBomba = C.ajustarCurvaBomba(pts);

      tk = L.pegar();

      else if (tk.tipo === '}') { nivel--; if (!nivel) break; }
      s += tk.tipo === 'cmd' ? (SIM[tk.v] || tk.v) : tk.v;
    }
    return s;

  function lerColchete(L) {
    if (L.fim() || L.olhar().tipo !== '[') return null;
    L.pegar();
    var filhos = lerLinha(L, ']');
    if (!L.fim() && L.olhar().tipo === ']') L.pegar();
    return { t: 'linha', filhos: filhos };
  }

  var ABRE = { '(': ')', '[': ']', '\\{': '\\}' };

  function lerAtomo(L) {
    var tk = L.pegar();
    if (!tk) return null;

    if (tk.tipo === 'cmd') {
      var c = tk.v;
      if (c === 'frac' || c === 'dfrac') {
        return { t: 'frac', num: lerGrupo(L), den: lerGrupo(L) };
      }
      if (c === 'sqrt') {
        var idx = lerColchete(L);
        return { t: 'raiz', rad: lerGrupo(L), idx: idx };
      }
      if (c === 'text' || c === 'mathrm' || c === 'operatorname') {

      }
      if (c === 'left' || c === 'right') {

      if (c === ',') return { t: 'esp', w: 0.17 };
      if (c === ';') return { t: 'esp', w: 0.28 };

    return h('div', { class: 'grade' }, campos);

  F.infoTubo = function (st, ctx, conj) {

      chip('DI', UI.num(t.diMm, 1), 'mm'),
