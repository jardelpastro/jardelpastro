<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dimensionamento de Conduto Forçado por Gravidade</title>
<meta name="description" content="Dimensionamento de adutoras e emissários por gravidade (conduto forçado) — Hazen-Williams e Fórmula Universal (Colebrook-White), com estudo de cenários de nível de lançamento.">
<style>
/* ==================================================================
   Dimensionamento de Conduto Forçado por Gravidade
   Mesmo conceito visual do Pré-dimensionamento de Adutora
   ================================================================== */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --border: #d6dde6;
  --border-forte: #b3bdca;
  --texto: #1b2733;
  --texto-2: #5b6875;
  --texto-3: #8a97a4;
  --azul: #0E2148;
  --azul-claro: #e7ecf4;
  --azul-escuro: #060f24;
  --teal: #0E6F66;
  --teal-claro: #e2f4f2;
  --teal-vivo: #14A5A0;
  --verde: #0f7b3f;
  --verde-bg: #e4f4ea;
  --ambar: #8a5a00;
  --ambar-bg: #fff3d4;
  --vermelho: #a8231f;
  --vermelho-bg: #fdeaea;
  --sombra: 0 1px 2px rgba(16,30,46,.06), 0 2px 8px rgba(16,30,46,.05);
  --r: 6px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
[data-tema="escuro"] {
  --bg: #12171d;
  --surface: #1a2129;
  --surface-2: #202832;
  --border: #2e3945;
  --border-forte: #3d4a59;
  --texto: #e6ebf0;
  --texto-2: #a4b1bf;
  --texto-3: #76838f;
  --azul: #7fb2e8;
  --azul-claro: #17253c;
  --azul-escuro: #a9cdf5;
  --teal: #35c3ba;
  --teal-claro: #10302e;
  --teal-vivo: #3ad2c8;
  --verde: #56c98a;
  --verde-bg: #14301f;
  --ambar: #e0b050;
  --ambar-bg: #33260c;
  --vermelho: #f0837f;
  --vermelho-bg: #351717;
  --sombra: 0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--texto);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0 0 .6em; }
a { color: var(--azul); }

header.topo {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 40;
}
header.topo h1 { font-size: 15px; letter-spacing: -.2px; }
header.topo h1 .sub { display: block; font-size: 11px; font-weight: 400; color: var(--texto-3); letter-spacing: .3px; }
header.topo .acoes { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

nav.abas {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  display: flex; gap: 2px; overflow-x: auto;
  position: sticky; top: 55px; z-index: 39;
}
nav.abas button {
  appearance: none; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--texto-2);
  padding: 9px 11px; border-bottom: 2px solid transparent; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
nav.abas button:hover { color: var(--texto); }
nav.abas button[aria-selected="true"] { color: var(--azul); border-bottom-color: var(--teal-vivo); font-weight: 600; }
nav.abas .sep { width: 1px; background: var(--border); margin: 8px 4px; }
nav.abas .marcador {
  background: var(--vermelho); color: #fff; font-size: 10px; font-weight: 700;
  border-radius: 9px; padding: 0 5px; min-width: 16px; text-align: center; line-height: 15px;
}

main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 80px; }

.btn {
  appearance: none; font: inherit; font-size: 12.5px; cursor: pointer;
  background: var(--surface); color: var(--texto);
  border: 1px solid var(--border-forte); border-radius: var(--r);
  padding: 5px 11px; line-height: 1.4;
}
.btn:hover { border-color: var(--teal); color: var(--teal); }
.btn.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
[data-tema="escuro"] .btn.primario { color: #0c1220; }
.btn.primario:hover { filter: brightness(1.15); }
.btn.perigo:hover { border-color: var(--vermelho); color: var(--vermelho); }
.btn.mini { font-size: 11.5px; padding: 2px 8px; }

.cartao {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); box-shadow: var(--sombra);
  padding: 14px 16px; margin-bottom: 14px;
}
.cartao > h2 { font-size: 14px; color: var(--azul); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.cartao > h2 .dica { font-weight: 400; font-size: 11.5px; color: var(--texto-3); display: block; margin-top: 2px; }
.cartao h3 { font-size: 12.5px; color: var(--texto-2); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .5px; }

.linha-campos { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 6px; }
.campo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.campo > label { font-size: 11.5px; color: var(--texto-2); }
.campo > label b { color: var(--texto); font-weight: 600; }
.campo input, .campo select, .campo textarea {
  font: inherit; font-size: 13px; color: var(--texto);
  background: var(--surface-2); border: 1px solid var(--border-forte);
  border-radius: var(--r); padding: 5px 8px; min-width: 0;
}
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: 2px solid var(--teal-vivo); outline-offset: -1px; }
.campo input[type="number"], .campo input.num { font-family: var(--mono); text-align: right; }
.campo .un { font-size: 11px; color: var(--texto-3); }
.campo.invalido input { border-color: var(--vermelho); background: var(--vermelho-bg); }
.l60 { width: 60px; } .l80 { width: 84px; } .l100 { width: 104px; } .l120 { width: 124px; }
.l160 { width: 164px; } .l200 { width: 208px; } .l260 { width: 264px; } .cresce { flex: 1 1 180px; }

table.dados { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.dados th, table.dados td { border: 1px solid var(--border); padding: 4px 8px; text-align: right; }
table.dados th {
  background: var(--azul-claro); color: var(--azul); font-weight: 600; font-size: 11.5px;
  text-align: center; vertical-align: middle;
}
table.dados td:first-child, table.dados th:first-child { text-align: left; }
table.dados td.c { text-align: center; }
table.dados td.num, table.dados td:not(:first-child):not(.c):not(.txt) { font-family: var(--mono); font-size: 12px; }
table.dados td.txt { text-align: left; font-family: inherit; }
table.dados tr.total td { font-weight: 700; background: var(--surface-2); }
table.dados tr.grupo td { background: var(--teal-claro); color: var(--teal); font-weight: 600; text-align: left; font-family: inherit; }
.rolagem { overflow-x: auto; }

.selo { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 1px 9px; white-space: nowrap; }
.selo.ok { background: var(--verde-bg); color: var(--verde); }
.selo.atencao { background: var(--ambar-bg); color: var(--ambar); }
.selo.ruim { background: var(--vermelho-bg); color: var(--vermelho); }
.selo.neutro { background: var(--azul-claro); color: var(--azul); }

.aviso { border-left: 3px solid var(--ambar); background: var(--ambar-bg); color: var(--texto); border-radius: 0 var(--r) var(--r) 0; padding: 8px 12px; margin: 8px 0; font-size: 12.5px; }
.aviso.erro { border-left-color: var(--vermelho); background: var(--vermelho-bg); }
.aviso.info { border-left-color: var(--teal); background: var(--teal-claro); }
.aviso b { display: block; }

.nota { font-size: 11.5px; color: var(--texto-3); margin-top: 6px; }
.nota b { color: var(--texto-2); }
.formula { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px dashed var(--border-forte); border-radius: var(--r); padding: 6px 10px; display: inline-block; margin: 4px 0; }

.paineis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 12px; }
.painel { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; }
.painel .rotulo { font-size: 11px; color: var(--texto-3); text-transform: uppercase; letter-spacing: .5px; }
.painel .valor { font-size: 21px; font-weight: 700; font-family: var(--mono); color: var(--azul); margin-top: 2px; }
.painel .valor .un { font-size: 12px; font-weight: 400; color: var(--texto-3); margin-left: 3px; }
.painel .compl { font-size: 11.5px; color: var(--texto-2); margin-top: 2px; }
.painel.ok { border-left: 3px solid var(--verde); }
.painel.ruim { border-left: 3px solid var(--vermelho); }
.painel.atencao { border-left: 3px solid var(--ambar); }

.trecho-cartao { border: 1px solid var(--border-forte); border-radius: var(--r); margin-bottom: 12px; background: var(--surface); }
.trecho-cab { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--azul-claro); border-bottom: 1px solid var(--border); border-radius: var(--r) var(--r) 0 0; }
.trecho-cab .titulo { font-weight: 700; color: var(--azul); font-size: 13px; }
.trecho-cab .acoes-trecho { margin-left: auto; display: flex; gap: 5px; }
.trecho-corpo { padding: 10px 12px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--teal-claro); color: var(--teal); border: 1px solid var(--teal);
  border-radius: 14px; font-size: 12px; padding: 2px 4px 2px 10px;
}
.chip input { width: 44px; font: inherit; font-family: var(--mono); font-size: 11.5px; text-align: center; border: 1px solid var(--border-forte); border-radius: 8px; background: var(--surface); color: var(--texto); padding: 0 2px; }
.chip button { appearance: none; border: 0; background: none; color: inherit; cursor: pointer; font-size: 13px; line-height: 1; padding: 0 4px; }
.chip button:hover { color: var(--vermelho); }
.chip .k { font-family: var(--mono); font-size: 11px; opacity: .8; }

.interruptor { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.interruptor input { position: absolute; opacity: 0; }
.interruptor .pista { width: 38px; height: 20px; border-radius: 10px; background: var(--border-forte); position: relative; transition: background .15s; flex: none; }
.interruptor .pista::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 8px; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.interruptor input:checked + .pista { background: var(--teal-vivo); }
.interruptor input:checked + .pista::after { left: 20px; }
.interruptor .rot { font-weight: 600; font-size: 13px; }

.duas-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 860px) { .duas-colunas { grid-template-columns: 1fr; } }

.fonte-item { border-bottom: 1px solid var(--border); padding: 8px 0; }
.fonte-item:last-child { border-bottom: 0; }
.fonte-item b { font-size: 13px; }
.fonte-item .tipo { font-size: 10.5px; font-weight: 700; color: var(--teal); text-transform: uppercase; letter-spacing: .5px; margin-left: 6px; }
.fonte-item p { font-size: 12.5px; color: var(--texto-2); margin: 2px 0 0; }

/* ---------------- impressão ---------------- */
#impressao { display: none; }
@media print {
  @page { size: A4; margin: 18mm 15mm; }
  body { background: #fff; color: #000; font-size: 11pt; }
  header.topo, nav.abas, main, .naoimprime { display: none !important; }
  #impressao { display: block; }
  #impressao h1 { font-size: 16pt; color: #0E2148; border-bottom: 2px solid #0E2148; padding-bottom: 6px; margin-bottom: 4px; }
  #impressao .subtitulo { font-size: 10pt; color: #444; margin-bottom: 14px; }
  #impressao h2 { font-size: 12.5pt; color: #0E2148; margin: 16px 0 6px; border-bottom: 1px solid #999; padding-bottom: 3px; }
  #impressao h3 { font-size: 11pt; color: #0E6F66; margin: 10px 0 4px; }
  #impressao table { border-collapse: collapse; width: 100%; font-size: 8.5pt; margin: 4px 0 8px; page-break-inside: avoid; }
  #impressao th, #impressao td { border: 1px solid #999; padding: 2.5pt 5pt; text-align: right; }
  #impressao th { background: #e7ecf4; text-align: center; }
  #impressao td:first-child, #impressao th:first-child { text-align: left; }
  #impressao td.c { text-align: center; }
  #impressao tr.total td { font-weight: 700; background: #f2f4f7; }
  #impressao tr.grupo td { background: #e2f4f2; font-weight: 700; text-align: left; }
  #impressao p { font-size: 10pt; margin: 2px 0 6px; }
  #impressao .obs { font-size: 8.5pt; color: #333; }
  #impressao .quebra { page-break-before: always; }
  #impressao .ok-txt { color: #0f7b3f; font-weight: 700; }
  #impressao .ruim-txt { color: #a8231f; font-weight: 700; }
}
</style>
</head>
<body>

<header class="topo">
  <h1>Conduto Forçado por Gravidade
    <span class="sub">adutoras e emissários por gravidade · Hazen-Williams e Colebrook-White · cenários · perfil × piezométrica · tubos em paralelo</span></h1>
  <div class="acoes">
    <button class="btn" type="button" data-acao="novo">Novo</button>
    <button class="btn" type="button" data-acao="exemplo">Exemplo</button>

    <button class="btn" type="button" data-acao="importar" title="Abrir um projeto .json exportado">Importar</button>

<nav class="abas" id="abas" role="tablist"></nav>

  </div>

<script>
/* ================================================================
   Utilidades
   ================================================================ */
(function (GCF) {
  'use strict';
  var U = {};

  /* criador de elementos: h('div', {class:'x', onclick:fn}, filhos...) */
  U.h = function (tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (k === 'checked' || k === 'disabled' || k === 'selected') e[k] = !!v;
      else if (k === 'value') e.value = v;
      else e.setAttribute(k, v === true ? '' : String(v));
    });
    for (var i = 2; i < arguments.length; i++) U.anexar(e, arguments[i]);
    return e;
  };
  U.anexar = function (e, f) {
    if (f === null || f === undefined || f === false) return;
    if (Array.isArray(f)) { f.forEach(function (x) { U.anexar(e, x); }); return; }
    e.appendChild(typeof f === 'object' && f.nodeType ? f : document.createTextNode(String(f)));
  };
  U.limpar = function (e) { while (e.firstChild) e.removeChild(e.firstChild); };

  /* números pt-BR */
  U.fmt = function (x, dec) {
    if (x === null || x === undefined || isNaN(x) || !isFinite(x)) return '—';
    if (dec === undefined) dec = 2;
    if (Math.abs(x) < Math.pow(10, -dec) / 2) x = 0;  /* evita "-0,000" */
    return x.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  };
  /* casas decimais automáticas conforme a ordem de grandeza */
  U.fmtAuto = function (x) {
    if (x === null || x === undefined || isNaN(x) || !isFinite(x)) return '—';
    var a = Math.abs(x);
    if (a >= 100) return U.fmt(x, 1);
    if (a >= 1) return U.fmt(x, 2);
    if (a >= 0.01) return U.fmt(x, 3);
    return U.fmt(x, 4);
  };
  U.num = function (s) {
    if (s === null || s === undefined) return NaN;
    if (typeof s === 'number') return s;
    s = String(s).trim();
    if (!s) return NaN;
    s = s.replace(/\./g, function (m, i, str) { return str.indexOf(',') > -1 ? '' : m; });
    s = s.replace(',', '.');
    return parseFloat(s);
  };
  U.id = function () { return 'id' + Math.random().toString(36).slice(2, 9); };
  U.clonar = function (o) { return JSON.parse(JSON.stringify(o)); };
  U.escapar = function (s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };

  /* campo numérico com edição livre (aceita vírgula) — grava no blur/change */
  U.campoNum = function (op) {
    var input = U.h('input', {
      type: 'text', class: 'num ' + (op.classe || 'l100'), inputmode: 'decimal',
      value: (op.valor === null || op.valor === undefined || isNaN(op.valor)) ? '' : U.fmt(op.valor, op.dec !== undefined ? op.dec : 2),
      placeholder: op.placeholder || '',
      onchange: function () {
        var v = U.num(input.value);
        op.gravar(isNaN(v) ? null : v);
      }
    });
    return input;
  };

  GCF.U = U;
})(window.GCF = window.GCF || {});

/* ================================================================
   Hidráulica — perda de carga em conduto forçado
   (mesmas rotinas do Pré-dimensionamento de Adutora)
   ================================================================ */
(function (GCF) {
  'use strict';
  var H = {};

  H.g = 9.80665;               /* m/s² — aceleração da gravidade normal */

  /* Constantes de Hazen-Williams expostas para ajuste fino.
     Padrão: J = 10,643 · Q^1,852 · C^-1,852 · D^-4,871 (Azevedo Netto) */
  H.HW = { k: 10.643, expQ: 1.852, expD: 4.871 };

  /* Viscosidade cinemática da água [m²/s] em função da temperatura [°C] */
  H.viscosidadeAgua = function (T) {
    if (T === undefined || T === null || isNaN(T)) T = 20;
    return 1.792e-6 / (1 + 0.0337 * T + 0.000221 * T * T);
  };

  H.area = function (D) { return Math.PI * D * D / 4; };
  H.velocidade = function (Q, D) { return Q / H.area(D); };
  H.reynolds = function (v, D, ni) { return v * D / ni; };

  /* Colebrook-White resolvido iterativamente (ponto fixo):
       1/sqrt(f) = -2 log10( eps/(3,7 D) + 2,51/(Re sqrt(f)) ) */
  H.fColebrook = function (Re, epsRel) {
    if (!(Re > 0)) return { f: 0, iter: 0, regime: 'nulo' };
    if (Re < 2000) return { f: 64 / Re, iter: 0, regime: 'laminar' };
    var regime = (Re < 4000) ? 'transicao' : 'turbulento';
    var x = 1 / Math.sqrt(H.fSwameeJain(Re, epsRel));
    var i, xn;
    for (i = 0; i < 60; i++) {
      xn = -2 * Math.log10(epsRel / 3.7 + 2.51 * x / Re);
      if (Math.abs(xn - x) < 1e-12) { x = xn; break; }
      x = xn;
    }
    return { f: 1 / (x * x), iter: i, regime: regime };
  };

  /* Swamee-Jain (1976) — explícita, erro < 1 % para
     1e-6 <= eps/D <= 1e-2 e 5e3 <= Re <= 1e8 */
  H.fSwameeJain = function (Re, epsRel) {
    if (!(Re > 0)) return 0;
    if (Re < 2000) return 64 / Re;
    var a = Math.log10(epsRel / 3.7 + 5.74 / Math.pow(Re, 0.9));
    return 0.25 / (a * a);
  };

  /* Zigrang-Sylvester (1982) — forma usada nas planilhas Colebrook de origem */
  H.fZigrangSylvester = function (Re, epsRel) {
    if (!(Re > 0)) return 0;
    if (Re < 2000) return 64 / Re;
    var t = epsRel / 3.7;
    var a = Math.log10(t - (5.02 / Re) * Math.log10(t + 14.5 / Re));
    return 0.25 / (a * a);
  };

  H.fatorAtrito = function (Re, epsRel, metodo) {
    var reg = Re < 2000 ? 'laminar' : (Re < 4000 ? 'transicao' : 'turbulento');
    switch (metodo) {
      case 'swamee':  return { f: H.fSwameeJain(Re, epsRel), regime: reg };
      case 'zigrang': return { f: H.fZigrangSylvester(Re, epsRel), regime: reg };
      default:        return H.fColebrook(Re, epsRel);
    }
  };

  /* Hazen-Williams: J [m/m]. C adimensional, Q [m³/s], D [m] */
  H.jHazenWilliams = function (Q, D, C) {
    if (!(Q > 0) || !(D > 0) || !(C > 0)) return 0;

        '<th>v (m/s)</th><th>J (m/km)</th><th>hf (mca)</th><th>hl (mca)</th><th>H total (mca)</th><th>Folga (mca)</th><th>Situação</th></tr></thead><tbody>');

      function linhas(nome, Q, pt, folga, status) {
        var multi = res.trechos.length > 1;
        pt.trechos.forEach(function (d, i) {
          if (!d) return;
          var t = res.trechos[i];
          s.push('<tr><td>' + esc(multi ? nome + ' — ' + t.nome : nome) + '</td><td>' + fmt(Q * 1000, 2) + '</td>' +
            (mostraF ? '<td>' + (d.Re ? d.Re.toExponential(2).replace('.', ',') : '—') + '</td><td>' + (d.f !== null && d.f !== undefined ? fmt(d.f, 4) : '—') + '</td>'
                     : '<td>' + (t.C ? fmt(t.C, 0) : '—') + '</td>') +
            '<td>' + fmt(d.v, 3) + '</td><td>' + fmt(d.J * 1000, 3) + '</td><td>' + fmt(d.hf, 3) +
            '</td><td>' + fmt(d.hl, 3) + '</td><td>' + fmt(multi ? d.htotal : pt.H, 3) + '</td>' +
            (multi ? '<td></td><td></td>' :
              '<td>' + (folga !== null ? fmt(folga, 3) : '—') + '</td><td class="c ' +
              (status === 'ruim' ? 'ruim-txt' : status === 'ok' ? 'ok-txt' : '') + '">' + esc(txtStatus(status)) + '</td>') +
            '</tr>');
        });
        if (multi) {
          s.push('<tr class="total"><td>' + esc(nome) + ' — total</td><td>' + fmt(Q * 1000, 2) + '</td>' +
            (mostraF ? '<td></td><td></td>' : '<td></td>') +
            '<td></td><td></td><td>' + fmt(pt.hf, 3) + '</td><td>' + fmt(pt.hl, 3) + '</td><td>' + fmt(pt.H, 3) + '</td>' +
            '<td>' + (folga !== null ? fmt(folga, 3) : '—') + '</td><td class="c ' +
            (status === 'ruim' ? 'ruim-txt' : status === 'ok' ? 'ok-txt' : '') + '">' + esc(txtStatus(status)) + '</td></tr>');
        }
      }
      function txtStatus(sst) {
        return sst === 'ok' ? 'Passa' : sst === 'atencao' ? 'Passa (justa)' : sst === 'ruim' ? 'Não passa' : 'Limite';
      }

      rc.vazoes.forEach(function (rv) { linhas(rv.vaz.nome, rv.Q, rv.perda, rv.folga, rv.status); });
      if (rc.qmax) linhas('Máximo de transporte', rc.qmax, rc.qmaxDet, rc.hdisp - rc.qmaxDet.H, 'indef');
      s.push('</tbody></table>');
    });

    var sec = 3;

    /* perfil da linha */
    var pontosPerf = ((st.perfil && st.perfil.pontos) || []).filter(function (pp) {
      return pp.x !== null && pp.x !== undefined && pp.cota !== null && pp.cota !== undefined;
    });
    if (pontosPerf.length >= 2) {
      sec += 1;
      s.push('<h2>' + sec + '. Perfil da linha e linha piezométrica</h2>');
      res.cenarios.forEach(function (rc) {
        if (st.cenarios.habilitado) s.push('<h3>' + esc(rc.cen.nome) + '</h3>');
        var g = GCF.GRAF.perfil(st, res, rc, { impressao: true });
        if (g) s.push(g.svg.outerHTML);
        if (rc.vazoes.length) {
          s.push('<table><thead><tr><th>Ponto</th><th>Dist. (m)</th><th>Cota (m)</th>' +
            rc.vazoes.map(function (rv) { return '<th>' + esc(rv.vaz.nome) + '<br>(' + fmt(rv.Q * 1000, 1) + ' L/s)</th>'; }).join('') +
            '</tr></thead><tbody>');
          st.perfil.pontos.forEach(function (pp, ip) {
            if (pp.x === null || pp.cota === null || pp.x === undefined || pp.cota === undefined) return;
            s.push('<tr><td>' + esc(pp.rot || 'Ponto ' + (ip + 1)) + '</td><td>' + fmt(pp.x, 1) + '</td><td>' + fmt(pp.cota, 2) + '</td>' +
              rc.vazoes.map(function (rv) {
                var r = rv.perfil && rv.perfil[ip];
                var v = r ? r.pressao : null;
                return '<td class="' + (v !== null && v < 0 ? 'ruim-txt' : '') + '">' + (v !== null ? fmt(v, 2) : '—') + '</td>';
              }).join('') + '</tr>');
          });
          s.push('</tbody></table>');
          s.push('<p class="obs">Pressão sobre o conduto (cota piezométrica − cota do conduto), em mca, por vazão. Perda localizada distribuída ao longo do trecho.</p>');
        }
      });
    }

    /* comparativo */
    var vazoes = st.vazoes.filter(function (v) { return v.q > 0; });
    if (st.cenarios.habilitado && res.cenarios.length > 1 && vazoes.length) {
      sec += 1;
      s.push('<h2>' + sec + '. Comparativo de cenários — folga (mca)</h2>');
      s.push('<table><thead><tr><th>Cenário</th><th>H disp. (mca)</th>' +
        vazoes.map(function (v) { return '<th>' + esc(v.nome) + '<br>(' + fmt(v.q, 1) + ' L/s)</th>'; }).join('') +
        '<th>Q máx (L/s)</th></tr></thead><tbody>');
      res.cenarios.forEach(function (rc) {
        s.push('<tr><td>' + esc(rc.cen.nome) + '</td><td>' + (rc.hdisp !== null ? fmt(rc.hdisp, 2) : '—') + '</td>' +
          rc.vazoes.map(function (rv) {
            return '<td class="' + (rv.status === 'ruim' ? 'ruim-txt' : rv.status === 'ok' ? 'ok-txt' : '') + '">' +
              (rv.folga !== null ? fmt(rv.folga, 3) : '—') + '</td>';
          }).join('') +
          '<td>' + (rc.qmax ? fmt(rc.qmax * 1000, 1) : '—') + '</td></tr>');
      });
      s.push('</tbody></table>');
    }

    /* avisos */
    var avisos = [], vistos = {};
    res.avisos.forEach(function (a) {
      var k = a.onde + '|' + a.msg;
      if (!vistos[k]) { vistos[k] = 1; avisos.push(a); }
    });
    if (avisos.length) {
      sec += 1;
      s.push('<h2>' + sec + '. Pontos a verificar</h2>');
      avisos.forEach(function (a) {
        s.push('<p class="obs">• <b>' + esc(a.onde) + ':</b> ' + esc(a.msg) + '</p>');
      });
    }

    s.push('<p class="obs" style="margin-top:14px">Perda contínua: ' +
      (st.params.metodo === 'hw' ? 'Hazen-Williams' : 'Fórmula Universal (Darcy-Weisbach), fator de atrito por ' + esc(GCF.App.rotuloMetodo(st.params.metodo).replace('Universal — ', ''))) +
      '. Perda localizada: hl = ΣK·v²/(2g). Coeficientes conforme Azevedo Netto (Manual de Hidráulica) e normas ABNT citadas no programa. ' +
      'Documento de pré-dimensionamento — confirmar diâmetros internos e classes de pressão nos catálogos dos fabricantes.</p>');

    document.getElementById('impressao').innerHTML = s.join('');
    window.print();
  };

  GCF.REL = REL;
})(window.GCF = window.GCF || {});

/* ================================================================
   Início
   ================================================================ */
document.addEventListener('DOMContentLoaded', function () {
  GCF.App.iniciar();
});
</script>
</body>
