<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dimensionamento de Tubulação sob Travessia — Rodovia e Ferrovia</title>
<meta name="description" content="Dimensionamento e verificação estrutural de tubulações em travessias de rodovia e ferrovia: cargas de Marston, trem-tipo TB-450 e Cooper E-80, deflexão de Iowa, flambagem, tubo camisa de aço e galeria de concreto.">
<style>/* ==================================================================
   Dimensionamento de Tubulação sob Travessia — Rodovia / Ferrovia
   ================================================================== */

:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --border: #d6dde6;
  --border-forte: #b3bdca;
  --texto: #1b2733;
  --texto-2: #5b6875;
  --texto-3: #8a97a4;
  --azul: #0E2148;            /* navy da marca */
  --azul-claro: #e7ecf4;
  --azul-escuro: #060f24;
  --teal: #0E6F66;            /* teal da marca */
  --teal-claro: #e2f4f2;
  --teal-vivo: #14A5A0;
  --verde: #0f7b3f;
  --verde-bg: #e4f4ea;
  --ambar: #8a5a00;
  --ambar-bg: #fff3d4;
  --vermelho: #a8231f;
  --vermelho-bg: #fdeaea;
  --sombra: 0 1px 2px rgba(16, 30, 46, .06), 0 2px 8px rgba(16, 30, 46, .05);
  --r: 6px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}

[data-tema="escuro"] {
  --bg: #12171d;
  --surface: #1a2129;
  --surface-2: #202832;
  --border: #2e3945;
  --border-forte: #3d4a59;
  --texto: #e6ebf0;
  --texto-2: #a4b1bf;
  --texto-3: #76838f;
  --azul: #7fb2e8;
  --azul-claro: #17253c;
  --azul-escuro: #a9cdf5;
  --teal: #35c3ba;
  --teal-claro: #10302e;
  --teal-vivo: #3ad2c8;
  --verde: #56c98a;
  --verde-bg: #14301f;
  --ambar: #e0b050;
  --ambar-bg: #33260c;
  --vermelho: #f0837f;
  --vermelho-bg: #351717;
  --sombra: 0 1px 2px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--texto);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0 0 .6em; }
a { color: var(--azul); }

/* ---------------- estrutura ---------------- */

header.topo {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 40;
}
header.topo .marca { display: flex; align-items: center; gap: 13px; min-width: 0; }
header.topo h1 { font-size: 15px; letter-spacing: -.2px; }
header.topo h1 .sub { display: block; font-size: 11px; font-weight: 400; color: var(--texto-3); letter-spacing: .3px; }
header.topo .versao { font-size: 11px; color: var(--texto-3); }

.marca-bloco { display: flex; align-items: center; gap: 9px; color: var(--azul); }
[data-tema="escuro"] .marca-bloco { color: #cfe0f5; }
.marca-simbolo { display: block; line-height: 0; }
/* qualquer logo cabe na mesma caixa: comprida encolhe pela largura,
   alta encolhe pela altura, e nunca distorce nem empurra o cabeçalho */
.marca-moldura { display: flex; align-items: center; justify-content: flex-start; overflow: hidden; }
.marca-img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
.marca-bloco.marca-vazia { display: none; }
.marca-nome { display: flex; flex-direction: column; line-height: 1; font-family: Georgia, "Times New Roman", serif; }
.marca-nome b { font-size: 19px; letter-spacing: .5px; color: var(--azul); }
.marca-nome i { font-size: 10.5px; font-style: normal; letter-spacing: 1.6px; color: var(--teal); font-weight: 600; }
[data-tema="escuro"] .marca-nome b { color: #cfe0f5; }
.marca-divisoria { width: 1px; align-self: stretch; background: var(--border); margin: 2px 3px; }
header.topo .acoes { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

nav.abas {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  position: sticky;
  top: 51px;
  z-index: 39;
}
nav.abas button {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 13px;
  font: inherit;
  font-weight: 500;
  color: var(--texto-2);
  cursor: pointer;
  white-space: nowrap;
}
nav.abas button:hover { color: var(--texto); background: var(--surface-2); }
nav.abas button[aria-selected="true"] { color: var(--azul); border-bottom-color: var(--teal-vivo); background: var(--surface-2); }
[data-tema="escuro"] nav.abas button[aria-selected="true"] { color: var(--azul-escuro); }
nav.abas .sep { width: 1px; background: var(--border); margin: 7px 6px; flex: none; }
nav.abas button .marcador {
  display: inline-block; min-width: 16px; height: 16px; line-height: 16px; margin-left: 6px;
  border-radius: 8px; background: var(--ambar); color: #fff; font-size: 10.5px; font-weight: 700;
  text-align: center; padding: 0 4px; vertical-align: 1px;
}

main { max-width: 1500px; margin: 0 auto; padding: 16px; }

/* faixa de resumo fixa logo abaixo das abas */
.faixa-fixa {
  position: sticky;
  top: var(--topo-h, 100px);
  z-index: 37;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px 9px;
  display: none;
}
.faixa-fixa.ativa { display: block; }
.faixa-fixa .interno { max-width: 1500px; margin: 0 auto; }
.faixa-fixa .faixa-resumo { margin: 0; }

#cabecalho-impressao { display: none; }
.somenteimprime { display: none; }
.valor-impresso { display: none; }

.faixa-resumo {
  display: flex; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 10px 12px; margin-bottom: 14px;
  box-shadow: var(--sombra);
}
.chip { display: flex; flex-direction: column; gap: 1px; min-width: 92px; }
.chip .rot { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-3); }
.chip .val { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.forte { padding: 2px 11px 3px; border-left: 3px solid var(--teal-vivo); background: var(--teal-claro); border-radius: 0 4px 4px 0; }
.chip.forte .val { font-size: 18px; }
.chip.alerta { padding: 2px 11px 3px; border-left: 3px solid var(--vermelho); background: var(--vermelho-bg); border-radius: 0 4px 4px 0; }
.chip .val .sinal { color: var(--vermelho); font-weight: 700; margin-left: 4px; cursor: help; }
.chip .val .sinal.atencao { color: var(--ambar); }
.chip .val small { font-size: 11px; font-weight: 500; color: var(--texto-2); }

/* ---------------- cartões ---------------- */

.cartao {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 14px;
  box-shadow: var(--sombra);
  overflow: hidden;
}
.cartao > .cab {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}
.cartao > .cab::before {
  content: ''; width: 3px; align-self: stretch; margin: -10px 4px -10px -13px;
  background: var(--teal-vivo); flex: none;
}
.cartao.destaque { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal), var(--sombra); }
.cartao.destaque > .cab { background: var(--teal-claro); }
.cartao.neutro > .cab::before { background: var(--border-forte); }
.cartao > .cab h2, .cartao > .cab h3 { font-size: 13.5px; }
.cartao > .cab .sub { font-size: 12px; color: var(--texto-2); font-weight: 400; }
.cartao > .cab .dir { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.cartao > .corpo { padding: 13px; }
.cartao.recolhido > .corpo { display: none; }

.grade { display: grid; gap: 11px 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.grade.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grade.g4 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.linha { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }

/* ---------------- campos ---------------- */

label.campo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
label.campo.chave {
  background: var(--teal-claro); border: 1px solid var(--teal); border-radius: 5px;
  padding: 7px 9px 8px;
}
label.campo.chave > span.rot { color: var(--teal); font-weight: 700; }
[data-tema="escuro"] label.campo.chave > span.rot { color: var(--teal); }
label.campo.chave input { border-color: var(--teal); font-weight: 600; }

label.campo > span.rot {
  font-size: 11.5px; font-weight: 600; color: var(--texto-2);
  display: flex; align-items: center; gap: 5px;
}
label.campo.compacto { max-width: 130px; }

input, select, textarea, button { font: inherit; color: inherit; }
input[type="text"], input[type="number"], select, textarea {
  background: var(--surface);
  border: 1px solid var(--border-forte);
  border-radius: 4px;
  padding: 6px 8px;
  width: 100%;
  min-width: 0;
}
input[type="text"], input[type="number"] { font-variant-numeric: tabular-nums; }
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--azul); outline-offset: -1px; border-color: var(--azul);
}
input.num { text-align: right; }
input:disabled, select:disabled { background: var(--surface-2); color: var(--texto-3); }
input.editado, select.editado { border-color: var(--ambar); background: var(--ambar-bg); }
textarea { resize: vertical; min-height: 54px; }
.par-unid { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
.par-unid select { width: auto; }

label.check { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
label.check input { width: auto; }

button.btn {
  background: var(--surface); border: 1px solid var(--border-forte);
  border-radius: 4px; padding: 6px 11px; cursor: pointer; font-weight: 500;
  white-space: nowrap;
}
button.btn:hover { background: var(--surface-2); border-color: var(--texto-3); }
button.btn.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
button.btn.primario:hover { background: var(--azul-escuro); border-color: var(--azul-escuro); }
[data-tema="escuro"] button.btn.primario { background: var(--teal); border-color: var(--teal); color: #06231f; }
button.btn.teal { background: var(--teal); border-color: var(--teal); color: #fff; }
button.btn.teal:hover { filter: brightness(1.12); }
button.btn.perigo:hover { background: var(--vermelho-bg); border-color: var(--vermelho); color: var(--vermelho); }
button.btn.mini { padding: 3px 7px; font-size: 12px; }
button.btn.icone { padding: 3px 7px; line-height: 1; }

.dica {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--azul-claro); color: var(--azul);
  font-size: 10px; font-weight: 700; cursor: help; border: none; flex: none;
}
.dica:hover { background: var(--azul); color: #fff; }

/* ---------------- tabelas ---------------- */

.rolagem { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--border); }
th { background: var(--surface-2); font-weight: 600; font-size: 11.5px; color: var(--texto-2); white-space: nowrap; position: relative; }
th:first-child, td:first-child { text-align: left; }
th.esq, td.esq { text-align: left; }
th.ordenavel { cursor: pointer; user-select: none; }
th.ordenavel:hover { color: var(--azul); background: var(--azul-claro); }
th .seta { color: var(--teal); }
td { font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--surface-2); }
tfoot td { font-weight: 600; background: var(--surface-2); border-top: 2px solid var(--border-forte); }
table.enxuta th, table.enxuta td { padding: 3px 6px; }

tr.bom     td:first-child { box-shadow: inset 3px 0 var(--verde); }
tr.atencao td:first-child { box-shadow: inset 3px 0 var(--ambar); }
tr.ruim    td:first-child { box-shadow: inset 3px 0 var(--vermelho); }
tr.bom     { background: var(--verde-bg); }
tr.atencao { background: var(--ambar-bg); }
tr.ruim    { background: var(--vermelho-bg); }
tr.bom:hover, tr.atencao:hover, tr.ruim:hover { filter: brightness(.97); }
tr.selecionada { outline: 2px solid var(--azul); outline-offset: -2px; }
tr.selecionada td { font-weight: 600; }

.tag {
  display: inline-block; padding: 1px 6px; border-radius: 9px;
  font-size: 10.5px; font-weight: 600; white-space: nowrap;
}
.tag.bom { background: var(--verde-bg); color: var(--verde); border: 1px solid var(--verde); }
.tag.atencao { background: var(--ambar-bg); color: var(--ambar); border: 1px solid var(--ambar); }
.tag.ruim { background: var(--vermelho-bg); color: var(--vermelho); border: 1px solid var(--vermelho); }
.tag.neutro { background: var(--azul-claro); color: var(--azul); border: 1px solid var(--azul); }
.tag.cinza { background: var(--surface-2); color: var(--texto-2); border: 1px solid var(--border-forte); }

.aviso {
  border-left: 3px solid var(--ambar); background: var(--ambar-bg);
  padding: 8px 11px; border-radius: 0 4px 4px 0; font-size: 12.5px; margin: 8px 0;
  color: var(--texto);
}
.aviso.erro { border-color: var(--vermelho); background: var(--vermelho-bg); }
.aviso.ok { border-color: var(--verde); background: var(--verde-bg); }
.aviso.info { border-color: var(--azul); background: var(--azul-claro); }
.aviso b { display: block; margin-bottom: 2px; }
.aviso ul { margin: 4px 0 0; padding-left: 18px; }

.vazio { color: var(--texto-3); font-size: 13px; text-align: center; padding: 18px; font-style: italic; }
.nota { font-size: 11.5px; color: var(--texto-2); line-height: 1.45; }
.nota-fonte { font-size: 11px; color: var(--texto-3); }
.mono { font-family: var(--mono); font-size: 12px; }

/* ---------------- listas de peças ---------------- */

.pecas-tab select { padding: 3px 5px; font-size: 12.5px; }
.pecas-tab input { padding: 3px 5px; font-size: 12.5px; }
.pecas-tab td { padding: 3px 5px; }
.pecas-tab .col-qtd { width: 74px; }
.pecas-tab .col-k { width: 88px; }
.pecas-tab .col-di { width: 104px; }
.pecas-tab .col-dn { width: 168px; }
.pecas-tab .col-dn select { max-width: 168px; }
.pecas-tab .col-x { width: 32px; }
.pecas-tab .col-mover { width: 74px; white-space: nowrap; }

tr.arrastavel .alca {
  display: inline-block; cursor: grab; color: var(--texto-3); font-size: 14px;
  padding: 0 3px; user-select: none; line-height: 1;
}
/* dentro dos campos o gesto é seleção de texto, nunca arraste */
tr.arrastavel input, tr.arrastavel select, tr.arrastavel textarea,
.conjunto.arrastavel input, .conjunto.arrastavel select, .conjunto.arrastavel textarea {
  -webkit-user-drag: none; user-select: text;
}
tr.arrastavel .alca:active { cursor: grabbing; }
tr.arrastavel:hover .alca { color: var(--teal); }
tr.arrastando { opacity: .45; }
tr.alvo-acima td { box-shadow: inset 0 2px 0 var(--teal-vivo); }
tr.alvo-abaixo td { box-shadow: inset 0 -2px 0 var(--teal-vivo); }
.col-mover button { padding: 1px 5px; line-height: 1.2; }
.col-mover button:disabled { opacity: .3; cursor: default; }

/* cabeçalho de conjunto arrastável (trechos) */
.conjunto.arrastavel > .cab-conj .alca {
  cursor: grab; color: var(--texto-3); font-size: 15px; padding: 0 2px; user-select: none;
}
.conjunto.arrastando { opacity: .45; }
.conjunto.alvo-acima { box-shadow: inset 0 3px 0 var(--teal-vivo); }
.conjunto.alvo-abaixo { box-shadow: inset 0 -3px 0 var(--teal-vivo); }

/* ---------------- conjuntos / trechos ---------------- */

.conjunto { border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 11px; background: var(--surface); }
.conjunto > .cab-conj {
  display: flex; align-items: center; gap: 9px; padding: 8px 11px;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  border-radius: var(--r) var(--r) 0 0;
}
.conjunto > .cab-conj input.titulo {
  border: 1px solid transparent; background: transparent; font-weight: 600; width: auto; flex: 1;
}
.conjunto > .cab-conj input.titulo:hover { border-color: var(--border-forte); }
.conjunto > .corpo-conj { padding: 11px; }
.conjunto.desativado > .corpo-conj { display: none; }
.conjunto.desativado > .cab-conj { opacity: .6; border-radius: var(--r); border-bottom: none; }

.subtitulo {
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  color: var(--texto-3); margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--border);
}
.subtitulo:first-child { margin-top: 0; }

/* ---------------- esquemas explicativos ---------------- */

.esquema { width: 100%; max-width: 760px; height: auto; display: block; margin: 4px auto 2px; }
.esquema text { font-size: 9.5px; fill: var(--texto-2); font-family: inherit; }
.esquema text.rotulo { font-weight: 700; fill: var(--azul); }
[data-tema="escuro"] .esquema text.rotulo { fill: var(--azul-escuro); }
.esquema .agua { fill: var(--teal-vivo); opacity: .28; }
.esquema .agua-l { stroke: var(--teal); stroke-width: 1.2; fill: none; }
.esquema .estrutura { stroke: var(--texto-2); stroke-width: 1.4; fill: none; }
.esquema .terreno { stroke: var(--texto-3); stroke-width: 1.2; fill: none; stroke-dasharray: 3 2; }
.esquema .tubo { stroke: var(--azul); stroke-width: 2.6; fill: none; }
[data-tema="escuro"] .esquema .tubo { stroke: var(--azul-escuro); }
.esquema .cota { stroke: var(--vermelho); stroke-width: .9; }
.esquema .cota-t { fill: var(--vermelho); font-weight: 600; }
.esquema .bomba { fill: var(--teal); stroke: var(--azul); stroke-width: 1.2; }

.caixa-esquema {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r);
  padding: 9px 11px; margin: 4px 0 11px;
}
.caixa-esquema > .tit {
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  color: var(--texto-3); margin-bottom: 4px; display: flex; align-items: center; gap: 7px;
}
.caixa-esquema.recolhida svg, .caixa-esquema.recolhida .leg { display: none; }
.caixa-esquema .leg { font-size: 11.5px; color: var(--texto-2); margin-top: 5px; }

/* ---------------- perfil piezométrico ---------------- */

.perfil { width: 100%; height: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; }
.perfil text { font-size: 10px; fill: var(--texto-2); font-family: inherit; }
.perfil .terreno { fill: none; stroke: var(--texto-2); stroke-width: 1.5; }
.perfil .lp { fill: none; stroke: var(--azul); stroke-width: 2; }
.perfil .lps { fill: none; stroke: var(--vermelho); stroke-width: 1.5; stroke-dasharray: 5 3; }
.perfil .grade-l { stroke: var(--border); stroke-width: .5; }

/* ---------------- modal ---------------- */

.fundo-modal {
  position: fixed; inset: 0; background: rgba(12, 20, 30, .55);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; z-index: 100; overflow-y: auto;
}
.modal {
  background: var(--surface); border-radius: 8px; max-width: 780px; width: 100%;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .3); border: 1px solid var(--border);
}
.modal > .cab { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--border); }
.modal > .cab h3 { font-size: 15px; }
.modal > .cab button { margin-left: auto; }
.modal > .corpo { padding: 16px; max-height: 70vh; overflow-y: auto; }
.modal > .pe { padding: 11px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--texto); color: var(--bg); padding: 9px 16px; border-radius: 20px;
  font-size: 13px; z-index: 200; box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
}

/* ---------------- escolha da logo ---------------- */

.previa-logo { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0; }
.previa-timbrado { margin-top: 8px; }
.timb-folha {
  position: relative; width: 132px; aspect-ratio: 210 / 297; margin: 0 0 7px;

}
.timb-folha img { width: 100%; height: 100%; object-fit: fill; display: block; }
.timb-mancha {
  position: absolute; border: 1px dashed var(--teal-vivo);
  background: rgba(20, 165, 160, .10);
  display: flex; align-items: center; justify-content: center;
}
.timb-mancha span { font-size: 9px; color: var(--teal-escuro, #0E6F66); }

.previa-caixa {
  border: 1px dashed var(--border-forte); border-radius: var(--r);
  padding: 10px 12px 12px; background: var(--surface-2); min-width: 260px;
}
.previa-caixa.papel { background: #fff; }
[data-tema="escuro"] .previa-caixa.papel { background: #f7f9fb; }

.previa-rot {
  display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--texto-3); margin-bottom: 7px;
}

.lista-opcoes { display: flex; flex-direction: column; gap: 8px; }
button.btn.opcao-logo { text-align: left; padding: 10px 12px; }
button.btn.opcao-logo.escolhida { border-color: var(--teal); background: var(--teal-claro); }
button.btn.opcao-logo b { display: block; margin-bottom: 2px; }

/* ---------------- fontes ---------------- */

.fonte-item { border-left: 3px solid var(--azul); padding: 8px 12px; margin-bottom: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.fonte-item h4 { font-size: 13px; margin-bottom: 3px; }
.fonte-item .tipo { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-3); }
.fonte-item p { font-size: 12.5px; color: var(--texto-2); margin: 4px 0 0; }

/* ---------------- memorial / impressão ---------------- */

.memorial { background: var(--surface); padding: 22px; font-size: 12.5px; }
.memorial h2 { font-size: 15px; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.memorial h2:first-child { margin-top: 0; }
.memorial table { margin-bottom: 12px; }
.memorial .cab-doc { text-align: center; margin-bottom: 18px; }

@media print {
  /* A impressão reproduz o que está na tela: mesmos cartões, mesmas cores,
     mesmas tabelas. Some apenas o que é comando de tela. */
  :root { --bg: #fff; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

  @page { margin: 10mm 8mm; }

  html, body { background: #fff !important; }
  body { font-size: 8.6pt; color: #16202e; }

  .somenteimprime { display: block !important; margin-bottom: 11px; }
  header.topo, nav.abas, .faixa-fixa, .naoimprime,
  .fundo-modal, .toast, .dica, button { display: none !important; }

  main { max-width: none; padding: 0; }

  #cabecalho-impressao {

    padding: 0 0 8px; margin-bottom: 12px;

    display: flex; gap: 14px; flex-wrap: wrap;
  }
  #cabecalho-impressao .dados .linha-dados b { color: var(--texto); font-weight: 600; }

  /* a faixa de resumo entra no papel, logo abaixo do cabeçalho */
  .faixa-resumo {
    box-shadow: none; border: 1px solid #c9d2dc; break-inside: avoid;
    padding: 7px 9px; gap: 12px;
  }
  .chip .val { font-size: 10pt; }
  .chip.forte { background: #eaf5f4 !important; }

  .cartao {
    break-inside: auto; page-break-inside: auto;
    box-shadow: none; border-color: #c9d2dc; margin-bottom: 9px;
  }
  .cartao > .cab { break-after: avoid; page-break-after: avoid; background: #f2f5f8 !important; }
  .cartao > .corpo { padding: 9px; }
  .conjunto { break-inside: auto; border-color: #ccd4de; }
  .conjunto > .cab-conj { break-after: avoid; background: #f2f5f8 !important; }

  h2, h3, .subtitulo { break-after: avoid; page-break-after: avoid; }
  thead { display: table-header-group; }
  tr { break-inside: avoid; page-break-inside: avoid; }
  table { font-size: 7.6pt; }
  th, td { padding: 2px 4px; }
  .rolagem { overflow: visible !important; max-height: none !important; }

  /* campos: viram texto impresso, sem cara de formulário */
  input[type="text"], input[type="number"], select, textarea {
    border: none; border-bottom: 1px solid #c9d2dc; border-radius: 0;
    background: transparent !important; padding: 1px 2px;
    -webkit-appearance: none; appearance: none;
    color: #16202e !important; font-weight: 600;
  }
  select { display: none !important; }
  .valor-impresso {
    display: inline-block !important;
    border-bottom: 1px solid #c9d2dc; padding: 1px 2px;
    font-weight: 600; font-size: inherit; line-height: 1.35;
    width: 100%; word-break: break-word;
  }
  td .valor-impresso, th .valor-impresso { border: none; width: auto; }
  input.editado, select.editado { background: #fff6e0 !important; border-bottom-color: #b58a2b; }
  label.campo.chave { background: #eaf5f4 !important; border-color: #7fb8b3; }
  label.campo > span.rot { color: #556273; }
  input:disabled, select:disabled { color: #556273 !important; }

  tr.bom { background: #eef8f1 !important; }
  tr.atencao { background: #fdf6e3 !important; }
  tr.ruim { background: #fbeeed !important; }
  tr.selecionada { outline: 1.5px solid var(--azul); }
  .tag { border-width: .8px; }

  .aviso { break-inside: avoid; }
  .caixa-esquema { break-inside: avoid; background: #fafbfc !important; }
  svg.perfil, svg.esquema { break-inside: avoid; max-width: 100%; }
  .perfil { background: #fafbfc !important; }

  .memorial { padding: 0; }
  .memorial h2 { break-before: auto; }

  a[href]::after { content: none !important; }
}

@media (max-width: 720px) {
  header.topo { padding: 8px 10px; }
  main { padding: 10px; }
  nav.abas { top: 47px; }

}

/* ==================================================================
   Memorial: documento paginado
   ================================================================== */

/* ------------------------------------------------------------------
   Memorial em A4, formatado conforme a ABNT (NBR 14724, 6024, 6027,
   6023 e 10520), com uma exceção pedida pelo usuário: entrelinhas 1,2
   no lugar de 1,5.
   ------------------------------------------------------------------ */
.doc {
  font-family: Arial, Helvetica, sans-serif;
  color: #000;
  font-size: 12pt;
  line-height: 1.2;
}
.doc-medidor { position: absolute; left: -20000px; top: 0; visibility: hidden; }

.doc .pagina {
  width: 210mm;
  height: 297mm;
  background: #fff;
  margin: 0 auto 10mm;
  box-shadow: 0 2px 10px rgba(16, 30, 46, .18);
  /* margens ABNT: 3 cm em cima e à esquerda, 2 cm embaixo e à direita */
  padding: 30mm 20mm 20mm 30mm;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}
/* timbrado do escritório, quando carregado */
.doc .pagina .pag-timbrado {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: fill; z-index: 0;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.doc .pagina > .pag-corpo, .doc .pagina > .doc-capa { position: relative; z-index: 1; }

/* número da página: canto superior direito, a 2 cm da borda (NBR 14724) */
.doc .pag-num {
  position: absolute; top: 20mm; right: 20mm; z-index: 2;
  font-size: 10pt; color: #000; line-height: 1;
}
.doc .pag-corpo { flex: 1 1 auto; overflow: hidden; }
.doc .pag-corpo > * { margin-top: 0 !important; margin-bottom: 0 !important; }

/* --- títulos (NBR 6024): indicativo, um espaço, título --- */
.doc .doc-h1 {
  font-size: 12pt; font-weight: bold; color: #000; text-transform: uppercase;
  margin: 0; padding: 0 0 8pt; text-align: left;
}
.doc .doc-h1-frente { text-align: center; padding-bottom: 12pt; }
.doc .doc-h2 {
  font-size: 12pt; font-weight: bold; color: #000;
  margin: 0; padding: 10pt 0 6pt;
}
.doc .doc-h3 {
  font-size: 12pt; font-weight: normal; font-style: italic; color: #000;
  margin: 0; padding: 8pt 0 5pt;
}

/* --- texto --- */
.doc .doc-p {
  margin: 0; padding-bottom: 6pt; text-align: justify;
  text-indent: 12.5mm;                      /* recuo de primeira linha */
  hyphens: auto;
}
.doc .doc-p.sem-recuo { text-indent: 0; }
.doc .doc-alineas { margin: 0; padding: 0 0 6pt 12.5mm; list-style: none; }
.doc .doc-alineas li { text-align: justify; padding: 0 0 3pt 6mm; text-indent: -6mm; }
.doc .doc-nota { font-size: 10pt; margin: 0; padding-bottom: 6pt; text-align: justify; }
.doc .doc-ref {
  margin: 0; padding-bottom: 11pt; text-align: left; font-size: 12pt;
  line-height: 1.0;                          /* referências em espaço simples */
}

/* --- equações: centralizadas, com o número entre parênteses à direita --- */
.doc .doc-formula {
  margin: 0; padding: 8pt 0; display: flex; align-items: center; gap: 6mm;
}
.doc .doc-formula .formula-corpo { flex: 1 1 auto; text-align: center; }
.doc .doc-formula .formula-num { flex: none; font-size: 12pt; }
.doc .formula-svg { max-width: 100%; height: auto; vertical-align: middle; }
.doc .formula-leg { font-size: 12pt; margin: 0; padding: 0 0 6pt; text-align: justify; }
.doc .doc-aplicacao { margin: 0; padding: 4pt 0 8pt 12.5mm; }

/* --- ilustrações e tabelas --- */
.doc .doc-quadro { margin: 0; padding: 6pt 0 10pt; }
.doc .doc-cap-tab, .doc .doc-cap-fig {
  font-size: 10pt; font-weight: bold; text-align: left; margin-bottom: 3pt;
}
.doc .doc-fonte { font-size: 10pt; text-align: left; margin-top: 3pt; }
.doc .doc-fig { text-align: center; }
.doc .doc-fig svg, .doc .doc-fig img { max-width: 100%; height: auto; }

/* tabela no padrão IBGE/ABNT: fechada em cima e embaixo, sem traços
   verticais; largura total da mancha; corpo 10 pt; linhas de 0,6 cm */
.doc .doc-tabela {
  border-collapse: collapse; width: 100%; font-size: 10pt;
  border-top: 1pt solid #000; border-bottom: 1pt solid #000;
}
.doc .doc-tabela th, .doc .doc-tabela td {
  border: 0; padding: 1.6mm 2mm; text-align: right; height: 6mm;
  vertical-align: middle; line-height: 1.15;
}
.doc .doc-tabela thead th {
  border-bottom: .75pt solid #000; font-weight: bold; text-align: center;
  background: transparent; color: #000;
}
.doc .doc-tabela td.esq, .doc .doc-tabela th.esq { text-align: left; }
.doc .doc-tabela tr.total td { font-weight: bold; border-top: .75pt solid #000; }
.doc .doc-tabela tr.destaque td { background: #ececec;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.doc .doc-tabela td, .doc .doc-tabela th { color: #000; }

/* --- sumário e listas (NBR 6027) --- */
.doc .doc-sum {
  display: flex; align-items: baseline; gap: 4px; margin: 0;
  padding: 3pt 0; font-size: 12pt;
}
.doc .doc-sum.nivel1 { font-weight: bold; text-transform: uppercase; }
.doc .doc-sum.nivel2 { padding-left: 8mm; }
.doc .sum-pts { flex: 1 1 auto; border-bottom: 1px dotted #555; height: .8em; }
.doc .sum-pag { flex: none; font-variant-numeric: tabular-nums; }

/* --- capa --- */
.doc .pagina-capa { padding: 30mm 20mm 20mm 30mm; }
.doc .doc-capa { display: flex; flex-direction: column; height: 100%; text-align: center; }
.doc .capa-topo { display: flex; justify-content: center; }
.doc .capa-meio { margin-top: 38mm; }
.doc .capa-tipo {
  text-transform: uppercase; letter-spacing: 2px; font-size: 12pt; font-weight: bold;
}
.doc .capa-titulo { font-size: 16pt; font-weight: bold; margin: 10mm 0 5mm; line-height: 1.3; }
.doc .capa-sub { font-size: 12pt; }
.doc .capa-linha { width: 60mm; height: 1pt; background: #000; margin: 8mm auto 0; }
.doc .capa-dados { margin-top: auto; font-size: 12pt; line-height: 1.6; }
.doc .capa-rodape { margin-top: 10mm; font-size: 10pt; }

.visor-doc {
  background: #48525e; background: #48525e; padding: 10mm 0;
  max-height: 62vh; overflow: auto; border-radius: 4px;
}
.visor-doc .doc { transform: scale(.62); transform-origin: top center; }
.visor-doc #doc-saida { width: 210mm; margin: 0 auto; }

#doc-saida { display: none; }
html.imprimindo-doc #doc-saida { display: block; }

@media print {
  html.imprimindo-doc body > * { display: none !important; }
  html.imprimindo-doc #doc-saida { display: block !important; }
  html.imprimindo-doc #cabecalho-impressao { display: none !important; }
  html.imprimindo-doc { background: #fff; }
  html.imprimindo-doc .doc .pagina {
    box-shadow: none; margin: 0; page-break-after: always; break-after: page;
  }
  html.imprimindo-doc .doc .pagina:last-child { page-break-after: auto; break-after: auto; }
}

.visor-doc #doc-saida { display: block; }
</style>

<script>/* ===== 00-marca.js ===== */
/* ------------------------------------------------------------------
 * Identidade visual: marca no cabeçalho.
 *
 * O símbolo abaixo é uma reprodução em SVG (engrenagem + gota + onda).
 * Para usar o arquivo oficial da logo, o botão "Logo" no cabeçalho
 * carrega uma imagem PNG/JPG/SVG, que fica gravada no navegador como
 * data URI e passa a ser usada no lugar do desenho — inclusive na
 * impressão do memorial.
 * ------------------------------------------------------------------ */
(function (TRV) {
  'use strict';

  var M = {};
  var LS_LOGO = 'trv.logo.v1';
  var LS_MODO = 'trv.logo.modo.v1';
  var SVG_NS = 'http://www.w3.org/2000/svg';

  /* Caixa em que qualquer logo tem de caber, na tela e no papel. A imagem é
     ajustada por object-fit: contain, então uma logo comprida encolhe pela
     largura e uma logo alta encolhe pela altura — nas duas situações ela cabe
     inteira, sem distorcer e sem empurrar o resto do cabeçalho. */
  M.CAIXA = { larguraTela: 250, larguraImpressao: 210, alturaTela: 46, alturaCapa: 96 };

  M.cores = {
    navy: '#0E2148',
    navy2: '#16305F',
    teal: '#14A5A0',
    tealEscuro: '#0E6F66',
    verdeTeal: '#1A6B5A'
  };

  function sv(tag, attrs, filho) {
    var e = document.createElementNS(SVG_NS, tag), k;
    for (k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    if (filho) (Array.isArray(filho) ? filho : [filho]).forEach(function (f) { e.appendChild(f); });
    return e;
  }

  /* símbolo: engrenagem envolvendo uma gota com onda */
  M.simbolo = function (alturaPx) {
    var svg = sv('svg', {
      viewBox: '0 0 120 124', width: alturaPx * 120 / 124, height: alturaPx,
      role: 'img', 'aria-label': 'Pastro Engenharia'
    });

    var defs = sv('defs');
    var grad = sv('linearGradient', { id: 'trvOnda', x1: '0', y1: '1', x2: '1', y2: '0' });
    grad.appendChild(sv('stop', { offset: '0', 'stop-color': M.cores.tealEscuro }));
    grad.appendChild(sv('stop', { offset: '1', 'stop-color': '#1FC6BE' }));
    defs.appendChild(grad);
    var clip = sv('clipPath', { id: 'trvGota' });
    clip.appendChild(sv('path', { d: 'M60 22 C60 22 88 58 88 76 A28 28 0 1 1 32 76 C32 58 60 22 60 22 Z' }));
    defs.appendChild(clip);
    svg.appendChild(defs);

    /* engrenagem: anel + dentes */
    var g = sv('g', { fill: 'none', stroke: 'currentColor', 'stroke-width': 8,
                      'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
    var i, ang, dentes = 10;
    for (i = 0; i < dentes; i++) {
      ang = -90 + (360 / dentes) * i;
      if (ang > -140 && ang < -40) continue;            /* abertura no topo, para a gota */
      g.appendChild(sv('rect', {
        x: 54, y: 6, width: 12, height: 16, rx: 2,
        transform: 'rotate(' + (ang + 90) + ' 60 70)'
      }));
    }
    g.appendChild(sv('circle', { cx: 60, cy: 70, r: 48 }));
    svg.appendChild(g);

    /* gota */
    svg.appendChild(sv('path', {
      d: 'M60 22 C60 22 88 58 88 76 A28 28 0 1 1 32 76 C32 58 60 22 60 22 Z',
      fill: 'var(--surface)', stroke: 'currentColor', 'stroke-width': 8, 'stroke-linejoin': 'round'
    }));

    /* onda dentro da gota */
    svg.appendChild(sv('path', {
      d: 'M32 82 C42 74 52 88 64 84 C74 81 82 74 88 68 L88 84 A28 28 0 0 1 34 92 Z',
      fill: 'url(#trvOnda)', 'clip-path': 'url(#trvGota)'
    }));

    return svg;
  };

  /* marca completa para o cabeçalho.
     op: { altura, larguraMax, semTexto } */
  M.marca = function (alturaPx, op) {
    op = op || {};
    var modo = M.modo();
    var caixa = document.createElement('div');
    caixa.className = 'marca-bloco';
    if (modo === 'nenhuma') { caixa.className += ' marca-vazia'; return caixa; }

    var alt = alturaPx || 38;
    var larg = op.larguraMax || M.CAIXA.larguraTela;

    if (modo === 'usuario') {
      var logo = M.logoGravada();
      if (logo) {
        var moldura = document.createElement('span');
        moldura.className = 'marca-moldura';
        moldura.style.height = alt + 'px';
        moldura.style.maxWidth = larg + 'px';
        var img = document.createElement('img');
        img.src = logo;
        img.alt = 'Logo';
        img.className = 'marca-img';
        moldura.appendChild(img);
        caixa.appendChild(moldura);
        return caixa;
      }
    }

    var simb = document.createElement('span');
    simb.className = 'marca-simbolo';
    simb.appendChild(M.simbolo(alt));
    caixa.appendChild(simb);

    if (!op.semTexto) {
      var txt = document.createElement('span');
      txt.className = 'marca-nome';
      txt.innerHTML = '<b>PASTRO</b><i>ENGENHARIA</i>';
      caixa.appendChild(txt);
    }
    return caixa;
  };

  /* 'padrao' (o desenho), 'usuario' (arquivo carregado) ou 'nenhuma' */
  M.modo = function () {
    var m;
    try { m = localStorage.getItem(LS_MODO); } catch (e) { m = null; }
    if (m === 'nenhuma') return 'nenhuma';
    if (m === 'usuario' && M.logoGravada()) return 'usuario';
    return 'padrao';
  };

  M.definirModo = function (m) {
    try { localStorage.setItem(LS_MODO, m); return true; } catch (e) { return false; }
  };

  M.logoGravada = function () {
    try { return localStorage.getItem(LS_LOGO) || null; } catch (e) { return null; }
  };

  M.gravarLogo = function (dataUri) {
    try {
      localStorage.setItem(LS_LOGO, dataUri);
      localStorage.setItem(LS_MODO, 'usuario');
      return true;
    } catch (e) { return false; }
  };

  M.removerLogo = function () {
    try { localStorage.removeItem(LS_LOGO); localStorage.setItem(LS_MODO, 'padrao'); } catch (e) {}
  };

  /* ------------------------------------------------------------------
     Timbrado: a folha timbrada do escritório, usada como fundo de todas
     as páginas do memorial. Guardada já reduzida ao tamanho de uma A4 a
     150 dpi, porque o arquivo original costuma ter dezenas de megabytes
     e não caberia no armazenamento do navegador.
     ------------------------------------------------------------------ */

  var LS_TIMB = 'trv.timbrado.v1';
  M.TIMBRADO_PX = { largura: 1240, altura: 1754 };      /* A4 a 150 dpi */

/* ------------------------------------------------------------------
 * Motor de cálculo da travessia.
 *
 * Convenções internas:
 *   pressões em kPa · tensões e módulos em MPa · comprimentos em m ·

  'use strict';

    var item = null, i;
    for (i = 0; i < cat.itens.length; i++) {
      if (cat.itens[i].rot === cfg.itemRot) { item = cat.itens[i]; break; }
    }
    var mat = TRV.R.materiais[cat.material] || TRV.R.materiais.aco;
    if (!item) return { cat: cat, mat: mat, material: cat.material, semDiametro: true };
    var e = num(cfg.eOverride, item.e);
    var de = item.de;
    var di = (item.di !== undefined && item.di !== null) ? item.di : de - 2 * e;
    return {
      cat: cat, item: item, mat: mat, material: cat.material,
      de: de, e: e, di: di, dn: item.dn, pn: item.pn, sn: item.sn || null,
      eOriginal: item.e, eAlterada: cfg.eOverride !== null && cfg.eOverride !== undefined &&

  };

     Contexto: tudo o que o cálculo precisa, já resolvido
     ================================================================ */

  C.contexto = function (st, cats) {
    var ctx = { avisosDados: [] };

    ctx.condutor = C.resolverTubo(st.condutor, cats, 'condutor');
    ctx.camisaUsada = !!st.camisa.usar;
    ctx.camisa = ctx.camisaUsada ? C.resolverTubo(st.camisa, cats, 'camisa') : null;

    /* elemento estrutural que recebe solo + tráfego */
    ctx.estrutural = ctx.camisaUsada ? ctx.camisa : ctx.condutor;
    ctx.estruturalNome = ctx.camisaUsada
      ? (ctx.camisa && ctx.camisa.material === 'concreto' ? 'galeria de concreto' : 'tubo camisa')
      : 'condutor';

    /* solo */
    var solo = TRV.R.solo(st.solo.tipoId);
    ctx.solo = {
      rot: solo.rot,
      ku: st.solo.tipoId === 'manual' ? num(st.solo.kuOverride, 0.13) : num(st.solo.kuOverride, solo.ku),
      gama: num(st.solo.gama, 18.5),
      coesao: Math.max(0, num(st.solo.coesao, 0)),
      ePrime: num(st.solo.ePrimeOverride, TRV.R.ePrimeDe(st.solo.grupoE, st.solo.compactacao))
    };
    if (st.solo.tipoId === 'manual' && st.solo.kuOverride === null) {
      ctx.avisosDados.push('Informe o valor de Kμ′ do solo (tipo "Outro").');
    }

    /* geometria */
    var t = st.travessia;
    ctx.H = Math.max(0.05, num(t.H, 2));
    ctx.hAgua = Math.max(0, Math.min(num(t.hAgua, 0), ctx.H));
    ctx.tipo = t.tipo;

    /* nunca acima do prisma — o arqueamento só alivia */
    if (out.Pv > prisma) { out.Pv = prisma; out.limitadoPrisma = true; }

  /* ================================================================

     ================================================================ */

  C.cargas = function (st, ctx) {
    var solo = C.cargaSolo(st, ctx);
    var movel = TRV.LD.pressaoMovel(st, ctx.H);
    var sobre = Math.max(0, num(st.travessia.sobrecarga, 0));
    var agua = GAMA_AGUA * ctx.hAgua;

    var De = ctx.DeEst ? ctx.DeEst / 1000 : 0;
    var total = solo.Pv + movel.p + sobre;

    return {
      solo: solo,
      movel: movel,
      sobrecarga: sobre,
      aguaKPa: agua,
      PvTotal: total,
      Wtotal: total * De,
      WtotalRigido: solo.W + (movel.p + sobre) * De
    };
  };

  /* ================================================================
     Verificações de tubo flexível
     elem: 'condutor' | 'camisa'
     ================================================================ */

  C.verificarFlexivel = function (st, ctx, cargas, elem) {
    var cfg = st[elem];
    var tubo = elem === 'camisa' ? ctx.camisa : ctx.condutor;
    if (!tubo || tubo.semDiametro) return null;

    var cri = st.criterios;
    var mat = tubo.mat;
    var De = tubo.de, e = tubo.e;
    var r = (De - e) / 2;                       /* raio médio, mm */
    var Dm = De - e;

    var eLongo = num(cfg.eLongoOverride, mat.eLongo);
    var eCurto = num(cfg.eCurtoOverride, mat.eCurto);

    var K = TRV.R.leitoK(cfg.apoioGraus);
    var DL = num(cfg.dl, 1.5);

    var I = Math.pow(e, 3) / 12;                /* mm⁴/mm */
    var rigidezAnel = tubo.sn
      ? 8 * tubo.sn * 1e-6                      /* SN (N/m²) → EI/r³ em MPa */
      : eLongo * I / Math.pow(r, 3);            /* MPa */
    var frs = 0.061 * ctx.solo.ePrime;          /* MPa */

    /* deflexão: DL só sobre a parcela permanente.

    var Wperm = (cargas.solo.Pv + cargas.sobrecarga) / 1000 * De;
    var Wmovel = cargas.movel.p / 1000 * De;                      /* N/mm */
    var num_ = K * (DL * Wperm + Wmovel);                          /* N/mm */
    var den = (rigidezAnel + frs) * De;                            /* N/mm²·mm = N/mm */
    var defl = den > 0 ? num_ / den : Infinity;                    /* Δy/De */
    var deflPct = defl * 100;
    var deflAdm = num(cfg.deflexaoAdmPct, mat.deflexaoProjeto || 5);

    /* compressão anelar */
    var sigma = cargas.PvTotal / 1000 * De / (2 * e);              /* MPa */
    var sigmaAdm;
    if (tubo.material === 'aco') {
      var fy = num(cfg.fyOverride, TRV.R.aco(cfg.acoId).fy || 250);
      sigmaAdm = fy / num(cri.fsAnelarAco, 2);
    } else {
      sigmaAdm = num(cfg.sigmaAdmOverride, mat.sigmaAdm);
    }

    var Blin = 1 / (1 + 4 * Math.exp(-0.213 * ctx.H));
    var Rw = 1 - 0.33 * (ctx.hAgua / ctx.H);
    var EID3 = tubo.sn ? tubo.sn * 1e-6 : eLongo * I / Math.pow(De, 3);
    var qAdm = Math.sqrt(Math.max(0, 32 * Rw * Blin * ctx.solo.ePrime * EID3)) /
               num(cri.fsFlambagem, 2.5);                          /* MPa */
    var vac = elem === 'condutor' ? Math.max(0, num(st.travessia.vacuo, 0)) : 0;
    var qAtu = (cargas.aguaKPa + Rw * cargas.solo.Pv + cargas.movel.p +
                cargas.sobrecarga + vac) / 1000;                   /* MPa */

    /* rigidez mínima do anel frente ao solo (verificação de boa prática) */
    var rigidezMinOk = rigidezAnel >= 0.15 * frs;

    return {
      elem: elem, tubo: tubo,
      K: K, DL: DL, I: I, r: r, Dm: Dm,
      eLongo: eLongo, eCurto: eCurto,
      rigidezAnel: rigidezAnel, frs: frs, rigidezMinOk: rigidezMinOk,
      deflexao: { mm: defl * De, pct: deflPct, adm: deflAdm, admAbs: mat.deflexaoAdm,
                  ok: deflPct <= deflAdm + 1e-9 },
      anelar: { sigma: sigma, adm: sigmaAdm, ok: sigmaAdm ? sigma <= sigmaAdm + 1e-9 : null },
      flambagem: { qAdm: qAdm, qAtu: qAtu, Blin: Blin, Rw: Rw, EID3: EID3,

    var qRupReq  = W * num(cri.fsRuptura, 1.5) / apoio.Fe;

    var classes = TRV.CAT.classesConcreto;
    var resultado = {};
    var atende = null;
    Object.keys(classes).forEach(function (cl) {
      var fiss = classes[cl][0] * dnM;
      var rup = classes[cl][1] * dnM;
      var ok = fiss >= qFissReq - 1e-9 && rup >= qRupReq - 1e-9;
      resultado[cl] = { fissura: fiss, ruptura: rup, ok: ok };

      qFissReq: qFissReq, qRupReq: qRupReq,

    var pExt = Math.max(0, num(st.travessia.vacuo, 0)) + GAMA_AGUA * ctx.hAgua;
    var fsCol = num(cri.fsColapso, 2);

        : 'Do greide do pavimento ao topo do elemento estrutural. Confirmar a exigência do órgão (DNIT/concessionária).');

    /* elemento estrutural */
    if (ctx.estrutural.mat.tipo === 'rigido') {
      res.rigido = C.verificarRigido(st, ctx, cargas);
      if (res.rigido) {

          'classe ' + res.rigido.classeEscolhida,
          res.rigido.classeMinima ? 'mínima: ' + res.rigido.classeMinima : 'nenhuma classe atende',
          'Fissura exigida ' + res.rigido.qFissReq.toFixed(1).replace('.', ',') + ' kN/m ≤ ' +
          (cl ? cl.fissura.toFixed(1).replace('.', ',') : '—') + ' kN/m da classe.');
      }

      var f = res.flexEstrutural;

          f.deflexao.pct.toFixed(2).replace('.', ',') + ' %',
          '≤ ' + f.deflexao.adm.toFixed(1).replace('.', ',') + ' %',
          'Δy = ' + f.deflexao.mm.toFixed(1).replace('.', ',') + ' mm.');
        if (f.anelar.ok !== null) {
          v('anelar', 'Compressão na parede ' + nomeEl, f.anelar.ok,
            f.anelar.sigma.toFixed(2).replace('.', ',') + ' MPa',

          '≤ ' + (f.flambagem.qAdm * 1000).toFixed(1).replace('.', ',') + ' kPa',
          'FS = ' + f.flambagem.fs + ' já aplicado no limite.');
        if (!f.rigidezMinOk) {

        }

    }

    /* espessura mínima AREMA para camisa de aço cravada */
    if (ctx.camisaUsada && ctx.camisa.material === 'aco' && ctx.instalacao === 'cravacao') {
      var eMin = C.eMinArema(ctx.camisa.de);
      v('arema', 'Espessura mínima da camisa (AREMA)', ctx.camisa.e >= eMin - 1e-9,
        ctx.camisa.e.toFixed(2).replace('.', ',') + ' mm', '≥ ' + eMin.toFixed(2).replace('.', ',') + ' mm',
        'Parede mínima para cravação de camisa lisa sem revestimento. Confirmar o regulamento do órgão.',
        ctx.tipo === 'rodovia');

          it.folga.toFixed(0) + ' mm', '≥ ' + it.folgaMin.toFixed(0) + ' mm',
          'DI da camisa menos DE do condutor, para bolsas, luvas e espaçadores.');
      }
      if (it.pressaoOk !== null) {

          it.pServBar.toFixed(1).replace('.', ',') + ' bar', '≤ PN ' + String(it.pn).replace('.', ','),
          'Sem transiente. Verificar o golpe de aríete no dimensionamento da linha.');

        it.pExt.toFixed(1).replace('.', ',') + ' kPa',
        '≤ ' + (it.pcr / it.fsColapso).toFixed(1).replace('.', ',') + ' kPa',
        'Anel não confinado (Timoshenko), FS = ' + it.fsColapso + '. Considerar também a pressão de grauteamento, se houver.');

          pServ2.toFixed(1).replace('.', ',') + ' bar', '≤ PN ' + String(ctx.condutor.pn).replace('.', ','),
          'Sem transiente. Verificar o golpe de aríete no dimensionamento da linha.');

    res.nRuim = V.filter(function (x) { return x.classe === 'ruim'; }).length;

(function (TRV) {
  'use strict';

  var Q = {};
  var UI, h;
  var NS = 'http://www.w3.org/2000/svg';

  Q.init = function () { UI = TRV.UI; h = UI.h; };

  function sv(tag, attrs, filhos) {
    var e = document.createElementNS(NS, tag), k;
    for (k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    if (filhos) (Array.isArray(filhos) ? filhos : [filhos]).forEach(function (f) {
      if (typeof f === 'string') e.appendChild(document.createTextNode(f));
      else if (f) e.appendChild(f);

  function txt(x, y, s, anchor, classe) {

    return t;

    var g = sv('g', { class: 'cota' });

      stroke: 'currentColor', 'stroke-width': 1, 'marker-start': 'url(#seta-i)', 'marker-end': 'url(#seta-f)' }));
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    var vertical = Math.abs(x2 - x1) < Math.abs(y2 - y1);
    var t = txt(vertical ? mx + (lado === 'esq' ? -6 : 8) : mx,
                vertical ? my + 3 : my - 5, rotulo,
                vertical ? (lado === 'esq' ? 'end' : 'start') : 'middle', 'cota-t');
    g.appendChild(t);
    return g;

  function fmt(v, d) { return UI.num(v, d === undefined ? 2 : d); }

  /* ================================================================
     Perfil longitudinal da travessia

  Q.perfil = function (st, ctx) {
    var W = 760, Ht = 320;
    var t = st.travessia;
    var ferrovia = t.tipo === 'ferrovia';

    var svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + Ht, class: 'esquema',
                          width: '100%', preserveAspectRatio: 'xMidYMid meet', role: 'img' });

                             markerWidth: 6, markerHeight: 6, orient: k ? 'auto' : 'auto-start-reverse' });
      m.appendChild(sv('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'currentColor' }));
      defs.appendChild(m);

    svg.appendChild(defs);

    /* escala vertical: superfície da via em ySup; tubo em ySup + H·esc */
    var H = ctx.H;
    var altAterro = Math.max(0, Number(t.altAterro) || 0);
    var deM = ctx.DeEst ? ctx.DeEst / 1000 : 0.5;
    var profTotal = H + deM + Math.max(1, 0.6 * H);
    var ySup = 78;
    var esc = Math.min(46, 170 / profTotal);

    var yTerreno = ySup + altAterro * esc;
    var yTuboTopo = ySup + H * esc;
    var dTubo = Math.max(10, deM * esc);
    var yTuboBase = yTuboTopo + dTubo;

    var cx = W / 2;
    var plat = Math.max(90, Math.min(300, (Number(t.largPlataforma) || 12) * 14));
    var talude = altAterro * esc * 1.5;

    /* terreno natural */
    svg.appendChild(sv('path', {
      class: 'terreno',

      fill: 'none', 'stroke-width': 1.6
    }));

    /* aterro da via (trapézio) */
    if (altAterro > 0.02) {
      svg.appendChild(sv('path', {
        class: 'estrutura',
        d: 'M ' + (cx - plat / 2 - talude) + ' ' + yTerreno +
           ' L ' + (cx - plat / 2) + ' ' + ySup +
           ' H ' + (cx + plat / 2) +
           ' L ' + (cx + plat / 2 + talude) + ' ' + yTerreno + ' Z',
        fill: 'none', 'stroke-width': 1.4

        stroke: 'currentColor', 'stroke-width': 2.4 }));
      svg.appendChild(txt(cx, ySup - 14, 'ferrovia — ' +
        (TRV.LD.trem(TRV.LD.ferroviarios, st.cargaMovel.modeloFerrovia).rot), 'middle', 'rotulo'));
    } else {
      svg.appendChild(sv('rect', { x: cx - plat / 2, y: ySup - 6, width: plat, height: 6,
        fill: 'currentColor', opacity: 0.75, rx: 1.5 }));

      var gT = sv('g', { fill: 'none', stroke: 'currentColor', 'stroke-width': 1.6 });
      gT.appendChild(sv('rect', { x: cx - 30, y: ySup - 34, width: 38, height: 20, rx: 2 }));
      gT.appendChild(sv('rect', { x: cx + 8, y: ySup - 26, width: 16, height: 12, rx: 2 }));
      gT.appendChild(sv('circle', { cx: cx - 20, cy: ySup - 10, r: 4.5 }));
      gT.appendChild(sv('circle', { cx: cx - 4, cy: ySup - 10, r: 4.5 }));
      gT.appendChild(sv('circle', { cx: cx + 16, cy: ySup - 10, r: 4.5 }));
      svg.appendChild(gT);
      svg.appendChild(txt(cx, ySup - 42, 'rodovia — ' +

      svg.appendChild(txt(36, yNA - 4, '▽ NA', 'start', 'rotulo'));
    }

    var compCam = ctx.compCamisa;
    var larguraDesenhoCam = Math.min(W - 120, Math.max(plat + 2 * talude + 40,

      svg.appendChild(sv('rect', {
        class: 'tubo', x: cx - larguraDesenhoCam / 2, y: yCamTopo,
        width: larguraDesenhoCam, height: dCam,
        fill: 'none', 'stroke-width': 2.4, rx: 2
      }));
      yTuboTopo = yCamTopo + (dCam - Math.max(6, (ctx.condutor.de || 300) / 1000 * esc)) / 2;
      dTubo = Math.max(6, (ctx.condutor.de || 300) / 1000 * esc);
      yTuboBase = yCamTopo + dCam;

      /* espaçadores */
      var nE = Math.max(2, Math.round(larguraDesenhoCam / 60));
      for (var kE = 0; kE < nE; kE++) {
        var xe = cx - larguraDesenhoCam / 2 + (kE + 0.5) * larguraDesenhoCam / nE;
        svg.appendChild(sv('line', { x1: xe, y1: yTuboTopo + dTubo, x2: xe, y2: yCamTopo + dCam,

      }
      svg.appendChild(cota(cx - larguraDesenhoCam / 2, yCamTopo + dCam + 26,
                           cx + larguraDesenhoCam / 2, yCamTopo + dCam + 26,
                           'camisa L = ' + fmt(compCam, 1) + ' m'));
      svg.appendChild(txt(cx + larguraDesenhoCam / 2 + 8, yCamTopo + dCam / 2 + 3,
        (ctx.camisa.material === 'concreto' ? 'galeria DN ' : 'camisa DE ') +
        UI.numEdit(ctx.camisa.material === 'concreto' ? ctx.camisa.dn : ctx.camisa.de) + ' mm', 'start', 'rotulo'));
    }

    svg.appendChild(sv('rect', {

    svg.appendChild(txt(46, yTuboTopo + dTubo + 13,

/* ===== 08c-formula.js ===== */
/* ------------------------------------------------------------------
 * Composição de fórmulas com cara de fórmula.
 *
 * Um compositor matemático pequeno: recebe um código parecido com o do
 * LaTeX ( \frac{a}{b}, \sqrt{x}, a^2, \pi, \cdot ) e devolve um SVG com
 * fração de barra horizontal, radical com barra sobre o radicando,
 * expoentes, índices e parênteses que crescem com o conteúdo.
 *
 * Sai em SVG por dois motivos: fica nítido em qualquer zoom na impressão

    var cfg = UI.get(st, base);
    var lista = TRV.CAT.paraUso(cats.todos, uso);
    var porFam = TRV.CAT.porFamilia(lista);
    var sel = h('select', { 'data-bind': base + '.catalogoId', 'data-tipo': 'texto' });
    Object.keys(porFam).forEach(function (fam) {
      var g = h('optgroup', { label: fam });
      porFam[fam].forEach(function (c) {
        g.appendChild(h('option', { value: c.id, selected: c.id === cfg.catalogoId }, c.nome));
      });
      sel.appendChild(g);
    });
    return h('label', { class: 'campo chave' },
      h('span', { class: 'rot' }, 'Catálogo / material'),
      sel);
  }

  function seletorDiametro(st, base, uso, cats) {
    var cfg = UI.get(st, base);
    var cat = TRV.CAT.buscar(cats.todos, cfg.catalogoId);
    var opcoes = [h('option', { value: '', selected: !cfg.itemRot }, '— escolher —')];
    if (cat) {
      cat.itens.forEach(function (it) {
        var di = TRV.CAT.diInterno(cat, it);
        var rot = it.rot + '  ·  e ' + UI.num(it.e, 1) + ' mm  ·  DI ' + UI.num(di, 0) + ' mm' +
                  (it.pn ? '  ·  PN ' + String(it.pn).replace('.', ',') : '');
        opcoes.push(h('option', { value: it.rot, selected: it.rot === cfg.itemRot }, rot));
      });
    }
    return h('label', { class: 'campo chave' },
      h('span', { class: 'rot' }, 'Diâmetro'),
      h('select', { 'data-bind': base + '.itemRot', 'data-tipo': 'texto' }, opcoes));
  }

  function resumoTubo(tubo, rotulo) {
    if (!tubo || tubo.semDiametro) {
      return h('div', { class: 'aviso info' }, 'Escolha o catálogo e o diâmetro para ver as dimensões.');
    }
    var linhas = [
      ['DE — diâmetro externo', UI.num(tubo.de, 1) + ' mm'],
      ['e — espessura de parede', UI.num(tubo.e, 2) + ' mm' + (tubo.eAlterada ? ' (alterada)' : '')],
      ['DI — diâmetro interno', UI.num(tubo.di, 1) + ' mm'],
      ['Material', tubo.mat.rot]
    ];
    if (tubo.pn) linhas.push(['PN', String(tubo.pn).replace('.', ',') + ' bar']);
    if (tubo.sn) linhas.push(['Rigidez SN', UI.numEdit(tubo.sn) + ' N/m²']);
    return h('div', { class: 'faixa-resumo', style: 'margin:4px 0 8px' },
      linhas.map(function (l) {
        return h('span', { class: 'chip' },
          h('span', { class: 'rot' }, l[0]), h('span', { class: 'val' }, l[1]));
      }),
      (tubo.item && (tubo.item.calc || tubo.item.verificar))
        ? h('span', { class: 'nota', style: 'align-self:center' },
            tubo.item.calc ? 'espessura por fórmula normativa · ' : '',
            tubo.item.verificar ? 'confirmar no fabricante/órgão' : '')
        : null);
  }

    this.nSub = 0;
    return el;
  };

  Doc.prototype.capituloSemNumero = function (titulo) {
    var id = 'cap0' + this.capitulos.length;
    this.capitulos.push({ id: id, num: '', titulo: titulo, nivel: 1 });
    this.nSub = 0;
    return this.add(h('h1', { class: 'doc-h1 bloco pagina-nova', 'data-ref': id }, titulo));
  };

  Doc.prototype.secao = function (titulo) {
    this.nSub = (this.nSub || 0) + 1;
    var num = this.nCap + '.' + this.nSub;
    var id = 'sec' + num.replace('.', '_');
    this.capitulos.push({ id: id, num: num, titulo: titulo, nivel: 2 });
    return this.add(h('h2', { class: 'doc-h2 bloco', 'data-ref': id }, num + ' ' + titulo));
  };

  Doc.prototype.p = function () {
    var el = h('p', { class: 'doc-p bloco' });
    var i;
    for (i = 0; i < arguments.length; i++) UI.add(el, arguments[i]);
    return this.add(el);
  };

  Doc.prototype.nota = function (txt) {
    return this.add(h('p', { class: 'doc-nota bloco' }, txt));
  };

  Doc.prototype.formula = function (codigo, legenda, op) {
    op = op || {};
    var corpo = h('div', { class: 'formula-corpo' });
    (Array.isArray(codigo) ? codigo : [codigo]).forEach(function (c) {
      corpo.appendChild(TRV.FX.svg(c, { tam: 17 }));
    });
    var num = '';
    if (!op.semNumero) { this.equacoes++; num = '(' + this.equacoes + ')'; }
    var el = h('div', { class: 'doc-formula bloco-junto' },
      corpo,
      h('div', { class: 'formula-num' }, num));
    this.add(el);
    if (legenda) {
      this.add(h('p', { class: 'formula-leg bloco', html: 'em que ' + TRV.FX.emTexto(legenda) }));
    }
    return this.equacoes;
  };

  Doc.prototype.aplicacao = function () {
    var linhas = [], i;
    for (i = 0; i < arguments.length; i++) if (arguments[i]) linhas.push(arguments[i]);
    if (!linhas.length) return null;
    var bloco = h('div', { class: 'doc-aplicacao bloco-junto' });
    var textos = [], rotulos = [];
    linhas.forEach(function (l) {
      if (typeof l === 'object' && l.rot) rotulos.push(l);
      else textos.push(String(l));
    });
    rotulos.forEach(function (l) { bloco.appendChild(h('p', { class: 'doc-p sem-recuo' }, l.rot)); });
    if (textos.length) bloco.appendChild(TRV.FX.bloco(textos, { tam: 15 }));
    return this.add(bloco);
  };

  Doc.prototype.alineas = function (itens) {
    var letras = 'abcdefghijklmnopqrstuvwxyz';
    return this.add(h('ul', { class: 'doc-alineas bloco' },
      itens.map(function (t, i) {
        return h('li', {}, letras.charAt(i) + ') ' + t + (i === itens.length - 1 ? '.' : ';'));
      })));
  };

  Doc.prototype.tabela = function (titulo, cabs, linhas, fonte) {
    var num = this.tabelas.length + 1;
    var id = 'tab' + num;
    this.tabelas.push({ id: id, num: num, titulo: titulo });
    var tab = h('table', { class: 'doc-tabela' },
      h('thead', {}, h('tr', {}, cabs.map(function (c) {
        return typeof c === 'string' ? h('th', {}, c)
          : h('th', { class: c.esq ? 'esq' : null }, c.rot);
      }))),
      h('tbody', {}, linhas));
    return this.add(h('div', { class: 'doc-quadro bloco-tabela', 'data-ref': id },
      h('div', { class: 'doc-cap-tab' }, 'Tabela ' + num + ' – ' + titulo),
      tab,
      fonte ? h('div', { class: 'doc-fonte' }, 'Fonte: ' + fonte) : null));
  };

  Doc.prototype.figura = function (titulo, el, fonte) {
    var num = this.figuras.length + 1;
    var id = 'fig' + num;
    this.figuras.push({ id: id, num: num, titulo: titulo });
    return this.add(h('div', { class: 'doc-quadro bloco-junto', 'data-ref': id },
      h('div', { class: 'doc-cap-fig' }, 'Figura ' + num + ' – ' + titulo),
      h('div', { class: 'doc-fig' }, el),
      fonte ? h('div', { class: 'doc-fonte' }, 'Fonte: ' + fonte) : null));
  };

  Doc.prototype.usar = function () {
    var i;
    for (i = 0; i < arguments.length; i++) this.fontesUsadas[arguments[i]] = true;
    return MEM.cit(arguments[0]);
  };

  function linha2(a, b) {
    return h('tr', {}, h('td', { class: 'esq' }, a), h('td', {}, b));
  }

  /* ================================================================
     Introdução padrão
     ================================================================ */

  MEM.introducaoPadrao = function (st, ctx, res) {
    var t = st.travessia;
    var via = st.projeto.via ? st.projeto.via + (st.projeto.km ? ', ' + st.projeto.km : '') : null;
    var ferrovia = t.tipo === 'ferrovia';
    var met = {
      camisa_cravada: 'método não destrutivo, com cravação de tubo camisa de aço',
      galeria: 'cravação de galeria de tubos de concreto armado',
      hdd: 'furo direcional horizontal (HDD), com o condutor lançado diretamente no maciço',
      vala: 'abertura de vala a céu aberto com posterior recomposição'
    }[t.metodo] || 'método não destrutivo';

    var p1 = 'Este memorial apresenta o dimensionamento e a verificação estrutural da tubulação na travessia ' +
      'sob a ' + (ferrovia ? 'ferrovia' : 'rodovia') + (via ? ' ' + via : '') +
      (st.projeto.local ? ', em ' + st.projeto.local : '') + '. ' +
      'A travessia será executada por ' + met + ', com recobrimento de ' + n(ctx.H) + ' m entre ' +
      (ferrovia ? 'o boleto do trilho' : 'o greide do pavimento') + ' e a geratriz superior do ' +
      (ctx.camisaUsada ? 'tubo camisa' : 'condutor') + '.';

    var cond = ctx.condutor;
    var p2 = 'O condutor é um tubo ' + (cond.mat ? cond.mat.rot : '') +
      (cond.item ? ' ' + cond.item.rot + ' (DE ' + ne(cond.de) + ' mm, parede ' + n(cond.e, 1) + ' mm' +
        (cond.pn ? ', PN ' + String(cond.pn).replace('.', ',') : '') + ')' : '') + '.' +
      (ctx.camisaUsada && ctx.camisa && !ctx.camisa.semDiametro
        ? ' Ele é instalado no interior de ' +
          (ctx.camisa.material === 'concreto'
            ? 'galeria de tubos de concreto DN ' + ne(ctx.camisa.dn)
            : 'tubo camisa de aço DE ' + ne(ctx.camisa.de) + ' mm × ' + n(ctx.camisa.e, 1) + ' mm') +
          ', sobre espaçadores, com as extremidades vedadas.'
        : '');

    var p3 = 'As cargas consideradas são o peso do solo de cobertura e a carga móvel ' +
      (ferrovia ? 'ferroviária' : 'rodoviária') + ' (' +
      (ferrovia ? TRV.LD.trem(TRV.LD.ferroviarios, st.cargaMovel.modeloFerrovia).rot
                : TRV.LD.trem(TRV.LD.rodoviarios, st.cargaMovel.modeloRodovia).rot) + '), ' +
      'propagada até a profundidade do tubo. As verificações seguem a teoria de Marston-Spangler para condutos ' +
      'enterrados e os critérios dos manuais AWWA (M11 e M55), da AREMA e das normas ABNT aplicáveis, ' +
      'conforme detalhado nos capítulos seguintes.';

    return p1 + '\n\n' + p2 + '\n\n' + p3;
  };

  /* ================================================================
     O documento
     ================================================================ */

  MEM.documento = function (st, ctx, res) {
    var D = new Doc(st, ctx, res);
    var t = st.travessia;
    var c = res.cargas;
    var ferrovia = t.tipo === 'ferrovia';
    var cri = st.criterios;

    /* ---------------- 1 INTRODUÇÃO ---------------- */
    D.capitulo('INTRODUÇÃO');
    var intro = (st.memorial && st.memorial.introducao) || MEM.introducaoPadrao(st, ctx, res);
    intro.split(/\n\s*\n/).forEach(function (par) { if (par.trim()) D.p(par.trim()); });
    if (st.memorial && st.memorial.objetivo) {
      D.secao('Objetivo');
      st.memorial.objetivo.split(/\n\s*\n/).forEach(function (par) { if (par.trim()) D.p(par.trim()); });
    }

    /* ---------------- 2 CARACTERIZAÇÃO ---------------- */
    D.capitulo('CARACTERIZAÇÃO DA TRAVESSIA');
    var met = { camisa_cravada: 'Tubo camisa de aço cravado (método não destrutivo)',
                galeria: 'Galeria de tubos de concreto cravados',
                hdd: 'Furo direcional horizontal (HDD)',
                vala: 'Vala a céu aberto' }[t.metodo] || '—';
    var linhasCar = [
      linha2('Tipo de via', ferrovia ? 'Ferrovia' : 'Rodovia'),
      st.projeto.via ? linha2('Via interferida', st.projeto.via + (st.projeto.km ? ' — ' + st.projeto.km : '')) : null,
      st.projeto.orgao ? linha2('Órgão / concessionária', st.projeto.orgao) : null,
      linha2('Método executivo', met),
      linha2('Recobrimento H (topo do ' + (ctx.camisaUsada ? 'tubo camisa' : 'condutor') + ')', n(ctx.H) + ' m'),
      linha2('Largura da plataforma', n(t.largPlataforma, 1) + ' m'),
      linha2('Esviamento', n(t.esviamento, 0) + '°'),
      linha2('Comprimento da travessia', n(ctx.compTravessia, 1) + ' m' +
             (t.compManual ? ' (imposto)' : ' (calculado)')),
      ctx.camisaUsada ? linha2('Comprimento da camisa', n(ctx.compCamisa, 1) + ' m') : null,
      linha2('Nível d\'água acima do topo', ctx.hAgua > 0 ? n(ctx.hAgua) + ' m' : 'abaixo do tubo'),
      linha2('Condutor', (ctx.condutor.mat ? ctx.condutor.mat.rot + ' ' : '') +
             (ctx.condutor.item ? ctx.condutor.item.rot + ' — DE ' + ne(ctx.condutor.de) +
              ' × ' + n(ctx.condutor.e, 1) + ' mm' : '—')),
      ctx.camisaUsada && ctx.camisa && !ctx.camisa.semDiametro
        ? linha2(ctx.camisa.material === 'concreto' ? 'Galeria' : 'Tubo camisa',
                 (ctx.camisa.material === 'concreto'
                   ? 'Concreto NBR 8890 DN ' + ne(ctx.camisa.dn) + ', classe ' + st.camisa.classeConcreto
                   : 'Aço DE ' + ne(ctx.camisa.de) + ' × ' + n(ctx.camisa.e, 1) + ' mm'))
        : null
    ].filter(Boolean);
    D.tabela('Dados gerais da travessia', [{ rot: 'Grandeza', esq: true }, { rot: 'Valor' }], linhasCar,
             'elaborado pelo autor.');

    D.figura('Perfil esquemático da travessia',
      h('div', {}, TRV.Q.perfil(st, ctx).querySelector('svg')), 'elaborado pelo autor.');
    if (ctx.camisaUsada && ctx.camisa && !ctx.camisa.semDiametro) {
      var sec = TRV.Q.secao(st, ctx);
      if (sec) D.figura('Seção transversal — camisa e condutor',
        h('div', {}, sec.querySelector('svg')), 'elaborado pelo autor.');
    }

    /* ---------------- 3 PARÂMETROS ---------------- */
    D.capitulo('PARÂMETROS GEOTÉCNICOS E CRITÉRIOS');
    D.p('O solo de cobertura foi caracterizado como ', h('b', {}, ctx.solo.rot.toLowerCase()),
      ', com peso específico γ = ' + n(ctx.solo.gama, 1) + ' kN/m³ e produto Kμ′ = ' +
      n(ctx.solo.ku, 3) + ' ' + D.usar('marston') + '. O módulo de reação do solo adotado é E′ = ' +
      n(ctx.solo.ePrime, 2) + ' MPa, conforme a tabela de Howard ' + D.usar('howard') +
      ' para o grupo de solo e o grau de compactação do envolvimento.' +
      (ctx.solo.coesao > 0 ? ' No método túnel considera-se a coesão c = ' + n(ctx.solo.coesao, 0) + ' kPa.' : ''));
    D.tabela('Critérios de verificação adotados',
      [{ rot: 'Critério', esq: true }, { rot: 'Valor' }], [
        linha2('Recobrimento mínimo (' + (ferrovia ? 'ferrovia' : 'rodovia') + ')',
               n(ferrovia ? cri.hMinFerrovia : cri.hMinRodovia) + ' m'),
        linha2('Fator de segurança — flambagem confinada', n(cri.fsFlambagem, 1)),
        linha2('Fator de segurança — colapso não confinado', n(cri.fsColapso, 1)),
        ctx.camisaUsada && ctx.camisa.material === 'aco'
          ? linha2('Compressão anelar do aço', 'σ adm = fy / ' + n(cri.fsAnelarAco, 1)) : null,
        ctx.camisaUsada && ctx.camisa.material === 'concreto'
          ? linha2('Três cutelos — fissura / ruptura', 'FS ' + n(cri.fsFissura, 1) + ' / ' + n(cri.fsRuptura, 1)) : null,
        ctx.camisaUsada ? linha2('Folga mínima camisa × condutor', n(cri.folgaCamisaMm, 0) + ' mm') : null
      ].filter(Boolean), 'elaborado pelo autor.');

    /* ---------------- 4 CARGAS ---------------- */
    D.capitulo('CARGAS ATUANTES');

    D.secao('Carga de solo');
    var s = c.solo;
    if (s.usado === 'marston_vala') {
      D.p('Para tubo assentado em vala e reaterrado, a carga de solo é aliviada pelo atrito do prisma ' +
        'de reaterro contra as paredes da vala, conforme a teoria de Marston ' + D.usar('marston') + ':');
      D.formula(['C_d = \\frac{1 - e^{-2 K \\mu\' \\cdot H / B_d}}{2 K \\mu\'}', s.formula],
        'C_d é o coeficiente de carga; K\\mu\' = ' + n(ctx.solo.ku, 3) + '; H = ' + n(ctx.H) +
        ' m é o recobrimento; B_d = ' + n(ctx.Bd) + ' m é a largura da vala; \\gamma = ' +
        n(ctx.solo.gama, 1) + ' kN/m³.');
      D.aplicacao(
        'C_d = \\frac{1 - e^{-2 \\cdot ' + n(ctx.solo.ku, 3) + ' \\cdot ' + n(ctx.H) + ' / ' + n(ctx.Bd) + '}}{2 \\cdot ' + n(ctx.solo.ku, 3) + '} = ' + n(s.coef, 3),
        'P_v = ' + n(s.Pv, 1) + '\\ \\text{kPa}');
    } else if (s.usado === 'marston_tunel') {
      D.p('Para tubo cravado ou instalado por perfuração, sem abertura de vala, o maciço sobrejacente ' +
        'arqueia sobre o furo e a carga é dada pela formulação de Marston para túneis ' +
        D.usar('marston', 'spanglerHandy') + ':');
      D.formula(['C_t = \\frac{1 - e^{-2 K \\mu \\cdot H / B_t}}{2 K \\mu}',
                 'W_t = C_t \\cdot B_t (\\gamma \\cdot B_t - 2c)'],
        'C_t é o coeficiente de carga do túnel; B_t = ' + n(ctx.Bt) + ' m é o diâmetro da perfuração; ' +
        'c = ' + n(ctx.solo.coesao, 0) + ' kPa é a coesão do solo; \\gamma = ' + n(ctx.solo.gama, 1) + ' kN/m³.');
      D.aplicacao(
        'C_t = \\frac{1 - e^{-2 \\cdot ' + n(ctx.solo.ku, 3) + ' \\cdot ' + n(ctx.H) + ' / ' + n(ctx.Bt) + '}}{2 \\cdot ' + n(ctx.solo.ku, 3) + '} = ' + n(s.coef, 3),
        'P_v = C_t (\\gamma B_t - 2c) = ' + n(s.Pv, 1) + '\\ \\text{kPa}');
    } else {
      D.p('A carga de solo foi tomada como o prisma completo de terra sobre o tubo, sem alívio de ' +
        'atrito — hipótese recomendada pela AWWA para tubos flexíveis em projeto de longa vida ' +
        D.usar('awwa_m55') + ':');
      D.formula('P_v = \\gamma \\cdot H',
        '\\gamma = ' + n(ctx.solo.gama, 1) + ' kN/m³ é o peso específico do solo e H = ' + n(ctx.H) + ' m o recobrimento.');
      D.aplicacao('P_v = ' + n(ctx.solo.gama, 1) + ' \\cdot ' + n(ctx.H) + ' = ' + n(s.Pv, 1) + '\\ \\text{kPa}');
    }
    if (s.limitadoPrisma) {
      D.nota('O resultado de Marston foi limitado ao prisma γ·H = ' + n(s.prisma, 1) +
        ' kPa, que é o máximo físico da carga de solo.');
    } else if (s.usado !== 'prisma') {
      D.nota('Para referência, o prisma completo vale γ·H = ' + n(s.prisma, 1) + ' kPa; a carga adotada corresponde a ' +
        n(s.fracaoPrisma * 100, 0) + '% desse valor.');
    }

    D.secao('Carga móvel');
    var m = c.movel;
    if (ferrovia && (st.cargaMovel.modeloFerrovia === 'cooper80' || st.cargaMovel.distribuicao === 'arema')) {
      D.p('A pressão da carga ferroviária na profundidade do tubo foi obtida da tabela da AREMA para o trem ' +
        'Cooper E-80 ' + D.usar('arema') + ', que já incorpora o efeito dinâmico. ' +
        (m.modelo.indexOf('E-80') < 0 ? 'Para o trem-tipo ' + m.modelo + ' a pressão é escalonada pela relação entre as cargas de eixo. ' : '') +
        'Na profundidade H = ' + n(ctx.H) + ' m resulta:');
      D.aplicacao('p_m = ' + n(m.p, 1) + '\\ \\text{kPa}');
    } else if (ferrovia) {
      D.p('A carga ferroviária (' + m.modelo + ' ' + D.usar('nbr7189') + ') foi distribuída pela área do ' +
        'dormente e espraiada em profundidade, com o fator de impacto aplicado:');
      D.formula('p_m = \\frac{n \\cdot Q \\cdot I_c}{(L_d + 2 m H)(L_g + 2 m H)}',
        'n é o número de eixos do grupo; Q a carga por eixo; L_d o comprimento do dormente; ' +
        'L_g o comprimento do grupo de eixos; m = ' + n(st.cargaMovel.espraiamento, 2) + ' a inclinação do espraiamento; I_c = ' + n(m.ic, 2) + '.');
      D.aplicacao('p_m = ' + n(m.p, 1) + '\\ \\text{kPa}');
    } else {
      if (st.cargaMovel.distribuicao === 'aashto') {
        D.p('A pressão das rodas do veículo-tipo ' + m.modelo + ' ' + D.usar('nbr7188') +
          ' foi propagada pelo espraiamento geométrico da AASHTO ' + D.usar('aashto') +
          ', em que a área de contato cresce LLDF·H em cada direção, com fusão das áreas de rodas ' +
          'vizinhas quando se sobrepõem. O fator de impacto adotado é Ic = ' + n(m.ic, 2) + '.');
      } else {
        D.p('A pressão das rodas do veículo-tipo ' + m.modelo + ' ' + D.usar('nbr7188') +
          ' foi obtida por integração da solução elástica de Boussinesq sob as seis rodas do veículo ' +
          '(método de Newmark para área retangular carregada) ' + D.usar('boussinesq') +
          ', avaliada na posição mais desfavorável em planta. O fator de impacto adotado é Ic = ' +
          n(m.ic, 2) + (st.cargaMovel.impacto === 'aashto' ? ', decrescente com a profundidade conforme a AASHTO LRFD' + (D.usar('aashto') ? '' : '') : '') + '.');
        D.formula('\\sigma_z = \\frac{q}{4\\pi} [\\frac{2mn\\sqrt{m^2+n^2+1}}{m^2+n^2+1+m^2 n^2} \\cdot \\frac{m^2+n^2+2}{m^2+n^2+1} + \\text{arctg}\\frac{2mn\\sqrt{m^2+n^2+1}}{m^2+n^2+1-m^2 n^2}]',
          'q é a pressão de contato da roda; m = a/z e n = b/z são as razões entre as meias-dimensões ' +
          'da área carregada e a profundidade z (superposição dos quatro quadrantes).', {});
      }
      D.aplicacao('p_m = ' + n(m.p, 1) + '\\ \\text{kPa}');
    }

    D.secao('Resumo das cargas');
    D.tabela('Pressões verticais na profundidade do tubo',
      [{ rot: 'Parcela', esq: true }, 'kPa', 'kgf/m²'], [
        h('tr', {}, h('td', { class: 'esq' }, 'Solo — ' + s.metodoRot), h('td', {}, n(s.Pv, 1)),
          h('td', {}, n(s.Pv / 9.80665 * 1000, 0))),
        h('tr', {}, h('td', { class: 'esq' }, 'Carga móvel — ' + m.modelo), h('td', {}, n(m.p, 1)),
          h('td', {}, n(m.p / 9.80665 * 1000, 0))),
        c.sobrecarga > 0 ? h('tr', {}, h('td', { class: 'esq' }, 'Sobrecarga na superfície'),
          h('td', {}, n(c.sobrecarga, 1)), h('td', {}, n(c.sobrecarga / 9.80665 * 1000, 0))) : null,
        h('tr', { class: 'total' }, h('td', { class: 'esq' }, 'Total'),
          h('td', {}, n(c.PvTotal, 1)), h('td', {}, n(c.PvTotal / 9.80665 * 1000, 0)))
      ].filter(Boolean), 'elaborado pelo autor.');

    /* ---------------- 5 ELEMENTO ESTRUTURAL ---------------- */
    var f = res.flexEstrutural;
    var rg = res.rigido;
    var nomeEl = ctx.camisaUsada
      ? (ctx.camisa.material === 'concreto' ? 'GALERIA DE CONCRETO' : 'TUBO CAMISA DE AÇO')
      : 'CONDUTOR ENTERRADO';
    D.capitulo('VERIFICAÇÃO DO ' + nomeEl);

    if (f) {
      var cfgEl = st[f.elem];
      D.secao('Deflexão — fórmula de Iowa modificada');
      D.p('A deflexão vertical do tubo flexível sob a carga de solo e de tráfego é estimada pela fórmula ' +
        'de Iowa modificada ' + D.usar('spangler', 'watkins') + ', com o fator de deflexão diferida D_L = ' +
        n(f.DL, 2) + ' aplicado à parcela permanente e o módulo de ' +
        (f.tubo.material.indexOf('pead') === 0 || f.tubo.material === 'pvc' ? 'longa duração ' : 'elasticidade ') +
        'E = ' + ne(f.eLongo) + ' MPa:');
      D.formula('\\frac{\\Delta y}{D_e} = \\frac{K (D_L W_c + W_m)}{(\\frac{E I}{r^3} + 0,061 E\') \\cdot D_e}',
        'K = ' + n(f.K, 3) + ' é a constante de leito (apoio de ' + cfgEl.apoioGraus + '°); ' +
        'W_c e W_m são as cargas permanente e móvel por unidade de comprimento; ' +
        'I = e³/12 = ' + n(f.I, 1) + ' mm⁴/mm; r = ' + n(f.r, 1) + ' mm é o raio médio; ' +
        'E\' = ' + n(ctx.solo.ePrime, 2) + ' MPa é o módulo de reação do solo.');
      D.aplicacao(
        '\\frac{E I}{r^3} = ' + n(f.rigidezAnel * 1000, 2) + '\\ \\text{kPa}',
        '0,061 E\' = ' + n(f.frs * 1000, 2) + '\\ \\text{kPa}',
        '\\Delta y = ' + n(f.deflexao.mm, 1) + '\\ \\text{mm} \\to \\frac{\\Delta y}{D_e} = ' +

      inf: t ? t.margInf : X.PAG.margInf

    medidor.appendChild(el);

    medidor.removeChild(el);

  /* ================================================================

  function dividirTabela(quadro, medidor, alturaPrimeira, alturaCheia) {
    var clone = quadro.cloneNode(true);
    medidor.appendChild(clone);
    var cap = clone.querySelector('.doc-cap-tab');
    var tab = clone.querySelector('table');
    var fonte = clone.querySelector('.doc-fonte');
    if (!tab) { medidor.removeChild(clone); return null; }

    var thead = tab.querySelector('thead');
    var linhas = Array.prototype.slice.call(tab.querySelectorAll('tbody tr'));
    var alturas = linhas.map(function (tr) { return tr.getBoundingClientRect().height; });
    medidor.removeChild(clone);

    if (!linhas.length) return null;

    function montar(de, ate, continuacao, comFonte) {
      var parte = quadro.cloneNode(false);
      parte.removeAttribute('data-ref');
      if (!continuacao && quadro.getAttribute('data-ref')) {
        parte.setAttribute('data-ref', quadro.getAttribute('data-ref'));
      }
      if (cap) {
        var c2 = cap.cloneNode(true);
        if (continuacao) c2.textContent = cap.textContent + '  (continuação)';
        parte.appendChild(c2);
      }
      var t2 = tab.cloneNode(false);
      if (thead) t2.appendChild(thead.cloneNode(true));
      var tb = document.createElement('tbody');
      for (var k = de; k < ate; k++) tb.appendChild(linhas[k].cloneNode(true));
      t2.appendChild(tb);
      parte.appendChild(t2);
      if (comFonte && fonte) parte.appendChild(fonte.cloneNode(true));
      return parte;
    }

    function sobrecarga(continuacao, comFonte) {
      return medir(medidor, montar(0, 1, continuacao, comFonte)) - alturas[0];
    }

    var sobreCont = sobrecarga(true, false);
    var sobreUlt = sobrecarga(false, true) - sobrecarga(false, false);

    var partes = [], idx = 0, primeira = true;
    var MIN_LINHAS = 2;
    while (idx < linhas.length) {
      var cont = partes.length > 0;
      var disp = (primeira ? alturaPrimeira : alturaCheia) - (cont ? sobreCont : sobreNormal);
      var n = 0, acc = 0;
      while (idx + n < linhas.length && acc + alturas[idx + n] <= disp) { acc += alturas[idx + n]; n++; }
      if (idx + n >= linhas.length) {
        while (n > 1 && acc + sobreUlt > disp) { n--; acc -= alturas[idx + n]; }
      }
      if (linhas.length - (idx + n) === 1 && n > MIN_LINHAS) n--;
      if (n < MIN_LINHAS && primeira) { primeira = false; continue; }

      partes.push({ el: montar(idx, idx + n, cont, ultima), primeira: primeira });
