    var dt = new Date();
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return z(dt.getDate()) + '/' + z(dt.getMonth() + 1) + '/' + dt.getFullYear() +
           ' ' + z(dt.getHours()) + ':' + z(dt.getMinutes());
  };

  App.medirTopo = function () {
    var topo = document.querySelector('header.topo');
    var nav = document.getElementById('abas');
    if (!topo || !nav) return;
    var alt = topo.offsetHeight + nav.offsetHeight;
    document.documentElement.style.setProperty('--topo-h', alt + 'px');
  };

  App.irPara = function (aba) {
    App.aba = aba;
    App.rolarTopo = true;
    TRV.E.salvarConfig({ tema: document.documentElement.getAttribute('data-tema'), aba: aba });
    App.render();
  };

  App.agendar = function (ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { timer = null; App.render(); }, ms);
  };

  App.salvarFoco = function () {
    var a = document.activeElement;
    foco = null;
    if (a && a.getAttribute && a.getAttribute('data-bind')) {
      foco = {
        bind: a.getAttribute('data-bind'),
        tag: a.tagName,
        valor: a.value,
        ini: a.selectionStart,
        fim: a.selectionEnd
      };
    }
  };

  App.restaurarFoco = function () {
    if (!foco) return;
    var el = document.querySelector('[data-bind="' + foco.bind + '"]');
    if (!el) { foco = null; return; }
    if (el.tagName === 'INPUT' && el.type === 'text' && foco.valor !== undefined) {
      el.value = foco.valor;
    }
    try {
      el.focus();
      if (el.setSelectionRange && foco.ini !== null && foco.ini !== undefined) {
        el.setSelectionRange(foco.ini, foco.fim);
      }
    } catch (e) { /* alguns tipos de campo não aceitam seleção */ }
    foco = null;
  };

  /* ================================================================
     Eventos
     ================================================================ */

  App.ligarEventos = function () {
    document.addEventListener('input', function (e) { App.aoDigitar(e, false); });
    document.addEventListener('change', function (e) { App.aoDigitar(e, true); });
    document.addEventListener('click', App.aoClicar);
    window.addEventListener('resize', App.medirTopo);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') UI.fecharModal();
      if (e.key === 'Enter' && e.target && e.target.getAttribute &&
          e.target.getAttribute('data-bind') && e.target.tagName === 'INPUT') {
        e.preventDefault();
        e.target.blur();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); App.guardarNaBiblioteca(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); TRV.B.abrir(); }
    });
  };

  App.aoDigitar = function (e, ehChange) {
    var el = e.target;
    if (!el || !el.getAttribute) return;

    var bind = el.getAttribute('data-bind');
    if (!bind) return;
    var tipo = el.getAttribute('data-tipo') || 'num';
    var valor;
    if (tipo === 'bool') valor = el.checked;
    else if (tipo === 'texto') valor = el.value;
    else valor = el.value.trim() === '' ? null : UI.parseNum(el.value);

    UI.set(App.st, bind, valor);

    /* troca de catálogo: o diâmetro anterior pode não existir no novo */
    if (/\.catalogoId$/.test(bind)) {
      var basePai = bind.replace(/\.catalogoId$/, '');
      var c = UI.get(App.st, basePai);
      if (c) c.itemRot = '';
    }

    /* método executivo: aplica o preset de instalação e camisa */
    if (bind === 'travessia.metodo') {
      TRV.E.aplicarMetodo(App.st);
    }

    var estrutural = el.getAttribute('data-estrutural') || tipo === 'bool' ||
                     el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || ehChange;
    App.agendar(estrutural ? 0 : 320);
  };

  App.aoClicar = function (e) {
    var el = e.target.closest ? e.target.closest('[data-acao]') : null;
    if (!el) return;
    var acao = el.getAttribute('data-acao');
    var id = el.getAttribute('data-id');
    var st = App.st;

    switch (acao) {
      case 'imprimir': App.imprimir(); return;
      case 'irAba': App.irPara(el.getAttribute('data-aba')); return;
      case 'logo': App.modalLogo(); return;
      case 'restaurarCriterios':
        UI.confirmar('Restaurar critérios',
          'Voltar todos os critérios de verificação aos valores sugeridos pelo programa?',
          function () { st.criterios = TRV.E.criteriosPadrao(); App.render(); });
        return;

      case 'novoCatalogo': TRV.K.modalCatalogo(st, App.cats, null, null); return;
      case 'duplicarCatalogo':
        TRV.K.modalCatalogo(st, App.cats, null, TRV.CAT.buscar(App.cats.todos, id));
        return;
      case 'editarCatalogo': {
        var catU = App.cats.usuario.filter(function (c) { return c.id === id; })[0];
        if (catU) TRV.K.modalCatalogo(st, App.cats, catU, null);
        return;
      }
      case 'excluirCatalogo':
        UI.confirmar('Excluir catálogo', 'Excluir este catálogo do navegador? Projetos que o usam ficarão sem diâmetro.',
          function () {
            App.gravarCatalogos(App.cats.usuario.filter(function (c) { return c.id !== id; }));
            TRV.K.catAberto = null;
            App.render();
          });
        return;
      case 'exportarCatalogos': App.baixarCatalogos(); return;
      case 'importarCatalogos': App.abrirArquivo(App.carregarCatalogos); return;

      case 'novoProjeto':
        UI.confirmar('Novo projeto', 'Começar um projeto em branco? O atual continua na biblioteca se foi salvo.',
          function () { App.st = TRV.E.padrao(); App.aba = 'projeto'; App.render(); });
        return;
      case 'abrirProjeto': TRV.B.abrir(); return;
      case 'importarProjeto': UI.fecharModal(); App.abrirArquivo(App.carregarProjeto); return;
      case 'salvarProjeto': App.guardarNaBiblioteca(); return;
      case 'exportarProjeto': App.modalExportar(); return;
      case 'exportarArquivo': UI.fecharModal(); App.baixarProjeto(); return;
      case 'memorial': UI.fecharModal(); TRV.X.previa(); return;
      case 'memorialPdf': TRV.X.pdf(); return;
      case 'memorialWord': TRV.X.word(); return;
      case 'editarIntroducao': TRV.X.modalIntroducao(); return;
      case 'exemplo': TRV.B.abrir(); return;
      case 'exemploRodovia':
        UI.fecharModal(); App.st = App.exemploRodovia(); App.aba = 'resultados'; App.render(); return;
      case 'exemploFerrovia':
        UI.fecharModal(); App.st = App.exemploFerrovia(); App.aba = 'resultados'; App.render(); return;

      case 'abrirDaBiblioteca': {
        var reg = TRV.E.doBiblioteca(id);
        if (reg) {
          App.st = TRV.E.migrar(TRV.E.clone(reg.st));
          UI.fecharModal(); App.aba = 'resumo'; App.render();
          UI.toast('Projeto aberto.');
        }
        return;
      }
      case 'duplicarDaBiblioteca': {
        var reg2 = TRV.E.doBiblioteca(id);
        if (reg2) {
          var novo = TRV.E.migrar(TRV.E.clone(reg2.st));
          delete novo.id;
          novo.projeto.nome = (novo.projeto.nome || 'Projeto') + ' (cópia)';
          App.st = novo;
          UI.fecharModal(); App.aba = 'projeto'; App.render();
          UI.toast('Cópia aberta — salve para guardar na biblioteca.');
        }
        return;
      }
      case 'excluirDaBiblioteca':
        UI.confirmar('Excluir projeto', 'Excluir este projeto da biblioteca do navegador?',
          function () {
            TRV.E.excluirDaBiblioteca(id);
            TRV.B.abrir();
          });
        return;

      case 'ajuda': App.modalAjuda(); return;
      case 'tema': {
        var atual = document.documentElement.getAttribute('data-tema') === 'escuro' ? 'claro' : 'escuro';
        document.documentElement.setAttribute('data-tema', atual);
        TRV.E.salvarConfig({ tema: atual, aba: App.aba });
        return;
      }
    }
  };

  App.baixar = function (nome, texto) {
    var blob = new Blob([texto], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  };

  function nomeArquivo(st, sufixo) {
    var n = (st.projeto.nome || 'travessia').replace(/[^\wÀ-ÿ .-]+/g, '').trim().slice(0, 60) || 'travessia';
    return n + sufixo;
  }

  App.guardarNaBiblioteca = function () {
    var st = App.st;
    if (!st.projeto.nome || st.projeto.nome === TRV.E.padrao().projeto.nome) {
      App.pedirNome();
      return;
    }
    var r = TRV.E.guardar(st, App.agora());
    if (!r.ok) {
      UI.modal('Não foi possível guardar', [
        h('p', {}, 'O armazenamento do navegador está cheio. Exclua projetos antigos na biblioteca ' +
                   'ou exporte este projeto em arquivo.'),
        h('div', { class: 'linha', style: 'margin-top:10px' },
          h('button', { class: 'btn primario', type: 'button', onclick: function () { UI.fecharModal(); App.baixarProjeto(); } }, 'Exportar em arquivo'),
          h('button', { class: 'btn', type: 'button', onclick: function () { UI.fecharModal(); TRV.B.abrir(); } }, 'Abrir a biblioteca'))
      ]);
      return;
    }
    App.render();
    UI.toast(r.novo ? 'Projeto guardado na biblioteca.' : 'Projeto atualizado na biblioteca.');
  };

  App.pedirNome = function () {
    var inp = h('input', { type: 'text', value: App.st.projeto.nome || '', placeholder: 'Ex.: Travessia da BR-262 — LR do Bairro Norte' });
    var loc = h('input', { type: 'text', value: App.st.projeto.local || '', placeholder: 'Cidade / obra' });
    var resp = h('input', { type: 'text', value: App.st.projeto.responsavel || '', placeholder: 'Responsável técnico' });
    UI.modal('Nome do projeto', [
      h('p', { class: 'nota' },
        'A biblioteca organiza os projetos por estes campos. Dê um nome antes de guardar — ' +
        'os outros dois são opcionais e ajudam a achar depois.'),
      h('div', { class: 'grade', style: 'margin-top:10px' },
        h('label', { class: 'campo chave' }, h('span', { class: 'rot' }, 'Projeto / obra'), inp),
        h('label', { class: 'campo' }, h('span', { class: 'rot' }, 'Local'), loc),
        h('label', { class: 'campo' }, h('span', { class: 'rot' }, 'Responsável técnico'), resp))
    ], [
      h('button', { class: 'btn', type: 'button', onclick: UI.fecharModal }, 'Cancelar'),
      h('button', {
        class: 'btn primario', type: 'button', onclick: function () {
          if (!inp.value.trim()) { UI.toast('Informe o nome do projeto.'); return; }
          App.st.projeto.nome = inp.value.trim();
          App.st.projeto.local = loc.value.trim();
          App.st.projeto.responsavel = resp.value.trim();
          UI.fecharModal();
          App.guardarNaBiblioteca();
        }
      }, 'Guardar')
    ]);
    setTimeout(function () { inp.focus(); inp.select(); }, 30);
  };

  App.agora = function () { return new Date().toISOString(); };

  App.baixarProjeto = function () {
    App.baixar(nomeArquivo(App.st, '.travessia.json'),
      JSON.stringify({ tipo: 'trv-projeto', versao: TRV.E.VERSAO, projeto: App.st, catalogosUsuario: App.cats.usuario }, null, 1));
    UI.toast('Projeto salvo em arquivo.');

  App.baixarCatalogos = function () {
    if (!App.cats.usuario.length) { UI.toast('Você ainda não cadastrou catálogos próprios.'); return; }
    App.baixar('catalogos-travessia.json',
      JSON.stringify({ tipo: 'trv-catalogos', versao: TRV.E.VERSAO, catalogos: App.cats.usuario }, null, 1));
    UI.toast(App.cats.usuario.length + ' catálogo(s) exportado(s).');
  };

  App.abrirArquivo = function (cb) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try { cb(JSON.parse(String(fr.result))); }
        catch (e) { UI.toast('Arquivo inválido: ' + e.message); }
      };
      fr.readAsText(f);
    };
    inp.click();
  };

  App.carregarProjeto = function (dados) {
    var proj = dados.projeto || (dados.versao !== undefined && dados.travessia ? dados : null);
    if (!proj) { UI.toast('Este arquivo não contém um projeto de travessia.'); return; }
    App.st = TRV.E.migrar(proj);
    if (dados.catalogosUsuario && dados.catalogosUsuario.length) {
      var atuais = App.cats.usuario.slice();
      dados.catalogosUsuario.forEach(function (c) {
        if (!atuais.some(function (x) { return x.id === c.id; })) atuais.push(c);
      });
      App.gravarCatalogos(atuais);
    }
    App.aba = 'resultados';
    App.render();
    UI.toast('Projeto carregado.');
  };

  App.carregarCatalogos = function (dados) {
    var lista = dados.catalogos || (Array.isArray(dados) ? dados : null);
    if (!lista) { UI.toast('Este arquivo não contém catálogos.'); return; }
    var atuais = App.cats.usuario.slice(), n = 0;
    lista.forEach(function (c) {
      if (!c.id) c.id = 'usr_' + Math.random().toString(36).slice(2, 9);
      if (!c.itens || !c.itens.length) return;
      atuais = atuais.filter(function (x) { return x.id !== c.id; });
      c.usuario = true;
      atuais.push(c); n++;
    });
    App.gravarCatalogos(atuais);
    App.render();
    UI.toast(n + ' catálogo(s) importado(s).');
  };

  App.modalLogo = function () {
    var previa = h('div', { class: 'previa-logo' });
    var aviso = h('div', {});

    function mostrar() {
      UI.limpar(previa);
      previa.appendChild(h('div', { class: 'previa-caixa' },
        h('span', { class: 'previa-rot' }, 'no cabeçalho'),
        TRV.M.marca(TRV.M.CAIXA.alturaTela)));
      previa.appendChild(h('div', { class: 'previa-caixa papel' },
        h('span', { class: 'previa-rot' }, 'no papel'),
        TRV.M.marca(TRV.M.CAIXA.alturaTela + 6, { larguraMax: TRV.M.CAIXA.larguraImpressao })));
      if (TRV.M.modo() === 'nenhuma') {
        previa.appendChild(h('p', { class: 'nota' }, 'Sem logo: o cabeçalho e o memorial saem só com o nome do projeto.'));
      }
    }

    function escolher(m) {
      TRV.M.definirModo(m);
      App.montarMarca();
      App.render();
      App.modalLogo();
    }

    function opcao(id, titulo, descricao, extra) {
      var atual = TRV.M.modo() === id;
      return h('button', {
        class: 'btn opcao-logo' + (atual ? ' escolhida' : ''), type: 'button',
        onclick: function () { if (!atual) escolher(id); }
      }, h('b', {}, (atual ? '● ' : '○ ') + titulo),
         h('div', { class: 'nota' }, descricao), extra || null);
    }

    var entrada = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/svg+xml,image/webp' });
    entrada.addEventListener('change', function () {
      var f = entrada.files && entrada.files[0];
      if (!f) return;
      if (f.size > 900 * 1024) {
        UI.toast('Arquivo muito grande (máximo 900 kB). Reduza a imagem e tente de novo.');
        return;
      }
      var fr = new FileReader();
      fr.onload = function () {
        var uri = String(fr.result);
        TRV.M.medir(uri, function (m) {
          if (!TRV.M.gravarLogo(uri)) {
            UI.toast('Não foi possível gravar a logo neste navegador.');
            return;
          }
          App.montarMarca(); App.render();
          mostrar();
          UI.limpar(aviso);
          if (m) {
            var alturaEfetiva = Math.min(TRV.M.CAIXA.alturaTela, TRV.M.CAIXA.larguraTela / m.proporcao);
            if (m.proporcao > 7) {
              UI.add(aviso, h('div', { class: 'aviso' },
                'Esta logo é bem comprida (proporção ' + UI.num(m.proporcao, 1) + ':1). Ela cabe inteira na caixa, ' +
                'mas fica com cerca de ' + UI.num(alturaEfetiva, 0) + ' px de altura. Se preferir mais destaque, ' +
                'use uma versão mais compacta da marca.'));
            } else if (m.proporcao < 0.8) {
              UI.add(aviso, h('div', { class: 'aviso' },
                'Esta logo é mais alta que larga (proporção ' + UI.num(m.proporcao, 2) + ':1). Ela cabe inteira, ' +
                'limitada pela altura da caixa. Uma versão horizontal costuma render melhor em cabeçalho.'));
            } else {
              UI.add(aviso, h('div', { class: 'aviso ok' },
                'Logo carregada: ' + m.largura + ' × ' + m.altura + ' px. Cabe bem na caixa do cabeçalho.'));
            }
          }
          UI.toast('Logo carregada.');
        });
      };
      fr.readAsDataURL(f);
    });

    mostrar();

    /* ---- timbrado ---- */
    var timbre = TRV.M.timbrado();
    var previaTimb = h('div', { class: 'previa-timbrado' });
    var avisoTimb = h('div', {});

    function mostrarTimbrado() {
      UI.limpar(previaTimb);
      var t = TRV.M.timbrado();
      if (!t) {
        UI.add(previaTimb, h('p', { class: 'nota' },
          'Sem timbrado: as páginas do memorial saem em branco, com as margens da ABNT ' +
          '(3 cm em cima e à esquerda, 2 cm embaixo e à direita) e o número no canto superior direito.'));
        return;
      }
      UI.add(previaTimb,
        h('div', { class: 'timb-folha' },
          h('img', { src: t.imagem, alt: 'Timbrado' }),
          h('div', {
            class: 'timb-mancha',
            style: 'top:' + (t.margSup / 297 * 100) + '%;bottom:' + (t.margInf / 297 * 100) +
                   '%;left:' + (30 / 210 * 100) + '%;right:' + (20 / 210 * 100) + '%'
          }, h('span', {}, 'texto'))),
        h('p', { class: 'nota' },
          'A área marcada é onde o texto entra. Original de ' + t.largura + ' × ' + t.altura +
          ' px, guardado reduzido para A4 a 150 dpi (' + UI.num(t.bytes / 1024, 0) + ' kB).'));
    }

    var entradaTimb = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp' });
    entradaTimb.addEventListener('change', function () {
      var f = entradaTimb.files && entradaTimb.files[0];
      if (!f) return;
      UI.limpar(avisoTimb);
      UI.add(avisoTimb, h('div', { class: 'aviso' }, 'Reduzindo a imagem…'));
      var fr = new FileReader();
      fr.onload = function () {
        TRV.M.reduzirParaA4(String(fr.result), function (t) {
          UI.limpar(avisoTimb);
          if (!t) { UI.add(avisoTimb, h('div', { class: 'aviso' }, 'Não foi possível ler a imagem.')); return; }
          var ant = TRV.M.timbrado();
          t.margSup = ant ? ant.margSup : 35;
          t.margInf = ant ? ant.margInf : 25;
          if (!TRV.M.gravarTimbrado(t)) {
            UI.add(avisoTimb, h('div', { class: 'aviso' },
              'A imagem reduzida ainda não coube no armazenamento do navegador. ' +
              'Salve o timbrado em JPG antes de carregar.'));
            return;
          }
          App.modalLogo();
          UI.toast('Timbrado carregado (' + UI.num(t.bytes / 1024, 0) + ' kB).');
        });
      };
      fr.readAsDataURL(f);
    });

    function campoMargem(rot, chave, valor) {
      var inp = h('input', { type: 'number', step: '0.5', min: '10', max: '80', value: String(valor) });
      inp.addEventListener('change', function () {
        var t = TRV.M.timbrado();
        if (!t) return;
        var v = parseFloat(String(inp.value).replace(',', '.'));
        if (!(v > 0)) return;
        t[chave] = v;
        TRV.M.gravarTimbrado(t);
        mostrarTimbrado();
      });
      return h('label', { class: 'campo' }, h('span', {}, rot), inp);
    }

    mostrarTimbrado();

    UI.modal('Logo e timbrado', [
      h('p', { class: 'nota' },
        'A logo aparece no cabeçalho do programa e no topo de tudo o que é impresso ou exportado. ' +
        'Qualquer imagem carregada é ajustada para caber na mesma caixa: uma logo comprida encolhe pela largura, ' +
        'uma logo alta encolhe pela altura, e nenhuma delas distorce nem empurra o resto do cabeçalho.'),
      previa,
      aviso,
      UI.sub('Qual usar'),
      h('div', { class: 'lista-opcoes' },
        opcao('padrao', 'O desenho que já vem no programa',
          'Símbolo vetorial com as cores da marca. É o padrão e continua disponível mesmo depois de você carregar um arquivo.'),
        opcao('usuario', 'Um arquivo meu',
          TRV.M.logoGravada()
            ? 'Uma logo já está carregada neste navegador. Carregue outra abaixo para substituir.'
            : 'Carregue o arquivo oficial abaixo — PNG com fundo transparente, JPG, SVG ou WebP, até 900 kB.',
          h('div', { style: 'margin-top:7px' }, entrada)),
        opcao('nenhuma', 'Sem logo',
          'O cabeçalho e o memorial saem apenas com o nome do projeto, sem imagem nenhuma.')),
      TRV.M.logoGravada() ? h('div', { style: 'margin-top:11px' },
        h('button', {
          class: 'btn perigo', type: 'button', onclick: function () {
            TRV.M.removerLogo(); App.montarMarca(); App.render(); App.modalLogo();
            UI.toast('Arquivo removido; voltou o desenho padrão.');
          }
        }, 'Apagar o arquivo carregado')) : null,
      h('p', { class: 'nota', style: 'margin-top:11px' },
        'A escolha vale para este navegador. Em outro computador é preciso carregar de novo.'),

      UI.sub('Papel timbrado do memorial'),
      h('p', { class: 'nota' },
        'O timbrado entra como fundo de todas as páginas do memorial, inclusive da capa. ' +
        'O arquivo original não precisa ser reduzido antes: o programa o converte para uma folha ' +
        'A4 a 150 dpi. Nada é enviado para fora — a conversão acontece no próprio navegador.'),
      previaTimb,
      avisoTimb,
      h('div', { style: 'margin-top:8px' }, entradaTimb),
      timbre ? h('div', { class: 'linha', style: 'margin-top:9px;gap:12px;align-items:flex-end' },
        campoMargem('Margem superior (mm)', 'margSup', timbre.margSup),
        campoMargem('Margem inferior (mm)', 'margInf', timbre.margInf),
        h('button', {
          class: 'btn perigo', type: 'button', onclick: function () {
            TRV.M.removerTimbrado(); App.render(); App.modalLogo();
            UI.toast('Timbrado removido; o memorial volta às margens da ABNT.');
          }
        }, 'Remover o timbrado')) : null
    ]);
  };

  /* ================================================================
     Ajuda
     ================================================================ */

  App.modalAjuda = function () {
    UI.modal('Ajuda', h('div', { class: 'nota', style: 'font-size:13px;line-height:1.65' },
      h('p', {}, h('b', {}, 'O que este programa faz.'), ' Dimensiona e verifica a tubulação de uma travessia ' +
        'sob rodovia ou ferrovia: calcula a carga de solo (Marston ou prisma), a carga móvel do trem-tipo ' +
        '(Boussinesq-Newmark, AASHTO ou tabela AREMA) e verifica o elemento estrutural — camisa de aço, ' +
        'galeria de concreto ou o próprio condutor — em deflexão, compressão anelar, flambagem e, no concreto, ' +
        'no ensaio de três cutelos. O condutor dentro da camisa é verificado em folga, pressão interna e colapso.'),
      h('p', {}, h('b', {}, 'Fluxo.'), ' Projeto → Travessia → Solo e cargas → Tubulação → Resultados. ' +
        'Os campos essenciais têm fundo destacado; todos os sugeridos têm o botão "i" com a origem do valor.'),
      h('p', {}, h('b', {}, 'Salvar e abrir.'), ' Salvar guarda o projeto na biblioteca do navegador (Ctrl+S). ' +
        'Abrir lista a biblioteca e os exemplos (Ctrl+O). Exportar gera o memorial ou o arquivo .json do projeto — ' +
        'que também leva os seus catálogos próprios.'),
      h('p', {}, h('b', {}, 'Impressão.'), ' O botão Imprimir imprime a aba atual com cabeçalho timbrado; ' +
        'Exportar → Memorial gera o documento completo paginado em A4, em PDF ou Word.'),
      h('p', {}, h('b', {}, 'Privacidade.'), ' Tudo roda no seu navegador. Nenhum dado sai do computador.'),
      h('p', {}, h('b', {}, 'Aviso de responsabilidade.'), ' Ferramenta de apoio ao projeto. Os resultados devem ser ' +
        'conferidos por profissional habilitado e os requisitos confirmados junto ao órgão com jurisdição sobre a via.')));
  };

  TRV.App = App;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.iniciar);
  } else {
    App.iniciar();
  }
})(window.TRV = window.TRV || {});</script>
</body>
</html>
